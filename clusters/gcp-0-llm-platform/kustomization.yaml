apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Flat list of LLM-specific Flux Kustomizations for gcp-0. The umbrella
# Kustomization at clusters/gcp-0/llm-platform.yaml applies this directory
# only when its `spec.suspend` is false.
#
# Three children, fewer than aws-0's -- no gpu-nodepools (GKE ComputeClass
# already covers gpu-l4, see infrastructure/gcp-0/computeclass/gpu-l4.yaml)
# and no runtimeclass-nvidia (GKE manages GPU drivers itself). The gateway
# layer lives in the ai-gateway umbrella (../gcp-0-ai-gateway). See README.md.
resources:
  - apps-llm.yaml
  - security-llm-workloadidentity.yaml
  - tooling-promptfoo.yaml
