apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Flat list of LLM-specific Flux Kustomizations for gcp-0. The umbrella
# Kustomization at clusters/gcp-0/llm-platform.yaml applies this directory
# only when its `spec.suspend` is false.
#
# Six children, not aws-0's eight -- no gpu-nodepools (GKE ComputeClass
# already covers gpu-l4, see infrastructure/gcp-0/computeclass/gpu-l4.yaml)
# and no runtimeclass-nvidia (GKE manages GPU drivers itself). See README.md.
resources:
  # AI gateway: Envoy Gateway -> Envoy AI Gateway -> vLLM Service, same as
  # aws-0 (SPEC-001 direct routing; no interceptor in the data path).
  - infrastructure-envoy-gateway.yaml
  - infrastructure-envoy-ai-gateway.yaml
  - infrastructure-vllm-semantic-router.yaml
  - apps-llm.yaml
  - security-llm-workloadidentity.yaml
  - tooling-promptfoo.yaml
