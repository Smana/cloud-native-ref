apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: crossplane-configuration
  namespace: flux-system
spec:
  prune: true
  interval: 1m0s
  timeout: 3m0s
  path: ./infrastructure/aws-0/crossplane/configuration
  sourceRef:
    kind: ExternalArtifact
    name: infra-artifact
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: eks-aws-0-vars
  dependsOn:
    - name: crossplane-providers
