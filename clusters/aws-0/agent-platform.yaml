---
# Agent platform — opt-in Flux umbrella (Agent Factory programme, C1).
#
# Live on aws-0 (owner, 2026-10-16), as ai-gateway is: a suspended umbrella froze
# its children's own specs (dependsOn, health checks) while their content followed
# main. gcp-0's twin stays suspended. The AgentRun XRD ships in the always-on
# Crossplane package; without this umbrella a claim has no RuntimeClass to run on.
#
# Teardown: see clusters/aws-0-agent-platform/README.md
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: agent-platform
  namespace: flux-system
spec:
  suspend: false
  prune: true
  interval: 1m0s
  timeout: 5m0s
  # The children's directory in the ai-native-ref artifact (ADR-0057, split design H1).
  path: ./clusters/aws-0-agent-platform
  sourceRef:
    kind: OCIRepository
    name: ai-native-ref
  # Agents run on frontier models through the ai-gateway controllers, with zero
  # GPUs: never llm-platform (C1).
  dependsOn:
    - name: ai-gateway
