apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: observability-victoria-metrics-k8s-stack
  namespace: flux-system
spec:
  interval: 3m0s
  timeout: 10m0s
  path: ./observability/aws-0/victoria-metrics-k8s-stack
  prune: true
  sourceRef:
    kind: ExternalArtifact
    name: observability-artifact
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: eks-aws-0-vars
  dependsOn:
    # security-openbao, NOT security: this path renders four ExternalSecrets,
    # and the `clustersecretstore` ClusterSecretStore they read is created by
    # ./security/aws-0/openbao. That Kustomization already dependsOn security.
    - name: security-openbao
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: victoria-metrics-k8s-stack
      namespace: observability
