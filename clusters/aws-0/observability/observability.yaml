apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: observability
  namespace: flux-system
spec:
  interval: 3m0s
  timeout: 10m0s
  path: ./observability/aws-0
  prune: true
  sourceRef:
    kind: ExternalArtifact
    name: observability-artifact
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: eks-aws-0-vars
  dependsOn:
    - name: observability-grafana-operator
