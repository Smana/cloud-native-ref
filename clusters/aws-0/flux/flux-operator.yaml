apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-operator
  namespace: flux-system
spec:
  prune: true
  interval: 1m0s
  path: ./flux/operator
  sourceRef:
    kind: ExternalArtifact
    name: flux-artifact
  dependsOn:
    # security-openbao, NOT security: externalsecret-flux-ui-oidc.yaml reads
    # through the ClusterSecretStore that ./security/aws-0/openbao creates.
    - name: security-openbao
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: eks-aws-0-vars
