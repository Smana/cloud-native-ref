---
# AI gateway layer — opt-in Flux umbrella (programme OD-3, amended 2026-09-26), CPU only.
#
# The Envoy Gateway and Agent Router controllers, the Semantic Router, and the
# human/system Gateway `ai-gateway`, with its frontier backends in namespace
# llm-gateway. Both the GPU fleet (llm-platform) and the agents
# (agent-platform) route through it. Agents run on frontier
# models with zero GPUs, which is impossible while these controllers live in
# the GPU umbrella.
#
# Live on aws-0 (owner, 2026-10-16): the agent factory runs here. A suspended
# umbrella froze its children's own specs at the revision it last applied while
# their content followed main, so a child-spec change (phase H's agent-router
# health check) never landed. gcp-0's twin stays suspended. `llm-platform` and
# `agent-platform` depend on this one.
#
# Pause it on this cluster (Git sets it back on the next flux-system sync):
#   flux suspend kustomization ai-gateway -n flux-system
#
# deletionPolicy Orphan: removing this object (a revert, a rename) must not
# cascade into uninstalling Envoy Gateway and every Gateway on the cluster.
# Tearing the layer down is explicit: aws-0-ai-gateway/README.md.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ai-gateway
  namespace: flux-system
spec:
  suspend: false
  prune: true
  deletionPolicy: Orphan
  interval: 5m0s
  timeout: 5m0s
  # The children's directory in the ai-native-ref artifact (ADR-0057, split design H1).
  path: ./clusters/aws-0-ai-gateway
  sourceRef:
    kind: OCIRepository
    name: ai-native-ref
