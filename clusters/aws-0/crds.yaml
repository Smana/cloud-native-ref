apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: crds
  namespace: flux-system
spec:
  prune: false
  interval: 1m0s
  path: ./crds/base
  sourceRef:
    kind: ExternalArtifact
    name: crds-artifact
  dependsOn:
    - name: namespaces
    # crds/base pulls CRDs from upstream GitRepositories that flux-sources
    # defines. Without this edge the child Kustomizations reconcile before their
    # sources exist and report "source not found" until the next interval.
    # Added to match clusters/gcp-0/crds.yaml: the dependency is a
    # property of the shared crds/base content, not of either cluster.
    - name: flux-sources
