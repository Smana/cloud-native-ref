# The security controllers, and nothing their webhooks admit.
#
# cert-manager and external-secrets both ship a validating webhook with
# failurePolicy: Fail. The ClusterIssuers, ClusterSecretStore and
# ExternalSecrets those webhooks admit are applied by `security-openbao`, which
# dependsOn this one; the tailscale operator and the OpenBao snapshot job
# follow it in turn. See security/aws-0/openbao/kustomization.yaml.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: security
  namespace: flux-system
spec:
  prune: true
  interval: 4m0s
  retryInterval: 30s
  timeout: 8m0s
  sourceRef:
    kind: ExternalArtifact
    name: security-artifact
  path: ./security/aws-0
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: eks-aws-0-vars
  dependsOn:
    - name: eks-pod-identities
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: cert-manager
      namespace: security
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: kyverno
      namespace: security
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: external-secrets
      namespace: security
