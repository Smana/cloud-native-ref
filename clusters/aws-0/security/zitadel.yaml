apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: zitadel
  namespace: flux-system
spec:
  # SUSPENDED: GCP is the primary cloud (global.primary_cloud = "gcp" in
  # opentofu/config.tm.hcl) and gcp-0 hosts the one identity provider
  # (ADR-0027). aws-0 is torn down; returning to AWS primary is a migration
  # (website/content/docs/guides/migrate-the-identity-provider.md), not a flip
  # of this field alone.
  #
  # THE SECONDARY CLOUD IS SUSPENDED, THE PRIMARY IS NOT.
  # ./scripts/ci/validate-idp-topology.sh checks the pair against primary_cloud.
  suspend: true
  prune: true
  interval: 1m0s
  # 15m, not 5m: this must be >= the time the HelmRelease can legitimately take,
  # or the health check reports failure on every first bootstrap while Helm is
  # still working. ZITADEL's own install timeout is 45m, and a restore-from-seed
  # bootstrap really does take longer than five minutes -- CNPG recovery, then
  # the replica join, then ZITADEL's schema migrations.
  #
  # Measured 2026-09-02: this Kustomization flapped False/Unknown for ~25
  # minutes while the install underneath was progressing normally, which buried
  # a real failure (a stuck certificate) in noise that looked identical.
  timeout: 15m0s
  sourceRef:
    kind: ExternalArtifact
    name: security-artifact
  path: ./security/aws-0/zitadel
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: eks-aws-0-vars
  dependsOn:
    - name: infrastructure
    # Two edges, for two different prerequisites this path renders:
    #   - security-openbao creates the `clustersecretstore` the two
    #     ExternalSecrets read through.
    #   - security-public-certs creates the `letsencrypt-prod` ClusterIssuer
    #     that certificate.yaml names.
    # Both already dependOn `security`, so cert-manager and External Secrets
    # being up is covered transitively.
    - name: security-openbao
    - name: security-public-certs
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: zitadel
      namespace: security
  healthCheckExprs:
    - apiVersion: cloud.ogenki.io/v1alpha1
      kind: SQLInstance
      failed: status.conditions.filter(c, c.type == 'Ready').all(c, c.status == 'False')
      current: status.conditions.filter(c, c.type == 'Ready').all(c, c.status == 'True')
