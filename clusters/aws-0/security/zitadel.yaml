apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: zitadel
  namespace: flux-system
spec:
  # ACTIVE: this cluster is the primary cloud (global.primary_cloud = "aws" in
  # opentofu/config.tm.hcl), so it hosts the one identity provider (ADR-0027).
  #
  # Stated explicitly rather than left absent, so that the rule reads the same
  # on both clusters: THE SECONDARY CLOUD IS SUSPENDED, THE PRIMARY IS NOT.
  # An omitted field means the same thing to Flux, but it makes the pair look
  # asymmetric and leaves a reader guessing whether the omission is a decision.
  # ./scripts/validate-idp-topology.sh checks the pair against primary_cloud.
  suspend: false
  prune: true
  interval: 1m0s
  timeout: 5m0s
  sourceRef:
    kind: ExternalArtifact
    name: security-artifact
  path: ./security/aws-0/zitadel
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: eks-aws-0-vars
  dependsOn:
    - name: infrastructure
    # Two edges, for two different prerequisites this path renders:
    #   - security-openbao creates the `clustersecretstore` the two
    #     ExternalSecrets read through.
    #   - security-public-certs creates the `letsencrypt-prod` ClusterIssuer
    #     that certificate.yaml names.
    # Both already dependOn `security`, so cert-manager and External Secrets
    # being up is covered transitively.
    - name: security-openbao
    - name: security-public-certs
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: zitadel
      namespace: security
  healthCheckExprs:
    - apiVersion: cloud.ogenki.io/v1alpha1
      kind: SQLInstance
      failed: status.conditions.filter(c, c.type == 'Ready').all(c, c.status == 'False')
      current: status.conditions.filter(c, c.type == 'Ready').all(c, c.status == 'True')
