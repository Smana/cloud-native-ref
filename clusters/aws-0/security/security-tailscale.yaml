# The Tailscale operator, its ProxyClasses and its ProxyGroup.
#
# Split out of `security` for the same reason as security-openbao-snapshot:
# oauth-client-externalsecret.yaml reads through the `clustersecretstore`
# ClusterSecretStore, which ./security/aws-0/openbao creates. Applied in the
# same pass as that store, the ExternalSecret races both the store's existence
# and the external-secrets webhook having endpoints.
#
# Mirrors clusters/gcp-0/security/security-tailscale.yaml, which references a
# gcp-0 overlay; aws-0 needs no overlay and takes the base directly.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: security-tailscale
  namespace: flux-system
spec:
  prune: true
  interval: 4m0s
  retryInterval: 30s
  timeout: 8m0s
  sourceRef:
    kind: ExternalArtifact
    name: security-artifact
  path: ./security/base/tailscale-operator
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: eks-aws-0-vars
  dependsOn:
    - name: security-openbao
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: tailscale-operator
      namespace: tailscale
