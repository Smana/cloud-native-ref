# The OpenBao-backed configuration the `security` controllers admit: a
# ClusterSecretStore, two ExternalSecrets and the `openbao` ClusterIssuer. The
# Let's Encrypt issuers are NOT here -- they are ACME/Route53, unrelated to
# OpenBao, and belong to `security-public-certs`.
#
# Separate from `security` so these are not applied in the same pass as the
# cert-manager and external-secrets charts, whose validating webhooks
# (failurePolicy: Fail) have no Service endpoints yet at that point. See
# security/gcp-0/controllers/kustomization.yaml for the measured failure. The
# dependsOn below is what converts "the charts are installed" into a real
# ordering: `security` health-checks both HelmReleases, and helm-controller
# waits for a release's workloads by default, so a Ready HelmRelease means the
# webhook Deployment is Available.
#
# Mirrors clusters/gcp-0/security/security-openbao.yaml.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: security-openbao
  namespace: flux-system
spec:
  prune: true
  interval: 4m0s
  retryInterval: 30s
  timeout: 8m0s
  sourceRef:
    kind: ExternalArtifact
    name: security-artifact
  path: ./security/aws-0/openbao
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: eks-aws-0-vars
    # ConfigMap only. This used to carry a second source, `kind: Secret` /
    # `cert-manager-openbao-approle` in flux-system, written by OpenTofu and
    # supplying ${cert_manager_approle_id} to the ClusterIssuer. It is gone
    # because JWT auth substitutes no generated identifier at all: the role
    # name is a literal and the credential is a projected ServiceAccount token
    # minted at request time. There is now no `kind: Secret` in any
    # substituteFrom anywhere in the repo -- see the note in
    # scripts/flux-schema/check-substitution.py, which can only check the keys
    # of a ConfigMap.
  dependsOn:
    - name: security
  healthChecks:
    - apiVersion: cert-manager.io/v1
      kind: ClusterIssuer
      name: openbao
