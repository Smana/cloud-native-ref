# Observability on gcp-0. Same four Kustomizations as aws-0, same order, same
# shared base — only the overlay path and the vars ConfigMap differ.
#
# Grafana and its operator. Applied straight from ./observability/base — there
# is nothing cloud-shaped in it, so gcp-0 needs no overlay of its own.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: observability-grafana-operator
  namespace: flux-system
spec:
  interval: 3m0s
  timeout: 3m0s
  path: ./observability/base/grafana-operator
  prune: true
  sourceRef:
    kind: ExternalArtifact
    name: observability-artifact
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: gke-gcp-0-vars
  dependsOn:
    # The operator's dashboards are GrafanaDashboard objects that reference
    # VictoriaMetrics datasources; the stack above must exist first.
    - name: observability-victoria-metrics-k8s-stack
