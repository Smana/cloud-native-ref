# Observability on gcp-0. Same four Kustomizations as aws-0, same order, same
# shared base — only the overlay path and the vars ConfigMap differ.
#
# The remaining components: kubernetes-event-exporter and VictoriaLogs.
# NOT metrics-server — GKE ships its own as a managed addon, and ours only fought
# it. NOT loggen either — the demo generator runs on aws-0 only.
# runlore comes from the overlay rather than the base, being the one
# observability component that is not cloud-neutral. Both reasons are in
# observability/gcp-0/kustomization.yaml.
#
# No healthCheckExprs on either cluster: an earlier aws-0 version gated on a
# SQLInstance that nothing here renders (runlore persists to a PVC, and the
# only SQLInstance ever in this tree belonged to the removed grafana-oncall).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: observability
  namespace: flux-system
spec:
  interval: 3m0s
  timeout: 10m0s
  path: ./observability/gcp-0
  prune: true
  sourceRef:
    kind: ExternalArtifact
    name: observability-artifact
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: gke-gcp-0-vars
  dependsOn:
    - name: observability-grafana-operator
