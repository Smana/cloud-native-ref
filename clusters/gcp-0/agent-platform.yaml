---
# Agent platform, gcp-0's opt-in umbrella (the aws-0 twin, GCP parity). Live on
# gcp-0 (runbook 14 step 6), with `factory: gcp-0` in the ownership fence. The sandbox
# pool is OpenTofu (gke/init sandbox.tf) and GKE ships the gvisor RuntimeClass,
# so unlike aws-0 no child builds nodes or a RuntimeClass.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: agent-platform
  namespace: flux-system
spec:
  suspend: false
  prune: true
  interval: 1m0s
  timeout: 5m0s
  # The children's directory in the ai-native-ref artifact (ADR-0057, split design H1).
  path: ./clusters/gcp-0-agent-platform
  sourceRef:
    kind: OCIRepository
    name: ai-native-ref
  # Agents run on frontier models through the ai-gateway controllers, with zero
  # GPUs: never llm-platform (C1).
  dependsOn:
    - name: ai-gateway
