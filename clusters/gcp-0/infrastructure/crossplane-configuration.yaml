# Crossplane, stage 3 of 3: what the cluster owns rather than what a package
# ships — the Functions (shared with AWS), the ClusterProviderConfig that wires
# credentials, and the EnvironmentConfig the Compositions read.
#
# The XRDs and Compositions are NOT here yet — see
# infrastructure/base/crossplane/configuration-gcp/kustomization.yaml.
#
# So this stage lands the wiring with no API on top of it, and lands NO proof
# that the wiring works. Applying a ClusterProviderConfig does not authenticate
# anything: Crossplane never contacts GCP to validate credentials, and this
# Kustomization sets neither `wait: true` nor a healthCheck, so Flux reports
# Ready the moment the object is accepted.
#
# Credentials are first exercised when a managed resource reconciles. The first
# ProjectIAMMember a GCPWorkloadIdentity claim renders is therefore the real test
# of the Workload Identity binding in opentofu/gcp/gke/init/iam.tf — criterion 18
# in docs/superpowers/specs/2026-08-18-gcp-support-design.md. Until then that
# binding is unverified.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: crossplane-configuration
  namespace: flux-system
spec:
  prune: true
  interval: 1m0s
  timeout: 3m0s
  path: ./infrastructure/gcp-0/crossplane/configuration
  sourceRef:
    kind: ExternalArtifact
    name: infra-artifact
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: gke-gcp-0-vars
  dependsOn:
    - name: crossplane-providers
