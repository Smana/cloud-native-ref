# Tooling on gcp-0 — Harbor, and only Harbor.
#
# tooling/gcp-0/ has existed since workstream 9 (#1844) with a complete Harbor
# overlay — the GCS bucket, the GCPWorkloadIdentity and the chart's gcs storage
# driver — but no Kustomization ever applied it. It was built and left unwired.
#
# What unblocked it: Harbor declares a SQLInstance (tooling/base/harbor/
# sqlinstance.yaml), and until crossplane-configuration v0.4.0 the GCP
# SQLInstance Composition was a stub that failed evaluation on purpose. Wiring
# this before that release would have produced a permanently red Kustomization.
#
# NOT the same set as aws-0's tooling. That one also pulls ../base/headlamp and
# ../base/homepage; this overlay is Harbor alone, because homepage's dashboard
# links every service on the cluster and most of them do not run here yet.
#
# dependsOn differs from aws-0's for a real reason, not an omission: aws-0's
# tooling waits on `observability` as well as `infrastructure`, and gcp-0 has no
# observability Kustomization at all. Adding that edge here would wedge this
# Kustomization on a dependency that never becomes Ready.
#
# ── One manual prerequisite ───────────────────────────────────────────────────
# Harbor's two ExternalSecrets read `harbor/admin/password` and the Valkey
# password from this cluster's OpenBao through the `clustersecretstore`
# ClusterSecretStore. Nothing seeds them — that is true on aws-0 too, where they
# were written by hand. Until they exist in gcp-0's OpenBao, the ExternalSecrets
# stay unsynced and the Harbor HelmRelease waits on its secret rather than
# failing outright. Seed them before expecting this Kustomization to go Ready.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tooling
  namespace: flux-system
  labels:
    sharding.fluxcd.io/key: apps
spec:
  commonMetadata:
    labels:
      sharding.fluxcd.io/key: apps
  prune: true
  interval: 4m0s
  sourceRef:
    kind: ExternalArtifact
    name: tooling-artifact
  path: ./tooling/gcp-0
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: gke-gcp-0-vars
  dependsOn:
    # infrastructure: the HTTPRoute parents platform-tailscale-general in the
    # infrastructure namespace, and that Gateway comes from
    # infrastructure/gcp-0/gapi. This edge also transitively covers
    # crossplane-configuration, which infrastructure already depends on and
    # which installs the SQLInstance, KVStore and GCPWorkloadIdentity contracts
    # Harbor claims.
    - name: infrastructure
    # security-openbao, NOT security. The `clustersecretstore`
    # ClusterSecretStore both ExternalSecrets name is created by
    # ./security/gcp-0/openbao, which security-openbao applies; `security` is
    # only the controllers path (external-secrets and cert-manager
    # HelmReleases). security-openbao already dependsOn security, so this one
    # edge covers both. Without it Harbor's secrets apply before the store
    # exists and sit unsynced through the retry.
    - name: security-openbao
  healthCheckExprs:
    - apiVersion: cloud.ogenki.io/v1alpha1
      kind: App
      failed: status.conditions.filter(c, c.type == 'Ready').all(c, c.status == 'False')
      current: status.conditions.filter(c, c.type == 'Ready').all(c, c.status == 'True')
