# Tooling on gcp-0 — Harbor, and only Harbor.
#
# NOT the same set as aws-0's tooling, which also pulls ../base/headlamp and
# ../base/homepage. Homepage's dashboard links every service on the cluster and
# most of them do not run here, so it would render mostly dead links.
#
# dependsOn omits the `observability` edge aws-0's tooling carries, deliberately:
# adding it wedges Harbor behind a dependency that is itself waiting on secrets.
# Add it for parity once observability is reliably green here.
#
# ── One manual prerequisite ───────────────────────────────────────────────────
# Harbor's two ExternalSecrets read `harbor-admin-password` and
# `harbor-valkey-password` from GCP Secret Manager through `clustersecretstore`
# (Secrets Manager on aws-0, GCP Secret Manager here -- the base
# ClusterSecretStore is overridden in security/gcp-0/openbao). Nothing seeds
# them, on either cloud.
#
# `./scripts/secret-store.sh check --cloud gcp` lists every key this cluster
# needs and which are missing, rather than waiting for the ten-minute
# HelmRelease timeout to say so indirectly.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tooling
  namespace: flux-system
  labels:
    sharding.fluxcd.io/key: apps
spec:
  commonMetadata:
    labels:
      sharding.fluxcd.io/key: apps
  prune: true
  interval: 4m0s
  sourceRef:
    kind: ExternalArtifact
    name: tooling-artifact
  path: ./tooling/gcp-0
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: gke-gcp-0-vars
  dependsOn:
    # infrastructure: the HTTPRoute parents platform-tailscale-general in the
    # infrastructure namespace, and that Gateway comes from
    # infrastructure/gcp-0/gapi. This edge also transitively covers
    # crossplane-configuration, which infrastructure already depends on and
    # which installs the SQLInstance, KVStore and GCPWorkloadIdentity contracts
    # Harbor claims.
    - name: infrastructure
    # security-openbao, NOT security. The `clustersecretstore`
    # ClusterSecretStore both ExternalSecrets name is created by
    # ./security/gcp-0/openbao, which security-openbao applies; `security` is
    # only the controllers path (external-secrets and cert-manager
    # HelmReleases). security-openbao already dependsOn security, so this one
    # edge covers both. Without it Harbor's secrets apply before the store
    # exists and sit unsynced through the retry.
    - name: security-openbao
  healthCheckExprs:
    - apiVersion: cloud.ogenki.io/v1alpha1
      kind: App
      failed: status.conditions.filter(c, c.type == 'Ready').all(c, c.status == 'False')
      current: status.conditions.filter(c, c.type == 'Ready').all(c, c.status == 'True')
