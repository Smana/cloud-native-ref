# The PKI wiring: what the security controllers are CONFIGURED with.
#
# A ClusterSecretStore pointing at GCP Secret Manager, two ExternalSecrets
# pulling cert-manager's AppRole secret_id and the CA chain, and the ClusterIssuer
# that signs private certificates from the GCP OpenBao.
#
# Separate from `security` for two reasons, both about ordering:
#
# 1. ADMISSION. Every resource here is validated by a webhook that ships with
#    one of those charts, all with failurePolicy: Fail. Applied in the same
#    Kustomization as the charts, they are admitted before the webhook Services
#    have endpoints and fail with `no endpoints available for service
#    "external-secrets-webhook"`. Measured on the first GCP deploy: the ESO
#    controller retries, but controller-runtime's exponential backoff had
#    reached 32s and was still doubling toward 1000s by the time the webhook was
#    ready, leaving both ExternalSecrets unsynced with empty status and no
#    events -- while Flux reported Ready. `security`'s healthChecks on the two
#    HelmReleases are what this dependsOn converts into a real ordering
#    guarantee.
#
# 2. DATA. The ClusterIssuer's appRole secretRef and caBundleSecretRef point at
#    Secrets that the two ExternalSecrets create, which needs a running External
#    Secrets controller. Same direction, so one edge covers both.
#
# The CRDs are a different matter and are NOT fully guaranteed here. `crds` (via
# `security`) applies crds/base/crds-cert-manager.yaml itself, so the
# ClusterIssuer CRD is certain; but the ExternalSecret and ClusterSecretStore
# CRDs come from crds/base/kustomization-external-secrets.yaml, a CHILD Flux
# Kustomization whose reconcile `crds` does not wait on. A first apply can
# therefore still hit `no matches for kind "ExternalSecret"` and converge on the
# 30s retryInterval. Closing that means a healthCheck on the
# crds-external-secrets Kustomization, not another edge here.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: security-openbao
  namespace: flux-system
spec:
  prune: true
  interval: 4m0s
  retryInterval: 30s
  timeout: 8m0s
  sourceRef:
    kind: ExternalArtifact
    name: security-artifact
  path: ./security/gcp-0/openbao
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: gke-gcp-0-vars
    # No Secret source, unlike AWS. The AWS copy substitutes
    # ${cert_manager_approle_id} out of the very Secret its own ExternalSecret
    # creates, so a fresh cluster's first reconcile necessarily fails and
    # succeeds on a retry. GCP's role_id is pinned in the management stack
    # (opentofu/gcp/openbao/management/auth.tf), so this has no such cycle.
  dependsOn:
    - name: security
  healthChecks:
    - apiVersion: cert-manager.io/v1
      kind: ClusterIssuer
      name: openbao
