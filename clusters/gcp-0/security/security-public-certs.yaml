# The public certificate issuer.
#
# dependsOn security (not security-openbao): this needs cert-manager RUNNING,
# which security's healthChecks already gate on. It has no relationship to the
# private PKI -- deliberately, since the two issuers exist to fail independently.
#
# That sentence is load-bearing and is checked, not assumed. This cluster's ACME
# dns01 solver federates a projected `cert-manager` ServiceAccount token to AWS
# STS, so it needs the `cert-manager-token-creator` Role -- and that Role is
# applied by `security`, from security/gcp-0/controllers/, alongside cert-manager
# itself. It was briefly applied by `security-openbao` instead, which made this
# Kustomization's only real precondition arrive from the private PKI's
# Kustomization: on a cold build the two reconcile in parallel, and whenever this
# one won, public issuance failed until security-openbao landed. Nothing this
# overlay needs now comes from security-openbao.
#
# No healthCheck on the ClusterIssuer. cert-manager marks an ACME issuer Ready
# only after it has registered an account with Let's Encrypt, which is a live
# network call to a rate-limited third party. Gating a Kustomization on that
# would make an unrelated LE outage look like a GitOps failure. The public
# Gateway's Certificate is where issuance is actually proven.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: security-public-certs
  namespace: flux-system
spec:
  prune: true
  interval: 4m0s
  retryInterval: 30s
  timeout: 8m0s
  sourceRef:
    kind: ExternalArtifact
    name: security-artifact
  path: ./security/gcp-0/cert-manager-public
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: gke-gcp-0-vars
  dependsOn:
    - name: security
