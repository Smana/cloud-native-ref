# ZITADEL on gcp-0 -- this cluster's own identity provider.
#
# ADR-0024 supersedes ADR-0022: the IdP is deployable on either cloud, default
# AWS, so a GCP-only platform does not depend on an AWS cluster being up to log
# anyone in. Only public DNS stays AWS-owned (Route53, ADR-0019).
#
# Same edges as clusters/aws-0/security/zitadel.yaml and for the same reasons:
#
#   infrastructure -- the Gateway needs a GatewayClass and the Crossplane
#     provider that reconciles the SQLInstance claim; both come from there.
#   security -- the two ExternalSecrets need the External Secrets webhook
#     running, and the Certificate needs cert-manager.
#
# The healthCheckExprs on SQLInstance matter more here than on aws-0: without
# objectStoreRecovery this database bootstraps EMPTY, so a first deploy is the
# slow path -- CNPG initdb, then ZITADEL's own migrations -- and a plain
# HelmRelease health check would go Ready before the database is usable. The
# 10m timeout is deliberately longer than aws-0's 5m for the same reason.
#
# ── ACTIVE: gcp-0 hosts its own instance ──────────────────────────────────────
# ADR-0024 makes AWS the *default* host, but this cluster opts out of that
# default so a GCP-only platform can log people in with aws-0 torn down.
#
# That takes TWO gates, and they must always agree:
#
#   1. tofu:  deploy_identity_provider = true   (opentofu/gcp/gke/configure/
#             variables.tfvars) -- drives identity_provider_url, which every
#             consumer reads
#   2. flux:  spec.suspend = false              (below)
#
# Gate 1 alone points every consumer at auth.<gcp public domain>, which nothing
# serves. Gate 2 alone runs a ZITADEL that no consumer is configured to use --
# and that failure is silent, because ZITADEL is up and the consumers are
# healthy, they are simply pointed at another cluster's IdP. Neither half can
# enforce the other; see ADR-0024. To consume aws-0's instance instead, flip
# both back in one commit.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: zitadel
  namespace: flux-system
spec:
  # Gate 2 of the two above, and it must keep agreeing with gate 1
  # (deploy_identity_provider = true in opentofu/gcp/gke/configure/
  # variables.tfvars). `flux suspend` is not a way to flip this durably --
  # kustomize-controller owns the field and re-asserts the committed value on
  # its next apply. Change it here, in the same commit as gate 1.
  suspend: false
  prune: true
  interval: 1m0s
  timeout: 10m0s
  sourceRef:
    kind: ExternalArtifact
    name: security-artifact
  path: ./security/gcp-0/zitadel
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: gke-gcp-0-vars
  dependsOn:
    - name: infrastructure
    # Two edges, for two different prerequisites this path renders:
    #   - security-openbao creates the `clustersecretstore` the two
    #     ExternalSecrets in ../../base/zitadel read through.
    #   - security-public-certs creates the `letsencrypt-prod` ClusterIssuer
    #     that base's certificate.yaml names.
    # Both already dependOn `security`, so cert-manager and External Secrets
    # being up is covered transitively.
    - name: security-openbao
    - name: security-public-certs
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: zitadel
      namespace: security
  healthCheckExprs:
    - apiVersion: cloud.ogenki.io/v1alpha1
      kind: SQLInstance
      failed: status.conditions.filter(c, c.type == 'Ready').all(c, c.status == 'False')
      current: status.conditions.filter(c, c.type == 'Ready').all(c, c.status == 'True')
