# ZITADEL on gcp-0 -- this cluster's own identity provider.
#
# ADR-0024 supersedes ADR-0022: the IdP is deployable on either cloud, default
# AWS, so a GCP-only platform does not depend on an AWS cluster being up to log
# anyone in. Only public DNS stays AWS-owned (Route53, ADR-0019).
#
# Same edges as clusters/aws-0/security/zitadel.yaml and for the same reasons:
#
#   infrastructure -- the Gateway needs a GatewayClass and the Crossplane
#     provider that reconciles the SQLInstance claim; both come from there.
#   security -- the two ExternalSecrets need the External Secrets webhook
#     running, and the Certificate needs cert-manager.
#
# The healthCheckExprs on SQLInstance matter more here than on aws-0: without
# objectStoreRecovery this database bootstraps EMPTY, so a first deploy is the
# slow path -- CNPG initdb, then ZITADEL's own migrations -- and a plain
# HelmRelease health check would go Ready before the database is usable. The
# 10m timeout is deliberately longer than aws-0's 5m for the same reason.
#
# ── INACTIVE: this cluster consumes aws-0's instance ──────────────────────────
# ZITADEL is a primary-cloud singleton (ADR-0027) and AWS is primary
# (global.primary_cloud in opentofu/config.tm.hcl), so this cluster does not
# host one. It reaches auth.<aws public domain>, which every consumer here gets
# from identity_provider_url in the cluster vars ConfigMap.
#
# Placement still has two halves, but only one of them is typed now:
#
#   1. tofu:  deploy_identity_provider -- DERIVED from global.primary_cloud in
#             workflows.tm.hcl; no longer a literal anyone can set out of step
#   2. flux:  spec.suspend             -- committed below, and CHECKED against
#             primary_cloud by ./scripts/validate-idp-topology.sh
#
# The failures this prevents are both silent. Hosting here while AWS also hosts
# gives two user directories, where a grant means nothing without knowing which
# one issued it. Pointing consumers at a host nothing serves breaks SSO at the
# authorize step while ZITADEL and every consumer still report healthy.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: zitadel
  namespace: flux-system
spec:
  # SUSPENDED: aws-0 hosts the identity provider (global.primary_cloud = "aws",
  # ADR-0027). ZITADEL is a singleton that RELOCATES for a GCP-only platform
  # rather than being duplicated -- two directories mean a grant says nothing
  # without knowing which one issued it.
  #
  # This is the half that cannot be derived: kustomize-controller owns the
  # field and re-asserts the committed value on its next apply, and Flux never
  # sees Terramate globals. `flux suspend` therefore does not flip it durably.
  # ./scripts/validate-idp-topology.sh checks it against primary_cloud instead.
  #
  # To make GCP primary: set primary_cloud = "gcp" in opentofu/config.tm.hcl,
  # flip this to false in the same commit, and MIGRATE the database seed, the
  # admin credential and the OIDC clients -- they travel together or the move
  # half-works in silence. Note that a GCP primary while AWS is also deployed
  # is rejected: opentofu/aws/eks/configure hosts unconditionally, so that
  # combination needs an AWS-side toggle and a new decision.
  #
  # CLOSED, and left here because the gap it describes is the kind people
  # rediscover: gcp-0's OIDC clients ARE registered in aws-0's directory
  # automatically. scripts/zitadel-oidc-clients.sh grew the cross-cluster mode
  # this comment was waiting for -- `--idp-cloud aws` reads the admin PAT from
  # the cluster that HOSTS the directory while writing client secrets into the
  # CONSUMING cluster's store -- and aws/eks/init's stage4-oidc-clients job
  # calls it for this cluster whenever TM_CLOUD includes gcp or all.
  #
  # The symptom if that ever regresses is unchanged: headlamp's oauth2-proxy
  # has no client secret and sits in CreateContainerConfigError.
  #
  # This field is also only half of a live migration: suspending stops Flux
  # reconciling an instance, it does not remove one that is already running.
  # See the warning in the migration guide.
  suspend: true
  prune: true
  interval: 1m0s
  timeout: 10m0s
  sourceRef:
    kind: ExternalArtifact
    name: security-artifact
  path: ./security/gcp-0/zitadel
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: gke-gcp-0-vars
  dependsOn:
    - name: infrastructure
    # Two edges, for two different prerequisites this path renders:
    #   - security-openbao creates the `clustersecretstore` the two
    #     ExternalSecrets in ../../base/zitadel read through.
    #   - security-public-certs creates the `letsencrypt-prod` ClusterIssuer
    #     that base's certificate.yaml names.
    # Both already dependOn `security`, so cert-manager and External Secrets
    # being up is covered transitively.
    - name: security-openbao
    - name: security-public-certs
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: zitadel
      namespace: security
  healthCheckExprs:
    - apiVersion: cloud.ogenki.io/v1alpha1
      kind: SQLInstance
      failed: status.conditions.filter(c, c.type == 'Ready').all(c, c.status == 'False')
      current: status.conditions.filter(c, c.type == 'Ready').all(c, c.status == 'True')
