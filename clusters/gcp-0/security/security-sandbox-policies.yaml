# gcp-0's GKE Sandbox admission policy: gVisor pods tolerate Cilium's startup
# taint, or the agents-gvisor pool never scales from zero (ADR-0006). See
# security/gcp-0/sandbox-policies.
#
# dependsOn security, whose health checks wait for the kyverno HelmRelease, so
# the policy lands on a running Kyverno; `security` installs Kyverno, so the
# policy cannot live there. Always on, unlike the agent-platform umbrella: the
# pool exists whether or not the platform runs.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: security-sandbox-policies
  namespace: flux-system
spec:
  prune: true
  interval: 4m0s
  retryInterval: 30s
  timeout: 4m0s
  sourceRef:
    kind: ExternalArtifact
    name: security-artifact
  path: ./security/gcp-0/sandbox-policies
  dependsOn:
    - name: security
