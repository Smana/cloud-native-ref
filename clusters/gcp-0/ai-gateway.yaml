---
# AI gateway layer, gcp-0's opt-in umbrella (the aws-0 twin, GCP parity). The
# Envoy Gateway and Agent Router controllers, the Semantic Router, and the
# frontier routes. agent-platform and llm-platform depend on it; the agents
# themselves call agentgateway (ADR-0053), not this layer.
#
# Live on gcp-0 (runbook 14 step 6): the agent factory runs here while aws-0 is
# torn down. `llm-platform` stays suspended.
#
# deletionPolicy Orphan: removing this object must not uninstall Envoy Gateway
# and every Gateway on the cluster.
#
# gcp-0 has no README of its own for this umbrella: see the Teardown section of
# clusters/aws-0-ai-gateway/README.md, substituting gcp-0 paths. Its "Secrets
# this layer reads" section is an AWS Secrets Manager bootstrap and does not
# apply here.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ai-gateway
  namespace: flux-system
spec:
  suspend: false
  prune: true
  deletionPolicy: Orphan
  interval: 5m0s
  timeout: 5m0s
  # The children's directory in the ai-native-ref artifact (ADR-0057, split design H1).
  path: ./clusters/gcp-0-ai-gateway
  sourceRef:
    kind: OCIRepository
    name: ai-native-ref
