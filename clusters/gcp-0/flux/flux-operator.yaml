# Flux Operator extras — the ResourceSet CRDs and RBAC the operator needs
# beyond the FluxInstance that opentofu/gcp/gke/configure installs.
#
# Cloud-neutral: no ${var} it reads is cluster-specific beyond the ConfigMap
# name below.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-operator
  namespace: flux-system
spec:
  path: ./flux/operator
  interval: 1m0s
  prune: true
  sourceRef:
    kind: ExternalArtifact
    name: flux-artifact
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: gke-gcp-0-vars
  dependsOn:
    # security-openbao, NOT security: externalsecret-flux-ui-oidc.yaml reads
    # through the `clustersecretstore` ClusterSecretStore, which on this
    # cluster is created by ./security/gcp-0/openbao. `security` here is
    # ./security/gcp-0/controllers and creates no store at all.
    - name: security-openbao
