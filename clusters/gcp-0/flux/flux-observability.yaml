# Flux's own dashboards, scrape configs and alert rules — GrafanaDashboard,
# GrafanaFolder, VMPodScrape, VMServiceScrape and a VMRule.
#
# Every one of those Kinds needs a CRD that only arrived on this cluster with
# the observability stack, which is why this could not be wired before it:
# grafana-operator supplies the Grafana kinds, victoria-metrics-k8s-stack the
# VM ones. Both are now in clusters/gcp-0/observability/.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-observability
  namespace: flux-system
spec:
  path: ./flux/observability
  interval: 1m0s
  prune: true
  sourceRef:
    kind: ExternalArtifact
    name: flux-artifact
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: gke-gcp-0-vars
  dependsOn:
    - name: security
