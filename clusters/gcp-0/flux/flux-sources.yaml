# The GitRepository / HelmRepository sources that CRDs and workloads reference.
#
# Required by the `crds` Kustomization: crds/base pulls CRDs straight from
# upstream repos (grafana-operator, victoria-metrics-operator, external-secrets,
# kyverno, tailscale, actions-runner-controller, ...), and every one of those is
# a GitRepository defined here. Without this Kustomization the crds children all
# fail with:
#
#   GitRepository.source.toolkit.fluxcd.io "grafana-operator" not found
#
# `flux/sources/` uses no substitution variables today, so the postBuild block
# below is not strictly required yet. It is wired anyway: the first manifest
# here that does add one would otherwise render a raw `${cluster_name}` while
# Flux reports success. Cheaper to wire now than to debug then.
#
# The ConfigMap name differs from AWS (gke-* vs eks-*), but the KEYS it provides
# deliberately match for everything cloud-neutral — that is what lets one
# manifest under infrastructure/base/ render on either cloud.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-sources
  namespace: flux-system
spec:
  prune: true
  interval: 1m0s
  path: ./flux/sources
  sourceRef:
    kind: ExternalArtifact
    name: flux-artifact
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: gke-gcp-0-vars
