---
# agent-system's namespaced SecretStore (SP1 S9). After security-openbao, which
# installs the ESO webhook's stores and the openbao endpoint.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: agent-secrets
  namespace: flux-system
spec:
  prune: true
  interval: 5m0s
  timeout: 3m0s
  path: ./security/base/agent-secrets
  sourceRef:
    kind: ExternalArtifact
    name: security-artifact
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: eks-aws-0-vars
  dependsOn:
    - name: security-openbao
  # Flux evaluates healthCheckExprs only for resources named in healthChecks,
  # so the entry is what makes the expression below run at all.
  healthChecks:
    - apiVersion: external-secrets.io/v1
      kind: SecretStore
      name: agents-secrets
      namespace: agent-system
  healthCheckExprs:
    - apiVersion: external-secrets.io/v1
      kind: SecretStore
      current: status.conditions.filter(c, c.type == 'Ready').all(c, c.status == 'True')
      failed: status.conditions.filter(c, c.type == 'Ready').all(c, c.status == 'False')
