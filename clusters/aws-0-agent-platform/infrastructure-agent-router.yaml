---
# The agents' Z.ai key, read by agentgateway's zai backends (ADR-0053). Envoy's
# agent-router left in phase H; this child keeps its name so its prune never
# deletes the Secret.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: agent-router
  namespace: flux-system
spec:
  prune: true
  interval: 5m0s
  retryInterval: 30s
  timeout: 5m0s
  path: ./infrastructure/aws-0/agent-router
  sourceRef:
    kind: ExternalArtifact
    name: infra-artifact
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: eks-aws-0-vars
  dependsOn:
    - name: agent-secrets
