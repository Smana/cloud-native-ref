---
# octo-sts for the agents' GitHub App (ADR-0043).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: octo-sts
  namespace: flux-system
spec:
  prune: true
  interval: 5m0s
  # The Deployment can still be rolling out on first apply; retry soon rather
  # than holding dependents back a whole interval (mirrors agent-secrets).
  retryInterval: 30s
  timeout: 3m0s
  path: ./security/aws-0/octo-sts
  sourceRef:
    kind: ExternalArtifact
    name: security-artifact
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: eks-aws-0-vars
  dependsOn:
    - name: agent-secrets
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: octo-sts
      namespace: agent-system
