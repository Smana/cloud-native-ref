---
# The agent router's controller (ADR-0053). On aws-0 it keeps the PoC child's name
# and HelmRelease names, so Flux adopts the installed controller instead of
# re-installing it (old plan R5).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: agentgateway
  namespace: flux-system
spec:
  prune: true
  interval: 10m0s
  retryInterval: 30s
  timeout: 5m0s
  path: ./infrastructure/gcp-0/agentgateway
  sourceRef:
    kind: ExternalArtifact
    name: infra-artifact
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: gke-gcp-0-vars
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: agentgateway-crds
      namespace: agentgateway-system
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: agentgateway
      namespace: agentgateway-system
