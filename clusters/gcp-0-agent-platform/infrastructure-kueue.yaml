---
# Kueue (SP3): the controller, then its queues once the CRDs exist.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kueue
  namespace: flux-system
spec:
  prune: true
  interval: 5m0s
  # The HelmRelease can still be rolling out on first apply; retry soon rather
  # than holding kueue-queues back a whole interval (mirrors agent-mcp).
  retryInterval: 30s
  timeout: 5m0s
  path: ./infrastructure/gcp-0/kueue
  sourceRef:
    kind: ExternalArtifact
    name: infra-artifact
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: gke-gcp-0-vars
  dependsOn:
    - name: agent-sandbox
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: kueue
      namespace: agent-system
---
# The base, not a gcp-0 overlay: the queues hold no cloud-shaped value, so the
# substitution gate has nothing here to render wrong.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kueue-queues
  namespace: flux-system
spec:
  prune: true
  interval: 5m0s
  timeout: 2m0s
  path: ./infrastructure/base/kueue-queues
  sourceRef:
    kind: ExternalArtifact
    name: infra-artifact
  dependsOn:
    - name: kueue
