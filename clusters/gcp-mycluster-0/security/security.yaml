# The security layer's CONTROLLERS: External Secrets and cert-manager.
#
# The resources they admit -- ExternalSecrets, the ClusterSecretStore, the
# ClusterIssuer -- are a separate Kustomization (security-openbao.yaml) that
# waits on this one's health checks. Both charts ship a validating webhook with
# failurePolicy: Fail, so a custom resource applied alongside its own chart is
# admitted against a Service that has no endpoints yet. See
# security/gcp-mycluster-0/controllers/kustomization.yaml for the measured
# failure and why the split is deterministic rather than lucky.
#
# Points at security/gcp-mycluster-0, NOT security/mycluster-0 -- that tree's
# secret store is AWS Secrets Manager and it pulls in components (kyverno, rbac,
# tailscale-operator, openbao-snapshot) this cluster does not run yet.
#
# dependsOn crds, not eks-pod-identities: the AWS copy waits on Pod Identity
# associations because that is how its controllers get IAM. GKE binds identity
# by SUBJECT -- the ServiceAccount is already a Google principal the moment it
# exists -- so there is nothing here to wait for on the IAM side. `crds` itself
# depends on `namespaces`.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: security
  namespace: flux-system
spec:
  prune: true
  interval: 4m0s
  retryInterval: 30s
  timeout: 8m0s
  sourceRef:
    kind: ExternalArtifact
    name: security-artifact
  path: ./security/gcp-mycluster-0/controllers
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: gke-gcp-mycluster-0-vars
  dependsOn:
    - name: crds
  # These are what make the split work. A Ready HelmRelease means helm-controller
  # finished waiting on the release's workloads (install.disableWait defaults to
  # false), so each chart's webhook Deployment is Available -- and therefore its
  # Service has endpoints -- before security-openbao is allowed to apply anything.
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: external-secrets
      namespace: security
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: cert-manager
      namespace: security
