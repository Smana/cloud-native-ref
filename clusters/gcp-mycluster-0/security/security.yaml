# Security layer for gcp-mycluster-0: External Secrets and cert-manager, wired
# to the GCP OpenBao's PKI.
#
# Points at security/gcp-mycluster-0, NOT security/mycluster-0 -- that tree's
# secret store is AWS Secrets Manager and it pulls in components (kyverno, rbac,
# tailscale-operator, openbao-snapshot) this cluster does not run yet.
#
# dependsOn crds, not eks-pod-identities: the AWS copy waits on Pod Identity
# associations because that is how its controllers get IAM. GKE binds identity
# by SUBJECT -- the ServiceAccount is already a Google principal the moment it
# exists -- so there is nothing here to wait for on the IAM side. `crds` itself
# depends on `namespaces`.
#
# What `crds` does and does not guarantee, precisely, because the two CRD sets
# arrive by different routes:
#   - ClusterIssuer IS guaranteed. crds/base/crds-cert-manager.yaml is a plain
#     file that the `crds` Kustomization applies itself.
#   - ExternalSecret / ClusterSecretStore are NOT. They come from
#     crds/base/kustomization-external-secrets.yaml, a CHILD Flux Kustomization
#     whose own reconcile `crds` does not wait on.
#
# So this Kustomization's first apply on a fresh cluster can hit `no matches for
# kind "ExternalSecret"` and go NotReady. It converges on the 30s retryInterval
# rather than being ordered -- an accepted red status during bootstrap, not a
# guarantee. Tightening it means adding a healthCheck on the crds-external-secrets
# Kustomization, not adding an edge here.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: security
  namespace: flux-system
spec:
  prune: true
  interval: 4m0s
  retryInterval: 30s
  timeout: 8m0s
  sourceRef:
    kind: ExternalArtifact
    name: security-artifact
  path: ./security/gcp-mycluster-0
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: gke-gcp-mycluster-0-vars
    # No Secret source here, unlike AWS. The AWS copy substitutes
    # ${cert_manager_approle_id} out of the very Secret its own ExternalSecret
    # creates, so the first reconcile of a fresh cluster necessarily fails and
    # succeeds on a retry. GCP's role_id is pinned in the management stack, so
    # this Kustomization has no such cycle.
  dependsOn:
    - name: crds
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: external-secrets
      namespace: security
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: cert-manager
      namespace: security
