# Crossplane, stage 3 of 3: what the cluster owns rather than what a package
# ships — the Functions (shared with AWS), the ClusterProviderConfig that wires
# credentials, and the EnvironmentConfig the Compositions read.
#
# The XRDs and Compositions are NOT here yet. crossplane-configuration-gcp does
# not exist; see infrastructure/base/crossplane/configuration-gcp/kustomization.yaml
# for what has to happen in Smana/crossplane-configuration first, and why adding
# it is a two-PR cutover rather than a one-line pin.
#
# So this stage currently installs a working provider with no API on top of it.
# That is deliberate and verifiable on its own: a healthy ClusterProviderConfig
# proves the Workload Identity binding from opentofu/gcp/gke/init/iam.tf actually
# authenticates, which is design criterion 18 and the thing most likely to be
# wrong. Finding that out now is cheaper than finding it out underneath a
# composition.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: crossplane-configuration
  namespace: flux-system
spec:
  prune: true
  interval: 1m0s
  timeout: 3m0s
  path: ./infrastructure/gcp-mycluster-0/crossplane/configuration
  sourceRef:
    kind: ExternalArtifact
    name: infra-artifact
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: gke-gcp-mycluster-0-vars
  dependsOn:
    - name: crossplane-providers
