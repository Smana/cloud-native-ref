# Identical to clusters/mycluster-0/crds.yaml — crds/base is shared between both
# clusters.
#
# prune: false is deliberate and matches the AWS tree. Pruning a CRD deletes every
# custom resource of that kind, so this Kustomization never removes what it stops
# managing.
#
# NOTE: the Gateway API CRDs are NOT installed from here. They are applied by
# opentofu/gcp/gke/configure (via opentofu/shared/modules/gateway-api-crds) BEFORE
# Cilium starts, because cilium-operator probes for them exactly once at startup
# and permanently disables its Gateway API controller if any is missing. Flux
# reconciling them afterwards is too late.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: crds
  namespace: flux-system
spec:
  prune: false
  interval: 1m0s
  path: ./crds/base
  sourceRef:
    kind: ExternalArtifact
    name: crds-artifact
  dependsOn:
    - name: namespaces
