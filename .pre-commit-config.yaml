repos:
  # General code quality
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        exclude: '\.k$'  # Exclude KCL files - kcl fmt uses indented blank lines
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=1000]
        # Upstream envoy-gateway CRDs render to ~2 MiB total; the
        # `envoyproxies` schema alone is ~1.2 MiB. Committed because
        # the chart can't be installed via HelmRelease (1 MiB Helm
        # release Secret cap). Single-file release-asset form lives at
        # `crds/base/crds-envoy-gateway.yaml`.
        exclude: '^crds/base/crds-envoy-gateway\.yaml$'
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-symlinks
        # opentofu/openbao/management/.tls is a tracked symlink to
        # ../cluster/.tls, whose *contents* are gitignored (`**/.tls/*`). The
        # target directory therefore does not exist in a fresh clone or git
        # worktree, so the link resolves only where the PKI material has been
        # generated. CI sidesteps this by creating the directory before running
        # pre-commit (see the "Write required openbao files" step in
        # .github/workflows/ci.yaml); a local `pre-commit run --all-files` has
        # nothing equivalent and fails on a link that is deliberate and, in the
        # checkout that matters, working.
        exclude: '^opentofu/openbao/management/\.tls$'
      - id: check-executables-have-shebangs
      - id: detect-private-key

  # OpenTofu/Terraform
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.99.0
    hooks:
      - id: terraform_fmt
        args:
          - --hook-config=--tf-path=tofu
          - --args=-diff
          - --args=-write=true
      - id: terraform_validate
        args:
          - --hook-config=--tf-path=tofu
          - --hook-config=--retry-once-with-cleanup=true
          - --args=-json
      - id: terraform_tflint
        args:
          - --hook-config=--tf-path=tofu
          - --args=--config=__GIT_WORKING_DIR__/.tflint.hcl

  # Security scanning
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]

  # Markdown - disabled due to Node.js compatibility issues in CI
  # - repo: https://github.com/igorshubovych/markdownlint-cli
  #   rev: v0.42.0
  #   hooks:
  #     - id: markdownlint
  #       args: [--fix]

default_language_version:
  python: python3

ci:
  autofix_commit_msg: |
    [pre-commit.ci] auto fixes from pre-commit.com hooks

    for more information, see https://pre-commit.ci
  autofix_prs: true
  autoupdate_branch: ""
  autoupdate_commit_msg: "[pre-commit.ci] pre-commit autoupdate"
  autoupdate_schedule: weekly
  skip: []
  submodules: false
