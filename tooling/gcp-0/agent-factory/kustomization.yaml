apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# A render root of its own, so CI renders this base with gcp-0's fixture values
# (GCP parity GP-14). Nothing is cloud-shaped here: the broker CA is agent-secrets'
# openbao-ca, which security/gcp-0/agent-secrets already points at Secret Manager.
resources:
  - ../../base/agent-factory
