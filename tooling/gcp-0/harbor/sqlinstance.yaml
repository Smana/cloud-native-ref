# Harbor's PostgreSQL on gcp-0.
#
# Same claim name as the AWS one on purpose: tooling/base/harbor's HelmRelease
# addresses the database by name — host `xplane-harbor-cnpg-cluster-rw`, secret
# `xplane-harbor-cnpg-registry` — both derived from this metadata.name. Rename
# it here and the chart points at a database that does not exist.
#
# Three differences from tooling/aws-0/harbor/sqlinstance.yaml, which is why
# this claim is per-cloud rather than shared from base:
#
#   1. compositionRef names the GCP Composition. Both are installed from
#      different packages — aws-0 gets `xsqlinstances.cloud.ogenki.io` from
#      crossplane-configuration-aws, gcp-0 gets `xsqlinstances-gcp...` from
#      -gcp — so a claim naming the AWS one here would find no Composition.
#
#   2. No `objectStoreRecovery`. The AWS claim restores from the
#      harbor-pre-destroy alias; no GCS equivalent exists until the first
#      gcp-0 teardown creates it, and pointing at an empty prefix would fail
#      the bootstrap rather than start a fresh database.
#
#   3. `backup.bucketName` names a `${project_id}-` bucket, not a `${region}-`
#      one. GCS bucket names are globally unique, so the region is not what
#      makes one unique — the same convention as this cluster's other buckets
#      (harbor, openbao-snapshot, llm weights). The schedule matches aws-0's.
#
# The plugin that makes `backup` mean anything now runs here:
# infrastructure/gcp-0/cloudnative-pg-barman-plugin installs it with an egress
# allowlist of GCS hostnames in place of the base's AWS S3 ones, and
# infrastructure/gcp-0/cloudnative-pg/gcs-bucket.yaml provisions the bucket the
# name below resolves to. The Composition renders barman's ObjectStore and a
# bucket-scoped GCPWorkloadIdentity from this block on its own.
#
# Still NO objectStoreRecovery today — switch to path: harbor-pre-destroy
# once the gcp alias exists: the first gcp-0 teardown running the
# stage2-seed-databases job (opentofu/gcp/gke/init/workflows.tm.hcl, same
# hook as the AWS lane) creates it. The ordering is not optional: pointing
# recovery at an empty prefix fails the bootstrap instead of starting a
# fresh database. 2026-10-05 database-backup brief, Steps 4+6.

apiVersion: cloud.ogenki.io/v1alpha1
kind: SQLInstance
metadata:
  name: xplane-harbor
spec:
  instances: 1
  size: "small"
  storageSize: 20Gi
  postgresVersion: "17"
  databases:
    - name: registry
      owner: harbor
  roles:
    - name: harbor
      comment: "Harbor admin user"
      superuser: true
  backup:
    # SIX-field cron, seconds first -- CNPG uses robfig/cron, not Kubernetes
    # CronJob syntax, so `0 1 * * *` silently meant hourly at :01.
    # Full explanation and the measurement: security/base/zitadel/sqlinstance.yaml
    schedule: "0 0 1 * * *"
    bucketName: "${project_id}-ogenki-cnpg-backups"
  crossplane:
    compositionRef:
      name: xsqlinstances-gcp.cloud.ogenki.io
