apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: headlamp-oauth2-proxy
  namespace: tooling
spec:
  description: "Headlamp's auth proxy: in from the gateway, out to ZITADEL and headlamp"
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/name: oauth2-proxy
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          # L7 DNS inspection, without which no toFQDNs rule anywhere can work.
          # Not needed by the rules below -- they use toEntities -- but omitting
          # it is the trap documented in .claude/rules/cilium-network-policies.md,
          # so it stays even though nothing here depends on it yet.
          rules:
            dns:
              - matchPattern: "*"

    # ZITADEL over its PUBLIC hostname (auth.<public domain>), which resolves to
    # this cluster's own Gateway LoadBalancer -- traffic leaves and comes back.
    #
    # `all`, NOT `world`, and that is a measured result rather than laziness.
    # With every narrower selector the connection was reset during the TLS
    # ClientHello, 0 successes out of 6-10 attempts each:
    #
    #   world                              0/10     cluster    0/8
    #   host                               0/8      remote-node 0/8
    #   ingress                            0/8      all        6/6
    #
    # An unlabelled pod on the same node reached the same URL 12/12, which is
    # what isolated the policy as the variable. `cilium-dbg bpf ipcache get`
    # reports the LB address as `identity=1` (reserved:host) -- yet allowing
    # `host` does not match it, so the ipcache identity is not what the egress
    # decision uses for a hairpinned LoadBalancer VIP. Cilium logged no drop for
    # any of it, which is why this took measurement rather than reading a verdict.
    #
    # It is still a restriction, not an opt-out: `all` is scoped to TCP 443 and
    # every other port stays denied, as does all ingress except from the gateway.
    # Narrow it again if a future Cilium classifies these VIPs usefully.
    - toEntities:
        - all
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP

    # The upstream it proxies to.
    - toEndpoints:
        - matchLabels:
            k8s:app.kubernetes.io/name: headlamp
      toPorts:
        - ports:
            - port: "4466"
              protocol: TCP

  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "4180"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: headlamp
  namespace: tooling
spec:
  # The other half of the design: with -proxy-auth Headlamp trusts identity
  # headers, so anything that can reach it directly can claim to be anyone. The
  # HTTPRoute strips those headers at the edge; this makes sure the edge is the
  # only way in, by allowing ingress ONLY from the proxy. Without it the gateway
  # filter is a fence with the gate left open beside it -- any pod in the cluster
  # could call headlamp:4466 with an X-Forwarded-User of its choosing.
  description: "Headlamp accepts traffic only from its auth proxy"
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/name: headlamp
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:app.kubernetes.io/name: oauth2-proxy
      toPorts:
        - ports:
            - port: "4466"
              protocol: TCP
