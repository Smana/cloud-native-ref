apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: headlamp-oauth2-proxy
  namespace: tooling
spec:
  description: "Headlamp's auth proxy: in from the gateway, out to ZITADEL and headlamp"
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/name: oauth2-proxy
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          # L7 DNS inspection, without which no toFQDNs rule anywhere can work.
          # Not needed by the rules below -- they use toEntities -- but omitting
          # it is the trap documented in .claude/rules/cilium-network-policies.md,
          # so it stays even though nothing here depends on it yet.
          rules:
            dns:
              - matchPattern: "*"

    # ZITADEL over its PUBLIC hostname, which resolves to THIS cluster's own
    # Gateway LoadBalancer. No port restriction, and no narrower selector, and
    # that is a measured result rather than laziness.
    #
    # Cilium's Gateway API Service has no real backend: its EndpointSlice is the
    # sentinel 192.192.192.192:9999, meaning "the L7 proxy handles this". Socket
    # load-balancing rewrites the destination BEFORE policy is evaluated, to an
    # Envoy listener whose port is allocated at runtime -- so a rule naming a
    # port cannot match, whatever entity it names.
    #
    # Measured on gcp-0, 6-10 attempts each, from a pod on a node that does NOT
    # run the zitadel pod (co-located pods succeed regardless, which is what made
    # this look like a node problem first):
    #
    #   world / cluster / host / remote-node / ingress, port 443     0
    #   all, port 443                                                0
    #   all, ports 443 + 9999 (the sentinel port)                    0
    #   toServices: cilium-gateway-zitadel                           0
    #   all, NO toPorts                                              6/6
    #   no policy at all                                             6/6
    #
    # Cilium logged no drop for any of the failures, so there is no verdict to
    # read -- only A/B measurement finds this.
    #
    # What still constrains this pod: ingress only from the gateway, egress to
    # kube-dns under L7 DNS inspection, and egress to headlamp on 4466. It holds
    # no cloud credentials and no kubeconfig; its ServiceAccount is the default.
    #
    # The narrow fix is to stop traversing the public VIP at all -- ZITADEL's own
    # Service is ClusterIP :8080, so that needs the issuer URL to keep :443,
    # which means split-horizon DNS (the repo already has the idea as
    # IDP_RESOLVE in scripts/zitadel-*.sh). Worth doing when something else needs
    # it too; not worth it for one pod.
    - toEntities:
        - all

    # The upstream it proxies to.
    - toEndpoints:
        - matchLabels:
            k8s:app.kubernetes.io/name: headlamp
      toPorts:
        - ports:
            - port: "4466"
              protocol: TCP

  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "4180"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: headlamp
  namespace: tooling
spec:
  # The other half of the design: with -proxy-auth Headlamp trusts identity
  # headers, so anything that can reach it directly can claim to be anyone. The
  # HTTPRoute strips those headers at the edge; this makes sure the edge is the
  # only way in, by allowing ingress ONLY from the proxy. Without it the gateway
  # filter is a fence with the gate left open beside it -- any pod in the cluster
  # could call headlamp:4466 with an X-Forwarded-User of its choosing.
  description: "Headlamp accepts traffic only from the token-exchange shim"
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/name: headlamp
  ingress:
    # THE SHIM, NOT oauth2-proxy. Since the cutover, oauth2-proxy's upstream is
    # the shim, and the shim's upstream is headlamp -- so oauth2-proxy no longer
    # talks to headlamp at all and naming it here would be a stale grant.
    #
    # Getting this wrong is invisible from every side: the shim's own egress rule
    # permits headlamp:4466, so a config review reads as correct, and the drop is
    # recorded against HEADLAMP's endpoint rather than the shim's -- so
    # `hubble observe --pod tooling/headlamp-token-exchange` shows nothing at all.
    # The only symptom is `dial tcp <headlamp-clusterIP>:80: i/o timeout` in the
    # shim's log. Measured on gcp-0 2026-09-02.
    - fromEndpoints:
        - matchLabels:
            k8s:app.kubernetes.io/name: headlamp-token-exchange
      toPorts:
        - ports:
            - port: "4466"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: headlamp-token-exchange
  namespace: tooling
spec:
  description: "Token-exchange shim: STS access for Headlamp's per-user GKE RBAC"
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/name: headlamp-token-exchange
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:app.kubernetes.io/name: oauth2-proxy
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          # L7 DNS inspection, mandatory for the toFQDNs rule below to have any
          # resolved IPs to match. Same trap as the identical comment on
          # headlamp-oauth2-proxy above: without it DNS keeps working and every
          # STS call is silently dropped. See .claude/rules/cilium-network-policies.md.
          rules:
            dns:
              - matchPattern: "*"

    # The shim's only external dependency: Google STS, to exchange the
    # ZITADEL id_token for a Workforce Identity Federation access token.
    # matchName (not matchPattern) -- sts.googleapis.com is a single fixed
    # host, not a CDN with subdomain fan-out.
    - toFQDNs:
        - matchName: sts.googleapis.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP

    # The upstream it proxies to, once the token is injected. Port 4466, NOT
    # the Service port 80 that TEP_UPSTREAM_URL (token-exchange.yaml) names --
    # Cilium enforces the pod's real listening port after Service resolution,
    # the same reason headlamp-oauth2-proxy's own egress rule to headlamp
    # (above) names 4466 rather than the port its `upstream:` field uses.
    - toEndpoints:
        - matchLabels:
            k8s:app.kubernetes.io/name: headlamp
      toPorts:
        - ports:
            - port: "4466"
              protocol: TCP
