apiVersion: cloud.ogenki.io/v1alpha1
kind: SQLInstance
metadata:
  name: xplane-harbor
spec:
  instances: 1
  size: "small"
  storageSize: 20Gi
  postgresVersion: "17"
  databases:
    - name: registry
      owner: harbor
  roles:
    - name: harbor
      comment: "Harbor admin user"
      superuser: true
  objectStoreRecovery:
    bucketName: "${region}-ogenki-cnpg-backups"
    path: "harbor-20241111"
  backup:
    # SIX fields, seconds first -- CNPG uses robfig/cron, not Kubernetes CronJob
    # syntax, so a five-field expression is silently shifted one position left
    # rather than rejected. `0 1 * * *` meant EVERY HOUR at :01:00.
    # Measured on this cluster 2026-09-02: backups at 08:01, 09:01, 10:01,
    # 11:01, 12:01, 13:01. See security/base/zitadel/sqlinstance.yaml.
    schedule: "0 0 1 * * *"
    bucketName: "${region}-ogenki-cnpg-backups"
  crossplane:
    compositionRef:
      name: xsqlinstances.cloud.ogenki.io
