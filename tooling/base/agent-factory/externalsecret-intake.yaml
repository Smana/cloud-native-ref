# The bearer the factory checks on POST /intake/runlore (SP3 §1), through agent-system's
# own store only (C1). The chart mounts this Secret at the config's runlore.tokenFile.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agent-factory-intake
  namespace: agent-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: agents-secrets
  target:
    name: agent-factory-intake
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: token  # pragma: allowlist secret
      remoteRef: {key: runlore-intake, property: token}
