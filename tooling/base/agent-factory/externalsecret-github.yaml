# The factory App's key (SP2 amendment), through agent-system's own store only (C1). The
# chart mounts this Secret 0440 under fsGroup 65532: its name and keys are the values'
# githubSecret and config.github files.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agent-factory-github
  namespace: agent-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: agents-secrets
  target:
    name: agent-factory-github
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: app_id  # pragma: allowlist secret
      remoteRef: {key: factory-app, property: app_id}
    - secretKey: private_key  # pragma: allowlist secret
      remoteRef: {key: factory-app, property: private_key}
