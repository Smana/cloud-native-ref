# The two ZITADEL client ids the API accepts tokens from (SP2 P12, S6). Ids, not secrets.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agent-factory-oidc
  namespace: agent-system
spec:
  refreshInterval: 20m
  secretStoreRef:
    kind: SecretStore
    name: agents-secrets
  target:
    name: agent-factory-oidc
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: rooms-proxy-client-id  # pragma: allowlist secret
      remoteRef: {key: rooms-proxy, property: client-id}
    - secretKey: roomctl-client-id  # pragma: allowlist secret
      remoteRef: {key: roomctl, property: client-id}
