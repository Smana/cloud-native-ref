apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# policy-bot, raw manifests (no HelmRelease): the merge gate of SP3. Namespace merge-gate
# is created by namespaces/base; the Flux wiring and rollout are gated on 6.1/6.9.
resources:
  - configmap.yaml
  - externalsecret.yaml
  - sessions.yaml
  - deployment.yaml
  - service.yaml
  - pdb.yaml
  - network-policy.yaml
  - httproute-hook.yaml
  - httproute-ui.yaml
  - vmservicescrape.yaml
