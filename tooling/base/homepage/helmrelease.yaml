apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: homepage
  namespace: tooling
spec:
  interval: 30m
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: homepage
      version: "2.1.0"
      sourceRef:
        kind: HelmRepository
        name: jameswynn
      interval: 12h
  values:
    # CONTAINER security context for the main container. This chart is a thin
    # wrapper over the bjw-s `common` library chart (v1.5.1), where
    # `securityContext` is "the Security Context for the main container" and
    # `podSecurityContext` is the pod one (lib/controller/_mainContainer.tpl).
    # Neither is set by default, so homepage ran with escalation allowed.
    securityContext:
      allowPrivilegeEscalation: false

    # Enable RBAC for Kubernetes integration
    enableRbac: true

    serviceAccount:
      create: true
      name: homepage

    # Additional ClusterRole permissions for Flux and Crossplane
    extraClusterRoles:
      # Flux resources
      - apiGroups:
          - source.toolkit.fluxcd.io
          - kustomize.toolkit.fluxcd.io
          - helm.toolkit.fluxcd.io
        resources:
          - gitrepositories
          - helmreleases
          - kustomizations
          - helmrepositories
        verbs:
          - get
          - list
      # Flux Operator resources
      - apiGroups:
          - fluxcd.controlplane.io
        resources:
          - fluxinstances
        verbs:
          - get
          - list
      # Crossplane resources
      - apiGroups:
          - apiextensions.crossplane.io
        resources:
          - compositions
          - compositeresourcedefinitions
        verbs:
          - get
          - list
      # Crossplane managed resources
      - apiGroups:
          - cloud.ogenki.io
        resources:
          - "*"
        verbs:
          - get
          - list

    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 256Mi

    env:
      - name: HOMEPAGE_ALLOWED_HOSTS
        value: "home.${private_domain_name}"

    config:
      bookmarks:
        # First, next to the App Wizard card: the two things a developer needs the
        # moment the form asks them something they don't know the answer to.
        - For Developers:
            - App Wizard Guide:
                - abbr: WIZ
                  href: https://cnref.ogenki.io/docs/platform/developer-platform/app-wizard/
            - App Claim Examples:
                - abbr: APP
                  href: https://github.com/Smana/cloud-native-ref/tree/main/apps
            - Platform Repo:
                - abbr: GIT
                  href: https://github.com/Smana/cloud-native-ref

        - Cloud Native:
            - Kubernetes Docs:
                - abbr: K8s
                  href: https://kubernetes.io/docs/
            - Crossplane Docs:
                - abbr: XP
                  href: https://docs.crossplane.io/
            - Flux Docs:
                - abbr: Flux
                  href: https://fluxcd.io/flux/
            - Gateway API:
                - abbr: GW
                  href: https://gateway-api.sigs.k8s.io/

        - Observability:
            - VictoriaMetrics:
                - abbr: VM
                  href: https://docs.victoriametrics.com/
            - Cilium:
                - abbr: Cilium
                  href: https://docs.cilium.io/

      services:
        # Deliberately first, and rendered as a single full-width row (see `layout`
        # below): this is the front door for developers. Everything under it is a tool
        # you look at; this is the one thing you *do*. Burying it in Platform Tools
        # alongside Headlamp/Harbor is how self-service goes unused.
        - Ship an App:
            - App Wizard:
                href: https://app-wizard.${private_domain_name}
                description: Describe your app in a form — the wizard opens a GitOps pull request for you. No YAML to write.
                icon: mdi-rocket-launch-#38bdf8
                namespace: apps
                app: app-wizard

        - Platform Tools:
            - Headlamp:
                href: https://headlamp.${private_domain_name}
                description: Kubernetes Web UI
                icon: headlamp.png
                namespace: tooling
                app: headlamp

            - Harbor:
                href: https://harbor.${private_domain_name}
                description: Container & Helm Registry
                icon: harbor.png
                namespace: tooling
                app: harbor

            - PEV2:
                href: https://pev2.${private_domain_name}
                description: PostgreSQL Execution Plan Visualizer
                icon: postgres.png
                namespace: tooling
                # Homepage matches on `app.kubernetes.io/name`, which the App
                # composition sets to the CLAIM name — and this claim is
                # `xplane-pev2`. Plain `pev2` matches 0 pods, so the card showed
                # an unknown/degraded status while the workload was perfectly
                # healthy. Entries whose claim carries the prefix must repeat it
                # here (cf. xplane-podinfo, xplane-image-gallery below).
                app: xplane-pev2

        - Observability:
            - Grafana:
                href: https://grafana.${private_domain_name}
                description: Metrics & Dashboards
                icon: grafana.png
                namespace: observability
                app: grafana

            - Victoria Metrics:
                href: https://vm.${private_domain_name}/vmui
                description: Time Series Database
                icon: victoriametrics.png
                namespace: observability
                app: vmsingle

            - Victoria Logs:
                href: https://vl.${private_domain_name}/select/vmui
                description: Log Management
                icon: victoriametrics.png
                namespace: observability
                app: victoria-logs-single

            - Victoria Traces:
                href: https://vt.${private_domain_name}/select/vmui
                description: Distributed Tracing
                icon: victoriametrics.png
                namespace: observability
                app: vt-single

        - Security & Identity:
            - Zitadel:
                # The IdP is a singleton that can run on either cloud (ADR-0024,
                # superseding ADR-0022's aws-0-only version), so this points
                # wherever it actually runs rather than at the local cluster's
                # own domain.
                href: ${identity_provider_url}
                description: Identity & Access Management
                icon: zitadel.png
                namespace: security
                app: zitadel

            - OpenBao:
                href: https://bao.${private_domain_name}:8200
                description: Secrets Management & PKI
                icon: vault.png

        - LLM Platform:
            - Chatbot:
                href: https://chat.${private_domain_name}
                description: Self-hosted Qwen models · OpenAI-compatible
                icon: mdi-robot-happy
                namespace: apps
                app: xplane-openwebui

        - Demo Apps:
            - Podinfo:
                href: https://podinfo.${private_domain_name}
                description: Demo Application
                icon: mdi-cube
                namespace: apps
                app: xplane-podinfo

            - Image Gallery:
                href: https://image-gallery.${private_domain_name}
                description: Demo Image Gallery
                icon: mdi-image-multiple
                namespace: apps
                app: xplane-image-gallery

        - "Cluster: ${cluster_name}":
            - Flux UI:
                href: https://flux-ui-${cluster_name}.${private_domain_name}
                description: Flux GitOps Dashboard
                icon: flux-cd.png
                namespace: flux-system
                app: flux-operator

            - Hubble UI:
                href: https://hubble-ui-${cluster_name}.${private_domain_name}
                description: Cilium Network Observability
                icon: cilium.png
                namespace: kube-system
                app: hubble-ui

      widgets:
        - search:
            provider: duckduckgo
            target: _blank
            showSearchSuggestions: true

        - kubernetes:
            cluster:
              show: true
              cpu: true
              memory: true
              showLabel: true
              label: "${cluster_name}"
            nodes:
              show: false

        - resources:
            backend: kubernetes
            expanded: true
            cpu: true
            memory: true

      kubernetes:
        mode: cluster
        # Enable Gateway API HttpRoute discovery
        gateway: true
        # Enable standard Ingress discovery
        ingress: true

      # settingsString, NOT settings — and that is load-bearing, not a style choice.
      #
      # `layout` is a YAML map, and homepage renders groups in the order its keys appear.
      # The chart pipes .Values.config.settings through `toYaml`, which sorts map keys
      # alphabetically, so a structured `settings:` silently reorders the groups: the
      # rendered ConfigMap came out Cluster / Demo Apps / LLM Platform / Observability /
      # Platform Tools / Security & Identity / Ship an App — i.e. the call to action last.
      # The chart's settingsString is emitted verbatim (no toYaml), so the order below is
      # the order on screen. `settings` takes precedence over `settingsString`, so it must
      # be absent entirely.
      settingsString: |
        title: Cloud Native Platform
        headerStyle: boxed
        # Theme and color not set to allow UI switchers
        # Users can change theme/color through the UI
        target: _blank
        language: en
        hideVersion: false
        statusStyle: dot
        quicklaunch:
          searchDescriptions: true
          hideInternetSearch: false
          showSearchSuggestions: true
        layout:
          # This order is the on-screen order: "Ship an App" leads, and columns: 1 gives
          # its single card the full width so it reads as a call to action rather than one
          # tile among twelve. That is what puts self-service above the fold.
          Ship an App:
            style: row
            columns: 1
          Platform Tools:
            style: row
            columns: 3 # 3 since PEV2 joined Headlamp + Harbor
          Observability:
            style: row
            columns: 3
          Security & Identity:
            style: row
            columns: 2
          LLM Platform:
            style: row
            columns: 4
          Demo Apps:
            style: row
            columns: 2
          "Cluster: ${cluster_name}":
            style: row
            columns: 3
