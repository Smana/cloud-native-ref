# Renders Harbor's CONFIG_OVERWRITE_JSON declaratively (ADR-0028) instead of
# an imperative post-install API call. zitadel-oidc-clients.sh registers the
# `harbor` OIDC client and writes {client_id, client_secret, endpoint} to the
# "harbor-oidc" store key -- this ExternalSecret is the only thing that reads
# it into the cluster; the payload below must match what that script's
# merge_secret wrote, field for field, and what harbor-oidc.sh used to PUT to
# Harbor's /api/v2.0/configurations before it was removed.
#
# oidc_scope MUST include offline_access -- Harbor uses the refresh token to
# keep a CLI/robot session alive and refuses the configuration without it.
# oidc_auto_onboard creates the Harbor user on first login. oidc_user_claim
# picks preferred_username over email because Harbor usernames cannot contain
# some characters valid in an address.
#
# client_id/client_secret/endpoint go through `toJson` rather than manual
# quoting so a value containing a `"` or `\` cannot break the JSON.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-oidc-config
spec:
  dataFrom:
    - extract:
        conversionStrategy: Default
        key: harbor-oidc
  refreshInterval: 20m
  secretStoreRef:
    kind: ClusterSecretStore
    name: clustersecretstore
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    name: harbor-oidc-config
    template:
      engineVersion: v2
      data:
        config-overwrite-json: >-
          {"auth_mode":"oidc_auth","oidc_name":"ZITADEL","oidc_endpoint":{{ .endpoint | toJson }},"oidc_client_id":{{ .client_id | toJson }},"oidc_client_secret":{{ .client_secret | toJson }},"oidc_scope":"openid,profile,email,offline_access","oidc_groups_claim":"groups","oidc_user_claim":"preferred_username","oidc_auto_onboard":true,"oidc_verify_cert":true}
