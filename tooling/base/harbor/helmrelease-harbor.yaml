apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: harbor
spec:
  releaseName: harbor
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: harbor
      sourceRef:
        kind: HelmRepository
        name: harbor
      version: "1.18.3"
  interval: 10m0s
  install:
    remediation:
      # Unbounded on INSTALL only -- see the same change on
      # security/base/zitadel/helmrelease.yaml for the full reasoning.
      #
      # Harbor waits on its own database the same way, and hit this on gcp-0 on
      # 2026-08-28: the install timed out while the CNPG cluster was blocked on
      # a secret, three retries were spent long before the database existed, and
      # the release stayed InstallFailed after every pod had gone Running.
      #
      # An install racing its dependencies is a timing problem. An upgrade
      # failing repeatedly is a regression, so that one is left finite.
      retries: -1
  # The harbor chart renders `strategy.rollingUpdate: null` on every Deployment
  # even when updateStrategy.type=Recreate, which the API server rejects
  # ("rollingUpdate may not be specified when type is Recreate") on the RWO
  # jobservice/registry Deployments. Strip the stray key with $retainKeys so only
  # `type: Recreate` remains.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: harbor-jobservice
            patch: |
              - op: replace
                path: /spec/strategy
                value:
                  type: Recreate
          - target:
              kind: Deployment
              name: harbor-registry
            patch: |
              - op: replace
                path: /spec/strategy
                value:
                  type: Recreate
  # Harbor's auth_mode/OIDC settings live in its database, not its config
  # file -- core.configureUserSettings renders CONFIG_OVERWRITE_JSON, which
  # Harbor writes to that database itself at container startup. `literal:
  # true` is required: the value is a JSON blob, and without it valuesFrom
  # would run the string through Helm's `--set` parser (commas, colons and
  # quotes would be reinterpreted as --set syntax rather than taken as-is).
  # See ADR-0028; the ExternalSecret is externalsecret-oidc.yaml.
  valuesFrom:
    - kind: Secret
      name: harbor-oidc-config
      valuesKey: config-overwrite-json
      targetPath: core.configureUserSettings
      literal: true
  values:
    fullnameOverride: "harbor"
    expose:
      type: clusterIP
      tls:
        auto:
          commonName: "ogenki"

    externalURL: https://harbor.${private_domain_name}

    # jobservice (job-logs) and registry use RWO EBS PVCs. The chart's default
    # RollingUpdate strategy starts a new pod before terminating the old one, so
    # the new pod Multi-Attach-deadlocks on the single-attach volume and every
    # `helm upgrade` times out waiting for the rollout. Recreate terminates the
    # old pod first (brief upgrade downtime, acceptable for an internal registry).
    updateStrategy:
      type: Recreate

    persistence:
      enabled: true
      # imageChartStorage is supplied per cloud:
      #   tooling/aws-0/harbor/storage-s3.yaml   -- s3 driver + IAM user keys
      #   tooling/gcp-0/harbor/storage-gcs.yaml  -- gcs driver + Workload Identity
      # The drivers differ because goharbor#18686 blocks Pod Identity for the S3
      # driver on AWS but says nothing about GCP, where the chart's gcs driver
      # takes Workload Identity directly. See ADR-0020.

    existingSecretAdminPassword: harbor-admin-password
    existingSecretAdminPasswordKey: password

    registry:
      serviceAccountName: harbor

    portal:
      resources:
        limits:
          memory: 300Mi
        requests:
          cpu: 300m
          memory: 300Mi

    database:
      type: external
      external:
        host: "xplane-harbor-cnpg-cluster-rw"
        port: "5432"
        username: "harbor"
        coreDatabase: "registry"
        existingSecret: "xplane-harbor-cnpg-registry" # pragma: allowlist secret
        sslmode: "require"

    redis:
      type: external
      external:
        # KVStore claim `xplane-harbor` (SPEC-012); classic AUTH = `default` ACL user
        addr: "xplane-harbor-valkey:6379"
        existingSecret: "harbor-valkey-password"

    metrics:
      enabled: true
      serviceMonitor:
        enabled: true

    cache:
      enabled: true
      expireHours: 24
