name: Vector Configuration Validation

on:
  pull_request:
    # Scoped to `main`, matching every other PR workflow here. Without it this
    # runs on pull requests targeting any branch, including ones whose base is
    # itself a feature branch.
    branches: ["main"]
    # NO `paths:` FILTER, deliberately, and it is what lets this be a REQUIRED
    # check. A path-filtered workflow simply does not run on a PR that misses the
    # filter, and GitHub does not treat "did not run" as "passed" — the check sits
    # at "Expected — waiting for status to be reported" and the PR is blocked
    # forever. Every PR not touching VictoriaLogs would be unmergeable.
    #
    # The alternative is a companion job that always runs and reports this job's
    # name when the paths are untouched. That is more machinery than the run costs:
    # yq plus two `docker run`s against an alpine image, well under a minute, in
    # parallel with a pipeline that takes two to three. So it just always runs.
    #
    # The `push` trigger below KEEPS its filter — there it is a notification, not
    # a gate, and nothing waits on it.
  push:
    branches:
      - main
      - feat_*
    paths:
      - 'observability/base/victoria-logs/helmrelease-*.yaml'
      - 'observability/base/victoria-logs/vl-common-helm-values-configmap.yaml'

# Declared here rather than left to the repository default. The default is `read`
# today, so this grants nothing new — it puts the guarantee in the file, which is
# what gets read, forked and copied.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The Vector the VictoriaLogs chart actually deploys — NOT the latest release.
  #
  # This was `timberio/vector:latest-alpine`, which makes the validator float
  # underneath the thing it validates: the same pipeline config could pass today
  # and fail tomorrow with no commit in between, and the VRL being checked was
  # whatever upstream shipped rather than what runs in the cluster. A gate whose
  # verdict moves on its own is not a gate.
  #
  # Keep this equal to the image in the rendered chart output:
  #   ./scripts/validate-manifests.sh && grep -rhoP 'image:\s*"?\K\S*vector\S*' .bundle/
  # It reads 0.57.0-distroless-libc as of chart vlsingle 0.13.9 / vlcluster 0.2.8.
  # The `-alpine` variant of the same release is used here because the workflow
  # invokes the binary through `docker run`, and alpine is the variant this job
  # has always used — only the version is changing.
  #
  # DELIBERATELY NOT RENOVATE-ANNOTATED. An annotation here would track Vector's
  # own releases, so Renovate would move it to 0.58.0 the week that ships and put
  # the validator AHEAD of the cluster — the same class of defect as the `latest`
  # tag it replaces, just slower. The version that matters is the chart's, and
  # this follows it by hand: bump it in the PR that bumps
  # observability/base/victoria-logs/helmrelease-*.yaml, whose chart version
  # Renovate DOES track.
  VECTOR_VERSION: "0.57.0"

jobs:
  validate-vector-config:
    name: Validate Vector Log Parsing Configuration
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        # Both variants must carry the pipeline. vlcluster silently shipped
        # without it until the shared ConfigMap landed — validating only the
        # active variant is how that went unnoticed.
        variant: [vlsingle, vlcluster]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up yq
        uses: mikefarah/yq@v4

      - name: Extract Vector configuration
        id: extract
        run: |
          echo "Composing Helm values for ${{ matrix.variant }}..."

          # The Vector pipeline lives in the shared vl-common-helm-values
          # ConfigMap, which both variants pull in via spec.valuesFrom. Reproduce
          # what Flux does: shared values first, the HelmRelease's own
          # spec.values deep-merged on top (maps merge, lists replace) — that is
          # what supplies the per-variant sink endpoints and catch-all sink.
          yq '.data."values.yaml"' \
            observability/base/victoria-logs/vl-common-helm-values-configmap.yaml \
            > /tmp/vl-common-values.yaml

          yq '.spec.values' \
            "observability/base/victoria-logs/helmrelease-${{ matrix.variant }}.yaml" \
            > /tmp/vl-inline-values.yaml

          yq eval-all '. as $item ireduce ({}; . * $item)' \
            /tmp/vl-common-values.yaml /tmp/vl-inline-values.yaml \
            > /tmp/vl-values.yaml

          # Extract the Vector customConfig section as a standalone Vector config
          cat > /tmp/vector-extract.yaml << 'EXTRACT_SCRIPT'
          {
            "sources": .vector.customConfig.sources,
            "transforms": .vector.customConfig.transforms,
            "sinks": .vector.customConfig.sinks,
            "tests": .vector.customConfig.tests
          }
          EXTRACT_SCRIPT

          yq eval-all \
            --from-file /tmp/vector-extract.yaml \
            /tmp/vl-values.yaml \
            > /tmp/vector-config.yaml

          # Fail loudly on an empty pipeline. Without this, a variant that stops
          # pulling in the shared values yields a null config and the downstream
          # `vector test` trivially "passes" with zero test cases.
          test_count=$(yq '.tests | length' /tmp/vector-config.yaml)
          if [ "$(yq '.sources // "null"' /tmp/vector-config.yaml)" = "null" ] \
            || [ "${test_count}" -eq 0 ]; then
            echo "::error::No Vector pipeline resolved for ${{ matrix.variant }}." \
              "Does its HelmRelease still reference the vl-common-helm-values" \
              "ConfigMap in spec.valuesFrom?"
            exit 1
          fi

          echo "Vector config extracted to /tmp/vector-config.yaml"

          # Show configuration summary
          echo "Sources:"
          yq eval '.sources | keys' /tmp/vector-config.yaml
          echo "Transforms:"
          yq eval '.transforms | keys' /tmp/vector-config.yaml
          echo "Sinks:"
          yq eval '.sinks | keys' /tmp/vector-config.yaml
          echo "Tests:"
          echo "${test_count}"

      - name: Validate Vector configuration syntax
        run: |
          echo "Validating Vector configuration with 'vector validate'..."

          docker run --rm \
            -v /tmp/vector-config.yaml:/etc/vector/vector.yaml:ro \
            timberio/vector:${VECTOR_VERSION}-alpine \
            validate /etc/vector/vector.yaml --no-environment

          echo "✅ Configuration syntax is valid"

      - name: Run Vector unit tests
        id: test
        run: |
          echo "Running Vector unit tests..."

          docker run --rm \
            -v /tmp/vector-config.yaml:/etc/vector/vector.yaml:ro \
            timberio/vector:${VECTOR_VERSION}-alpine \
            test /etc/vector/vector.yaml

          echo "✅ All unit tests passed"

      - name: Test coverage summary
        if: success()
        run: |
          echo "## Vector Configuration Validation Results (${{ matrix.variant }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Validation Status**: PASSED" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Configuration Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Sources**: $(yq eval '.sources | keys | join(", ")' /tmp/vector-config.yaml)" >> $GITHUB_STEP_SUMMARY
          echo "- **Transforms**: $(yq eval '.transforms | keys | join(", ")' /tmp/vector-config.yaml)" >> $GITHUB_STEP_SUMMARY
          echo "- **Sinks**: $(yq eval '.sinks | keys | join(", ")' /tmp/vector-config.yaml)" >> $GITHUB_STEP_SUMMARY
          echo "- **Tests**: $(yq eval '.tests | length' /tmp/vector-config.yaml) test cases" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Test Coverage" >> $GITHUB_STEP_SUMMARY
          echo "- Valid PostgreSQL auto_explain parsing" >> $GITHUB_STEP_SUMMARY
          echo "- Missing duration field handling" >> $GITHUB_STEP_SUMMARY
          echo "- Optional timing fields" >> $GITHUB_STEP_SUMMARY
          echo "- Malformed JSON error routing" >> $GITHUB_STEP_SUMMARY
          echo "- Non-PostgreSQL log filtering" >> $GITHUB_STEP_SUMMARY
          echo "- PostgreSQL logs without plans" >> $GITHUB_STEP_SUMMARY

      - name: Report failure
        if: failure()
        run: |
          echo "## Vector Configuration Validation Results (${{ matrix.variant }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "❌ **Validation Status**: FAILED" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Please review the error messages above and fix the Vector configuration." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Common Issues" >> $GITHUB_STEP_SUMMARY
          echo "- VRL syntax errors in transform source code" >> $GITHUB_STEP_SUMMARY
          echo "- Invalid field references" >> $GITHUB_STEP_SUMMARY
          echo "- Type mismatches in assertions" >> $GITHUB_STEP_SUMMARY
          echo "- Missing or incorrect test data structure" >> $GITHUB_STEP_SUMMARY
          echo "- A variant no longer pulling in the shared vl-common-helm-values ConfigMap" >> $GITHUB_STEP_SUMMARY
          exit 1
