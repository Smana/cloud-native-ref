name: Build Container Images

on:
  push:
    branches: [main]
    paths:
      - 'container-images/**'
      - '.github/workflows/build-container-images.yml'
  workflow_dispatch:
    inputs:
      image:
        description: 'Specific image to build (e.g., pev2) or "all"'
        required: false
        default: 'all'

# Declared here rather than left to the repository default. The default is `read`
# today, so this grants nothing new — it puts the guarantee in the file, which is
# what gets read, forked and copied. `build-and-push` keeps its own job-level
# block, which is where `packages: write` belongs: the narrowest scope that needs
# it, not the whole workflow.
#
# This workflow has no pull_request trigger on purpose. A workflow that runs on
# PRs injects its declared scopes into every PR run — whatever the steps gate —
# so the PR build lives in check-container-images.yml, which is read-only end
# to end. permissions: cannot be made conditional; the split is the only way to
# keep packages: write away from PR code.
permissions:
  contents: read

# Runs queue rather than cancel: every push to `main` is a different merge
# result whose images must all be built and published, so a newer commit must
# not kill the run publishing the previous one. PR runs — which do cancel
# their predecessors — live in check-container-images.yml, a separate workflow
# and group.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  REGISTRY_USER: ${{ github.actor }}

jobs:
  detect-changes:
    name: Detect Changed Images
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      images: ${{ steps.filter.outputs.images }}
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@24d32ffd492484c1d75e0c0b894501ddb9d30d62 # v47
        with:
          files: container-images/**
          dir_names: true
          dir_names_max_depth: 2
          json: true
          # REQUIRED alongside json: true. The action defaults escape_json to true, which
          # backslash-escapes the quotes: the output arrives as [\"container-images/foo\"],
          # and interpolating that into a shell string gives jq invalid JSON. jq then died
          # with `parse error: Invalid numeric literal at line 1, column 3`, IMAGES silently
          # became [], the build matrix came out empty, every build was skipped — and the
          # workflow still reported success. That is why ghcr.io/smana/app-wizard was never
          # published despite a green run on main.
          escape_json: false

      - name: Detect which images changed
        id: filter
        run: |
          # Manual trigger - build specified image or all
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ "${{ github.event.inputs.image }}" == "all" ]]; then
              IMAGES=$(ls -d container-images/*/ | sed 's|container-images/||g' | sed 's|/||g' | jq -R -s -c 'split("\n")[:-1]')
            else
              IMAGES='["${{ github.event.inputs.image }}"]'
            fi
            echo "images=${IMAGES}" >> $GITHUB_OUTPUT
            echo "Manual trigger - building: ${IMAGES}"
            exit 0
          fi

          # Automatic trigger - detect changes.
          #
          # pipefail matters here: the extraction below is a pipeline whose LAST command
          # (jq -R -s) succeeds even when the FIRST one (jq -r '.[]') dies. Without it a
          # parse failure just yields an empty list and the workflow goes green having
          # built nothing — exactly how app-wizard silently never shipped.
          set -o pipefail

          CHANGED_DIRS='${{ steps.changed-files.outputs.all_changed_files }}'

          if [[ "$CHANGED_DIRS" == "[]" ]] || [[ -z "$CHANGED_DIRS" ]]; then
            echo "No changes detected in container-images/"
            echo "images=[]" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Every entry is one of two shapes: a depth-2 image dir (container-images/<name>)
          # or the depth-1 root (container-images) that dir_names reports when a file
          # directly in the image root — the README — changes. The root names no image
          # and is handled by the no-images exit below; an entry matching neither shape
          # means the extraction is broken, so fail loud rather than skip the build
          # behind a green tick.
          if echo "$CHANGED_DIRS" | jq -r '.[]' | grep -vE '^(container-images|container-images/[^/]+)$' > /dev/null; then
            echo "::error::detected changed dirs ${CHANGED_DIRS} but some entries are neither container-images/<name> nor the container-images root - image detection is broken"
            exit 1
          fi

          # Extract unique image names from the depth-2 entries. The `|| true` swallows
          # grep's no-match exit — a root-only change names no image, and under bash -e
          # an unguarded no-match would abort the step — while pipefail still catches a
          # jq parse failure.
          IMAGES=$(echo "$CHANGED_DIRS" | jq -r '.[]' | { grep -E '^container-images/[^/]+$' || true; } | cut -d'/' -f2 | sort -u | jq -R -s -c 'split("\n")[:-1]')

          # No depth-2 entries: only root-level files changed, which names no image —
          # the same outcome as the no-changes exit above.
          if [[ "$IMAGES" == "[]" ]] || [[ -z "$IMAGES" ]]; then
            echo "Only root-level container-images files changed - no images to build"
            echo "images=[]" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Changed images: ${IMAGES}"
          echo "images=${IMAGES}" >> $GITHUB_OUTPUT

      - name: Set build matrix
        id: set-matrix
        run: |
          IMAGES='${{ steps.filter.outputs.images }}'

          if [[ "$IMAGES" == "[]" ]] || [[ -z "$IMAGES" ]]; then
            echo "matrix={\"include\":[]}" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Create matrix with image metadata
          MATRIX=$(echo "$IMAGES" | jq -c --arg registry "$REGISTRY" --arg user "$REGISTRY_USER" --arg sha "${{ github.sha }}" '[.[] | {
            "name": .,
            "context": ("container-images/" + .),
            "dockerfile": ("container-images/" + . + "/Dockerfile"),
            "tags": [
              ($registry + "/" + $user + "/" + . + ":latest"),
              ($registry + "/" + $user + "/" + . + ":" + $sha)
            ]
          }]' | jq -c '{include: .}')

          echo "Build matrix: ${MATRIX}"
          echo "matrix=${MATRIX}" >> $GITHUB_OUTPUT
        env:
          REGISTRY: ${{ env.REGISTRY }}
          REGISTRY_USER: ${{ github.repository_owner }}

  build-and-push:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    # Wider than the 15 used elsewhere: this builds linux/arm64 under QEMU
    # emulation, which is minutes rather than seconds per layer.
    timeout-minutes: 45
    needs: [detect-changes]
    if: needs.detect-changes.outputs.images != '[]'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.REGISTRY_USER }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract application version from Dockerfile
        id: app-version
        run: |
          # The image's OWN version ARG: app-wizard -> APP_WIZARD_VERSION, pev2 -> PEV2_VERSION.
          #
          # This used to match any ARG *VERSION=, which breaks the moment a Dockerfile also
          # pins a tool it vendors (app-wizard pins CROSSPLANE_VERSION for the render CLI):
          # grep then returns two lines, the multi-line value is written to $GITHUB_OUTPUT
          # without a delimiter, and the job dies with `Invalid format 'v2.3.3'`.
          #
          # The `^` anchor is load-bearing: openbao-snapshot's Dockerfile documents this
          # very convention in a comment (`# \`ARG OPENBAO_SNAPSHOT_VERSION=\` ...`) that
          # sits ABOVE the real ARG, so an unanchored match takes the comment's closing
          # backtick, metadata-action sanitises it to `-`, and buildx dies on the invalid
          # tag `<image>:-` before pushing anything.
          ARG_NAME="$(printf '%s' '${{ matrix.name }}' | tr 'a-z-' 'A-Z_')_VERSION"
          VERSION=$(grep -oP "^ARG ${ARG_NAME}=\K[^\s]+" "${{ matrix.dockerfile }}" | head -1 || echo "")
          if [[ -n "$VERSION" ]]; then
            echo "version=${VERSION}" >> $GITHUB_OUTPUT
            echo "Found application version (${ARG_NAME}): ${VERSION}"
          else
            echo "version=" >> $GITHUB_OUTPUT
            echo "No ${ARG_NAME} found in ${{ matrix.dockerfile }}"
          fi

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # <branch>-<sha> exists only in this workflow: on pull_request events
            # {{branch}} is empty and the template renders the invalid tag
            # "-<sha>" (leading dash), which is why check-container-images.yml
            # carries no type=sha at all — its builds are tagged pr-<n> and never
            # pushed.
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_dispatch' }}
            type=raw,value=${{ steps.app-version.outputs.version }},enable=${{ steps.app-version.outputs.version != '' }}

      - name: Check for a test stage
        id: test-stage
        run: |
          # Generic, not agent-harness-specific: any Dockerfile that names a
          # `test` build stage gets it run and gated here, before anything is
          # pushed (review M4). The default target never builds that stage, so
          # without this a Renovate-automerged FROM-digest bump rebuilds and
          # republishes an image whose test suite nobody ran.
          if grep -qE '^FROM .+ AS test$' "${{ matrix.dockerfile }}"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and run the test stage
        if: steps.test-stage.outputs.exists == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: test
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: '${{ fromJSON(steps.meta.outputs.json).tags[0] }}'
          format: 'sarif'
          output: 'trivy-results-${{ matrix.name }}.sarif'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          sarif_file: 'trivy-results-${{ matrix.name }}.sarif'
          category: 'trivy-${{ matrix.name }}'

      - name: Upload security scan results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: security-scan-${{ matrix.name }}
          path: trivy-results-${{ matrix.name }}.sarif
          retention-days: 30

  build-summary:
    name: Build Summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [detect-changes, build-and-push]
    if: always()
    steps:
      - name: Create build summary
        run: |
          echo "## 🏗️ Container Images Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger**: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Changed Images**: ${{ needs.detect-changes.outputs.images }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [[ "${{ needs.detect-changes.outputs.images }}" == "[]" ]]; then
            echo "ℹ️ No container images changed - build skipped" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Build Status**: ${{ needs.build-and-push.result }}" >> $GITHUB_STEP_SUMMARY
            echo "**Platforms**: linux/amd64, linux/arm64" >> $GITHUB_STEP_SUMMARY
            echo "**Registry**: ${{ env.REGISTRY }}" >> $GITHUB_STEP_SUMMARY
            echo "**Security Scan**: ✅ Trivy (HIGH, CRITICAL)" >> $GITHUB_STEP_SUMMARY
          fi
