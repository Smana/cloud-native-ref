---
# v2 hard-task cohort, arms B and C (docs/superpowers/specs/2026-10-12-v2-hard-task-cohort-design.md §3).
# TEMPORARY: deleted when the cohort ends. Started only by the maintainer's label on an issue, never
# by PR code, so check-workflow-secrets.sh (pull_request workflows) does not apply.
name: Cohort arms 🧪

on:
  issues:
    types: [labeled]

permissions: {}

jobs:
  arm-b:
    name: Arm B (Claude Code Action, Claude)
    if: github.event.sender.login == 'Smana' && github.event.label.name == 'cohort/arm-b'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: cohort-arm-b
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5
      # CLAUDE_CODE_SUBPROCESS_ENV_SCRUB's sandbox needs bwrap and socat, which the runner lacks; Ubuntu
      # 24.04's AppArmor blocks the unprivileged user namespaces bwrap needs, so lift that and prove both run.
      - name: Install the sandbox dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap socat
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --ro-bind / / --dev /dev --proc /proc true
          command -v socat
      # What ci.yaml's kubernetes-validation adds for `task check`; --allowedTools keeps the arm from
      # installing it itself. A pre-release crossplane-configuration pin has no release asset to fetch.
      - name: Install the validators' dependencies
        run: |
          flux plugin install schema@0.11.0
          python3 -m pip install --quiet --disable-pip-version-check pyyaml
          sudo apt-get install -y -qq jq
          f="$(./scripts/ci/fetch-xrd-crds.sh)"
          [ -z "$f" ] || echo "XRD_CRDS_FILE=$f" >> "$GITHUB_ENV"
      - id: claude
        # Below the job's 90, so the execution file still uploads after a timeout.
        timeout-minutes: 75
        uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc # v1
        env:
          # Strips the provider key from the agent's Bash subprocesses; the pilot checks gh still authenticates.
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
        with:
          anthropic_api_key: ${{ secrets.COHORT_ARM_B_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Resolve issue #${{ github.event.issue.number }} of ${{ github.repository }}.
            Read it with `gh issue view ${{ github.event.issue.number }}`; its acceptance criteria are the target.
            Work on a new branch `cohort/arm-b/${{ github.event.issue.number }}` from `main`.
            Push only to `cohort/arm-b/${{ github.event.issue.number }}`, never to `agent/**`.
            Run `task check` and fix what it reports before every push.
            Open one pull request with `gh pr create --base main`; its body must contain
            `Closes #${{ github.event.issue.number }}` and a line `Cohort-Arm: B`. Never merge.
            If the push or the PR creation fails, stop and report instead of retrying.
          # Caps a runaway: the pilot's arm C spent 192 turns retrying a blocked PR; arm B finished in 20.
          claude_args: |
            --max-turns 60
            --allowedTools "Bash(gh:*),Bash(git:*),Bash(task:*),Bash(mise:*),Edit,Write,Read,Glob,Grep"
      - if: always() && steps.claude.outputs.execution_file != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cohort-arm-b-${{ github.event.issue.number }}
          path: ${{ steps.claude.outputs.execution_file }}
          retention-days: 90

  arm-c:
    name: Arm C (Claude Code Action, GLM-5.3)
    if: github.event.sender.login == 'Smana' && github.event.label.name == 'cohort/arm-c'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: cohort-arm-c
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5
      # CLAUDE_CODE_SUBPROCESS_ENV_SCRUB's sandbox needs bwrap and socat, which the runner lacks; Ubuntu
      # 24.04's AppArmor blocks the unprivileged user namespaces bwrap needs, so lift that and prove both run.
      - name: Install the sandbox dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap socat
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --ro-bind / / --dev /dev --proc /proc true
          command -v socat
      # What ci.yaml's kubernetes-validation adds for `task check`; --allowedTools keeps the arm from
      # installing it itself. A pre-release crossplane-configuration pin has no release asset to fetch.
      - name: Install the validators' dependencies
        run: |
          flux plugin install schema@0.11.0
          python3 -m pip install --quiet --disable-pip-version-check pyyaml
          sudo apt-get install -y -qq jq
          f="$(./scripts/ci/fetch-xrd-crds.sh)"
          [ -z "$f" ] || echo "XRD_CRDS_FILE=$f" >> "$GITHUB_ENV"
      - id: claude
        # Below the job's 90, so the execution file still uploads after a timeout.
        timeout-minutes: 75
        uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc # v1
        env:
          # Z.ai's Anthropic-compatible endpoint: same harness as arm B, arm A's model.
          ANTHROPIC_BASE_URL: https://api.z.ai/api/anthropic
          # Every Claude Code model slot (subagents included) on arm A's model.
          ANTHROPIC_DEFAULT_HAIKU_MODEL: glm-5.3
          ANTHROPIC_DEFAULT_SONNET_MODEL: glm-5.3
          ANTHROPIC_DEFAULT_OPUS_MODEL: glm-5.3
          # Strips the provider key from the agent's Bash subprocesses; the pilot checks gh still authenticates.
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
        with:
          anthropic_api_key: ${{ secrets.COHORT_ARM_C_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Resolve issue #${{ github.event.issue.number }} of ${{ github.repository }}.
            Read it with `gh issue view ${{ github.event.issue.number }}`; its acceptance criteria are the target.
            Work on a new branch `cohort/arm-c/${{ github.event.issue.number }}` from `main`.
            Push only to `cohort/arm-c/${{ github.event.issue.number }}`, never to `agent/**`.
            Run `task check` and fix what it reports before every push.
            Open one pull request with `gh pr create --base main`; its body must contain
            `Closes #${{ github.event.issue.number }}` and a line `Cohort-Arm: C`. Never merge.
            If the push or the PR creation fails, stop and report instead of retrying.
          # Caps a runaway: the pilot's arm C spent 192 turns retrying a blocked PR; arm B finished in 20.
          claude_args: |
            --model glm-5.3
            --max-turns 60
            --allowedTools "Bash(gh:*),Bash(git:*),Bash(task:*),Bash(mise:*),Edit,Write,Read,Glob,Grep"
      - if: always() && steps.claude.outputs.execution_file != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cohort-arm-c-${{ github.event.issue.number }}
          path: ${{ steps.claude.outputs.execution_file }}
          retention-days: 90
