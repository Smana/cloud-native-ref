# Agents' App, implementer runs (ADR-0043). A gate path (C6): octo-sts reads it
# from the default branch only. The issuer is a pattern because the EKS issuer
# ID changes on every rebuild (OD-5). The second alternative is gcp-0's GKE
# issuer, fixed by project and cluster name (GCP parity GP-13). On its own it
# would accept a token minted in ANY eu-west-3 EKS cluster, an attacker's with
# a same-named ServiceAccount included. It is safe only because every token
# reaching octo-sts has already been verified by agent-router's `sts` listener
# against this cluster's issuer and JWKS. Besides that data plane, octo-sts's
# CNP admits node-local `host` on :8080 (kubelet's probes), which can already
# read the mounted App key.
issuer_pattern: '(https://oidc\.eks\.eu-west-3\.amazonaws\.com/id/[0-9A-F]{32}|https://container\.googleapis\.com/v1/projects/ogenki-435905/locations/[a-z0-9-]+/clusters/gcp-0)'
subject_pattern: 'system:serviceaccount:agents:xplane-run-[a-z2-7]{8}'
audience: octo-sts/Smana/cloud-native-ref/implementer
permissions:
  contents: write
  pull_requests: write
  issues: read
  checks: read
  actions: read
