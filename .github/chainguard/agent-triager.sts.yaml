# Agents' App, triager runs (ADR-0043). Read-only. A gate path. The issuer
# pattern alone would accept a token minted in any eu-west-3 EKS cluster. It is
# safe only because agent-router's `sts` listener has already verified every
# token against this cluster's issuer and JWKS.
issuer_pattern: 'https://oidc\.eks\.eu-west-3\.amazonaws\.com/id/[0-9A-F]{32}'
subject_pattern: 'system:serviceaccount:agents:xplane-run-[a-z2-7]{8}'
audience: octo-sts/Smana/cloud-native-ref/triager
permissions:
  contents: read
  pull_requests: read
  issues: read
  checks: read
  actions: read
