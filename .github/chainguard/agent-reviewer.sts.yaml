# Agents' App, reviewer runs (ADR-0043). Read-only: a reviewer's output goes to
# the room, and system components post it under their own identity. A gate
# path. The issuer pattern has two alternatives: aws-0's EKS issuer, which on
# its own would accept a token minted in any eu-west-3 EKS cluster and is safe
# only because agent-router's `sts` listener has already verified every token
# against this cluster's issuer and JWKS; and gcp-0's GKE issuer, fixed by
# project, location and cluster name (GP-13).
issuer_pattern: '(https://oidc\.eks\.eu-west-3\.amazonaws\.com/id/[0-9A-F]{32}|https://container\.googleapis\.com/v1/projects/ogenki-435905/locations/europe-west4-a/clusters/gcp-0)'
subject_pattern: 'system:serviceaccount:agents:xplane-run-[a-z2-7]{8}'
audience: octo-sts/Smana/cloud-native-ref/reviewer
permissions:
  contents: read
  pull_requests: read
  issues: read
  checks: read
  actions: read
