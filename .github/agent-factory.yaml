# Names the agent factory that may act on this repository (agent-platform ownership fence): only aws-0 takes its issues, runs and merges.
factory: gcp-0
mergePolicies:
- holdoutChecks:
  - "Check the documentation links \U0001F517"
  mode: live
  name: docs-links
- holdoutChecks:
  - "Check the documentation links \U0001F517"
  mode: live
  name: revert
- mode: "off"
  name: docs
- mode: "off"
  name: tests
- mode: "off"
  name: dashboards
- mode: "off"
  name: scripts
- mode: "off"
  name: review
- allowedFiles:
  - ^observability/.+\.ya?ml$
  mode: shadow
  name: alert-rules
- allowedFiles:
  - ^(docs|website/content)/.+\.md$
  mode: shadow
  name: dead-links
  oracleWorkflow: dead-links.yaml
- allowedFiles:
  - ^(apps|flux|infrastructure|observability|security|tooling)/.+\.ya?ml$
  mode: shadow
  name: deps-patch
- allowedFiles:
  - ^(apps|flux|infrastructure|observability|security|tooling)/.+\.ya?ml$
  mode: shadow
  name: deps-minor
