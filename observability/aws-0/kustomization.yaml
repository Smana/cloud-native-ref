apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# ../base/victoria-traces is deliberately NOT listed here.
# clusters/aws-0/observability/observability-victoria-traces.yaml applies that
# directory as its own Flux Kustomization, for the ordering it needs. Listing it
# here too put two Kustomizations with prune: true in charge of the same
# objects, each able to delete what the other owns.
resources:
  - ../base/kubernetes-event-exporter
  - ../base/victoria-logs
  # Log generator for demo purposes — aws-0 only, see observability/gcp-0/kustomization.yaml.
  - ../base/loggen
  - ../base/metrics-server
  # RunLore SRE agent — consumes Alertmanager + the observability stack; its dashboard
  # ships from base on both clusters, its health alerts while the switch below is on.
  # RunLore, a session switch (RK15): on for a demo session, off after. Flip it with the Alertmanager
  # route in vm-common-helm-values-configmap.yaml and the two runlore rule files, and with aws-0's
  # factory copies in ai-native-ref (runbook 25). Uninstalling keeps its PVCs.
  # - ../base/runlore
