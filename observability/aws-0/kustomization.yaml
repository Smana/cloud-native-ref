apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# ../base/victoria-traces is deliberately NOT listed here.
# clusters/aws-0/observability/observability-victoria-traces.yaml applies that
# directory as its own Flux Kustomization, for the ordering it needs. Listing it
# here too put two Kustomizations with prune: true in charge of the same
# objects, each able to delete what the other owns.
resources:
  - ../base/kubernetes-event-exporter
  - ../base/victoria-logs
  # Log generator for demo purposes — aws-0 only, see observability/gcp-0/kustomization.yaml.
  - ../base/loggen
  - ../base/metrics-server
  # RunLore SRE agent — consumes Alertmanager + the observability stack;
  # its dashboard + health alerts ship from base on both clusters.
  # Off while the agent factory's v2 is built (owner, 2026-10-16): re-enable with
  # the Alertmanager route in vm-common-helm-values-configmap.yaml and
  # vmrules/runlore.yaml. Uninstalling keeps its PVCs.
  # - ../base/runlore
