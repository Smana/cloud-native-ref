# RunLore knowledge-base session, KB-entry seed (ai-native-ref runbook 25 §3 shape, a second incident).
# Deliberately broken: the selector names `metrics-servr`, a Deployment that does not exist
# (`metrics-server` is the real one, in kube-system), so the alert always fires. RunLore investigates,
# the factory publishes the selector fix, the alert resolves when it merges, and the verified fix must
# reach Smana/runlore-kb as a new entry PR, which the factory's kb-entries class then judges in shadow.
# Remove the file when the session ends.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  labels:
    app: metrics-server
  name: runlore-kb-seed
  namespace: observability
spec:
  groups:
    - name: metrics-server-availability
      rules:
        - alert: MetricsServerUnavailable
          expr: absent(kube_deployment_status_replicas_available{namespace="kube-system",deployment="metrics-servr"} > 0)
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: metrics-server in kube-system has no available replica
            description: >-
              kube_deployment_status_replicas_available for kube-system/metrics-server reports no replica above
              zero for 5 minutes.
