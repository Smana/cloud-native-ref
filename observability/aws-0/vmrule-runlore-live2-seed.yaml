# RunLore knowledge-base session, Live 2 seed (ai-native-ref runbook 25 §3). Deliberately broken:
# the selector names `podnfo`, a Deployment that does not exist (`podinfo` is the real one), so the
# alert always fires. RunLore investigates it, the factory publishes the fix to this selector, and
# the alert resolves when the fix merges. Remove the file when the session ends.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  labels:
    app: podinfo
  name: runlore-live2-seed
  namespace: observability
spec:
  groups:
    - name: podinfo-availability
      rules:
        - alert: PodinfoUnavailable
          expr: absent(kube_deployment_status_replicas_available{namespace="apps",deployment="podnfo"} > 0)
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: podinfo in apps has no available replica
            description: >-
              kube_deployment_status_replicas_available for apps/podinfo reports no replica above zero
              for 5 minutes.
