# The platform CA, for RunLore's factory client (factory.ca_file, mounted at /etc/runlore-factory-ca by
# extraVolumes in observability/base/runlore/helm-values-configmap.yaml). A public certificate, not a secret.
# This is the platform's offline root (the same file as .github/openbao-root-ca.pem), which is a subset of the chain
# in agent-system's openbao-ca: the factory presents its intermediate, so the root verifies it. The session's
# first step verifies the factory's certificate against it (runbook 25 section 10 in ai-native-ref).
# Rotating the CA means a PR here and one in ai-native-ref (tooling/*/agent-factory/configmap-agent-factory-ca.yaml):
# test-factory-backend-tls.py there and scripts/ci/tests/test-runlore-factory-ca-mount.py here hold the copies equal.
# Listed in observability/aws-0/kustomization.yaml beside the `../base/runlore` switch: it goes on and off with it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: factory-ca
  namespace: runlore
