apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: image-gallery-availability
  namespace: apps
spec:
  groups:
    - name: image-gallery
      rules:
        - alert: ImageGalleryNoAvailableReplica
          expr: absent(kube_deployment_status_replicas_available{namespace="apps", deployment="image-galery"} > 0)
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: image-gallery has no available replica
            description: No replica of the image-gallery Deployment in apps has been available for 5 minutes.
