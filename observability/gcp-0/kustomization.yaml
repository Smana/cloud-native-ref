apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Observability on gcp-0 — the same components aws-0 runs, from the same base.
#
# Nothing listed here names an AWS service, an ARN, a Pod-Identity annotation,
# or a ${var} only aws-0's ConfigMap defines. Their PVCs read ${storage_class},
# which resolves to standard-rwo here and gp3 on aws-0.
resources:
  - ../base/kubernetes-event-exporter
  - ../base/victoria-logs
  # Log generator for demo purposes
  - ../base/loggen
  - ../base/metrics-server
  # ./runlore, not ../base/runlore: the overlay patches the three things that
  # genuinely differ by cloud — the provider block, the network policy that
  # reaches the metadata server, and the identity. See the directory.
  - ./runlore

# ../base/victoria-traces is deliberately NOT listed.
# clusters/gcp-0/observability/observability-victoria-traces.yaml applies that
# directory as its own Flux Kustomization, for the ordering it needs. Listing it
# here as well would put two Kustomizations with prune: true in charge of the
# same objects, each able to delete what the other owns.
