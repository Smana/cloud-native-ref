# The CA secret is the one thing in this stack whose SHAPE differs by cloud, not
# just its value -- so it is patched here rather than parameterised in the base.
#
# aws-0 stores the chain in AWS Secrets Manager as a JSON object and selects the
# `ca` property out of it. gcp-0 stores it in GCP Secret Manager as raw PEM, by
# deliberate design (scripts/openbao-config.sh: "certificates, no key"), so there
# is no property to select.
#
# The name differs too, and it has to: a GCP Secret Manager secret ID matches
# [A-Za-z0-9_-]+, so the AWS-style `certificates/<domain>/root-ca` is not a
# well-formed resource name there at all -- `gcloud secrets describe` on it does
# not 404, it fails to parse the URL.
#
# spec.data is a list with no merge key, so this patch replaces it wholesale.
# That is intended: the GCP form is the whole list.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openbao-ca
  namespace: observability
spec:
  data:
    - secretKey: ca.crt  # pragma: allowlist secret
      remoteRef:
        key: openbao-priv-gcp-ca-chain
