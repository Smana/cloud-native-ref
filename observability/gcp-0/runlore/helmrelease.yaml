# runlore on gcp-0. Only what genuinely differs by cloud.
#
# networkPolicy is the load-bearing part. On EKS the Pod Identity agent really
# does run on the node's host network, so `toEntities: [host]` is correct there.
# On GKE, Cilium does not classify 169.254.169.254 as the host entity, so the
# same rule matches NOTHING and every metadata call is dropped -- and the
# failure surfaces as "gcp: project is required (autodetection found none)",
# which reads as a configuration mistake rather than a dropped packet.
#
# The chart's gcpWorkloadIdentity option emits toCIDR instead. It exists only on
# runlore main, which is why flux/sources/gitrepo-runlore.yaml pins a commit
# rather than v0.15.0.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: runlore
  namespace: runlore
spec:
  values:
    # The base pins image 0.13.0, which has no GCP cloud provider at all: with
    # the chart and the policy both correct, the pod still logged NOTHING about
    # GCP -- not even a resolution failure -- and reported `"cloud":false`. An
    # absent provider and a broken one look identical from the outside.
    #
    # `main` is the only tag published for this image, built 2026-08-27T10:14:22Z,
    # three minutes after the commit the chart is pinned to (96688ac5). So it is
    # the image that matches the chart, not a newer guess.
    #
    # A moving tag is acceptable only because this cluster is rebuilt from
    # scratch every run. Pin a released tag alongside the chart's v0.16.0.
    image:
      tag: "main"
      pullPolicy: Always
    networkPolicy:
      awsPodIdentity: false
      gcpWorkloadIdentity: true
    config:
      cloud:
        provider: gcp
