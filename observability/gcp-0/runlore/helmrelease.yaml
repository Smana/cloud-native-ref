# runlore on gcp-0. Only what genuinely differs by cloud.
#
# networkPolicy is the load-bearing part. On EKS the Pod Identity agent really
# does run on the node's host network, so `toEntities: [host]` is correct there.
# On GKE, Cilium does not classify 169.254.169.254 as the host entity, so the
# same rule matches NOTHING and every metadata call is dropped -- and the
# failure surfaces as "gcp: project is required (autodetection found none)",
# which reads as a configuration mistake rather than a dropped packet.
#
# The chart's gcpWorkloadIdentity option emits toCIDR instead. It exists only on
# runlore main, which is why flux/sources/gitrepo-runlore.yaml pins a commit
# rather than v0.15.0.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: runlore
  namespace: runlore
spec:
  values:
    networkPolicy:
      awsPodIdentity: false
      gcpWorkloadIdentity: true
    config:
      cloud:
        provider: gcp
