# runlore on gcp-0. Only what genuinely differs by cloud.
#
# networkPolicy is the load-bearing part. On EKS the Pod Identity agent really
# does run on the node's host network, so `toEntities: [host]` is correct there.
# On GKE, Cilium does not classify 169.254.169.254 as the host entity, so the
# same rule matches NOTHING and every metadata call is dropped -- and the
# failure surfaces as "gcp: project is required (autodetection found none)",
# which reads as a configuration mistake rather than a dropped packet.
#
# The chart's gcpWorkloadIdentity option emits toCIDR instead. It exists only on
# runlore main, which is why flux/sources/gitrepo-runlore.yaml pins a commit
# rather than v0.15.0.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: runlore
  namespace: runlore
spec:
  values:
    # NO image override here any more, deliberately.
    #
    # This used to pin `tag: "main"` with pullPolicy: Always, because the GCP
    # cloud provider existed only on that branch. It is in 0.16.0 now, which the
    # base pins, so one pin serves both clouds and there is nothing per-cloud
    # left to say about the image.
    #
    # Worth keeping the reason the override was harmful, because it defended
    # itself as "acceptable, this cluster is rebuilt every run":
    #
    #   runlore_build_info{version="main-26372b4"}   <- the binary that ran
    #   chart pinned to 80d4b50                      <- the config it was given
    #
    # The Build Image run for 80d4b50 FAILED on 2026-08-27, so `main` never moved
    # past its predecessor and gcp-0 spent a day running a binary one commit
    # behind its own chart. Nothing reported it: a failed build is silent, a
    # stale tag has no status, and the drift is invisible from inside the
    # cluster. `main` is a rolling single-arch VALIDATION image from
    # build-image.yml -- it was never meant to be deployed.
    networkPolicy:
      awsPodIdentity: false
      gcpWorkloadIdentity: true
    config:
      cloud:
        provider: gcp
        # region and cluster_name are AWS-ONLY keys, and the base sets both.
        # Left in place, the binary refuses to start -- deliberately:
        #
        #   serve: invalid config: cloud.provider is "gcp" but cloud.region
        #   (use cloud.gcp.location) and cloud.cluster_name (use
        #   cloud.gcp.cluster_name) set: those keys are AWS-only and would be
        #   silently ignored, leaving the GKE scope to auto...
        #
        # That fail-closed check is the other half of Smana/runlore#563, and it
        # is why the first attempt at this overlay crash-looped and Flux rolled
        # the release back to 0.13.0. Nulling them removes the keys from the
        # merged values rather than passing empty strings.
        #
        # Nothing replaces them: on GKE the scope is read from the metadata
        # server, which is exactly what the gcpWorkloadIdentity policy above
        # makes reachable. Setting cloud.gcp.* by hand would work too and would
        # mean the autodetection path never gets exercised.
        region: null
        cluster_name: null
