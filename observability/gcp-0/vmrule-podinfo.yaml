apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: podinfo-availability
  namespace: apps
spec:
  groups:
    - name: podinfo
      rules:
        - alert: PodinfoNoAvailableReplica
          expr: absent(kube_deployment_status_replicas_available{namespace="apps", deployment="podnfo"} > 0)
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: podinfo has no available replica
            description: No replica of the podinfo Deployment in apps has been available for 5 minutes.
