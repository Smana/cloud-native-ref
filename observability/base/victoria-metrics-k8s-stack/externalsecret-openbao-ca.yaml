apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openbao-ca
  namespace: observability
spec:
  # CA chain for the OpenBao server certificate, so vmagent can scrape
  # /v1/sys/metrics with TLS verification rather than another
  # insecureSkipVerify. Same secret the OpenTofu management stack reads to
  # build the PKI chain.
  data:
    - secretKey: ca.crt  # pragma: allowlist secret
      remoteRef:
        # Per-cloud: priv.aws.ogenki.io on aws-0, priv.gcp.ogenki.io on gcp-0. This
        # was hardcoded to the AWS path in a shared base, so on gcp-0 it asked OpenBao
        # for a path that does not exist and the CA secret was never created.
        key: certificates/${private_domain_name}/root-ca
        property: ca
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: clustersecretstore
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    name: openbao-ca
