apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openbao-ca
  namespace: observability
spec:
  # CA chain for the OpenBao server certificate, so vmagent can scrape
  # /v1/sys/metrics with TLS verification rather than another
  # insecureSkipVerify. Same entry the OpenTofu management stack's CA step
  # writes to disk for the vault provider.
  data:
    - secretKey: ca.crt  # pragma: allowlist secret
      remoteRef:
        # aws-0 only in practice: gcp-0 replaces this whole data list from its
        # overlay, because there the chain is raw PEM under a GCP-valid name.
        # Reads ${private_domain_name} rather than the literal so renaming the
        # private domain does not silently break scraping.
        key: certificates/${private_domain_name}/ca-chain
        property: ca
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: clustersecretstore
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    name: openbao-ca
