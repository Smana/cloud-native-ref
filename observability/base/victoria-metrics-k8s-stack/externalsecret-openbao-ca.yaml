apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openbao-ca
  namespace: observability
spec:
  # CA chain for the OpenBao server certificate, so vmagent can scrape
  # /v1/sys/metrics with TLS verification rather than another
  # insecureSkipVerify. Same secret the OpenTofu management stack reads to
  # build the PKI chain.
  data:
    - secretKey: ca.crt  # pragma: allowlist secret
      remoteRef:
        key: certificates/priv.aws.ogenki.io/root-ca
        property: ca
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: clustersecretstore
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    name: openbao-ca
