apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-metrics-k8s-stack
  namespace: observability
spec:
  releaseName: victoria-metrics-k8s-stack
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: victoria-metrics-k8s-stack
      sourceRef:
        kind: HelmRepository
        name: victoria-metrics
        namespace: observability
      version: "0.91.2"
  interval: 4m0s
  timeout: 30m
  install:
    remediation:
      retries: 3
  valuesFrom:
    - kind: ConfigMap
      name: vm-common-helm-values
      valuesKey: values.yaml
  values:
    # Dashboard sync Job. This chart names the CONTAINER context
    # `containerSecurityContext` (`podSecurityContext` is the pod one) — putting
    # allowPrivilegeEscalation in the pod block renders an invalid PodSpec. The
    # chart ships neither, so the Job ran with privilege escalation allowed.
    #
    # Kept here in spec.values rather than in the shared vm-common-helm-values
    # ConfigMap: the manifest renderer (scripts/flux-schema/render-bundle.py)
    # resolves spec.values only, not spec.valuesFrom, so a fix living in the
    # ConfigMap is invisible to the validation gate. spec.values also layers on
    # top of valuesFrom in Flux, so this is the authoritative place either way.
    syncJob:
      containerSecurityContext:
        allowPrivilegeEscalation: false

    vmsingle:
      spec:
        # Deliberate value (2026-08-30): 14d fits the 10Gi PVC at this fleet size.
        # VictoriaMetrics OSS has no disk-based retention cap — the safety valve is
        # -storage.minFreeDiskSpaceBytes (existing data is never deleted by it; new
        # writes are rejected below the threshold — lossless only while vmagent's
        # own disk buffer absorbs the outage, not an unconditional guarantee).
        retentionPeriod: "14d"
        replicaCount: 1
        storage:
          # Same class the admission controller already defaults (gp3 / standard-rwo),
          # stated so the manifest stops depending on each cluster's default.
          storageClassName: ${storage_class}
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 10Gi
        extraArgs:
          maxLabelsPerTimeseries: "50"
