# Generate a configmap with the values for the victoria-metrics-k8s-stack helm chart
apiVersion: v1
kind: ConfigMap
metadata:
  name: vm-common-helm-values
  namespace: observability
data:
  values.yaml: |
    tenant: "0"

    defaultRules:
      # The control-plane components below are a managed service on EKS (and
      # kube-proxy is replaced by Cilium), so they are not scraped — see the
      # kube* toggles further down. Their default *Down alerts evaluate
      # absent(up{job=...}) and would therefore fire forever. Disable the
      # matching rule groups so the alerts track the scrape config.
      groups:
        kubernetes-system-apiserver:
          create: false
        kubernetes-system-controller-manager:
          create: false
        kubernetes-system-scheduler:
          create: false
      rule:
        spec:
          annotations:
            dashboard: "https://grafana.${private_domain_name}/dashboards"

    grafanaOperatorDashboardsFormat:
      enabled: true
      instanceSelector:
        matchLabels:
          dashboards: "grafana"
      allowCrossNamespaceImport: false

    vmagent:
      externalLabels:
        cluster: "${cluster_name}"

    # vmagent's externalLabels are NOT enough, because alerts do not come from
    # vmagent -- they come from vmalert, and most upstream rules aggregate the
    # cluster label away. CPUThrottlingHigh, for instance, sums
    # `by (container, pod, namespace)`, so whatever vmagent attached is gone by
    # the time the alert fires.
    #
    # The result reached Slack as, literally:
    #
    #   27.78% throttling of CPU in namespace tooling for container metrics
    #   in pod xplane-harbor-valkey-... on cluster .
    #
    # -- an empty cluster, which is harmless with one cluster and useless with
    # two. It also silently broke the route's `group_by: [cluster, ...]`:
    # grouping on a label nothing carries groups everything together.
    #
    # vmalert stamps these onto every alert it generates, after rule evaluation,
    # so no aggregation can drop them.
    vmalert:
      spec:
        externalLabels:
          cluster: "${cluster_name}"

    alertmanager:
      enabled: true
      spec:
        externalURL: "https://vmalertmanager-${cluster_name}.${private_domain_name}"
        secrets:
          - "victoria-metrics-k8s-stack-alertmanager-slack-app"
          - "runlore-webhook-token"
      config:
        global:
          slack_api_url: "https://slack.com/api/chat.postMessage"
          http_config:
            authorization:
              credentials_file: /etc/vm/secrets/victoria-metrics-k8s-stack-alertmanager-slack-app/token
        route:
          group_by:
            - cluster
            - alertname
            - severity
            - namespace
          group_interval: 5m
          group_wait: 30s
          repeat_interval: 3h
          receiver: "slack-monitoring"
          routes:
            - matchers:
                - alertname =~ "InfoInhibitor|Watchdog|KubeCPUOvercommit"
              receiver: "blackhole"
            # Send a copy of every non-blackholed alert to the RunLore SRE agent,
            # then continue so Slack still receives it. RunLore's own trigger policy
            # decides which alerts it actually investigates.
            - receiver: "runlore"
              continue: true
            # Explicit Slack catch-all (required because the route above matches all
            # with continue: true, so the root receiver no longer fires on its own).
            - receiver: "slack-monitoring"
        receivers:
          - name: "blackhole"
          - name: "runlore"
            webhook_configs:
              - url: "http://runlore.runlore.svc:8080/webhook/alertmanager"
                send_resolved: true
                # v0.2.0 fails closed: the runlore agent requires a bearer token on
                # /webhook/alertmanager once a model is configured. Per-receiver
                # http_config overrides the global (Slack) one; the token is mounted
                # from the runlore-webhook-token secret (spec.secrets above).
                http_config:
                  authorization:
                    credentials_file: /etc/vm/secrets/runlore-webhook-token/token
          - name: "slack-monitoring"
            slack_configs:
              - channel: "#alerts"
                send_resolved: true
                title: '{{ template "slack.monzo.title" . }}'
                icon_emoji: '{{ template "slack.monzo.icon_emoji" . }}'
                color: '{{ template "slack.monzo.color" . }}'
                text: '{{ template "slack.monzo.text" . }}'
                actions:
                  - type: button
                    text: "Runbook :green_book:"
                    url: "{{ (index .Alerts 0).Annotations.runbook_url }}"
                  - type: button
                    text: "Query :mag:"
                    url: "{{ (index .Alerts 0).GeneratorURL }}"
                  - type: button
                    text: "Dashboard :grafana:"
                    url: "{{ (index .Alerts 0).Annotations.dashboard }}"
                  - type: button
                    text: "Silence :no_bell:"
                    url: '{{ template "__alert_silence_link" . }}'
                  - type: button
                    text: '{{ template "slack.monzo.link_button_text" . }}'
                    url: "{{ .CommonAnnotations.link_url }}"

    defaultDashboards:
      enabled: true
      grafanaOperator:
          enabled: true
          spec:
            instanceSelector:
              matchLabels:
                dashboards: "grafana"
            allowCrossNamespaceImport: true
            # Place VictoriaMetrics dashboards in "observability" folder
            folder: "observability"
      dashboards:
        # THE KEY IS THE RENDERED NAME'S SUFFIX, and getting it wrong fails
        # SILENTLY. Each dashboard becomes
        # `victoria-metrics-k8s-stack-dashboard-<key>`, so read the key off a live
        # object: `kubectl get grafanadashboard -n observability`. A key matching
        # no dashboard is accepted, written into the sync-job ConfigMap, and does
        # nothing -- there is no error and no warning.
        #
        # That is not hypothetical. Four entries here were `k8s-views-*` while the
        # chart's keys are `kubernetes-views-*`, so the block below did NOTHING for
        # as long as it existed, and its own comment ("already managed manually in
        # infrastructure namespace") described a de-duplication that never
        # happened: both copies shipped, fighting over one Grafana UID.
        # Resolved on 2026-08-28 the other way round -- the hand-maintained copies
        # in observability/base/grafana-operator were dropped and the chart's
        # vendored ones kept -- so those four entries are gone rather than
        # corrected.
        #
        # Operating systems this platform does not run. Every node on both clusters
        # is Linux (Bottlerocket on aws-0, Container-Optimized OS on gcp-0), so
        # these seven drew empty panels and made up 7 of 63 dashboards.
        #
        # Disabled HERE and not via a HelmRelease postRenderer: these are created
        # at RUNTIME by the chart's sync-job (labelled `managed-by: sync-job`, owned
        # by its ServiceAccount), not rendered by `helm template`. A postRenderer
        # sees nothing to delete -- tried, and it was a silent no-op.
        k8s-resources-windows-cluster:
          enabled: false
        k8s-resources-windows-namespace:
          enabled: false
        k8s-resources-windows-pod:
          enabled: false
        k8s-windows-cluster-rsrc-use:
          enabled: false
        k8s-windows-node-rsrc-use:
          enabled: false
        nodes-aix:
          enabled: false
        nodes-darwin:
          enabled: false
        # Ours, from observability/base/grafana-operator, is the only
        # node-exporter-full deployed -- this key is correct and effective.
        node-exporter-full:
          enabled: false
        # Enable VictoriaMetrics-specific dashboards
        victoriametrics-vmalert:
          enabled: true
        victoriametrics-operator:
          enabled: true

    grafana:
      sidecar:
        datasources:
          enabled: true
          initDatasources: false
      # dashboards come from grafana-operator CRs and the chart sync-job only — no file-provider sidecar.
      image:
        # Overrides the grafana subchart's default (13.1.0). The vm-k8s-stack pins
        # `grafana: 12.7.*`, so the Grafana APP version is controlled by that
        # subchart constraint, not by Renovate — security releases (here the
        # 2026-08-18 one) need this explicit tag until the stack bumps its dep.
        tag: "13.1.4"
      plugins:
        # Signed catalog plugins, pinned. These replaced two curl initContainers:
        # one frozen at v0.14.0 for 16 months, one fetching GitHub "latest" at
        # every pod start. Space-separated "<id> <version>" = pinned install.
        # renovate: datasource=github-releases depName=VictoriaMetrics/victoriametrics-datasource extractVersion=^v(?<version>.+)$
        - "victoriametrics-metrics-datasource 0.25.2"
        # renovate: datasource=github-releases depName=VictoriaMetrics/victorialogs-datasource extractVersion=^v(?<version>.+)$
        - "victoriametrics-logs-datasource 0.31.0"
        - "marcusolsson-dynamictext-panel"
      "grafana.ini":
        feature_toggles:
          enable: externalServiceAccounts
          accessControlOnCall: 'false'
        server:
          root_url: "https://grafana.${private_domain_name}"
          domain: "grafana.${private_domain_name}"
        auth.generic_oauth:
          enabled: true
          name: "SSO"
          allow_sign_up: true
          scopes: "openid profile email"
          auth_url: "${identity_provider_url}/oauth/v2/authorize"
          token_url: "${identity_provider_url}/oauth/v2/token"
          api_url: "${identity_provider_url}/oidc/v1/userinfo"
          role_attribute_path: >
            contains(roles[*], 'admin') && 'Admin' ||
            contains(roles[*], 'backend') && 'Editor' ||
            contains(roles[*], 'frontend') && 'Editor' ||
            contains(roles[*], 'data') && 'Editor' ||
            'Viewer'
      admin:
        existingSecret: "victoria-metrics-k8s-stack-grafana-envvars"
        userKey: "GF_SECURITY_ADMIN_USER"
        passwordKey: "GF_SECURITY_ADMIN_PASSWORD"
      envFromSecret: "victoria-metrics-k8s-stack-grafana-envvars"
      extraVolumes:
        - name: "plugin-provisioning-oncall"
          configMap:
            name: "grafana-provisioning"
            items:
              - key: "plugin-oncall.yaml"
                path: "plugin-oncall.yaml"
      extraVolumeMounts:
        - name: "plugin-provisioning-oncall"
          mountPath: "/etc/grafana/provisioning/plugins/oncall.yaml"
          subPath: "plugin-oncall.yaml"
    # Do not scrape controlplane components as it is a managed service on EKS
    kubeApiServer:
      enabled: false
    kubeControllerManager:
      enabled: false
    kubeEtcd:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeProxy:
      enabled: false

    # Deployed with all the other CRDs, flux kustomization
    crds:
      enabled: false

    # Avoid webhook chicken-and-egg: operator pod may not be ready when CRs are created
    victoria-metrics-operator:
      admissionWebhooks:
        policy: Ignore
