# Generate a configmap with the values for the victoria-metrics-k8s-stack helm chart
apiVersion: v1
kind: ConfigMap
metadata:
  name: vm-common-helm-values
  namespace: observability
data:
  values.yaml: |
    tenant: "0"

    defaultRules:
      # The control-plane components below are a managed service on EKS (and
      # kube-proxy is replaced by Cilium), so they are not scraped — see the
      # kube* toggles further down. Their default *Down alerts evaluate
      # absent(up{job=...}) and would therefore fire forever. Disable the
      # matching rule groups so the alerts track the scrape config.
      groups:
        kubernetes-system-apiserver:
          create: false
        kubernetes-system-controller-manager:
          create: false
        kubernetes-system-scheduler:
          create: false
      rule:
        spec:
          annotations:
            dashboard: "https://grafana.${private_domain_name}/dashboards"

    grafanaOperatorDashboardsFormat:
      enabled: true
      instanceSelector:
        matchLabels:
          dashboards: "grafana"
      allowCrossNamespaceImport: false

    vmagent:
      externalLabels:
        cluster: "${cluster_name}"

    # vmagent's externalLabels are NOT enough, because alerts do not come from
    # vmagent -- they come from vmalert, and most upstream rules aggregate the
    # cluster label away. CPUThrottlingHigh, for instance, sums
    # `by (container, pod, namespace)`, so whatever vmagent attached is gone by
    # the time the alert fires.
    #
    # The result reached Slack as, literally:
    #
    #   27.78% throttling of CPU in namespace tooling for container metrics
    #   in pod xplane-harbor-valkey-... on cluster .
    #
    # -- an empty cluster, which is harmless with one cluster and useless with
    # two. It also silently broke the route's `group_by: [cluster, ...]`:
    # grouping on a label nothing carries groups everything together.
    #
    # vmalert stamps these onto every alert it generates, after rule evaluation,
    # so no aggregation can drop them.
    vmalert:
      spec:
        externalLabels:
          cluster: "${cluster_name}"
          # env/cloud/region join cluster so a Slack message says WHERE without
          # anyone having to know which cluster runs which workload. They are on
          # vmalert and deliberately not on vmagent: vmalert attaches them to
          # alerts and recording-rule output (a few hundred series), whereas the
          # same four labels on vmagent would attach to every scraped series in
          # the TSDB -- a real cardinality bill for a presentation feature.
          #
          # `cloud` comes from a ConfigMap key added in the same change. Until
          # both `configure` stacks are applied, Flux substitutes it EMPTY; the
          # templates guard for that and drop the segment rather than render
          # "aws-0 · dev · /".
          env: "${environment}"
          cloud: "${cloud}"
          region: "${region}"

    # vmalert's `-external.url`, and the reason the Query button in every Slack
    # alert has been dead since the day it was added.
    #
    # The chart builds `external.url` from `vm-k8s-stack.grafana.addr`
    # (_helpers.tpl:470-482), which reads THIS key and otherwise falls back to
    # the Grafana INGRESS host -- only when `grafana.ingress.enabled` is true.
    # This platform routes Grafana through a Gateway API HTTPRoute, not an
    # Ingress, so that fallback never fires, the address resolved to the empty
    # string, and the helper's unconditional `http://` prefix (line 473-475) left
    # vmalert running with `-external.url=http://`.
    #
    # Every alert therefore carried
    #   generatorURL = http:/explore?left={"datasource":"VictoriaMetrics",...}
    # -- one slash, no host. Slack silently DROPS an attachment action whose URL
    # is not a valid http(s) URL, so the button did not render wrong, it did not
    # render at all. Confirmed on live gcp-0 across all 23 firing alerts.
    #
    # Include the scheme: the helper prefixes `http://` to anything without one.
    # `private_domain_name` is defined in both clusters' ConfigMaps, so one value
    # is correct on aws-0 and gcp-0 alike.
    external:
      grafana:
        host: "https://grafana.${private_domain_name}"

    alertmanager:
      enabled: true
      spec:
        externalURL: "https://vmalertmanager-${cluster_name}.${private_domain_name}"
        secrets:
          - "victoria-metrics-k8s-stack-alertmanager-slack-app"
          - "runlore-webhook-token"

      # The chart vendors Monzo's 2018 templates and enables them by default.
      # They were written for one cluster: they print no cluster, environment,
      # cloud, region, label or duration, and they print `message` and
      # `description` in full -- so a rule whose description is a runbook pastes
      # that runbook into the channel. Replaced wholesale below.
      #
      # Turning this off also deletes `__alert_silence_link`, which is defined in
      # that template and used by the Silence button. It is redefined in ours.
      monzoTemplate:
        enabled: false

      # The chart renders this map into a `<fullname>-extra-tpl` ConfigMap and
      # appends it to VMAlertmanager.spec.templates itself (see its
      # _helpers.tpl, `vm.alertmanager.spec`). Values are inserted raw -- no
      # `tpl` -- so Go template syntax survives Helm untouched.
      #
      # TWO RULES FOR EDITING THIS BLOCK:
      #
      # 1. Never write a dollar-brace reference -- and note that this rule binds
      #    the COMMENTS too, which is why none below spells one out. Flux
      #    post-build substitution rewrites the whole manifest, comments
      #    included: it expands a dollar-brace name it knows and replaces one it
      #    does not with an EMPTY STRING. check-substitution.py fails the build
      #    on the unknown case, so a worked example in a comment here is a
      #    red gate, not a footnote. Bare `$var` -- every Go template variable
      #    below -- is untouched and safe. The two references that ARE spelled
      #    out (externalURL above, private_domain_name further down) are
      #    deliberate: both are real keys in both clusters' ConfigMaps, and the
      #    template gate asserts no unsubstituted reference survives rendering.
      #
      # 2. Alertmanager ships NO sprig. There is no `default`, and no arithmetic
      #    (`sub`, `add`, `min`). Available: append base64decode base64encode
      #    date dict humanizeDuration join list match now reReplaceAll
      #    routeLabels safeHtml safeUrl since stringSlice title toJson toLower
      #    toUpper trimSpace tz urlUnescape, plus Go builtins (len index slice
      #    printf urlquery eq ne lt gt and or not with range).
      #
      # ./scripts/validate-alertmanager-templates.sh renders every string below
      # against five fixture payloads and golden-compares the output. A template
      # that fails to execute makes Alertmanager DROP the notification, so this
      # is the difference between a formatting bug and silent total alert loss.
      templateFiles:
        ogenki.tmpl: |-
          {{/* ───────────────────────── helpers ───────────────────────── */}}

          {{/* Severity, never empty. */}}
          {{- define "ogenki.severity" -}}
          {{- if .CommonLabels.severity }}{{ .CommonLabels.severity }}{{ else }}unknown{{ end -}}
          {{- end }}

          {{/* Leading emoji. :lgtm: is a workspace custom emoji already in use. */}}
          {{- define "ogenki.emoji" -}}
          {{- if ne .Status "firing" -}}:lgtm:
          {{- else if eq .CommonLabels.severity "critical" -}}:fire:
          {{- else if eq .CommonLabels.severity "warning" -}}:warning:
          {{- else if eq .CommonLabels.severity "info" -}}:information_source:
          {{- else -}}:question:
          {{- end -}}
          {{- end }}

          {{/* "aws-0 · dev". Drops the env segment rather than render a dangling
               separator when the label is empty. */}}
          {{- define "ogenki.identity" -}}
          {{- if .CommonLabels.cluster }}{{ .CommonLabels.cluster }}{{ else }}unknown-cluster{{ end -}}
          {{- with .CommonLabels.env }} · {{ . }}{{ end -}}
          {{- end }}

          {{/* "aws / eu-west-3", degrading to either half, then to an em dash.
               Empty strings are falsy, which is what makes the pre-apply
               `cloud: ""` state render correctly instead of as " / eu-west-3". */}}
          {{- define "ogenki.location" -}}
          {{- if and .CommonLabels.cloud .CommonLabels.region -}}
          {{ .CommonLabels.cloud }} / {{ .CommonLabels.region }}
          {{- else if .CommonLabels.cloud -}}{{ .CommonLabels.cloud }}
          {{- else if .CommonLabels.region -}}{{ .CommonLabels.region }}
          {{- else -}}—{{- end -}}
          {{- end }}

          {{/* "14m 0s (since 09:06 UTC)" / "resolved after 6m 0s (at 09:11 UTC)".
               UTC is explicit and deliberate: `tz` would need tzdata in the
               container, and a missing zone is a template execution error --
               which drops the notification.

               $list is the firing subset on a firing notification: a group can
               carry a resolved member (which gets its own resolved message), and
               `index .Alerts 0` could otherwise describe that member's timing
               under a FIRING title. */}}
          {{- define "ogenki.duration" -}}
          {{- $list := .Alerts -}}
          {{- if eq .Status "firing" }}{{ $list = .Alerts.Firing }}{{ end -}}
          {{- $a := index $list 0 -}}
          {{- if eq .Status "firing" -}}
          {{ humanizeDuration (since $a.StartsAt).Seconds }} (since {{ $a.StartsAt.UTC.Format "15:04 MST" }})
          {{- else -}}
          resolved after {{ humanizeDuration ($a.EndsAt.Sub $a.StartsAt).Seconds }} (at {{ $a.EndsAt.UTC.Format "15:04 MST" }})
          {{- end -}}
          {{- end }}

          {{/* The one-line headline. Group-wide annotations win over the first
               alert's; summary wins over message wins over description. A rule
               with only a description lands here with its whole body, so this
               truncates -- that is the runbook-in-the-channel fix. */}}
          {{- define "ogenki.headline" -}}
          {{- $a := index .Alerts 0 -}}
          {{- $h := "" -}}
          {{- if .CommonAnnotations.summary }}{{ $h = .CommonAnnotations.summary }}
          {{- else if .CommonAnnotations.message }}{{ $h = .CommonAnnotations.message }}
          {{- else if $a.Annotations.summary }}{{ $h = $a.Annotations.summary }}
          {{- else if $a.Annotations.message }}{{ $h = $a.Annotations.message }}
          {{- else if .CommonAnnotations.description }}{{ $h = .CommonAnnotations.description }}
          {{- else if $a.Annotations.description }}{{ $h = $a.Annotations.description }}
          {{- else }}{{ $h = "(this alert sets no summary annotation)" }}{{ end -}}
          {{- $h = reReplaceAll "\\s+" " " $h -}}
          {{- if gt (len $h) 280 }}{{ slice $h 0 280 }}…{{ else }}{{ $h }}{{ end -}}
          {{- end }}

          {{/* What one alert in the group is ABOUT: the most specific identifier
               its labels carry. */}}
          {{- define "ogenki.target" -}}
          {{- $l := .Labels -}}
          {{- if and $l.namespace $l.pod -}}{{ $l.namespace }}/{{ $l.pod }}
          {{- else if $l.pod -}}{{ $l.pod }}
          {{- else if $l.instance -}}{{ $l.instance }}
          {{- else if $l.node -}}{{ $l.node }}
          {{- else if $l.job -}}{{ $l.job }}
          {{- else if $l.namespace -}}{{ $l.namespace }}
          {{- else -}}{{ .Fingerprint }}{{- end -}}
          {{- end }}

          {{/* One bullet per alert. The description is shown only when the alert
               ALSO has a summary or message -- otherwise the description is
               already the headline and would print twice. */}}
          {{- define "ogenki.bullet" -}}
          {{ template "ogenki.target" . }}
          {{- if and .Annotations.description (or .Annotations.summary .Annotations.message) -}}
          {{- $d := reReplaceAll "\\s+" " " .Annotations.description -}}
          {{- " — " -}}
          {{- if gt (len $d) 180 }}{{ slice $d 0 180 }}…{{ else }}{{ $d }}{{ end -}}
          {{- end -}}
          {{- end }}

          {{/* Silence link. Redefined here because disabling the chart's Monzo
               template deletes the original. The alertname is appended last so
               the label list has no trailing separator. */}}
          {{- define "__alert_silence_link" -}}
          {{ .ExternalURL }}/#/silences/new?filter=%7B
          {{- range .CommonLabels.SortedPairs -}}
          {{- if ne .Name "alertname" -}}
          {{- .Name }}%3D"{{- .Value | urlquery -}}"%2C%20
          {{- end -}}
          {{- end -}}
          alertname%3D"{{ .CommonLabels.alertname }}"%7D
          {{- end }}

          {{/* ──────────────────── receiver entry points ──────────────────── */}}

          {{- define "slack.ogenki.color" -}}
          {{- if ne .Status "firing" -}}good
          {{- else if eq .CommonLabels.severity "critical" -}}danger
          {{- else if eq .CommonLabels.severity "warning" -}}warning
          {{- else -}}#439FE0
          {{- end -}}
          {{- end }}

          {{/* What Slack shows in push notifications and channel previews. It
               was unset before, which is why a phone notification said nothing
               useful. */}}
          {{- define "slack.ogenki.fallback" -}}
          [{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ len .Alerts.Firing }}{{ end }}] {{ if .CommonLabels.alertname }}{{ .CommonLabels.alertname }}{{ else }}alert{{ end }} · {{ template "ogenki.identity" . }} · {{ template "ogenki.severity" . }}
          {{- end }}

          {{- define "slack.ogenki.title" -}}
          {{ template "ogenki.emoji" . }} {{ if eq .Status "firing" }}FIRING{{ if gt (len .Alerts.Firing) 1 }} · {{ len .Alerts.Firing }}{{ end }}{{ else }}RESOLVED{{ end }} — {{ if .CommonLabels.alertname }}{{ .CommonLabels.alertname }}{{ else }}alert{{ end }}
          {{- end }}

          {{/* Two different rules in one template, deliberately. The `dashboard`
               ANNOTATION is uniform across a group, so any member answers for it
               and `.Alerts 0` is fine. GeneratorURL is PER-ALERT, so the fallback
               takes the firing subset -- see slack.ogenki.query_url. */}}
          {{- define "slack.ogenki.title_link" -}}
          {{- $list := .Alerts -}}
          {{- if eq .Status "firing" }}{{ $list = .Alerts.Firing }}{{ end -}}
          {{- $a := index .Alerts 0 -}}
          {{- if $a.Annotations.dashboard }}{{ $a.Annotations.dashboard }}{{ else }}{{ (index $list 0).GeneratorURL }}{{ end -}}
          {{- end }}

          {{/* The Query button. GeneratorURL is PER-ALERT -- unlike runbook_url and
               dashboard_url below, which read annotations and so are uniform across
               the group -- so this takes the firing subset. A Query button on a
               FIRING message that lands you on a member that has already resolved
               is the dead-button class this template exists to remove.

               This is the fourth copy of the two-line $list preamble (duration,
               text, title_link, here). It cannot be factored out: a Go template
               `define` returns a string, not a list, so there is nothing to
               capture the firing subset into. */}}
          {{- define "slack.ogenki.query_url" -}}
          {{- $list := .Alerts -}}
          {{- if eq .Status "firing" }}{{ $list = .Alerts.Firing }}{{ end -}}
          {{- (index $list 0).GeneratorURL -}}
          {{- end }}

          {{/* Identity, headline, then at most five bullets. The cap is index
               based rather than `slice`, because a slice past the end panics and
               there is no `min` to clamp it with.

               $list matches what the title counts: on a firing notification the
               title says `FIRING · {{ len .Alerts.Firing }}`, so listing a
               resolved group member below it would print more bullets than the
               count. That member gets its own resolved message anyway. */}}
          {{- define "slack.ogenki.text" -}}
          {{- $list := .Alerts -}}
          {{- if eq .Status "firing" }}{{ $list = .Alerts.Firing }}{{ end -}}
          `{{ template "ogenki.identity" . }}`

          {{ template "ogenki.headline" . }}
          {{- range $i, $a := $list }}{{ if lt $i 5 }}
           • {{ template "ogenki.bullet" $a }}{{ end }}{{ end }}
          {{- if gt (len $list) 5 }}
           … showing 5 of {{ len $list }}{{ end }}
          {{- end }}

          {{- define "slack.ogenki.field_namespace" -}}
          {{- if .CommonLabels.namespace }}{{ .CommonLabels.namespace }}{{ else }}—{{ end -}}
          {{- end }}

          {{/* No button is ever dead: both fall back to a page that exists. */}}
          {{- define "slack.ogenki.runbook_url" -}}
          {{- $a := index .Alerts 0 -}}
          {{- if $a.Annotations.runbook_url }}{{ $a.Annotations.runbook_url }}{{ else }}https://cnref.ogenki.io/docs/platform/observability/dashboards-and-alerts/{{ end -}}
          {{- end }}

          {{- define "slack.ogenki.dashboard_url" -}}
          {{- $a := index .Alerts 0 -}}
          {{- if $a.Annotations.dashboard }}{{ $a.Annotations.dashboard }}{{ else }}https://grafana.${private_domain_name}/dashboards{{ end -}}
          {{- end }}
      config:
        global:
          slack_api_url: "https://slack.com/api/chat.postMessage"
          http_config:
            authorization:
              credentials_file: /etc/vm/secrets/victoria-metrics-k8s-stack-alertmanager-slack-app/token
        route:
          group_by:
            - cluster
            - alertname
            - severity
            - namespace
          group_interval: 5m
          group_wait: 30s
          # Was 3h for every severity, so a warning nagged as often as a page.
          # This is now only the default for anything that matches no route
          # below; each severity sets its own.
          repeat_interval: 12h
          receiver: "slack-monitoring"
          routes:
            - matchers:
                - alertname =~ "InfoInhibitor|Watchdog|KubeCPUOvercommit"
              receiver: "blackhole"
            # Send a copy of every non-blackholed alert to the RunLore SRE agent,
            # then continue so Slack still receives it. RunLore's own trigger policy
            # decides which alerts it actually investigates.
            - receiver: "runlore"
              continue: true
            # One channel carries every severity, so the cadence is what
            # separates a page from a nag.
            - matchers:
                - severity = "critical"
              receiver: "slack-monitoring"
              group_wait: 10s
              repeat_interval: 1h
            - matchers:
                - severity = "warning"
              receiver: "slack-monitoring"
              repeat_interval: 12h
            # info, and anything with no severity label at all. This route has no
            # matchers on purpose: it is the catch-all that keeps an unlabelled
            # alert reachable. `severity = "critical"` does not match a missing
            # label, so without this an alert with no severity would match no
            # route and nobody would ever see it.
            - receiver: "slack-monitoring"
              repeat_interval: 24h
        receivers:
          - name: "blackhole"
          - name: "runlore"
            webhook_configs:
              - url: "http://runlore.runlore.svc:8080/webhook/alertmanager"
                send_resolved: true
                # v0.2.0 fails closed: the runlore agent requires a bearer token on
                # /webhook/alertmanager once a model is configured. Per-receiver
                # http_config overrides the global (Slack) one; the token is mounted
                # from the runlore-webhook-token secret (spec.secrets above).
                http_config:
                  authorization:
                    credentials_file: /etc/vm/secrets/runlore-webhook-token/token
          - name: "slack-monitoring"
            slack_configs:
              - channel: "#alerts"
                send_resolved: true
                icon_emoji: ":waitwhat:"
                color: '{{ template "slack.ogenki.color" . }}'
                # Unset before this change, so a phone notification showed
                # Slack's own generic preview instead of the alert.
                fallback: '{{ template "slack.ogenki.fallback" . }}'
                title: '{{ template "slack.ogenki.title" . }}'
                title_link: '{{ template "slack.ogenki.title_link" . }}'
                text: '{{ template "slack.ogenki.text" . }}'
                mrkdwn_in: ["text"]
                # `fields` is a STATIC list -- only the values are templated, so
                # a field cannot be conditionally omitted. Every value template
                # therefore falls back to an em dash rather than rendering an
                # empty box.
                fields:
                  - title: "Namespace"
                    value: '{{ template "slack.ogenki.field_namespace" . }}'
                    short: true
                  - title: "Severity"
                    value: '{{ template "ogenki.severity" . }}'
                    short: true
                  - title: "Duration"
                    value: '{{ template "ogenki.duration" . }}'
                    short: true
                  - title: "Location"
                    value: '{{ template "ogenki.location" . }}'
                    short: true
                actions:
                  - type: button
                    text: "Runbook :green_book:"
                    url: '{{ template "slack.ogenki.runbook_url" . }}'
                  - type: button
                    text: "Dashboard :grafana:"
                    url: '{{ template "slack.ogenki.dashboard_url" . }}'
                  - type: button
                    text: "Query :mag:"
                    url: '{{ template "slack.ogenki.query_url" . }}'
                  - type: button
                    text: "Silence :no_bell:"
                    url: '{{ template "__alert_silence_link" . }}'
                # The fifth button is gone. It pointed at
                # .CommonAnnotations.link_url, an annotation no rule in this repo
                # has ever set, so it rendered with an empty URL on every alert.

        # There were NO inhibit rules: setting alertmanager.config replaces the
        # chart's defaults wholesale, so every implied alert posted alongside its
        # cause. An inhibited alert never reaches Slack at all -- that is the
        # accepted trade, and the reason these are narrow.
        inhibit_rules:
          # One alertname firing at two severities: keep the louder one.
          - source_matchers:
              - severity = "critical"
            target_matchers:
              - severity = "warning"
            equal: [cluster, alertname, namespace]
          # Observed 2026-09-12, one minute apart: quorum-at-risk means a peer is
          # ALREADY lost, so the warning adds nothing. Two different alertnames,
          # which is why the generic rule above cannot catch it. Add named pairs
          # as they are observed rather than generalising -- a clever generic
          # rule mutes things nobody intended.
          - source_matchers:
              - alertname = "OpenBaoRaftQuorumAtRisk"
            target_matchers:
              - alertname = "OpenBaoRaftNodeLost"
            equal: [cluster]

    defaultDashboards:
      enabled: true
      grafanaOperator:
          enabled: true
          spec:
            instanceSelector:
              matchLabels:
                dashboards: "grafana"
            allowCrossNamespaceImport: true
            # Place VictoriaMetrics dashboards in "observability" folder
            folder: "observability"
      dashboards:
        # THE KEY IS THE RENDERED NAME'S SUFFIX, and getting it wrong fails
        # SILENTLY. Each dashboard becomes
        # `victoria-metrics-k8s-stack-dashboard-<key>`, so read the key off a live
        # object: `kubectl get grafanadashboard -n observability`. A key matching
        # no dashboard is accepted, written into the sync-job ConfigMap, and does
        # nothing -- there is no error and no warning.
        #
        # That is not hypothetical. Four entries here were `k8s-views-*` while the
        # chart's keys are `kubernetes-views-*`, so the block below did NOTHING for
        # as long as it existed, and its own comment ("already managed manually in
        # infrastructure namespace") described a de-duplication that never
        # happened: both copies shipped, fighting over one Grafana UID.
        # Resolved on 2026-08-28 the other way round -- the hand-maintained copies
        # in observability/base/grafana-operator were dropped and the chart's
        # vendored ones kept -- so those four entries are gone rather than
        # corrected.
        #
        # Operating systems this platform does not run. Every node on both clusters
        # is Linux (Bottlerocket on aws-0, Container-Optimized OS on gcp-0), so
        # these seven drew empty panels and made up 7 of 63 dashboards.
        #
        # Disabled HERE and not via a HelmRelease postRenderer: these are created
        # at RUNTIME by the chart's sync-job (labelled `managed-by: sync-job`, owned
        # by its ServiceAccount), not rendered by `helm template`. A postRenderer
        # sees nothing to delete -- tried, and it was a silent no-op.
        k8s-resources-windows-cluster:
          enabled: false
        k8s-resources-windows-namespace:
          enabled: false
        k8s-resources-windows-pod:
          enabled: false
        k8s-windows-cluster-rsrc-use:
          enabled: false
        k8s-windows-node-rsrc-use:
          enabled: false
        nodes-aix:
          enabled: false
        nodes-darwin:
          enabled: false
        # Ours, from observability/base/grafana-operator, is the only
        # node-exporter-full deployed -- this key is correct and effective.
        node-exporter-full:
          enabled: false
        # Enable VictoriaMetrics-specific dashboards
        victoriametrics-vmalert:
          enabled: true
        victoriametrics-operator:
          enabled: true

    grafana:
      sidecar:
        datasources:
          enabled: true
          initDatasources: false
      # dashboards come from grafana-operator CRs and the chart sync-job only — no file-provider sidecar.
      image:
        # Overrides the grafana subchart's default (13.1.x). The vm-k8s-stack pins
        # `grafana: 12.7.*`, so the Grafana APP version is controlled by that
        # subchart constraint, not by Renovate — security releases (here the
        # 2026-08-18 one) need this explicit tag until the stack bumps its dep.
        tag: "13.1.4"
      plugins:
        # Signed catalog plugins, pinned. These replaced two curl initContainers:
        # one frozen at v0.14.0 for 16 months, one fetching GitHub "latest" at
        # every pod start. The chart maps this list straight to
        # GF_PLUGINS_PREINSTALL_SYNC, whose pin separator is "@" — a space
        # (like "id version") is silently split as two bare plugin ids instead,
        # so the version half becomes a bogus plugin id on a fail-hard preinstall
        # path and the real plugin installs UNPINNED. Use "<id>@<version>".
        # renovate: datasource=github-releases depName=VictoriaMetrics/victoriametrics-datasource extractVersion=^v(?<version>.+)$
        - "victoriametrics-metrics-datasource@0.25.2"
        # These pins are tracked from GITHUB RELEASES but installed from the
        # GRAFANA.COM CATALOG, and the two publish independently -- a tag can
        # exist on GitHub days before (or without ever) reaching the catalog.
        # Renovate has no catalog datasource, so it cannot see the difference.
        #
        # 0.32.0 was merged that way (#1959) and the catalog did not have it:
        #   failed to install plugin victoriametrics-logs-datasource@0.32.0:
        #   [plugin.versionNotFound] ... was not returned by the Grafana.com catalog
        # Grafana then refuses to start at all -- the plugin installer is a
        # startup module, so this is CrashLoopBackOff rather than a missing
        # datasource, and it takes observability -> tooling -> apps down with it.
        #
        # Before accepting a bump here, check the version is actually published:
        #   curl -s https://grafana.com/api/plugins/<plugin-id>/versions | jq -r '.items[].version'
        # renovate: datasource=github-releases depName=VictoriaMetrics/victorialogs-datasource extractVersion=^v(?<version>.+)$
        - "victoriametrics-logs-datasource@0.32.0"
        - "marcusolsson-dynamictext-panel"
      "grafana.ini":
        feature_toggles:
          enable: externalServiceAccounts
        server:
          root_url: "https://grafana.${private_domain_name}"
          domain: "grafana.${private_domain_name}"
        auth.generic_oauth:
          enabled: true
          name: "SSO"
          allow_sign_up: true
          scopes: "openid profile email"
          auth_url: "${identity_provider_url}/oauth/v2/authorize"
          token_url: "${identity_provider_url}/oauth/v2/token"
          api_url: "${identity_provider_url}/oidc/v1/userinfo"
          role_attribute_path: >
            contains(roles[*], 'platform') && 'Admin' ||
            contains(roles[*], 'backend') && 'Editor' ||
            contains(roles[*], 'frontend') && 'Editor' ||
            contains(roles[*], 'data') && 'Editor' ||
            'Viewer'
      admin:
        existingSecret: "victoria-metrics-k8s-stack-grafana-envvars"
        userKey: "GF_SECURITY_ADMIN_USER"
        passwordKey: "GF_SECURITY_ADMIN_PASSWORD"
      envFromSecret: "victoria-metrics-k8s-stack-grafana-envvars"
    # Do not scrape controlplane components as it is a managed service on EKS
    kubeApiServer:
      enabled: false
    kubeControllerManager:
      enabled: false
    kubeEtcd:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeProxy:
      enabled: false

    # Deployed with all the other CRDs, flux kustomization
    crds:
      enabled: false

    # Avoid webhook chicken-and-egg: operator pod may not be ready when CRs are created
    victoria-metrics-operator:
      admissionWebhooks:
        policy: Ignore
