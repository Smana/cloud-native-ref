apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Only rules that mean something on BOTH clouds.
#
# karpenter.yaml moved to observability/aws-0/victoria-metrics-k8s-stack/vmrules/.
# It was a hard failure on gcp-0, not merely noise: the VMRule declares
# `namespace: karpenter`, and GCP has no Karpenter at all (ADR-0006 chose Node
# Auto-Provisioning), so the Kustomization died with
# `VMRule/karpenter/karpenter not found: namespaces "karpenter" not found` and
# took grafana-operator, observability and victoria-traces down with it through
# dependsOn.
#
# runlore.yaml moved BACK to base on 2026-08-30: runlore has run on both
# clusters since #1862, but its health alerts had been left behind in the
# aws-0-only overlay, so gcp-0's agent going dark was invisible — nothing was
# watching it there.
#
# ai-fleet LLM-platform alerts moved to apps/base/ai/llm/vmrule-ai-fleet.yaml so
# they only deploy when the (opt-in, suspend-by-default) LLM platform is resumed —
# otherwise LLMPlatformSemanticRouterDown fires forever on an LLM-free cluster.
# cert-manager.yaml is in base deliberately: both clouds run cert-manager, both
# issue through Let's Encrypt, and the failure it watches for (an errored ACME
# order that cert-manager never retries) is cloud-neutral.
resources:
  - cert-manager.yaml
  - openbao.yaml
  - runlore.yaml
