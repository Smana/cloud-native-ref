apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  labels:
    app: openbao
  name: openbao
  namespace: observability
spec:
  groups:
    - name: openbao
      rules:
        # This is the alert whose absence let an expired server certificate go
        # unnoticed for nine months. The scrape verifies TLS against the CA
        # chain, so an expired or mis-issued certificate fails the scrape and
        # surfaces here rather than being papered over by a skip-verify.
        - alert: OpenBaoDown
          expr: up{job="openbao"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            message: OpenBao is unreachable.
            description: |
              The OpenBao endpoint has failed to scrape for 5 minutes. Either the
              service is down or its TLS certificate no longer validates against
              the CA chain. Check `openssl s_client -connect bao.${private_domain_name}:8200`
              for an expiry before assuming the process is dead.
            runbook_url: "https://openbao.org/docs/internals/telemetry/"
            dashboard: "https://grafana.${private_domain_name}/dashboards"

        - alert: OpenBaoSealed
          # max by (instance), not a bare `== 0`, for the same reason
          # OpenBaoNoActiveNode below wraps its expression in max(): OpenBao
          # publishes vault_core_unsealed TWICE per scrape -- once carrying the
          # cluster label (which the scrape relabels to exported_cluster) with
          # the real value, and once without any, always 0. A bare comparison
          # matches the always-zero copy, so this alert fires critical forever on
          # a perfectly healthy cluster. Verified on the rebuilt HA cluster:
          # `vault_core_unsealed` returns {exported_cluster=...}=1 AND {}=0, both
          # 16s fresh, while `max by (instance) (...)` returns 1.
          expr: max by (instance) (vault_core_unsealed{job="openbao"}) == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            message: OpenBao is sealed.
            description: |
              A node has been sealed for 5 minutes. Auto-unseal uses AWS KMS, so
              this usually means the instance role lost kms:Decrypt on the unseal
              key or KMS is unavailable in the region. Every secret read and
              certificate issuance is failing while this holds.
            runbook_url: "https://openbao.org/docs/concepts/seal/"
            dashboard: "https://grafana.${private_domain_name}/dashboards"

        - alert: OpenBaoNoActiveNode
          expr: max(vault_core_active{job="openbao"}) == 0
          for: 10m
          labels:
            severity: critical
          annotations:
            message: No active OpenBao node.
            description: |
              No node has reported itself active for 10 minutes. In ha mode this
              means raft has not elected a leader; check `bao operator raft
              list-peers` for dead voters left behind by replaced instances.
            runbook_url: "https://openbao.org/docs/internals/integrated-storage/"
            dashboard: "https://grafana.${private_domain_name}/dashboards"

        # Two thresholds on the same metric, because the interesting moment is
        # the FIRST lost node, not the last. A five-node cluster with min_quorum
        # 3 has a failure tolerance of 2 when healthy. At `< 1` the cluster is
        # already one failure from losing quorum -- by then it is an incident,
        # not a warning.
        #
        # Measured 2026-08-19: raft listed six voters against five live
        # instances (a replaced spot node left behind as a voter) and
        # vault_autopilot_failure_tolerance read exactly 1 -- so the old rule
        # stayed silent through it. Quorum is computed over the voter set, not
        # over live instances, so a stale voter raises the quorum bar (4 of 6
        # instead of 3 of 5) and halves the tolerance without anything failing.
        #
        # Neither fires in dev mode: a single raft node runs no autopilot,
        # so the metric does not exist.
        - alert: OpenBaoRaftNodeLost
          expr: vault_autopilot_failure_tolerance{job="openbao"} < 2
          for: 15m
          labels:
            severity: warning
          annotations:
            message: OpenBao raft cluster has lost redundancy.
            description: |
              Failure tolerance has been below 2 for 15 minutes, so a five-node
              cluster is no longer tolerating the two failures it is sized for.
              Usually a dead peer: instances replaced without
              `bao operator raft remove-peer` stay in the voter set, which spot
              reclamation does routinely.

              Compare the voter list against the running instances:
                bao operator raft list-peers
                aws autoscaling describe-auto-scaling-groups --region <region> \
                  --auto-scaling-group-names <asg> \
                  --query 'AutoScalingGroups[0].Instances[].InstanceId'

              Autopilot only removes these when dead server cleanup is enabled;
              that is the vault_raft_autopilot resource in
              opentofu/aws/openbao/management/autopilot.tf.
            runbook_url: "https://openbao.org/docs/concepts/integrated-storage/autopilot"
            dashboard: "https://grafana.${private_domain_name}/dashboards"

        - alert: OpenBaoRaftQuorumAtRisk
          expr: vault_autopilot_failure_tolerance{job="openbao"} < 1
          for: 15m
          labels:
            severity: critical
          annotations:
            message: OpenBao raft cluster cannot tolerate a node failure.
            description: |
              Failure tolerance has been below 1 for 15 minutes: losing one more
              node loses quorum, and a cluster without quorum cannot issue a
              certificate or read a secret. If OpenBaoRaftNodeLost fired first
              and was not acted on, this is that same dead peer plus a real one.
            runbook_url: "https://openbao.org/docs/concepts/integrated-storage/autopilot"
            dashboard: "https://grafana.${private_domain_name}/dashboards"

        # The backup ran and failed every night with nobody watching. Two
        # separate alerts on purpose: a job can fail loudly, or the CronJob can
        # quietly stop being scheduled at all.
        - alert: OpenBaoSnapshotJobFailed
          expr: kube_job_status_failed{namespace="security", job_name=~"openbao-snapshot.*"} > 0
          for: 15m
          labels:
            severity: critical
          annotations:
            message: The OpenBao snapshot job failed.
            description: |
              The nightly raft snapshot did not complete. Start with the pod
              logs:
                kubectl logs -n security -l app.kubernetes.io/instance=openbao \
                  --tail=100

              Every cluster runs raft storage in every mode — `storage "raft"`
              is unconditional in both clouds' OpenBao boot scripts — so
              `bao operator raft snapshot save` is available and there is no
              configuration in which this job is expected to fail. The usual
              causes are the JWT login (role `openbao-snapshot` on
              `jwt/<cluster>`, audience `openbao`) and write access to the
              lineage's snapshot bucket.
            runbook_url: "https://github.com/Smana/cloud-native-ref/blob/main/container-images/openbao-snapshot/README.md"
            dashboard: "https://grafana.${private_domain_name}/dashboards"

        # Two arms on purpose. kube-state-metrics only emits
        # kube_cronjob_status_last_successful_time once status.lastSuccessfulTime
        # is populated, so a CronJob that has *never* succeeded produces no
        # series at all and a `time() - <series>` comparison evaluates over an
        # empty vector — silent forever. The second arm is what covers that, and
        # it is worth keeping: a snapshot CronJob that has never once succeeded
        # is the exact condition this alert exists for, and now that it CAN
        # succeed on every cluster the arm is a real signal rather than a
        # permanent fixture.
        #
        # The `and on()` age guard is the part that makes it a real signal. The
        # bare arm is true from the moment kube-state-metrics first sees the
        # CronJob until the first snapshot succeeds, which on a HEALTHY,
        # freshly-built cluster is up to 25.5h:
        #
        #   next 04:00 UTC after the object is applied (schedule "0 4 * * *")
        #                                                            <= 24.0h
        #   startingDeadlineSeconds: 3600 — a missed run may start this late
        #                                                             + 1.0h
        #   activeDeadlineSeconds: 1800 — the Job's own bound, retries included
        #                                                             + 0.5h
        #                                                            --------
        #                                                              25.5h
        #
        # Unguarded, that is a day of critical paging on every cluster build,
        # indistinguishable from the real thing and with no action available to
        # the responder but "wait". kube_cronjob_created is a unix timestamp KSM
        # emits for the object itself, so requiring 26h of CronJob age (93600s,
        # 30m of slack over the worst case, plus this rule's own `for: 30m`)
        # suppresses exactly the bootstrap window and nothing else.
        #
        # Why an age guard and not a longer `for:`. `for:` is per-RULE, so a 26h
        # `for:` would also delay the 36h freshness arm to 62h and destroy the
        # signal it exists for. It is also vmalert's in-memory timer: a vmalert
        # restart inside the window resets it, and nothing here configures
        # remoteRead alert-state restore. The guard is cluster state, so it
        # survives a restart.
        #
        # Known limitation, accepted: kube_cronjob_created tracks the OBJECT, so
        # a Flux prune/recreate of the CronJob reopens the 26h window. That is
        # the same class of event as a re-bootstrap, which is what the window is
        # for.
        #
        # Vector matching: `absent()` returns its equality matchers as labels, so
        # the arm still carries namespace/cronjob; `max()` drops all labels,
        # hence `on()` with an empty label set. `and` binds tighter than `or`,
        # and the parentheses make that explicit rather than implied.
        - alert: OpenBaoSnapshotStale
          expr: |
            time() - kube_cronjob_status_last_successful_time{namespace="security", cronjob="openbao-snapshot"} > 129600
            or (
              absent(kube_cronjob_status_last_successful_time{namespace="security", cronjob="openbao-snapshot"}) == 1
              and on() (time() - max(kube_cronjob_created{namespace="security", cronjob="openbao-snapshot"}) > 93600)
            )
          for: 30m
          labels:
            severity: critical
          annotations:
            message: No successful OpenBao snapshot in 36 hours (or none ever).
            description: |
              Either the last successful snapshot is more than 36 hours old
              against a daily schedule, or the CronJob has existed for over 26
              hours without ever succeeding once. Every cluster runs raft
              storage, so this job can succeed everywhere it is deployed — there
              is no configuration in which a missing snapshot is expected. The
              disaster-recovery position is degrading silently: a backup with no
              freshness signal is not a backup, and one that has never run is
              not a backup at all.

              What to check, in order:

                kubectl get cronjob -n security openbao-snapshot -o \
                  jsonpath='suspend={.spec.suspend} last={.status.lastSuccessfulTime}{"\n"}'
                kubectl get jobs -n security -l app.kubernetes.io/instance=openbao
                kubectl logs -n security -l app.kubernetes.io/instance=openbao \
                  --tail=100

              `suspend=true`, or no Job objects at all, means nothing ever ran —
              look at the security-openbao-snapshot Flux Kustomization, not at
              OpenBao. Jobs that ran and failed belong to
              OpenBaoSnapshotJobFailed; the usual causes are the JWT login and
              write access to the lineage's snapshot bucket.

              Inside the first 26 hours of a cluster's life this alert is
              deliberately silent, because a CronJob that has not reached its
              first 04:00 UTC run is not yet a fault. That window is not
              coverage: until the first success there is no snapshot of this
              cluster. To get one now rather than waiting for the schedule:

                kubectl create job -n security \
                  --from=cronjob/openbao-snapshot openbao-snapshot-manual
            runbook_url: "https://github.com/Smana/cloud-native-ref/blob/main/container-images/openbao-snapshot/README.md"
            dashboard: "https://grafana.${private_domain_name}/dashboards"
