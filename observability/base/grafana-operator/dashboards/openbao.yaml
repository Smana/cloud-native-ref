# OpenBao runs outside the cluster; its metrics come from the openbao
# VMScrapeConfig (job="openbao"). Gauges are wrapped in max() because OpenBao
# publishes vault_core_unsealed/vault_core_active twice per scrape, once with an
# always-0 copy -- see vmrules/openbao.yaml.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: openbao
  namespace: observability
spec:
  allowCrossNamespaceImport: true
  folderRef: "kubernetes"
  datasources:
    - inputName: "DS_PROMETHEUS"
      datasourceName: "VictoriaMetrics"
  instanceSelector:
    matchLabels:
      dashboards: "grafana"
  json: |
    {
      "__inputs": [
        {
          "name": "DS_PROMETHEUS",
          "label": "VictoriaMetrics",
          "type": "datasource",
          "pluginId": "prometheus",
          "pluginName": "Prometheus"
        }
      ],
      "editable": true,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "panels": [
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "id": 1,
          "panels": [],
          "title": "Seal and leadership",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "$${DS_PROMETHEUS}" },
          "description": "1 when the node is unsealed. Auto-unseal uses cloud KMS: a sealed node usually means the instance lost decrypt on the unseal key.",
          "fieldConfig": {
            "defaults": {
              "mappings": [
                { "type": "value", "options": { "0": { "text": "Sealed", "color": "red" }, "1": { "text": "Unsealed", "color": "green" } } }
              ],
              "thresholds": { "mode": "absolute", "steps": [ { "color": "red", "value": null }, { "color": "green", "value": 1 } ] }
            },
            "overrides": []
          },
          "gridPos": { "h": 5, "w": 6, "x": 0, "y": 1 },
          "id": 2,
          "options": { "colorMode": "background", "graphMode": "none", "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "textMode": "value" },
          "targets": [
            { "datasource": { "type": "prometheus", "uid": "$${DS_PROMETHEUS}" }, "expr": "max(vault_core_unsealed{job=\"openbao\"})", "refId": "A" }
          ],
          "title": "Seal status",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "$${DS_PROMETHEUS}" },
          "description": "1 when a node reports itself active. 0 for 10 minutes fires OpenBaoNoActiveNode.",
          "fieldConfig": {
            "defaults": {
              "mappings": [
                { "type": "value", "options": { "0": { "text": "No active node", "color": "red" }, "1": { "text": "Active", "color": "green" } } }
              ],
              "thresholds": { "mode": "absolute", "steps": [ { "color": "red", "value": null }, { "color": "green", "value": 1 } ] }
            },
            "overrides": []
          },
          "gridPos": { "h": 5, "w": 6, "x": 6, "y": 1 },
          "id": 3,
          "options": { "colorMode": "background", "graphMode": "none", "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "textMode": "value" },
          "targets": [
            { "datasource": { "type": "prometheus", "uid": "$${DS_PROMETHEUS}" }, "expr": "max(vault_core_active{job=\"openbao\"})", "refId": "A" }
          ],
          "title": "Active node",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "$${DS_PROMETHEUS}" },
          "description": "Seal and active state over time; a dip is a seal or a leadership change.",
          "fieldConfig": {
            "defaults": {
              "custom": { "drawStyle": "line", "lineInterpolation": "stepAfter", "fillOpacity": 10, "showPoints": "never" },
              "max": 1,
              "min": 0
            },
            "overrides": []
          },
          "gridPos": { "h": 5, "w": 12, "x": 12, "y": 1 },
          "id": 4,
          "options": { "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true }, "tooltip": { "mode": "multi", "sort": "none" } },
          "targets": [
            { "datasource": { "type": "prometheus", "uid": "$${DS_PROMETHEUS}" }, "expr": "max(vault_core_unsealed{job=\"openbao\"})", "legendFormat": "unsealed", "refId": "A" },
            { "datasource": { "type": "prometheus", "uid": "$${DS_PROMETHEUS}" }, "expr": "max(vault_core_active{job=\"openbao\"})", "legendFormat": "active", "refId": "B" }
          ],
          "title": "Seal and active state",
          "type": "timeseries"
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 6 },
          "id": 5,
          "panels": [],
          "title": "Requests and errors",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "$${DS_PROMETHEUS}" },
          "description": "Requests handled per second, and the login subset.",
          "fieldConfig": {
            "defaults": {
              "custom": { "drawStyle": "line", "fillOpacity": 10, "showPoints": "never" },
              "unit": "reqps"
            },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 7 },
          "id": 6,
          "options": { "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true }, "tooltip": { "mode": "multi", "sort": "none" } },
          "targets": [
            { "datasource": { "type": "prometheus", "uid": "$${DS_PROMETHEUS}" }, "expr": "sum(rate(vault_core_handle_request_count{job=\"openbao\"}[$__rate_interval]))", "legendFormat": "all requests", "refId": "A" },
            { "datasource": { "type": "prometheus", "uid": "$${DS_PROMETHEUS}" }, "expr": "sum(rate(vault_core_handle_login_request_count{job=\"openbao\"}[$__rate_interval]))", "legendFormat": "logins", "refId": "B" }
          ],
          "title": "Request rate",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "$${DS_PROMETHEUS}" },
          "description": "Responses per second by HTTP status code. 4xx is mostly permission denied or missing paths; 5xx is OpenBao failing.",
          "fieldConfig": {
            "defaults": {
              "custom": { "drawStyle": "line", "fillOpacity": 20, "showPoints": "never", "stacking": { "group": "A", "mode": "normal" } },
              "unit": "reqps"
            },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 7 },
          "id": 7,
          "options": { "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true }, "tooltip": { "mode": "multi", "sort": "desc" } },
          "targets": [
            { "datasource": { "type": "prometheus", "uid": "$${DS_PROMETHEUS}" }, "expr": "sum by (code) (rate(vault_core_response_status_code{job=\"openbao\"}[$__rate_interval]))", "legendFormat": "{{code}}", "refId": "A" }
          ],
          "title": "Responses by status code",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "$${DS_PROMETHEUS}" },
          "description": "Share of responses with a 4xx or 5xx status. `or vector(0)` keeps the panel at 0 rather than empty when no error has occurred since the last restart.",
          "fieldConfig": {
            "defaults": {
              "custom": { "drawStyle": "line", "fillOpacity": 10, "showPoints": "never" },
              "min": 0,
              "unit": "percentunit"
            },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 15 },
          "id": 8,
          "options": { "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true }, "tooltip": { "mode": "multi", "sort": "none" } },
          "targets": [
            { "datasource": { "type": "prometheus", "uid": "$${DS_PROMETHEUS}" }, "expr": "(sum(rate(vault_core_response_status_code{job=\"openbao\", code=~\"4..\"}[$__rate_interval])) or vector(0)) / sum(rate(vault_core_response_status_code{job=\"openbao\"}[$__rate_interval]))", "legendFormat": "4xx", "refId": "A" },
            { "datasource": { "type": "prometheus", "uid": "$${DS_PROMETHEUS}" }, "expr": "(sum(rate(vault_core_response_status_code{job=\"openbao\", code=~\"5..\"}[$__rate_interval])) or vector(0)) / sum(rate(vault_core_response_status_code{job=\"openbao\"}[$__rate_interval]))", "legendFormat": "5xx", "refId": "B" }
          ],
          "title": "Error ratio",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "$${DS_PROMETHEUS}" },
          "description": "Request handling latency quantiles. go-metrics summaries cover a sliding window, so these are recent, not cumulative.",
          "fieldConfig": {
            "defaults": {
              "custom": { "drawStyle": "line", "fillOpacity": 10, "showPoints": "never" },
              "unit": "ms"
            },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 15 },
          "id": 9,
          "options": { "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true }, "tooltip": { "mode": "multi", "sort": "none" } },
          "targets": [
            { "datasource": { "type": "prometheus", "uid": "$${DS_PROMETHEUS}" }, "expr": "max by (quantile) (vault_core_handle_request{job=\"openbao\", quantile=~\"0.5|0.99\"})", "legendFormat": "p{{quantile}}", "refId": "A" }
          ],
          "title": "Request latency",
          "type": "timeseries"
        }
      ],
      "refresh": "1m",
      "schemaVersion": 39,
      "tags": ["openbao", "security"],
      "templating": { "list": [] },
      "time": { "from": "now-24h", "to": "now" },
      "timepicker": {},
      "timezone": "",
      "title": "OpenBao",
      "uid": "openbao-overview",
      "version": 1
    }
