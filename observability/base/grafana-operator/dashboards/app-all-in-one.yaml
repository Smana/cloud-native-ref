apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: app-all-in-one
  namespace: apps
spec:
  allowCrossNamespaceImport: true
  folderRef: "apps"
  instanceSelector:
    matchLabels:
      dashboards: "grafana"
  json: |
    {
      "uid": "app-all-in-one",
      "title": "Observability Demo - All in One",
      "description": "RED metrics, trace search and service map, and log context",
      "tags": ["observability", "traces", "metrics", "demo"],
      "timezone": "browser",
      "editable": true,
      "graphTooltip": 1,
      "time": {
        "from": "now-30m",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "query": "prometheus",
            "current": {
              "selected": false,
              "text": "VictoriaMetrics",
              "value": "VictoriaMetrics"
            },
            "hide": 0,
            "includeAll": false,
            "multi": false,
            "options": [],
            "refresh": 1,
            "regex": "",
            "skipUrlSync": false,
            "type": "datasource"
          },
          {
            "name": "logs_datasource",
            "label": "Logs Datasource",
            "type": "datasource",
            "query": "victoriametrics-logs-datasource",
            "current": {
              "selected": false,
              "text": "VictoriaLogs",
              "value": "VictoriaLogs"
            },
            "hide": 0,
            "includeAll": false,
            "multi": false,
            "options": [],
            "refresh": 1,
            "regex": "",
            "skipUrlSync": false,
            "type": "datasource"
          },
          {
            "name": "namespace",
            "type": "constant",
            "query": "apps",
            "current": {
              "text": "apps",
              "value": "apps"
            },
            "hide": 2
          },
          {
            "name": "service",
            "label": "Service",
            "type": "query",
            "datasource": {"type": "prometheus", "uid": "$${datasource}"},
            "query": {"query": "label_values(http.server.request.duration_count, service.name)", "refId": "service"},
            "definition": "label_values(http.server.request.duration_count, service.name)",
            "current": {
              "selected": true,
              "text": "image-gallery",
              "value": "image-gallery"
            },
            "hide": 0,
            "includeAll": false,
            "multi": false,
            "options": [],
            "refresh": 1,
            "regex": "",
            "sort": 1,
            "skipUrlSync": false
          },
          {
            "name": "min_trace_duration",
            "label": "Min Trace Duration",
            "type": "textbox",
            "query": "",
            "current": {
              "selected": false,
              "text": "",
              "value": ""
            },
            "hide": 0,
            "skipUrlSync": false
          },
          {
            "name": "operation",
            "label": "Route",
            "description": "Jaeger operation name, exactly as the span reports it -- GET /api/images, POST /api/images, GET /api/images/{id}/view, GET /api/images/{id}/thumbnail, GET /api/settings, DELETE /api/images/{id}. Empty means every route.",
            "type": "textbox",
            "query": "",
            "current": {"selected": false, "text": "", "value": ""},
            "hide": 0,
            "options": [],
            "skipUrlSync": false
          },
          {
            "name": "trace_tags",
            "label": "Trace filter",
            "description": "Jaeger tag filter in logfmt, which is what this datasource expects -- error=true for failures only, or http.response.status_code=503. Empty means every trace.",
            "type": "textbox",
            "query": "",
            "current": {"selected": false, "text": "", "value": ""},
            "hide": 0,
            "options": [],
            "skipUrlSync": false
          }
        ]
      },
      "panels": [
        {
          "type": "row",
          "title": "📊 METRICS: Service Health",
          "gridPos": {"x": 0, "y": 0, "w": 24, "h": 1},
          "collapsed": false
        },
        {
          "type": "timeseries",
          "title": "HTTP Request Rate (requests/sec)",
          "gridPos": {"x": 0, "y": 1, "w": 12, "h": 8},
          "datasource": {"type": "prometheus", "uid": "$${datasource}"},
          "targets": [
            {
              "expr": "sum(rate(http.server.request.duration_count{service.name=\"$service\",http.route!~\"/healthz|/readyz\"}[1m]))",
              "legendFormat": "Total requests/sec",
              "refId": "A"
            },
            {
              "expr": "sum by (http.response.status_code) (rate(http.server.request.duration_count{service.name=\"$service\",http.route!~\"/healthz|/readyz\"}[1m]))",
              "legendFormat": "{{http.response.status_code}}",
              "refId": "B"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "palette-classic"},
              "custom": {
                "axisCenteredZero": false,
                "axisLabel": "requests/sec",
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineWidth": 2,
                "showPoints": "auto"
              },
              "unit": "reqps"
            }
          },
          "options": {
            "tooltip": {"mode": "multi"},
            "legend": {"displayMode": "list", "placement": "bottom"}
          }
        },
        {
          "type": "timeseries",
          "title": "Response Time (P95 latency)",
          "links": [
            {"title": "\ud83d\udd0d View traces for this time range", "url": "/d/app-all-in-one?viewPanel=1000&$${__url_time_range}"},
            {"title": "\ud83d\udccb View error logs for this time range", "url": "/d/app-all-in-one?viewPanel=1001&$${__url_time_range}"}
          ],
          "gridPos": {"x": 12, "y": 1, "w": 12, "h": 8},
          "datasource": {"type": "prometheus", "uid": "$${datasource}"},
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(http.server.request.duration_bucket{service.name=\"$service\",http.route!~\"/healthz|/readyz\"}[1m])) by (vmrange, http.route))",
              "legendFormat": "P95 - {{http.route}}",
              "refId": "A"
            },
            {
              "expr": "histogram_quantile(0.50, sum(rate(http.server.request.duration_bucket{service.name=\"$service\",http.route!~\"/healthz|/readyz\"}[1m])) by (vmrange))",
              "legendFormat": "P50 (median)",
              "refId": "B"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "palette-classic"},
              "custom": {
                "axisCenteredZero": false,
                "axisLabel": "seconds",
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineWidth": 2
              },
              "unit": "s",
              "links": [
                {
                  "title": "View traces for this time range",
                  "url": "/d/app-all-in-one?viewPanel=1000&var-min_trace_duration=&$${__url_time_range}"
                },
                {
                  "title": "View error logs for this time range",
                  "url": "/d/app-all-in-one?viewPanel=1001&$${__url_time_range}"
                }
              ]
            }
          },
          "options": {
            "tooltip": {"mode": "multi"},
            "legend": {"displayMode": "list", "placement": "bottom"}
          }
        },
        {
          "type": "stat",
          "title": "Error Rate %",
          "gridPos": {"x": 0, "y": 9, "w": 6, "h": 4},
          "datasource": {"type": "prometheus", "uid": "$${datasource}"},
          "targets": [
            {
              "expr": "sum(rate(http.server.request.duration_count{service.name=\"$service\",http.route!~\"/healthz|/readyz\",http.response.status_code=~\"5..\"}[1m])) / sum(rate(http.server.request.duration_count{service.name=\"$service\",http.route!~\"/healthz|/readyz\"}[1m])) * 100",
              "legendFormat": "5xx rate",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "thresholds"},
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "yellow", "value": 1},
                  {"color": "orange", "value": 5},
                  {"color": "red", "value": 10}
                ]
              },
              "unit": "percent",
              "decimals": 2
            }
          },
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "textMode": "value_and_name"
          }
        },
        {
          "type": "stat",
          "title": "Request Rate",
          "gridPos": {"x": 6, "y": 9, "w": 6, "h": 4},
          "datasource": {"type": "prometheus", "uid": "$${datasource}"},
          "targets": [
            {
              "expr": "sum(rate(http.server.request.duration_count{service.name=\"$service\",http.route!~\"/healthz|/readyz\"}[1m]))",
              "legendFormat": "requests/sec",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "palette-classic"},
              "unit": "reqps",
              "decimals": 1
            }
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "textMode": "value_and_name"
          }
        },
        {
          "type": "stat",
          "title": "P95 Latency",
          "gridPos": {"x": 12, "y": 9, "w": 6, "h": 4},
          "datasource": {"type": "prometheus", "uid": "$${datasource}"},
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(http.server.request.duration_bucket{service.name=\"$service\",http.route!~\"/healthz|/readyz\"}[1m])) by (vmrange))",
              "legendFormat": "p95",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "thresholds"},
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "yellow", "value": 0.5},
                  {"color": "orange", "value": 1},
                  {"color": "red", "value": 5}
                ]
              },
              "unit": "s",
              "decimals": 3
            }
          },
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "textMode": "value_and_name"
          }
        },
        {
          "type": "stat",
          "title": "Total 5xx Errors (last 5m)",
          "gridPos": {"x": 18, "y": 9, "w": 6, "h": 4},
          "datasource": {"type": "prometheus", "uid": "$${datasource}"},
          "targets": [
            {
              "expr": "sum(increase(http.server.request.duration_count{service.name=\"$service\",http.route!~\"/healthz|/readyz\",http.response.status_code=~\"5..\"}[5m]))",
              "legendFormat": "5xx (5m)",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "thresholds"},
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "red", "value": 1}
                ]
              },
              "unit": "short",
              "decimals": 0
            }
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value_and_name"
          }
        },
        {
          "type": "timeseries",
          "title": "Request Count by Status Code",
          "gridPos": {"x": 0, "y": 13, "w": 24, "h": 6},
          "datasource": {"type": "prometheus", "uid": "$${datasource}"},
          "targets": [
            {
              "expr": "sum by (http.response.status_code) (rate(http.server.request.duration_count{service.name=\"$service\",http.route!~\"/healthz|/readyz\"}[1m]))",
              "legendFormat": "HTTP {{http.response.status_code}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "palette-classic"},
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 20,
                "lineWidth": 2,
                "stacking": {"mode": "normal"}
              },
              "unit": "reqps"
            },
            "overrides": [
              {
                "matcher": {"id": "byRegexp", "options": ".*5.*"},
                "properties": [
                  {"id": "color", "value": {"mode": "fixed", "fixedColor": "red"}}
                ]
              },
              {
                "matcher": {"id": "byRegexp", "options": ".*200.*"},
                "properties": [
                  {"id": "color", "value": {"mode": "fixed", "fixedColor": "green"}}
                ]
              }
            ]
          },
          "options": {
            "tooltip": {"mode": "multi"},
            "legend": {"displayMode": "list", "placement": "bottom"}
          }
        },
        {
          "type": "row",
          "title": "📋 Error Logs with Context",
          "gridPos": {"x": 0, "y": 19, "w": 24, "h": 1},
          "collapsed": false
        },
        {
          "id": 1001,
          "type": "logs",
          "title": "Application Warnings and Errors (click a line, then View Trace)",
          "description": "Warning and error logs from BOTH containers of the app. It previously filtered on kubernetes.container_name, which matches only the web container -- every error here comes from the worker, so the panel was always empty. Scoped on log.service.name instead, and widened to warn because the retry attempts behind the red spans in traces log at warn; only the final give-up logs at error.",
          "gridPos": {"x": 0, "y": 20, "w": 24, "h": 10},
          "datasource": {"type": "victoriametrics-logs-datasource", "uid": "$${logs_datasource}"},
          "targets": [
            {
              "expr": "{kubernetes.pod_namespace=\"apps\"} | unpack_json | log.service.name:~\"image-gallery.*\" | log.level:~\"error|warn\"",
              "refId": "A",
              "queryType": "raw"
            }
          ],
          "options": {
            "showTime": true,
            "showLabels": false,
            "showCommonLabels": false,
            "wrapLogMessage": true,
            "prettifyLogMessage": true,
            "enableLogDetails": true,
            "dedupStrategy": "none",
            "sortOrder": "Descending",
            "enableContext": true
          },
          "fieldConfig": {
            "defaults": {
              "custom": {}
            }
          }
        },
        {
          "type": "row",
          "title": "🔍 TRACES: Search",
          "gridPos": {"x": 0, "y": 30, "w": 24, "h": 1},
          "collapsed": false
        },
        {
          "id": 1000,
          "type": "table",
          "title": "Recent Traces (click a row to open the waterfall)",
          "description": "Trace search against VictoriaTraces via the Jaeger-compatible API, filtered to this service. Linked from the P95 latency panel, which sets a minimum duration to land on the slow traces. A table, not a Traces panel: the Traces visualization renders ONE trace from a traceID, while a search returns a list.",
          "gridPos": {"x": 0, "y": 31, "w": 24, "h": 10},
          "datasource": {"type": "jaeger", "uid": "VictoriaTraces"},
          "targets": [
            {
              "queryType": "search",
              "service": "$${service}",
              "operation": "$${operation}",
              "tags": "$${trace_tags}",
              "minDuration": "$${min_trace_duration}",
              "maxDuration": "",
              "limit": 20,
              "refId": "A"
            }
          ],
          "options": {}
        }
      ]
    }
