apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: app-all-in-one
  namespace: apps
spec:
  allowCrossNamespaceImport: true
  folderRef: "apps"
  instanceSelector:
    matchLabels:
      dashboards: "grafana"
  json: |
    {
      "title": "Observability Demo - All in One",
      "description": "RED metrics, trace search and service map, and log context",
      "tags": ["observability", "traces", "metrics", "demo"],
      "timezone": "browser",
      "editable": true,
      "graphTooltip": 1,
      "time": {
        "from": "now-30m",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "query": "prometheus",
            "current": {
              "selected": false,
              "text": "VictoriaMetrics",
              "value": "VictoriaMetrics"
            },
            "hide": 0,
            "includeAll": false,
            "multi": false,
            "options": [],
            "refresh": 1,
            "regex": "",
            "skipUrlSync": false,
            "type": "datasource"
          },
          {
            "name": "trace_datasource",
            "label": "Trace Datasource",
            "type": "datasource",
            "query": "jaeger",
            "current": {
              "selected": false,
              "text": "VictoriaTraces",
              "value": "VictoriaTraces"
            },
            "hide": 0,
            "includeAll": false,
            "multi": false,
            "options": [],
            "refresh": 1,
            "regex": "",
            "skipUrlSync": false,
            "type": "datasource"
          },
          {
            "name": "logs_datasource",
            "label": "Logs Datasource",
            "type": "datasource",
            "query": "victoriametrics-logs-datasource",
            "current": {
              "selected": false,
              "text": "VictoriaLogs",
              "value": "VictoriaLogs"
            },
            "hide": 0,
            "includeAll": false,
            "multi": false,
            "options": [],
            "refresh": 1,
            "regex": "",
            "skipUrlSync": false,
            "type": "datasource"
          },
          {
            "name": "namespace",
            "type": "constant",
            "query": "apps",
            "current": {
              "text": "apps",
              "value": "apps"
            },
            "hide": 2
          },
          {
            "name": "service",
            "type": "constant",
            "query": "image-gallery",
            "current": {
              "selected": true,
              "text": "image-gallery",
              "value": "image-gallery"
            },
            "hide": 0,
            "includeAll": false,
            "multi": false,
            "name": "service",
            "options": [
              {
                "selected": true,
                "text": "image-gallery",
                "value": "image-gallery"
              }
            ],
            "skipUrlSync": false,
            "type": "constant"
          },
          {
            "name": "min_trace_duration",
            "label": "Min Trace Duration",
            "type": "textbox",
            "query": "",
            "current": {
              "selected": false,
              "text": "",
              "value": ""
            },
            "hide": 0,
            "skipUrlSync": false
          }
        ]
      },
      "panels": [
        {
          "type": "row",
          "title": "📊 METRICS: Service Health",
          "gridPos": {"x": 0, "y": 0, "w": 24, "h": 1},
          "collapsed": false
        },
        {
          "type": "timeseries",
          "title": "HTTP Request Rate (requests/sec)",
          "gridPos": {"x": 0, "y": 1, "w": 12, "h": 8},
          "datasource": {"type": "prometheus", "uid": "$${datasource}"},
          "targets": [
            {
              "expr": "sum(rate(http.server.request.duration_count{service.name=\"$service\",http.route!~\"/healthz|/readyz\"}[1m]))",
              "legendFormat": "Total requests/sec",
              "refId": "A"
            },
            {
              "expr": "sum by (http.response.status_code) (rate(http.server.request.duration_count{service.name=\"$service\",http.route!~\"/healthz|/readyz\"}[1m]))",
              "legendFormat": "{{http.response.status_code}}",
              "refId": "B"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "palette-classic"},
              "custom": {
                "axisCenteredZero": false,
                "axisLabel": "requests/sec",
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineWidth": 2,
                "showPoints": "auto"
              },
              "unit": "reqps"
            }
          },
          "options": {
            "tooltip": {"mode": "multi"},
            "legend": {"displayMode": "list", "placement": "bottom"}
          }
        },
        {
          "type": "timeseries",
          "title": "Response Time (P95 latency)",
          "gridPos": {"x": 12, "y": 1, "w": 12, "h": 8},
          "datasource": {"type": "prometheus", "uid": "$${datasource}"},
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(http.server.request.duration_bucket{service.name=\"$service\",http.route!~\"/healthz|/readyz\"}[1m])) by (vmrange, http.route))",
              "legendFormat": "P95 - {{http.route}}",
              "refId": "A"
            },
            {
              "expr": "histogram_quantile(0.50, sum(rate(http.server.request.duration_bucket{service.name=\"$service\",http.route!~\"/healthz|/readyz\"}[1m])) by (vmrange))",
              "legendFormat": "P50 (median)",
              "refId": "B"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "palette-classic"},
              "custom": {
                "axisCenteredZero": false,
                "axisLabel": "seconds",
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineWidth": 2
              },
              "unit": "s",
              "links": [
                {
                  "title": "View traces for this time range",
                  "url": "?viewPanel=1000&var-min_trace_duration=500ms&$${__url_time_range}"
                }
              ]
            }
          },
          "options": {
            "tooltip": {"mode": "multi"},
            "legend": {"displayMode": "list", "placement": "bottom"}
          }
        },
        {
          "type": "stat",
          "title": "Error Rate %",
          "gridPos": {"x": 0, "y": 9, "w": 6, "h": 4},
          "datasource": {"type": "prometheus", "uid": "$${datasource}"},
          "targets": [
            {
              "expr": "sum(rate(http.server.request.duration_count{service.name=\"$service\",http.route!~\"/healthz|/readyz\",http.response.status_code=~\"5..\"}[1m])) / sum(rate(http.server.request.duration_count{service.name=\"$service\",http.route!~\"/healthz|/readyz\"}[1m])) * 100",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "thresholds"},
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "yellow", "value": 1},
                  {"color": "orange", "value": 5},
                  {"color": "red", "value": 10}
                ]
              },
              "unit": "percent",
              "decimals": 2
            }
          },
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "textMode": "value_and_name"
          }
        },
        {
          "type": "stat",
          "title": "Request Rate",
          "gridPos": {"x": 6, "y": 9, "w": 6, "h": 4},
          "datasource": {"type": "prometheus", "uid": "$${datasource}"},
          "targets": [
            {
              "expr": "sum(rate(http.server.request.duration_count{service.name=\"$service\",http.route!~\"/healthz|/readyz\"}[1m]))",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "palette-classic"},
              "unit": "reqps",
              "decimals": 1
            }
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "textMode": "value_and_name"
          }
        },
        {
          "type": "stat",
          "title": "P95 Latency",
          "gridPos": {"x": 12, "y": 9, "w": 6, "h": 4},
          "datasource": {"type": "prometheus", "uid": "$${datasource}"},
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(http.server.request.duration_bucket{service.name=\"$service\",http.route!~\"/healthz|/readyz\"}[1m])) by (vmrange))",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "thresholds"},
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "yellow", "value": 0.5},
                  {"color": "orange", "value": 1},
                  {"color": "red", "value": 5}
                ]
              },
              "unit": "s",
              "decimals": 3
            }
          },
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "textMode": "value_and_name"
          }
        },
        {
          "type": "stat",
          "title": "Total 5xx Errors (last 5m)",
          "gridPos": {"x": 18, "y": 9, "w": 6, "h": 4},
          "datasource": {"type": "prometheus", "uid": "$${datasource}"},
          "targets": [
            {
              "expr": "sum(increase(http.server.request.duration_count{service.name=\"$service\",http.route!~\"/healthz|/readyz\",http.response.status_code=~\"5..\"}[5m]))",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "thresholds"},
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "red", "value": 1}
                ]
              },
              "unit": "short",
              "decimals": 0
            }
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value_and_name"
          }
        },
        {
          "type": "timeseries",
          "title": "Request Count by Status Code",
          "gridPos": {"x": 0, "y": 13, "w": 24, "h": 6},
          "datasource": {"type": "prometheus", "uid": "$${datasource}"},
          "targets": [
            {
              "expr": "sum by (http.response.status_code) (rate(http.server.request.duration_count{service.name=\"$service\",http.route!~\"/healthz|/readyz\"}[1m]))",
              "legendFormat": "HTTP {{http.response.status_code}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "palette-classic"},
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 20,
                "lineWidth": 2,
                "stacking": {"mode": "normal"}
              },
              "unit": "reqps"
            },
            "overrides": [
              {
                "matcher": {"id": "byRegexp", "options": ".*5.*"},
                "properties": [
                  {"id": "color", "value": {"mode": "fixed", "fixedColor": "red"}}
                ]
              },
              {
                "matcher": {"id": "byRegexp", "options": ".*200.*"},
                "properties": [
                  {"id": "color", "value": {"mode": "fixed", "fixedColor": "green"}}
                ]
              }
            ]
          },
          "options": {
            "tooltip": {"mode": "multi"},
            "legend": {"displayMode": "list", "placement": "bottom"}
          }
        },
        {
          "type": "row",
          "title": "📋 Error Logs with Context",
          "gridPos": {"x": 0, "y": 19, "w": 24, "h": 1},
          "collapsed": false
        },
        {
          "type": "logs",
          "title": "Application Error Logs (Click on log line to see ±7 lines of context)",
          "description": "Shows error-level logs from the application. Click any log line to view surrounding context (±7 lines before/after).",
          "gridPos": {"x": 0, "y": 20, "w": 24, "h": 10},
          "datasource": {"type": "victoriametrics-logs-datasource", "uid": "$${logs_datasource}"},
          "targets": [
            {
              "expr": "{kubernetes.container_name=$$service} | unpack_json | log.level:error",
              "refId": "A",
              "queryType": "raw"
            }
          ],
          "options": {
            "showTime": true,
            "showLabels": false,
            "showCommonLabels": false,
            "wrapLogMessage": true,
            "prettifyLogMessage": true,
            "enableLogDetails": true,
            "dedupStrategy": "none",
            "sortOrder": "Descending",
            "enableContext": true
          },
          "fieldConfig": {
            "defaults": {
              "custom": {}
            }
          }
        },
        {
          "type": "row",
          "title": "🔍 TRACES: Search & Service Map",
          "gridPos": {"x": 0, "y": 30, "w": 24, "h": 1},
          "collapsed": false
        },
        {
          "id": 1000,
          "type": "traces",
          "title": "Recent Traces (pick a slow one to open the waterfall)",
          "description": "Trace search against VictoriaTraces via the Jaeger-compatible API, filtered to this service. Linked from the P95 latency panel, which sets a minimum duration to land on the slow traces.",
          "gridPos": {"x": 0, "y": 31, "w": 12, "h": 10},
          "datasource": {"type": "jaeger", "uid": "$${trace_datasource}"},
          "targets": [
            {
              "queryType": "search",
              "service": "$${service}",
              "operation": "",
              "tags": "",
              "minDuration": "$${min_trace_duration}",
              "maxDuration": "",
              "limit": 20,
              "refId": "A"
            }
          ],
          "options": {}
        },
        {
          "type": "nodeGraph",
          "title": "Service Map",
          "description": "Derived from the same trace search via the datasource's serviceMap/nodeGraph support.",
          "gridPos": {"x": 12, "y": 31, "w": 12, "h": 10},
          "datasource": {"type": "jaeger", "uid": "$${trace_datasource}"},
          "targets": [
            {
              "queryType": "search",
              "service": "$${service}",
              "operation": "",
              "tags": "",
              "minDuration": "",
              "maxDuration": "",
              "limit": 20,
              "refId": "A"
            }
          ],
          "options": {}
        }
      ]
    }
