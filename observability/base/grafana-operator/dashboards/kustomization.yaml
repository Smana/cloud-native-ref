apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - app-all-in-one.yaml
  - runlore.yaml
  - kubernetes-node-exporter-full.yaml

# The four kubernetes-views-* dashboards were here until 2026-08-28 and are gone
# because victoria-metrics-k8s-stack ALREADY SHIPS THEM, and shipping them twice
# is worse than shipping them once.
#
# They are the same dashboards -- dotdc/grafana-dashboards-kubernetes -- and they
# carried the same Grafana UIDs (k8s_views_global, …). Two GrafanaDashboard CRs
# with one UID do not coexist: both reported "Dashboard was successfully applied
# to 1 instances" while overwriting each other on every reconcile, so what the UI
# showed depended on which reconciled last.
#
# The chart's copy wins on merit, not seniority: it is VENDORED as inline JSON and
# version-matched to the stack, while these fetched raw.githubusercontent.com at
# runtime from dotdc's `master` -- an unpinned external dependency in the
# reconcile path, on a branch that can change under us.
#
# kubernetes-node-exporter-full stays: the chart's equivalent is gated on a
# clusterMetric and is not deployed here, so ours is the only one.
#
# kubernetes-karpenter moved to observability/aws-0/grafana-operator/ on
# 2026-08-28. Karpenter is the EKS node autoscaler; gcp-0 runs none (GKE node
# auto-provisioning + infrastructure/gcp-0/computeclass), so the dashboard drew
# empty panels on a cluster that can never fill them. Moved rather than patched
# away per-cluster, so what remains here is genuinely cloud-neutral.
