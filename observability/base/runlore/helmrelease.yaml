apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: runlore
spec:
  interval: 30m
  # First start is slow: the catalog git-sync warms the readyz gate, and on a
  # cold PVC two sync loops briefly race (one retries on the next interval), so
  # readiness can take up to ~one catalog.git.interval. Give Helm headroom and
  # retry instead of going terminally Stalled on a single timeout.
  timeout: 10m
  # disableWait was required before runlore#264: /readyz gated on leadership, so
  # standby replicas were permanently NotReady and Helm's --wait could never
  # succeed with replicaCount>1. #264 shipped (readyz decoupled from leadership,
  # followers forward work to the leader), so every replica reports Ready and
  # Flux's full health verification is back on — this deployment is the live
  # validation of exactly that.
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: deploy/helm/runlore
      # The GitRepository source is defined in flux/sources/gitrepo-runlore.yaml
      # (flux-sources Kustomization), NOT here under tooling. tooling stamps
      # sharding.fluxcd.io/key=apps via commonMetadata; the HelmChart the
      # helm-controller derives carries no shard label and is reconciled by the
      # default source-controller, which only caches non-apps-sharded sources.
      # An apps-sharded GitRepository would be invisible to it -> "source not found".
      sourceRef:
        kind: GitRepository
        name: runlore
      interval: 12h
      # Default reconcileStrategy (ChartVersion) only repackages when Chart.yaml's
      # version bumps — irrelevant here since we're pinned to an unreleased PR
      # branch commit (flux/sources/gitrepo-runlore.yaml) with no version bump.
      # Revision repackages whenever the GitRepository's observed commit changes,
      # which is what tracking an in-review branch actually needs.
      reconcileStrategy: Revision
  driftDetection:
    mode: enabled
  values:
    # StatefulSet (runlore#263) gives each replica its OWN RWO EBS volume via
    # volumeClaimTemplates — validated live (2 independently-Bound PVCs, correct
    # leader election/failover). replicaCount: 2 is live HA: BOTH replicas report
    # Ready (runlore#264 — readyz decoupled from leadership), the Service
    # round-robins, and a non-leader replica forwards work-bearing requests to
    # the leader via its routable Lease identity (<pod>_<podIP>).
    workloadKind: StatefulSet
    replicaCount: 2
    image:
      # MUST match the GitRepository ref in flux/sources/gitrepo-runlore.yaml. It was
      # once left at "0.9.0" while the source moved to v0.9.1, so the cluster quietly ran
      # the 0.9.0 binary behind the 0.9.1 chart — none of that release's fixes were live,
      # and nothing failed to say so. Move the two together, always.
      #
      # NO leading "v". GoReleaser (Smana/runlore release-binaries.yml) publishes the
      # release image as `{{ .Version }}` — 0.13.0, not v0.13.0 — so a `v` prefix 404s
      # and the StatefulSet lands in ImagePullBackOff. This is the signed, multi-arch,
      # SBOM-attested release image; the rolling `:main` tag from build-image.yml is a
      # single-arch validation build and must not be used here.
      #
      # It was pinned to that :main build by digest between 18:35 and 19:0x on
      # 2026-08-03 to exercise the 14 changes since v0.12.0 on a live cluster before
      # 0.13.0 was cut. That pin is reverted here, which is the point of a validation
      # pin: it does not outlive its validation.
      #
      # KEEP THIS IN LOCKSTEP WITH the GitRepository ref in
      # flux/sources/gitrepo-runlore.yaml. The chart is rendered from that ref, so a
      # chart newer than the image emits config keys the older binary rejects:
      # config parsing uses KnownFields(true), and 0.9.2 against the v0.11.0 chart
      # crashlooped on `field sweeps not found in type config.Curate`. Before this
      # bump the v0.13.0 chart was rendered with these exact values and the resulting
      # config replayed through the v0.13.0 binary's own config.Load: both pass.
      # 0.16.0, in lockstep with the GitRepository's `tag: v0.16.0`.
      #
      # This was "0.13.0" while the source had already moved to a COMMIT pin far
      # past v0.13.0 -- exactly the drift the paragraphs above warn about, and it
      # went unnoticed because gcp-0's overlay pinned `main` on top and aws-0 was
      # torn down. The lockstep rule is not decoration: config parsing uses
      # KnownFields(true), so a chart newer than its binary fails closed on a key
      # the binary has never heard of.
      tag: "0.16.0"
      pullPolicy: IfNotPresent
    serviceAccount:
      create: true
      # Must match the SA bound by the xplane-runlore EKS Pod Identity (security/base/epis/runlore.yaml).
      name: runlore
    # fsGroup is required so the nonroot container (UID 65532, distroless) can
    # write the catalog git-sync mirror + outcome ledger on the EBS (ext4) PVC.
    # The chart's default podSecurityContext omits it (harmless on its default
    # RWX/EFS, but EBS RWO mounts root-owned -> "mkdir .git: permission denied").
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 65532
      runAsGroup: 65532
      fsGroup: 65532
      seccompProfile:
        type: RuntimeDefault
    # Writable git-sync mirror of the KB repo at the persistent mount, so the
    # read/write learning loop is closed (recall reads it; curation pushes PRs).
    catalog:
      gitSync: true
      mountPath: /var/lib/runlore/catalog
    persistence:
      enabled: true
      storageClass: ${storage_class}
      accessModes: ["ReadWriteOnce"]
      size: 1Gi
    rbac:
      create: true
      # Read-only: no patch rights on Flux resources. actions.mode stays off.
      allowActions: false
      actionNamespaces: []

      # Namespaces where runlore may read POD LOGS. The chart defaults to
      # [flux-system] alone, which is the GitOps controllers and nothing the
      # platform actually runs.
      #
      # Added after an investigation on 2026-08-28 that diagnosed a crash-looping
      # oauth2-proxy in `tooling` and had to report:
      #
      #   pod_logs (previous=true) returned RBAC denial: 'pods/log is forbidden
      #   for system:serviceaccount:runlore:runlore' -- could not read the
      #   last-terminated container's crash output directly
      #
      # It reached the right answer through VictoriaLogs instead, but a
      # crash-looping pod's PREVIOUS container output is the single most direct
      # evidence there is, and it was reasoning around it.
      #
      # These are the namespaces this platform's own workloads run in. Deliberately
      # NOT included: kube-system (Cilium, GKE addons -- node-level components whose
      # logs runlore has no mandate over), and the gke-managed-* namespaces.
      # `config.investigation.pod_log_namespaces` auto-tracks this list, so the
      # app-layer allowlist follows without drifting.
      #
      # This is a real widening: pod logs can contain anything an application
      # prints, including values read from Secrets. It is accepted because runlore
      # is read-only on the cluster and its only write path anywhere is a
      # knowledge-base pull request.
      controllerLogNamespaces:
        - flux-system
        - crossplane-system
        - security
        - infrastructure
        - observability
        - tooling
        - apps
        - runlore
      # resource_spec / list_resources allowlist.
      #
      # WHY THIS IS RESTATED IN FULL: the chart ships this list POPULATED with
      # ten rules, and a Helm values list is REPLACED, not merged. Setting only
      # the additions below would silently drop 28 resource types -- Services,
      # Deployments, Jobs, HPAs, PDBs, CRDs, the VictoriaMetrics and Prometheus
      # kinds -- and every one of those questions would come back "forbidden"
      # while the suite stayed green. The first ten rules are therefore the
      # chart's own, verbatim; only the block after them is ours.
      #
      # WHY THE ADDITIONS: an investigation of the harbor HelmRelease failure on
      # gcp-0 on 2026-08-28 reported these as DATA GAPS, in its own words --
      # "RBAC denied reading ExternalSecret objects in tooling" and "RBAC denied
      # reading the CNPG Cluster resource". Those are the two objects that
      # actually explained the outage. runlore reached the right conclusion from
      # kube_events instead, but it reasoned around the evidence rather than
      # from it, and a denial is reported to the agent as a denial rather than
      # as an absent object -- so it knows it is blind, and says so.
      #
      # Granted get AND list: the gap named list_resources and resource_spec
      # failing together. The chart's own ten keep the verbs it ships them with.
      #
      # No Secret kind here, deliberately. An ExternalSecret's spec names the
      # store KEYS it reads, never their values, so this grant exposes secret
      # NAMES and not secret material -- which is the whole point of being able
      # to answer "which key is it asking for, and does it exist?".
      resourceSpecRules:
        # ── the chart's shipped ten, with `list` added ─────────────────────
        #
        # The rules are the chart's; the verbs are not. It ships `["get"]` only,
        # which serves resource_spec (fetch one named object) and leaves
        # list_resources denied on all 28 shipped types. An investigation on
        # 2026-08-28 reported exactly that, twice, having already been granted
        # the kinds:
        #
        #   list_resources on VMRule in observability  -> FORBIDDEN
        #   list_resources on CronJobs in security     -> FORBIDDEN
        #
        # while `kubectl auth can-i` confirmed get=yes, list=no for every one of
        # them. The five platform rules below were added with get AND list and
        # never hit this, which is what made the asymmetry visible.
        #
        # "Is there a CronJob in this namespace at all?" is a listing question,
        # and answering it from an ABSENT resource_spec result is guesswork
        # dressed as evidence. Still no Secret kind anywhere in this grant.
        - apiGroups: [""]
          resources: ["services", "persistentvolumeclaims", "persistentvolumes", "nodes", "namespaces"]
          verbs: ["get", "list"]
        - apiGroups: ["apps"]
          resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
          verbs: ["get", "list"]
        - apiGroups: ["batch"]
          resources: ["jobs", "cronjobs"]
          verbs: ["get", "list"]
        - apiGroups: ["networking.k8s.io"]
          resources: ["ingresses", "networkpolicies", "ingressclasses"]
          verbs: ["get", "list"]
        - apiGroups: ["autoscaling"]
          resources: ["horizontalpodautoscalers"]
          verbs: ["get", "list"]
        - apiGroups: ["policy"]
          resources: ["poddisruptionbudgets"]
          verbs: ["get", "list"]
        - apiGroups: ["storage.k8s.io"]
          resources: ["volumeattachments"]
          verbs: ["get", "list"]
        - apiGroups: ["apiextensions.k8s.io"]
          resources: ["customresourcedefinitions"]
          verbs: ["get", "list"]
        - apiGroups: ["operator.victoriametrics.com"]
          resources: ["vmservicescrapes", "vmpodscrapes", "vmscrapeconfigs", "vmrules", "vmagents", "vmalerts"]
          verbs: ["get", "list"]
        - apiGroups: ["monitoring.coreos.com"]
          resources: ["servicemonitors", "podmonitors", "prometheusrules", "probes"]
          verbs: ["get", "list"]
        # ── this platform's own operators ─────────────────────────────────
        # Named in the data gaps above. A SecretSyncedError is unreadable
        # without the ExternalSecret's spec: the remoteRef key IS the diagnosis.
        - apiGroups: ["external-secrets.io"]
          resources: ["externalsecrets", "clustersecretstores", "secretstores"]
          verbs: ["get", "list"]
        # Also named. Half this platform's workloads wait on a CNPG Cluster, and
        # its .status.phase is the difference between "still bootstrapping" and
        # "wedged" -- the exact question asked twice today.
        - apiGroups: ["postgresql.cnpg.io"]
          resources: ["clusters", "backups", "scheduledbackups", "poolers"]
          verbs: ["get", "list"]
        # The claims everything here is composed FROM. Without these an agent
        # can see a broken Deployment and never reach the App or SQLInstance
        # that rendered it, which is where the cause lives.
        - apiGroups: ["cloud.ogenki.io"]
          resources: ["apps", "sqlinstances", "inferenceservices", "kvstores", "epis", "gcpworkloadidentities"]
          verbs: ["get", "list"]
        # Policy is the first suspect for any timeout on this platform -- it is
        # what .claude/rules tells a human to check first, and three separate
        # failures on 2026-08-28 were an allowlist naming the wrong cloud.
        - apiGroups: ["cilium.io"]
          resources: ["ciliumnetworkpolicies", "ciliumclusterwidenetworkpolicies"]
          verbs: ["get", "list"]
        # How everything is exposed; an unprogrammed Gateway or a route with no
        # status.parents is a whole class of "the service is up but unreachable".
        - apiGroups: ["gateway.networking.k8s.io"]
          resources: ["gateways", "httproutes", "tlsroutes", "gatewayclasses"]
          verbs: ["get", "list"]
        # ── the layer BELOW the claims ────────────────────────────────────
        #
        # Added after an investigation that got the answer right and said so
        # honestly. Diagnosing a stuck ScheduledBackup on 2026-08-28, runlore
        # reached "barman-cloud gets 403 storage.buckets.get on the GCS bucket"
        # at 0.78 confidence -- correct, and a real bug -- but listed as gaps:
        #
        #   Cannot read Bucket resource status ... cannot confirm whether the
        #   GCS bucket actually exists in GCP or was created by Crossplane
        #   Cannot read BucketIAMMember status ... cannot confirm whether the
        #   IAM binding has propagated
        #   Cannot read ObjectStore ... cannot inspect the plugin's bucket config
        #
        # Its open question was exactly the ambiguity in GCP's error text: a 403
        # on buckets.get means "no permission" OR "no bucket", and only the
        # Bucket MR's status separates them. Granted these, that stops being an
        # open question.
        #
        # The claims were already granted (cloud.ogenki.io above); these are the
        # managed resources those claims COMPOSE INTO, which is where a
        # Crossplane failure actually shows itself -- a claim can read Ready
        # while the MR underneath carries the provider's real error.
        - apiGroups: ["storage.gcp.m.upbound.io"]
          resources: ["buckets", "bucketiammembers"]
          verbs: ["get", "list"]
        - apiGroups: ["cloudplatform.gcp.m.upbound.io"]
          resources: ["projectiammembers", "serviceaccounts"]
          verbs: ["get", "list"]
        # The barman plugin's own CR. postgresql.cnpg.io above covers Cluster
        # and Backup; ObjectStore is a DIFFERENT group shipped by the plugin,
        # and it holds the bucket path and credential mode -- the two fields
        # that decide whether archiving can work at all.
        - apiGroups: ["barmancloud.cnpg.io"]
          resources: ["objectstores"]
          verbs: ["get", "list"]
        # Crossplane's own plumbing. A claim stuck "Creating" is usually a
        # provider that never installed or a CRD never activated, and neither is
        # visible from the claim.
        - apiGroups: ["pkg.crossplane.io"]
          resources: ["providers", "providerrevisions", "configurations", "functions"]
          verbs: ["get", "list"]
    networkPolicy:
      enabled: true
      # Renders a CiliumNetworkPolicy allowing egress to the EKS Pod Identity
      # credential endpoint (169.254.170.23:80, host entity) — required on Cilium.
      awsPodIdentity: true
      # Scope who may reach :8080. Left empty the chart emits no `from:` at all,
      # i.e. every pod in the cluster can post to the webhook endpoint (#1589).
      # In-cluster callers all live in `observability`: vmagent scrapes /metrics
      # (vmServiceScrape below) and Alertmanager/VMAlert POST the incident
      # webhook. The chart always prepends a peer podSelector, so replica-to-
      # replica leader forwarding (runlore#264) survives this narrowing.
      #
      # NOT expressible here: the Gateway data plane. runlore's HTTPRoute hangs
      # off `platform-public` (GatewayClass cilium), and this cluster runs the
      # shared cilium-envoy DaemonSet with hostNetwork=true — so from runlore's
      # side that traffic is Cilium's `ingress` entity, not a pod in a namespace.
      # A namespaceSelector cannot match it, and adding one here alone would
      # black-hole Slack's POST /slack/interactions. It is allowed instead by
      # ciliumnetworkpolicy-ingress.yaml (Cilium unions the two policies).
      ingressFrom:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      # The chart's non-strict egress only opens 443/6443 — but VictoriaMetrics
      # (vmsingle :8428) and VictoriaLogs (:9428) listen on other ports, so without
      # this the agent's metrics/logs tool calls hang until they time out, starving
      # every investigation of those signals (and burning the per-investigation
      # deadline half-blind). Open egress to the observability namespace on both.
      extraEgress:
        - to:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: observability
          ports:
            - port: 8428   # VictoriaMetrics (vmsingle) — metrics.url
              protocol: TCP
            - port: 9428   # VictoriaLogs — logs.url
              protocol: TCP
    vmServiceScrape:
      enabled: true
      interval: 30s
      path: /metrics
    # Secret-backed env (GEMINI_API_KEY, GITHUB_APP_PRIVATE_KEY) from the
    # runlore-credentials ExternalSecret. RunLore never inlines credentials.
    envFrom:
      - secretRef:
          name: runlore-credentials
      - secretRef:
          name: runlore-slack
      - secretRef:
          name: runlore-webhook
    # Rendered verbatim into /etc/runlore/runlore.yaml (strict-parsed by the agent).
    config:
      gitops:
        engine: flux
      # Source enablement (runlore v0.5.0+): presence of a key under `sources`
      # turns that source on; its value is the source's own config. Enablement
      # moved here out of the old `triggers.<name>.enabled: true` flags.
      sources:
        alertmanager: {}      # Alertmanager/VMAlert webhook source
        gitops:
          enabled: true       # also react to Flux Ready=False
      triggers:
        # `triggers.<name>` now holds match/dedup/debounce POLICY only; enablement
        # lives under `sources` above.
        incidents:
          match:
            severity: [critical]
          dedup:
            window: 30m
      investigation:
        # Recurrence cooldown (runlore#270): a trigger answered CONCLUSIVELY less
        # than this long ago is not re-investigated — no model call, no duplicate
        # notification. Complements dedup above: dedup keys on the alert
        # fingerprint (same firing series), this keys on the TriggerKey (same
        # incident identity across re-fires/resolves). Human-deferential: an
        # inconclusive verdict always retries, and a standing 👎 on the previous
        # answer re-arms investigation immediately. Requires outcome.ledger_path.
        recurrence_cooldown: 30m
        # gitops_failures policy left at defaults (debounce 60s); enablement is
        # via sources.gitops above.
      leader_election:
        enabled: true
        name: runlore-leader
      logging:
        format: json
        level: info
      notify:
        slack:
          bot_token_env: SLACK_BOT_TOKEN  # pragma: allowlist secret
          channel: "#alerts"
          # Interactivity: Slack posts button clicks to the public gateway route
          # (httproute.yaml, POST /slack/interactions only) and every request is
          # HMAC-verified with this secret. feedback_buttons is the opt-in human
          # feedback loop (👍/👎 → outcome ledger → recall trust + recurrence
          # cooldown re-arm). Slack-app side: set the Interactivity Request URL to
          # https://runlore.<domain>/slack/interactions.
          signing_secret_env: SLACK_SIGNING_SECRET  # pragma: allowlist secret
          feedback_buttons: true
          # 🔕, a third control beside 👍/👎: suppress re-investigating THIS
          # trigger for a chosen window. Gated independently of feedback_buttons,
          # but its escape hatch is a 👎 (newest human wins), so it only makes
          # sense with a feedback control enabled somewhere -- which the line
          # above provides. Runlore warns at startup otherwise.
          #
          # A silence is not a mute: it ends early on a CRITICAL, on a 👎, or when
          # the incident resolves. Until then there is no model call, no
          # notification and no ledger open -- which is the point, because the
          # alert this exists for is the one that fires forty times.
          silence_button: true
        # Shared presets for the control above. windows[0] is the fallback
        # wherever no duration can be carried. Requires outcome.ledger_path,
        # which is set below.
        silence:
          windows: [1h, 4h, 24h]
          max_window: 24h
      telemetry:
        metrics_enabled: true
      model:
        # GLM 5.2 via Z.ai's OpenAI-compatible API. Any provider name other than
        # anthropic/gemini falls back to the OpenAI wire protocol (NewModelClient),
        # so provider: openai + base_url is the correct way to point at it.
        provider: openai
        model: glm-5.2
        base_url: https://api.z.ai/api/paas/v4/
        api_key_env: GLM_API_KEY  # pragma: allowlist secret
      catalog:
        dir: /var/lib/runlore/catalog
        git:
          url: https://github.com/Smana/runlore-kb
          branch: main
          interval: 5m
        # Instant recall: short-circuit the investigation loop when the catalog
        # has a high-confidence match (the learning payoff). Off by default — must
        # be enabled. Thresholds are BM25-corpus-dependent; tune from the
        # recall_score / recall_rejections metrics. Recall is auto-disabled under
        # actions.mode=auto (poison-safety); harmless here (mode=off).
        instant_recall:
          enabled: true
          # The LLM reranker (ON by default, runlore#294) gates the short-circuit on a
          # CALIBRATED 0-1 match confidence, not an absolute BM25 magnitude — so the
          # BM25 solo_floor/min_score/margin_gap NO LONGER need per-corpus tuning and
          # are left at their defaults. (Previously this cluster hand-tuned solo_floor
          # to 0.2 because label-derived Alertmanager queries score ~0.1-0.3, an order
          # of magnitude below the default 4.0 — the reranker removes that need.)
          # The reranker routes to model.verify when set (here the main model), costs
          # ~1-2k tokens, and fires on rerank_threshold 0.7. outcome_floor keeps the
          # decay gate (a recall that never resolves is rejected).
          outcome_prior: 2.0
          outcome_floor: 0.5
      outcome:
        ledger_path: /var/lib/runlore/catalog/outcomes.jsonl
      forge:
        kb_repo: Smana/runlore-kb
        base_branch: main
        # Don't draft a KB PR for a benign "no action needed" conclusion — the finding
        # still delivers to Slack, only the repo artifact is suppressed. Shipped in
        # #256 specifically because pilot data showed 72% of drafted PRs over 6 days
        # were closed as noise (benign infra churn, synthetic canaries, near-dupes).
        skip_verdicts: [no_action]
        github_app:
          app_id: 4106804
          installation_id: 141652301
          private_key_env: GITHUB_APP_PRIVATE_KEY  # pragma: allowlist secret
      cloud:
        # provider stays a literal: it is the one value here that is genuinely
        # per-cloud rather than per-cluster, and observability/gcp-0/runlore
        # patches it. region and cluster_name were hardcoded to eu-west-3 and
        # aws-0 in a SHARED base -- eleventh instance of that pattern -- so on
        # gcp-0 runlore would have reported on the other cluster by name.
        provider: aws
        region: ${region}
        cluster_name: ${cluster_name}
      # actions: omitted -> mode "off" (fully read-only on the cluster; only
      # writes are KB PRs/issues on Smana/runlore-kb via the GitHub App).
      # v0.2.0 fails closed (RequireWebhookAuth): with a model configured the
      # alert webhook MUST be authenticated, since alert labels/annotations flow
      # into the LLM prompt and bill the model. The bearer token comes from the
      # runlore-webhook ExternalSecret (envFrom above); the Alertmanager runlore
      # receiver posts it via authorization.credentials_file
      # (observability/.../vm-common-helm-values-configmap.yaml).
      server:
        webhook_token_env: WEBHOOK_TOKEN  # pragma: allowlist secret
      # Investigation signals — enable the query_metrics / query_metrics_range /
      # query_logs tools so investigations correlate the GitOps change against live
      # saturation + application logs (multi-source RCA), not just k8s object state.
      metrics:
        url: http://vmsingle-victoria-metrics-k8s-stack.observability.svc:8428
      logs:
        url: http://victoria-logs-victoria-logs-single-server.observability.svc:9428
      # network: deferred (needs a Hubble/flow-log provider choice).
