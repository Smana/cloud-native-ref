apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: runlore
spec:
  interval: 30m
  # First start is slow: the catalog git-sync warms the readyz gate, and on a
  # cold PVC two sync loops briefly race (one retries on the next interval), so
  # readiness can take up to ~one catalog.git.interval. Give Helm headroom and
  # retry instead of going terminally Stalled on a single timeout.
  timeout: 10m
  # disableWait was required before runlore#264: /readyz gated on leadership, so
  # standby replicas were permanently NotReady and Helm's --wait could never
  # succeed with replicaCount>1. #264 shipped (readyz decoupled from leadership,
  # followers forward work to the leader), so every replica reports Ready and
  # Flux's full health verification is back on — this deployment is the live
  # validation of exactly that.
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: deploy/helm/runlore
      # The GitRepository source is defined in flux/sources/gitrepo-runlore.yaml
      # (flux-sources Kustomization), NOT here under tooling. tooling stamps
      # sharding.fluxcd.io/key=apps via commonMetadata; the HelmChart the
      # helm-controller derives carries no shard label and is reconciled by the
      # default source-controller, which only caches non-apps-sharded sources.
      # An apps-sharded GitRepository would be invisible to it -> "source not found".
      sourceRef:
        kind: GitRepository
        name: runlore
      interval: 12h
      # Default reconcileStrategy (ChartVersion) only repackages when Chart.yaml's
      # version bumps — irrelevant here since we're pinned to an unreleased PR
      # branch commit (flux/sources/gitrepo-runlore.yaml) with no version bump.
      # Revision repackages whenever the GitRepository's observed commit changes,
      # which is what tracking an in-review branch actually needs.
      reconcileStrategy: Revision
  driftDetection:
    mode: enabled
  values:
    # StatefulSet (runlore#263) gives each replica its OWN RWO EBS volume via
    # volumeClaimTemplates — validated live (2 independently-Bound PVCs, correct
    # leader election/failover). replicaCount: 2 is live HA: BOTH replicas report
    # Ready (runlore#264 — readyz decoupled from leadership), the Service
    # round-robins, and a non-leader replica forwards work-bearing requests to
    # the leader via its routable Lease identity (<pod>_<podIP>).
    workloadKind: StatefulSet
    replicaCount: 2
    image:
      # MUST match the GitRepository ref in flux/sources/gitrepo-runlore.yaml. It was
      # once left at "0.9.0" while the source moved to v0.9.1, so the cluster quietly ran
      # the 0.9.0 binary behind the 0.9.1 chart — none of that release's fixes were live,
      # and nothing failed to say so. Move the two together, always.
      #
      # NO leading "v". GoReleaser (Smana/runlore release-binaries.yml) publishes the
      # release image as `{{ .Version }}` — 0.13.0, not v0.13.0 — so a `v` prefix 404s
      # and the StatefulSet lands in ImagePullBackOff. This is the signed, multi-arch,
      # SBOM-attested release image; the rolling `:main` tag from build-image.yml is a
      # single-arch validation build and must not be used here.
      #
      # It was pinned to that :main build by digest between 18:35 and 19:0x on
      # 2026-08-03 to exercise the 14 changes since v0.12.0 on a live cluster before
      # 0.13.0 was cut. That pin is reverted here, which is the point of a validation
      # pin: it does not outlive its validation.
      #
      # KEEP THIS IN LOCKSTEP WITH the GitRepository ref in
      # flux/sources/gitrepo-runlore.yaml. The chart is rendered from that ref, so a
      # chart newer than the image emits config keys the older binary rejects:
      # config parsing uses KnownFields(true), and 0.9.2 against the v0.11.0 chart
      # crashlooped on `field sweeps not found in type config.Curate`. Before this
      # pin the 0ed7806 chart was rendered with these exact values and the resulting
      # config replayed through 0ed7806's own config.Load: both pass.
      # TEMPORARY validation pin — the rolling :main image, pinned BY DIGEST to the
      # build of commit 0ed7806, the same commit the GitRepository renders the chart
      # from. Two things make this safe:
      #
      #   - The digest, not the tag, is what resolves. `:main` is mutable and the
      #     next main push overwrites it, which with pullPolicy IfNotPresent would
      #     otherwise mean a replaced pod silently runs a newer binary under a chart
      #     that did not move. repo:tag@sha256:... is a valid OCI reference and
      #     containerd pulls the digest, ignoring the tag.
      #   - It is single-arch linux/amd64 (build-image.yml builds only that for main,
      #     unlike the multi-arch release image). Every node in this cluster is
      #     amd64 Bottlerocket, so it schedules — but this is another reason the pin
      #     must not outlive its validation.
      #
      # REVERT to the signed multi-arch release image — tag: "0.14.0", NO leading "v"
      # — once this validation is done.
      tag: "main@sha256:d7c3b3f00910e65892fb3113d715fbba1992f8d2291a2d200f32da01d948a1f5"
      pullPolicy: IfNotPresent
    serviceAccount:
      create: true
      # Must match the SA bound by the xplane-runlore EKS Pod Identity (security/base/epis/runlore.yaml).
      name: runlore
    # fsGroup is required so the nonroot container (UID 65532, distroless) can
    # write the catalog git-sync mirror + outcome ledger on the EBS (ext4) PVC.
    # The chart's default podSecurityContext omits it (harmless on its default
    # RWX/EFS, but EBS RWO mounts root-owned -> "mkdir .git: permission denied").
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 65532
      runAsGroup: 65532
      fsGroup: 65532
      seccompProfile:
        type: RuntimeDefault
    # Writable git-sync mirror of the KB repo at the persistent mount, so the
    # read/write learning loop is closed (recall reads it; curation pushes PRs).
    catalog:
      gitSync: true
      mountPath: /var/lib/runlore/catalog
    persistence:
      enabled: true
      storageClass: gp3
      accessModes: ["ReadWriteOnce"]
      size: 1Gi
    rbac:
      create: true
      # Read-only: no patch rights on Flux resources. actions.mode stays off.
      allowActions: false
      actionNamespaces: []
    networkPolicy:
      enabled: true
      # Renders a CiliumNetworkPolicy allowing egress to the EKS Pod Identity
      # credential endpoint (169.254.170.23:80, host entity) — required on Cilium.
      awsPodIdentity: true
      # Scope who may reach :8080. Left empty the chart emits no `from:` at all,
      # i.e. every pod in the cluster can post to the webhook endpoint (#1589).
      # In-cluster callers all live in `observability`: vmagent scrapes /metrics
      # (vmServiceScrape below) and Alertmanager/VMAlert POST the incident
      # webhook. The chart always prepends a peer podSelector, so replica-to-
      # replica leader forwarding (runlore#264) survives this narrowing.
      #
      # NOT expressible here: the Gateway data plane. runlore's HTTPRoute hangs
      # off `platform-public` (GatewayClass cilium), and this cluster runs the
      # shared cilium-envoy DaemonSet with hostNetwork=true — so from runlore's
      # side that traffic is Cilium's `ingress` entity, not a pod in a namespace.
      # A namespaceSelector cannot match it, and adding one here alone would
      # black-hole Slack's POST /slack/interactions. It is allowed instead by
      # ciliumnetworkpolicy-ingress.yaml (Cilium unions the two policies).
      ingressFrom:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      # The chart's non-strict egress only opens 443/6443 — but VictoriaMetrics
      # (vmsingle :8428) and VictoriaLogs (:9428) listen on other ports, so without
      # this the agent's metrics/logs tool calls hang until they time out, starving
      # every investigation of those signals (and burning the per-investigation
      # deadline half-blind). Open egress to the observability namespace on both.
      extraEgress:
        - to:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: observability
          ports:
            - port: 8428   # VictoriaMetrics (vmsingle) — metrics.url
              protocol: TCP
            - port: 9428   # VictoriaLogs — logs.url
              protocol: TCP
        # Same failure, third port: Hubble relay listens on 80, so
        # `network.provider: hubble` above could not connect at all. The
        # network_drops tool was registered, called, and failed with
        #   get flows: rpc error: code = Unavailable ... dial tcp …:80: i/o timeout
        # The 2026-08-19 investigation still reached the right cause from Cilium
        # metrics and signature analysis, and declared the gap on the card — which
        # is how this was found. Enabling a provider is not the same as its tool
        # working, and only the card said so.
        - to:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: kube-system
              podSelector:
                matchLabels:
                  k8s-app: hubble-relay
          ports:
            # 4245, NOT the Service's port 80. NetworkPolicy matches the
            # DESTINATION POD port after Service translation, and hubble-relay's
            # Service maps 80 -> targetPort 4245. A rule for 80 therefore matches
            # nothing and the connection times out exactly as if no rule existed —
            # which is what the first attempt at this did, and what the second
            # investigation reported again in its data gaps. The URL above stays
            # :80 because that IS the Service port the client dials.
            - port: 4245   # hubble-relay listen-address (Service 80 -> 4245)
              protocol: TCP
    vmServiceScrape:
      enabled: true
      interval: 30s
      path: /metrics
    # Secret-backed env (GEMINI_API_KEY, GITHUB_APP_PRIVATE_KEY) from the
    # runlore-credentials ExternalSecret. RunLore never inlines credentials.
    envFrom:
      - secretRef:
          name: runlore-credentials
      - secretRef:
          name: runlore-slack
      - secretRef:
          name: runlore-webhook
    # Rendered verbatim into /etc/runlore/runlore.yaml (strict-parsed by the agent).
    config:
      gitops:
        engine: flux
      # Source enablement (runlore v0.5.0+): presence of a key under `sources`
      # turns that source on; its value is the source's own config. Enablement
      # moved here out of the old `triggers.<name>.enabled: true` flags.
      sources:
        alertmanager: {}      # Alertmanager/VMAlert webhook source
        gitops:
          enabled: true       # also react to Flux Ready=False
      triggers:
        # `triggers.<name>` now holds match/dedup/debounce POLICY only; enablement
        # lives under `sources` above.
        incidents:
          match:
            severity: [critical]
          dedup:
            window: 30m
      investigation:
        # The 10m default is a poor fit for this provider. z.ai generates at
        # ~20-30 tok/s and the investigator emits ~1660 output tokens per turn
        # (measured: runlore_investigation_output_tokens_sum 9968 over 6 calls),
        # so ONE model call costs 60-100s. Six calls consumed the entire 10m and
        # the investigation died with confidence=0, root_causes=0.
        #
        # Latency here is dominated by OUTPUT generation, not input: the same
        # model answers a 14.7k-token prompt in ~12s, and adding all 21 tool
        # definitions changes nothing (13.3s). The loop needs ~12-20 steps, which
        # simply does not fit in 10 minutes at this generation speed.
        timeout: 30m
        # Recurrence cooldown (runlore#270): a trigger answered CONCLUSIVELY less
        # than this long ago is not re-investigated — no model call, no duplicate
        # notification. Complements dedup above: dedup keys on the alert
        # fingerprint (same firing series), this keys on the TriggerKey (same
        # incident identity across re-fires/resolves). Human-deferential: an
        # inconclusive verdict always retries, and a standing 👎 on the previous
        # answer re-arms investigation immediately. Requires outcome.ledger_path.
        recurrence_cooldown: 30m
        # gitops_failures policy left at defaults (debounce 60s); enablement is
        # via sources.gitops above.
      leader_election:
        enabled: true
        name: runlore-leader
      logging:
        format: json
        level: info
      notify:
        slack:
          bot_token_env: SLACK_BOT_TOKEN  # pragma: allowlist secret
          channel: "#alerts"
          # Interactivity: Slack posts button clicks to the public gateway route
          # (httproute.yaml, POST /slack/interactions only) and every request is
          # HMAC-verified with this secret. feedback_buttons is the opt-in human
          # feedback loop (👍/👎 → outcome ledger → recall trust + recurrence
          # cooldown re-arm). Slack-app side: set the Interactivity Request URL to
          # https://runlore.<domain>/slack/interactions.
          signing_secret_env: SLACK_SIGNING_SECRET  # pragma: allowlist secret
          feedback_buttons: true
          # DEMO-SCOPED opt-in. Exposes a SECOND public endpoint, POST
          # /slack/events (routed in httproute.yaml), where Slack delivers
          # app_mention. That is how a human addresses an investigation in its own
          # thread: "note: ..." files a knowledge-base entry, anything else is a
          # question. Every request is HMAC-verified with the signing secret above,
          # which is why the config requires it.
          #
          # Slack-app side, and it is NOT just a toggle: the bot needs the
          # app_mentions:read scope, which today's token does NOT carry
          # (chat:write, chat:write.public, channels:history, groups:history). Adding
          # it requires a workspace reinstall, which reissues the bot token and means
          # updating the runlore/slack-app secret. Then Event Subscriptions →
          # Request URL https://runlore.<domain>/slack/events → subscribe app_mention.
          thread_capture: true
      # Hubble as the network-flow source, which is what makes `network_drops`
      # available to the investigator. Without it that tool is not registered at
      # all, and RunLore cannot see a CiliumNetworkPolicy denial — it would work a
      # connectivity timeout from the application logs alone and never reach the
      # cause. This repo's own rule is "always check the network policies when
      # there are timeouts"; this is what lets RunLore follow it.
      #
      # hubble-relay.kube-system:80 is the in-cluster relay Service
      # (enable-hubble: true, hubble-listen-address :4244 in cilium-config).
      network:
        provider: hubble
        hubble:
          url: hubble-relay.kube-system:80
      telemetry:
        metrics_enabled: true
      model:
        # glm-5.2 for the investigator. 5.3 was tried and is worse HERE, despite
        # scoring itself higher — the confidence number inverts the real quality:
        #
        #   glm-5.2  12 calls, <10 min, confidence 0.70 — NAMED the policy
        #            ("CiliumNetworkPolicy demo/inventory-api-allow-payments-only")
        #   glm-5.3  18 calls, ~28 min, confidence 0.85 — did NOT name it
        #            ("object not identifiable with available tooling")
        #
        # 5.3 also writes ~3000 output tokens per turn against 5.2's ~1660, which
        # is what made it slow (~94s/call) and what exhausted
        # investigation.max_tokens_per_investigation (394170/400000, forcing an
        # early conclusion). Output volume is the cost driver, not input size.
        #
        # Separately, z.ai limits by PER-MODEL CONCURRENCY: 5.3 and 5-Turbo get 1
        # in-flight request, 5.2 and 5.1 get 10. One slot is enough for this
        # sequential loop, but it 429s the moment anything else touches the key.
        provider: openai
        model: glm-5.2
        base_url: https://api.z.ai/api/paas/v4/
        api_key_env: GLM_API_KEY  # pragma: allowlist secret
        chat:
          # Thread replies answer a question against an already-written report,
          # so they want latency and cost, not depth. Measured on a realistic
          # thread turn (3 runs, median): 1.6s and 40 output tokens, against 2.9s
          # and 84 for glm-5.2 — and $0.1/$0.1 per 1M vs $1.4/$4.4, ~19x cheaper
          # per reply. 15 concurrency slots, the most of any model here, so a
          # follow-up asked mid-investigation cannot collide with the loop.
          model: glm-4-32b-0414-128k
      catalog:
        dir: /var/lib/runlore/catalog
        git:
          url: https://github.com/Smana/runlore-kb
          branch: main
          interval: 5m
        # Instant recall: short-circuit the investigation loop when the catalog
        # has a high-confidence match (the learning payoff). Off by default — must
        # be enabled. Thresholds are BM25-corpus-dependent; tune from the
        # recall_score / recall_rejections metrics. Recall is auto-disabled under
        # actions.mode=auto (poison-safety); harmless here (mode=off).
        instant_recall:
          enabled: true
          # The LLM reranker (ON by default, runlore#294) gates the short-circuit on a
          # CALIBRATED 0-1 match confidence, not an absolute BM25 magnitude — so the
          # BM25 solo_floor/min_score/margin_gap NO LONGER need per-corpus tuning and
          # are left at their defaults. (Previously this cluster hand-tuned solo_floor
          # to 0.2 because label-derived Alertmanager queries score ~0.1-0.3, an order
          # of magnitude below the default 4.0 — the reranker removes that need.)
          # The reranker routes to model.verify when set (here the main model), costs
          # ~1-2k tokens, and fires on rerank_threshold 0.7. outcome_floor keeps the
          # decay gate (a recall that never resolves is rejected).
          outcome_prior: 2.0
          outcome_floor: 0.5
      outcome:
        ledger_path: /var/lib/runlore/catalog/outcomes.jsonl
      forge:
        kb_repo: Smana/runlore-kb
        base_branch: main
        # Don't draft a KB PR for a benign "no action needed" conclusion — the finding
        # still delivers to Slack, only the repo artifact is suppressed. Shipped in
        # #256 specifically because pilot data showed 72% of drafted PRs over 6 days
        # were closed as noise (benign infra churn, synthetic canaries, near-dupes).
        skip_verdicts: [no_action]
        github_app:
          app_id: 4106804
          installation_id: 141652301
          private_key_env: GITHUB_APP_PRIVATE_KEY  # pragma: allowlist secret
      cloud:
        provider: aws
        region: eu-west-3
        cluster_name: mycluster-0
      # actions: omitted -> mode "off" (fully read-only on the cluster; only
      # writes are KB PRs/issues on Smana/runlore-kb via the GitHub App).
      # v0.2.0 fails closed (RequireWebhookAuth): with a model configured the
      # alert webhook MUST be authenticated, since alert labels/annotations flow
      # into the LLM prompt and bill the model. The bearer token comes from the
      # runlore-webhook ExternalSecret (envFrom above); the Alertmanager runlore
      # receiver posts it via authorization.credentials_file
      # (observability/.../vm-common-helm-values-configmap.yaml).
      server:
        webhook_token_env: WEBHOOK_TOKEN  # pragma: allowlist secret
      # Investigation signals — enable the query_metrics / query_metrics_range /
      # query_logs tools so investigations correlate the GitOps change against live
      # saturation + application logs (multi-source RCA), not just k8s object state.
      metrics:
        url: http://vmsingle-victoria-metrics-k8s-stack.observability.svc:8428
      logs:
        url: http://victoria-logs-victoria-logs-single-server.observability.svc:9428
      # network: deferred (needs a Hubble/flow-log provider choice).
