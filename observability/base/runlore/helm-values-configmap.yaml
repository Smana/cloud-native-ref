# envFrom lives HERE, not in spec.values: Flux merges spec.values LAST, over the
# valuesFrom result (fluxcd/pkg chartutil.ChartValuesFromReferences ends in
# MergeMaps(result, spec.values)), and lists replace rather than merge. In spec.values
# it would therefore replace the agent-platform umbrella's four-entry list with three,
# silently dropping the factory intake Secret (TW7). As the first valuesFrom entry this
# list is always shipped; the umbrella's optional CM, merged second, replaces it whole.
apiVersion: v1
kind: ConfigMap
metadata:
  # helm-controller re-reconciles the HelmRelease on change (#2276).
  labels:
    reconcile.fluxcd.io/watch: Enabled
  name: runlore-base-values
data:
  values.yaml: |  # pragma: allowlist secret -- Secret names only, no credential value
    # Secret-backed env (GEMINI_API_KEY, GITHUB_APP_PRIVATE_KEY) from the
    # runlore-credentials ExternalSecret. RunLore never inlines credentials.
    envFrom:
      - secretRef:
          name: runlore-credentials
      - secretRef:
          name: runlore-slack
      - secretRef:
          name: runlore-webhook
    # The platform CA for the factory client: the AI platform's values set factory.ca_file to
    # /etc/runlore-factory-ca/ca.crt. A SIBLING of /etc/runlore, never inside it: the chart mounts its config ConfigMap
    # there read-only, and the runtime cannot create a mount point in it (the pod would not start).
    # `optional` does not make a missing file harmless once ca_file is set: RunLore refuses a missing ca_file at
    # start. The ConfigMap ships with the switch: observability/aws-0/configmap-factory-ca.yaml (listed beside the
    # `../base/runlore` line) or observability/gcp-0/runlore/configmap-factory-ca.yaml (listed in ./runlore).
    extraVolumes:
      - name: factory-ca
        configMap: {name: factory-ca, optional: true}
    extraVolumeMounts:
      - {name: factory-ca, mountPath: /etc/runlore-factory-ca, readOnly: true}
