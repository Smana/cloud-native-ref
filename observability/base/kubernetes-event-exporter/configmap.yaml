apiVersion: v1
kind: ConfigMap
metadata:
  name: kubernetes-event-exporter
  labels:
    app.kubernetes.io/instance: kubernetes-event-exporter
    app.kubernetes.io/name: kubernetes-event-exporter
data:
  # No "dump" file receiver: with layout: {} (empty-but-present) the fork's
  # file sink takes the convertLayoutTemplate branch over zero keys and emits
  # contentless "{}" lines (pkg/sinks/file.go) — every cluster Event became a
  # noise line that Vector's unfiltered kubernetes_logs source re-ingested
  # into VictoriaLogs. It was never a fallback either: if the informer stops,
  # no receiver gets anything. Events now flow solely via the loki receiver.
  #
  # The loki URL below targets vlsingle (see observability/base/victoria-logs/),
  # the deployed variant — it pointed at the vlcluster vlinsert Service (never
  # deployed here) from 2025-08-23 to 2026-08-29, so event push silently went
  # nowhere the whole time.
  config.yaml: |
    clusterName: ${cluster_name}
    leaderElection: {}
    logFormat: json
    logLevel: info
    metricsNamePrefix: event_exporter_
    receivers:
    - loki:
        streamLabels:
          source: kubernetes-event-exporter
        url: http://victoria-logs-victoria-logs-single-server.observability.svc.cluster.local:9428/insert/loki/api/v1/push
      name: victorialogs
    route:
      routes:
      - match:
        - receiver: victorialogs
