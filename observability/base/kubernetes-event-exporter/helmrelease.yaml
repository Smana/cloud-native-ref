apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kubernetes-event-exporter
spec:
  interval: 30m
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: kubernetes-event-exporter
      version: "3.6.3"
      sourceRef:
        kind: HelmRepository
        name: bitnami
        namespace: flux-system
      interval: 12h
  values:
    global:
      security:
        allowInsecureImages: true
    # Using a custom image from https://github.com/civitatis/kubernetes-event-exporter because of this issue: https://github.com/civitatis/kubernetes-event-exporter
    image:
      registry: ghcr.io
      repository: civitatis/kubernetes-event-exporter
      tag: "1.8"
    config:
      logLevel: info
      logFormat: json
      metricsNamePrefix: "event_exporter_"
      clusterName: "${cluster_name}"
      receivers:
        # No "dump" file receiver: with layout: {} (empty-but-present) the fork's
        # file sink takes the convertLayoutTemplate branch over zero keys and emits
        # contentless "{}" lines (pkg/sinks/file.go) — every cluster Event became a
        # noise line that Vector's unfiltered kubernetes_logs source re-ingested
        # into VictoriaLogs. It was never a fallback either: if the informer stops,
        # no receiver gets anything. Events now flow solely via the loki receiver.
        - name: "victorialogs"
          loki:
            # vlsingle is the deployed variant (see observability/base/victoria-logs/).
            # This URL pointed at the vlcluster vlinsert Service from 2025-08-23 to
            # 2026-08-29 — a Service that never existed here — so direct event push
            # silently went nowhere the whole time.
            url: "http://victoria-logs-victoria-logs-single-server.observability.svc.cluster.local:9428/insert/loki/api/v1/push"
            streamLabels:
              source: kubernetes-event-exporter

      route:
        routes:
          - match:
              - receiver: "victorialogs"

    metrics:
      enabled: true

      serviceMonitor:
        enabled: true
        namespace: "observability"

      prometheusRule:
        enabled: true
        namespace: "observability"
        groups:
          - name: KubernetesEventExporter
            rules:
              # The VM operator's Prometheus converter turns this PrometheusRule
              # (and the ServiceMonitor above) into VM-native objects.
              # WatchErrors is registered as a labelless counter (pkg/kube/watcher.go,
              # WatchErrors.Inc()) — no namespace grouping is possible, so the message
              # below deliberately doesn't reference $labels.namespace. The cluster
              # external label is stamped by vmalert, so per-cluster attribution in
              # Slack still works. The rate(...[5m]) > 0 held for 15m is deliberate:
              # transient, self-healing informer watch errors don't fire; only a
              # sustained error stream does, hence severity warning rather than critical.
              - alert: KubernetesEventExporterWatchErrors
                annotations:
                  message: "kubernetes-event-exporter reports watch errors — cluster Events may be missing from VictoriaLogs."
                expr: |
                  sum(rate(event_exporter_watch_errors[5m])) > 0
                for: 15m
                labels:
                  severity: warning
