apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-logs
  namespace: observability
spec:
  releaseName: victoria-logs
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: victoria-logs-single
      sourceRef:
        kind: HelmRepository
        name: victoria-metrics
        namespace: observability
      version: "0.13.9"
  interval: 4m0s
  timeout: 30m
  install:
    remediation:
      retries: 3
  valuesFrom:
    - kind: ConfigMap
      name: vl-common-helm-values
      valuesKey: values.yaml
  values:
    printNotes: false

    server:
      resources:
        limits:
          cpu: 500m
          memory: 512Mi
        requests:
          cpu: 500m
          memory: 512Mi

      # Deliberate values (2026-08-30). Retention was previously unset — whatever
      # the app defaulted to. NOTE the units trap: a unit-less retentionPeriod is
      # MONTHS in VictoriaMetrics charts; always write the suffix.
      retentionPeriod: 7d
      retentionDiskSpaceUsage: 8GiB
      persistentVolume:
        enabled: true
        size: 10Gi
        storageClassName: ${storage_class}

      vmServiceScrape:
        enabled: true

    vector:
      enabled: true

      # Vector subchart: `securityContext` is the CONTAINER context
      # ("Specify securityContext on Vector containers" — vector values.yaml);
      # `podSecurityContext` is the pod one. Vector tails host log files as root
      # but never needs to escalate privileges.
      # (The `server` component already ships allowPrivilegeEscalation: false as
      # a chart default, so it needs nothing here.)
      securityContext:
        allowPrivilegeEscalation: false

      # The Vector pipeline (customConfig) — sources, transforms, PG sinks and
      # tests — is shared with the vlcluster variant via the
      # vl-common-helm-values ConfigMap (valuesFrom above). Only the catch-all
      # sink below stays inline: its name must match the sink the single chart
      # generates, which is chart-specific.
      customConfig:
        sinks:
          # ======================================================================
          # Sink 3: All Other Logs (Non-PostgreSQL)
          # ======================================================================
          # Purpose: Store general Kubernetes logs from all other pods
          # Input: parser (all logs except PostgreSQL execution plans)
          # NOTE: the name `vlogs-0` deliberately OVERRIDES the per-replica
          # sink the single chart generates; it is single-chart-specific, hence
          # inline and not shared (the cluster chart generates its own `vlogs`
          # catch-all already pointed at vlinsert — a shared copy would double
          # every general log line there).
          # ======================================================================
          vlogs-0:
            type: elasticsearch
            inputs:
              - parser
            api_version: v8
            mode: bulk
            compression: gzip
            endpoints:
              - http://victoria-logs-victoria-logs-single-server-0.victoria-logs-victoria-logs-single-server.observability.svc.cluster.local.:9428/insert/elasticsearch
            healthcheck:
              enabled: false
            request:
              headers:
                AccountID: "0"
                ProjectID: "0"
                VL-Time-Field: timestamp
                VL-Msg-Field: message,msg,_msg,log.msg,log.message,log
                VL-Stream-Fields: stream,kubernetes.pod_name,kubernetes.container_name,kubernetes.pod_namespace

    dashboards:
      enabled: true
      grafanaOperator:
        enabled: true
        spec:
          allowCrossNamespaceImport: true
          folderRef: "logs"
