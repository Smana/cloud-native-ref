apiVersion: operator.victoriametrics.com/v1beta1
kind: VMAlert
metadata:
  labels:
    app.kubernetes.io/component: victoria-logs-vmalert
    app.kubernetes.io/instance: victoria-logs
  name: victoria-logs
  namespace: observability
spec:
  # Same reason as the VM stack's vmalert (see
  # observability/base/victoria-metrics-k8s-stack/vm-common-helm-values-configmap.yaml):
  # every alert this instance generates needs to say which cluster it came from,
  # and no rule expression can be relied on to carry the label through.
  #
  # This one is easy to miss because it is a SECOND VMAlert in the same
  # namespace. Fixing only the stack's leaves every log-based alert --
  # TooManyLogs among them -- still arriving with an empty cluster.
  externalLabels:
    cluster: "${cluster_name}"
  ruleSelector:
    matchLabels:
      vmlog: "true"
  datasource:
    url: http://victoria-logs-victoria-logs-single-server.observability.svc.cluster.local.:9428
  evaluationInterval: 20s
  image:
    tag: v1.122.0
  notifiers:
    - url: http://vmalertmanager-victoria-metrics-k8s-stack-0.vmalertmanager-victoria-metrics-k8s-stack.observability.svc.cluster.local.:9093
  port: "8080"
  remoteRead:
    url: http://vmsingle-victoria-metrics-k8s-stack.observability.svc.cluster.local.:8429
  remoteWrite:
    url: http://vmsingle-victoria-metrics-k8s-stack.observability.svc.cluster.local.:8429/api/v1/write
  resources:
    limits:
      cpu: 100m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
