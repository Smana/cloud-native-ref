---
# LogsQL rules: promtool cannot parse them, so validate-vmrules.sh skips this
# group by its `type` and says so on every run.
# runbook_url points at the integration branch: the agent-factory runbooks live there until
# Phase 7 re-points them (Ruling G).
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: agent-platform-logs
  namespace: observability
  labels:
    vmlog: "true"
spec:
  groups:
    - name: agent-platform-logs
      type: vlogs
      interval: 5m
      rules:
        # The agent router's 401/403 burst is AgentGatewayUnauthorizedBurst, a metric rule (vmrule.yaml).
        - alert: OctoStsExchangeFailures
          expr: 'kubernetes.pod_labels.app.kubernetes.io/name:"octo-sts" AND _msg:~"(?i)(error|denied|failed)" | stats count() as failures | filter failures:>5'
          labels:
            severity: warning
          annotations:
            summary: "octo-sts logged {{ $value }} failed exchanges in 5 minutes"
            description: "A run is asking for a repository or role its trust policy does not grant, or the App key is wrong."
            runbook_url: "https://github.com/Smana/cloud-native-ref/blob/integration/agent-factory/docs/runbooks/agent-factory/05-github-octo-sts.md"
            dashboard: "https://grafana.${private_domain_name}/d/agent-platform"
