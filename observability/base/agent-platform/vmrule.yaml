---
# Agent platform health (SP1 §8). Lives in the umbrella: on a cluster with the
# platform suspended these would only ever be silent.
# runbook_url points at the integration branch: the agent-factory runbooks live there until
# Phase 7 re-points them (Ruling G).
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: agent-platform
  namespace: observability
spec:
  groups:
    - name: agent-platform
      rules:
        - alert: AgentSandboxPodPending
          expr: max by (pod) (kube_pod_status_phase{namespace="agents", phase="Pending"}) > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Agent sandbox pod {{ $labels.pod }} has been Pending for 15 minutes"
            description: "Check the agents-gvisor pool (aws-0: NodePool limit; gcp-0: node pool max, cluster CPU ceiling, the Cilium-taint toleration), spot capacity and runsc on the node: kubectl describe pod -n agents {{ $labels.pod }}"
            runbook_url: "https://github.com/Smana/cloud-native-ref/blob/integration/agent-factory/docs/runbooks/agent-factory/01-runtime-sandbox.md"
            dashboard: "https://grafana.${private_domain_name}/d/agent-platform"
        # aws-0 only: karpenter_nodepools_* has no series on gcp-0, whose pool is a
        # GKE node pool (no Karpenter), so this can never fire there. On gcp-0 a
        # full pool surfaces as AgentSandboxPodPending.
        - alert: AgentGvisorPoolNearLimit
          expr: sum by (resource_type) (karpenter_nodepools_usage{nodepool="agents-gvisor"}) / sum by (resource_type) (karpenter_nodepools_limit{nodepool="agents-gvisor"}) * 100 > 90
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "agents-gvisor is above 90 % of its {{ $labels.resource_type }} limit"
            description: "New runs will stay Pending. Raise the NodePool limit or wait for runs to finish. aws-0 only (Karpenter metrics); gcp-0 relies on AgentSandboxPodPending."
            runbook_url: "https://github.com/Smana/cloud-native-ref/blob/integration/agent-factory/docs/runbooks/agent-factory/01-runtime-sandbox.md"
            dashboard: "https://grafana.${private_domain_name}/d/agent-platform"
        # No enforced per-run cap exists until SP4 PR 2 (design spec line 162):
        # until then a run is bounded only by the gateway's 5M ceiling. These
        # watch the same gen_ai counters the SP4 llm-gateway budget uses.
        - alert: AgentRunTokenSpendHigh
          expr: sum by (ar_agent) (increase(gen_ai_client_token_usage_sum{ar_agent=~"system:serviceaccount:agents:.*", gen_ai_token_type=~"input|output"}[8h])) > 5e6
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.ar_agent }} spent more than 5M tokens in 8h"
            description: "No enforced per-run cap exists until SP4 PR 2. Revoke by hand: kubectl annotate agentrun -n agents <name> agents.ogenki.io/revoked=budget-run"
            runbook_url: "https://github.com/Smana/cloud-native-ref/blob/integration/agent-factory/docs/runbooks/agent-factory/04-gateway-secrets-budgets.md"
            dashboard: "https://grafana.${private_domain_name}/d/agent-platform"
        - alert: AgentFleetTokenSpendHigh
          expr: sum(increase(gen_ai_client_token_usage_sum{ar_agent=~"system:serviceaccount:agents:.*", gen_ai_token_type=~"input|output"}[1h])) > 1e7
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "The agent fleet spent more than 10M tokens in 1h"
            description: "No enforced per-run cap exists until SP4 PR 2. Revoke the noisiest run by hand: kubectl annotate agentrun -n agents <name> agents.ogenki.io/revoked=budget-run"
            runbook_url: "https://github.com/Smana/cloud-native-ref/blob/integration/agent-factory/docs/runbooks/agent-factory/04-gateway-secrets-budgets.md"
            dashboard: "https://grafana.${private_domain_name}/d/agent-platform"
    # The agent router on agentgateway (ADR-0053), beside Envoy's until phase H. The
    # scrape relabel feeds the gen_ai_* rules above; these read agentgateway_* too
    # (infrastructure/base/agent-gateway/vmpodscrape.yaml).
    - name: agent-gateway
      rules:
        # G2 guard: the relabel holds only while upstream's names do. Model calls
        # with no token series, or a token type the meter does not select, is the
        # signature of a silent rename: the meter would read zero or misprice.
        - alert: AgentRouterMetricContractBroken
          expr: (sum(increase(agentgateway_requests_total{namespace="agent-gateway", route="agent-system/agentgateway-models", status="200"}[15m])) > 0 unless sum(increase(gen_ai_client_token_usage_count{namespace="agent-gateway"}[15m])) > 0) or count(gen_ai_client_token_usage_sum{namespace="agent-gateway", gen_ai_token_type!~"input|output|cached_input|cache_creation_input"}) > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "agent-router (agentgateway) serves model calls the gen_ai contract does not see"
            description: "An agentgateway upgrade renamed a metric or token type that infrastructure/base/agent-gateway/vmpodscrape.yaml maps. The run meter, the budget alerts and the run page read zero or misprice until fixed."
            runbook_url: "https://github.com/Smana/cloud-native-ref/blob/main/docs/runbooks/agent-factory/08-observability.md"
            dashboard: "https://grafana.${private_domain_name}/d/agent-gateway"
        - alert: AgentGateway5xxRatioHigh
          expr: sum(rate(agentgateway_requests_total{namespace="agent-gateway", status=~"5.."}[10m])) / sum(rate(agentgateway_requests_total{namespace="agent-gateway"}[10m])) > 0.05 and sum(increase(agentgateway_requests_total{namespace="agent-gateway", status=~"5.."}[10m])) > 5
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "agent-router (agentgateway) answers {{ $value | humanizePercentage }} of requests with a 5xx"
            description: "Split by route and reason on the agent-gateway dashboard: UpstreamFailure or Timeout is the provider or an MCP server, Internal is the proxy."
            runbook_url: "https://github.com/Smana/cloud-native-ref/blob/main/docs/runbooks/agent-factory/04-gateway-secrets-budgets.md"
            dashboard: "https://grafana.${private_domain_name}/d/agent-gateway"
        # 1.6 sets error_type="_OTHER" on every failed model call: a ratio, not a cause.
        - alert: AgentGatewayModelErrorRatioHigh
          expr: sum(rate(gen_ai_server_request_duration_seconds_count{namespace="agent-gateway", error_type=~".+"}[10m])) / sum(rate(gen_ai_server_request_duration_seconds_count{namespace="agent-gateway"}[10m])) > 0.1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "{{ $value | humanizePercentage }} of model calls through agent-router (agentgateway) fail"
            description: "The provider is failing or refusing. The access log's http.status and error fields name the cause: kubectl logs -n agent-gateway -l gateway.networking.k8s.io/gateway-name=agent-router"
            runbook_url: "https://github.com/Smana/cloud-native-ref/blob/main/docs/runbooks/agent-factory/04-gateway-secrets-budgets.md"
            dashboard: "https://grafana.${private_domain_name}/d/agent-gateway"
        # The metric twin of the LogsQL AgentRouterUnauthorizedBurst: here the refusal reason is a label.
        - alert: AgentGatewayUnauthorizedBurst
          expr: sum(increase(agentgateway_requests_total{namespace="agent-gateway", reason=~"JwtAuth|Authorization"}[5m])) > 20
          labels:
            severity: warning
          annotations:
            summary: "agent-router (agentgateway) refused {{ $value }} requests in 5 minutes"
            description: "Invalid tokens, wrong audience or a sub outside namespace agents. T8: replayed or foreign tokens; R2: identity-proxy rotation broken."
            runbook_url: "https://github.com/Smana/cloud-native-ref/blob/main/docs/runbooks/agent-factory/02-identity-tokens.md"
            dashboard: "https://grafana.${private_domain_name}/d/agent-gateway"
        - alert: AgentRateLimitDown
          expr: absent(up{namespace="agent-gateway", pod=~"agent-ratelimit-.*"} == 1)
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "agent-ratelimit is down: agentgateway budgets count nothing"
            description: "The router fails open, so agents run unmetered by B1-B2. kubectl get pods -n agent-gateway -l app.kubernetes.io/name=agent-ratelimit"
            runbook_url: "https://github.com/Smana/cloud-native-ref/blob/main/docs/runbooks/agent-factory/04-gateway-secrets-budgets.md"
            dashboard: "https://grafana.${private_domain_name}/d/agent-gateway"
