apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Applications on gcp-0.
#
# Three of aws-0's four, from the same shared directories. None of these
# declares a single ${var}, so there is nothing per-cluster to substitute and
# nothing that could resolve to empty here.
resources:
  - ../base/basic
  - ../demo
  - ../platform

# ../base/complete is NOT here, and it is the one app that genuinely cannot be.
#
# image-gallery hardcodes its object storage in the container's environment:
#   STORAGE_ENDPOINT  s3.eu-west-3.amazonaws.com
#   STORAGE_BUCKET    eu-west-3-ogenki-xplane-image-gallery
#   STORAGE_REGION    eu-west-3
#
# This is not a manifest that needs a per-cloud overlay — it is an application
# talking to S3 through an S3 SDK. Pointing it at Cloud Storage means either
# GCS's S3-compatible XML API with HMAC keys (static credentials, which this
# platform avoids wherever a workload identity will do) or a GCS-native client
# in the application itself. Both are changes to image-gallery, not to this
# repository.
#
# ./llm is also absent, and deliberately: apps/gcp-0/llm is applied by
# clusters/gcp-0-llm-platform/apps-llm.yaml under the suspended umbrella, so
# listing it here would apply the LLM platform's claims regardless of that
# suspend — exactly what keeping the umbrella a sibling of clusters/gcp-0/ was
# meant to prevent.
