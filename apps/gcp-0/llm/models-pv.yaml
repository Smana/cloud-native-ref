# Shared GCS-FUSE mount for ALL InferenceService claims on gcp-0 (ADR-0021),
# the GCP analogue of apps/aws-0/llm/models-pvc.yaml. Same shape deliberately:
# a single cluster-scoped PV + namespaced PVC pair (RWM) in `llm`, so the
# InferenceService composition's per-claim subPath mount under /models needs
# no change to run on either cloud.
#
# Provisioned out-of-band, same reasons as the AWS PV: the PV is
# cluster-scoped and v2 namespaced XRs cannot render cluster-scoped
# resources.
#
# storageClassName: verified against the driver rather than copied from the
# AWS value's shape. Google's own static-provisioning example
# (github.com/GoogleCloudPlatform/gcs-fuse-csi-driver examples/static/
# pv-pvc-deployment.yaml) sets a non-empty, matching storageClassName on both
# the PV and the PVC ("dummy-storage-class") -- it is never resolved to an
# actual StorageClass object, it only has to match between the two sides so
# they bind to each other via claimRef/volumeName instead of a dynamic
# provisioner picking either one up. An empty string is NOT what upstream
# uses, so this follows the AWS overlay's naming convention
# (s3files-llm-models) rather than inventing a different shape: a distinct,
# never-provisioning class name, matching on both objects.
#
# volumeHandle is just the bucket name. Unlike aws-0's
# `s3files:<fs-id>::<ap-id>`, which is regenerated by every `tofu apply` and
# updated by hand (see the TODO in apps/aws-0/llm/models-pvc.yaml), this
# handle is deterministic -- so the manual loop that file describes does not
# exist on GCP.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: llm-models
  labels:
    app.kubernetes.io/part-of: ai
    app.kubernetes.io/component: storage
spec:
  # Capacity is nominal -- Cloud Storage FUSE is unmetered at the PV level.
  capacity:
    storage: 100Gi
  accessModes:
    - ReadWriteMany
  # Retain -- the underlying bucket data outlives any single PVC delete.
  persistentVolumeReclaimPolicy: Retain
  storageClassName: gcsfuse-llm-models
  mountOptions:
    - implicit-dirs
  csi:
    driver: gcsfuse.csi.storage.gke.io
    volumeHandle: ${project_id}-ogenki-llm-models
  claimRef:
    namespace: llm
    name: llm-models
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: llm-models
  namespace: llm
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: gcsfuse-llm-models
  resources:
    requests:
      storage: 100Gi
  volumeName: llm-models
