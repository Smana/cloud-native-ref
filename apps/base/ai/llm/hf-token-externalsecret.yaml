---
# Shared HuggingFace token for the LLM platform (FR-011).
# All InferenceService claims envFrom this Secret via spec.envFromSecrets:
#   ["hf-token"], avoiding per-claim ExternalSecret name collisions.
# The vLLM container uses HF_TOKEN at startup (when weights are downloaded
# from HF directly); the composition-rendered preload Job uses it during
# the one-shot upload from HF to the weights bucket.
#
# `key` is templated, not literal: each cluster's vars ConfigMap
# (opentofu/{aws,gcp}/.../kubernetes.tf) supplies llm_hf_token_secret, and the
# two shapes genuinely differ. AWS Secrets Manager permits "/", so aws-0's
# value stays path-style (/platform/llm/hf_token); GCP Secret Manager forbids
# "/" entirely, so gcp-0's value is a flat dash-separated ID. That is the
# constraint ADR-0023 records. The OpenBao snapshot job used to carry the same
# split via a variable named openbao_snapshot_secret; it no longer does. Since
# the switch to JWT auth that job needs a BUCKET name and no secret-store key
# at all, so this comment can no longer point at a live sibling for the shape.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hf-token
  namespace: llm
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: clustersecretstore
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    name: hf-token
  dataFrom:
    - extract:
        conversionStrategy: Default
        key: ${llm_hf_token_secret}
