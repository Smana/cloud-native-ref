# The factory's signed chart (SP3 §4). Signatures: release.yaml tags only (R20).
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: agent-factory
  namespace: agent-system
spec:
  interval: 12h
  url: oci://ghcr.io/smana/charts/agent-factory
  # Flux pulls the digest (it wins over the tag), so a re-pushed tag changes nothing. The tag
  # stays for Renovate and for readers.
  ref:
    tag: "0.54.0"  # maku v0.54.0
    digest: sha256:75b14c6dbad8407b9fa1d899f0e4c91f5e0ca6c5ed42147173091bbb23fb9d39
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  # One identity: Flux refuses several. maku's release workflow signs every chart since v0.30.0.
  verify:
    provider: cosign
    matchOIDCIdentity:
      - issuer: "^https://token\\.actions\\.githubusercontent\\.com$"
        subject: "^https://github\\.com/Smana/maku/\\.github/workflows/release\\.yaml@refs/tags/v.*$"
