# The factory's signed chart (SP3 §4). Signatures: ci.yaml pre-releases until the programme's
# merge wave, then release.yaml tags only; the wave narrows `subject` (R20).
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: agent-factory
  namespace: agent-system
spec:
  interval: 12h
  url: oci://ghcr.io/smana/charts/agent-factory
  # Flux pulls the digest (it wins over the tag): any same-repo agent-platform PR's CI can
  # re-push a tag with a valid signature. The tag stays for Renovate and for readers.
  ref:
    tag: "0.0.1-pr22.g745292b3"  # agent-platform#22 at 745292b (integration build)
    digest: sha256:6facc8b4a6784a4ca597ad7bd2f0c77460d0338a4db3092be2c4f637807b53c7
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  verify:
    provider: cosign
    matchOIDCIdentity:
      - issuer: "^https://token\\.actions\\.githubusercontent\\.com$"
        subject: "^https://github\\.com/Smana/agent-platform/\\.github/workflows/(ci|release)\\.yaml@refs/(tags/v.*|pull/[0-9]+/merge)$"
