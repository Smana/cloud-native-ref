# The AI platform (ADR-0057, split design H1). Suspended by default: a default deploy never fetches
# it. aws-0 un-suspends it in its flux-sources Kustomization (its umbrellas are live).
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: ai-native-ref
  namespace: flux-system
spec:
  suspend: true
  interval: 10m
  url: oci://ghcr.io/smana/ai-native-ref
  # Flux pulls the digest. A feature-branch cluster pins a pre-release here, on its branch (D2).
  # scripts/ci/ai-overlay.sh reads this pin: CI renders exactly what the cluster applies.
  ref:
    tag: "v3.1.3-pr294.g57fdff7c"
    digest: sha256:c5b50a1dd95a5fc5a24d44aac88d56a6c4174b71de5278a338e1bb1b3bc69470
  verify:
    provider: cosign
    # One entry: Flux's cosign keyless refuses several ("multiple identities are not supported
    # at this time", source-controller on aws-0, 2026-10-16), so one regex takes both signers:
    # release.yaml on a tag, ci.yaml on a PR pre-release.
    matchOIDCIdentity:
      - issuer: "^https://token\\.actions\\.githubusercontent\\.com$"
        subject: "^https://github\\.com/Smana/ai-native-ref/\\.github/workflows/(release\\.yaml@refs/tags/v.*|ci\\.yaml@refs/pull/[0-9]+/merge)$"
