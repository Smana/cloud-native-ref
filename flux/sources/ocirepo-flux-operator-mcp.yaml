apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: flux-operator-mcp
  namespace: agent-system
spec:
  interval: 12h
  url: oci://ghcr.io/controlplaneio-fluxcd/charts/flux-operator-mcp
  ref:
    # A bump that adds a resource/prompt/template here ships unauthorized:
    # `resources/*` and `prompts/*` bypass MCPRoute authorization entirely
    # (review M5). Check the release notes before bumping.
    tag: "0.60.0"
  verify:
    provider: cosign
    matchOIDCIdentity:
      # Both fields are Go regexes matched unanchored by default (Flux docs'
      # own example anchors them); `charts/*` matched zero-or-more `/`, not
      # "any workflow" -- a substring match looser than intended (review M8).
      - issuer: "^https://token.actions.githubusercontent.com$"
        subject: "^https://github.com/controlplaneio-fluxcd/charts/.*$"
