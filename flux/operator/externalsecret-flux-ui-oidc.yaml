apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: flux-ui-oidc
  namespace: flux-system
spec:
  dataFrom:
    - extract:
        conversionStrategy: Default
        key: flux/ui-oidc
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-platform
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    name: flux-ui-oidc
    # HelmRelease/flux-operator reads this through valuesFrom: without the label
    # a rotated secret waits for the release's interval. The chart's
    # checksum/web-config annotation then rolls the pod, which reads its config once.
    template:
      metadata:
        labels:
          reconcile.fluxcd.io/watch: Enabled
