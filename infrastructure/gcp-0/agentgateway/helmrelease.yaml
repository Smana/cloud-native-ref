apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: agentgateway
  namespace: agentgateway-system
spec:
  releaseName: agentgateway
  chartRef:
    kind: OCIRepository
    name: agentgateway
    namespace: agentgateway-system
  interval: 10m0s
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  dependsOn:
    - name: agentgateway-crds
      namespace: agentgateway-system
  values:
    controller:
      image:
        tag: "v1.5.0@sha256:319489cb86b7f901a52a3fc532ad07f136c92756f88cf02a4040909e20001120"
    # The proxy image is pinned per Gateway (AgentgatewayParameters.spec.image),
    # where a digest field exists; this chart only takes a tag for it.
    # Namespaced writes (Deployments, Services, Secrets) only where the PoC Gateway
    # lives. Reads stay cluster-wide, Secrets included: a backend's secretRef is
    # resolved by the controller, wherever the backend sits.
    rbac:
      gatewayNamespaces:
        - agw-poc
    podSecurityContext:
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      capabilities:
        drop: ["ALL"]
      seccompProfile:
        type: RuntimeDefault
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: "1"
        memory: 512Mi
  # The chart has a readiness and a startup probe but no liveness probe, and no value adds one.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: agentgateway
            patch: |
              - op: add
                path: /spec/template/spec/containers/0/livenessProbe
                value:
                  httpGet:
                    path: /readyz
                    port: 9093
                  periodSeconds: 20
                  failureThreshold: 6
