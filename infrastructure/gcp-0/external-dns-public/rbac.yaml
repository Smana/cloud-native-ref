# The chart normally creates these; it is disabled below because the chart's
# ServiceAccount would not carry the projected-token volume this needs.
#
# `namespaces` is required, not incidental: the chart's own clusterrole.yaml
# gates this exact rule on gateway sources ("we need to list namespaces
# cluster-wide to discover Gateways across the cluster"), and the
# gateway-route source builds a namespace informer at construction time --
# missing RBAC there is a log.Fatal in external-dns's main, so the pod
# CrashLoopBackOffs before it ever reaches a Route53 call. Confirmed against
# this repo's own rendered bundle: the private external-dns on gcp-0 uses
# chart RBAC and carries this rule; this hand-written copy omitted it until
# the final-branch review caught it.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: external-dns-public
rules:
  - apiGroups: [""]
    resources: ["services", "endpoints", "pods", "nodes"]
    verbs: ["get", "watch", "list"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "watch", "list"]
  # Required by the `service` source, which starts an EndpointSlice informer.
  # Without it external-dns does not degrade -- it dies:
  #   fatal: failed to sync *v1.EndpointSlice after 1m0s: context deadline exceeded
  # and crash-loops, so the Deployment sits at 0/1 and no record is ever
  # published. The failure names the informer, not the missing permission.
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "watch", "list"]
  - apiGroups: ["extensions", "networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "watch", "list"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["gateways", "httproutes", "grpcroutes", "tlsroutes", "tcproutes", "udproutes"]
    verbs: ["get", "watch", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: external-dns-public
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: external-dns-public
subjects:
  - kind: ServiceAccount
    name: external-dns-public
    namespace: kube-system
