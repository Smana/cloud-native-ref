# external-dns for the PUBLIC zone, authenticating to AWS with a projected
# ServiceAccount token -- no access key anywhere.
#
# The AWS SDK's web-identity path is driven by three things: AWS_ROLE_ARN,
# AWS_WEB_IDENTITY_TOKEN_FILE, and a token actually present at that path. The
# chart does not project a token for an arbitrary audience, so the volume is
# declared explicitly below. `audience: sts.amazonaws.com` MUST match the
# client_id_list on the OIDC provider and the `aud` condition in the trust
# policy; a mismatch fails with AccessDenied and no explanation.
#
# AWS_REGION is ${route53_region}, NOT ${region}. On gcp-0, ${region} is a GCP
# region (europe-west4), and it is fed straight into the AWS SDK's shared config
# to compute the STS client endpoint for the AssumeRoleWithWebIdentity call this
# HelmRelease makes -- so ${region} here produces a nonexistent STS endpoint.
# ${route53_region} is the dedicated AWS-shaped key that
# opentofu/gcp/gke/configure publishes for exactly this. The ClusterIssuer's
# route53 solver has already shipped this defect once. Do not "simplify" it back.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns-public
  namespace: kube-system
spec:
  releaseName: external-dns-public
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: external-dns
      sourceRef:
        kind: HelmRepository
        name: external-dns
        namespace: kube-system
      version: "1.21.1"
  interval: 10m0s
  install:
    remediation:
      retries: 3
  values:
    fullnameOverride: external-dns-public

    serviceAccount:
      create: false
      name: external-dns-public

    rbac:
      create: false

    provider:
      name: aws

    domainFilters:
      - ${public_domain_name}

    txtOwnerId: gcp-0-public

    policy: sync
    logFormat: json
    logLevel: info

    sources:
      - gateway-httproute
      # `service` is what publishes ZITADEL's public hostname, and it is needed
      # here for the same reason aws-0 needs it (infrastructure/base/external-dns
      # lists it too).
      #
      # ZITADEL is not reachable through any of the gateway sources:
      #   - it is fronted by a TLSRoute (TLS passthrough), not an HTTPRoute, so
      #     gateway-httproute never sees it;
      #   - its Gateway lives in `security`, and --gateway-namespace pins the
      #     gateway sources to `infrastructure`;
      #   - its Gateway carries no `external-dns: enabled` label, which
      #     --gateway-label-filter requires.
      #
      # Three independent reasons, none of which announce themselves: the
      # Gateway comes up healthy with a public IP and simply never gets a DNS
      # record. What does work is the annotation Cilium copies from the
      # Gateway's infrastructure.annotations onto the LoadBalancer Service --
      # which only the `service` source reads.
      - service

    extraArgs:
      - --gateway-namespace=infrastructure
      - --gateway-label-filter=external-dns=enabled
      - --min-event-sync-interval=30s
      - --aws-zone-type=public
      # REQUIRED, not optional -- domainFilters (${public_domain_name} ==
      # gcp.cloud.ogenki.io) is a CHILD of the actual hosted zone
      # (cloud.ogenki.io; gcp-0 has its own name to avoid colliding with
      # aws-0's production certificate, see ADR-0019). external-dns's Route53
      # provider by default matches a zone that is equal to, or a CHILD of, a
      # filter entry -- ours is the other way round, a filter that is a child
      # of the zone, so the zone matches nothing and is silently dropped.
      # --aws-zone-match-parent is what adds the parent case. Silently means
      # silently: the pod stays healthy, the Certificate still
      # issues via cert-manager's own DNS-01 path, and no A/CNAME record is
      # ever created. The only trace is a debug-level "no hosted zone
      # matching" log line, which never prints at this chart's logLevel: info.
      # This flag does not widen blast radius onto aws-0: filterRecordsForPlan
      # still drops anything not matching gcp.cloud.ogenki.io, and the TXT
      # registry's owner filter (txtOwnerId: gcp-0-public) is a second,
      # independent barrier. Do not remove this as "redundant".
      - --aws-zone-match-parent

    env:
      - name: AWS_REGION
        value: ${route53_region}
      - name: AWS_ROLE_ARN
        value: ${route53_role_arn}
      - name: AWS_WEB_IDENTITY_TOKEN_FILE
        value: /var/run/secrets/aws/token

    extraVolumes:
      - name: aws-token
        projected:
          sources:
            - serviceAccountToken:
                path: token
                expirationSeconds: 3600
                audience: sts.amazonaws.com

    extraVolumeMounts:
      - name: aws-token
        mountPath: /var/run/secrets/aws
        readOnly: true

    resources:
      limits:
        memory: 150Mi
      requests:
        cpu: 100m
        memory: 150Mi
