# The CNPG backup bucket on gcp-0 — the GCS counterpart of
# infrastructure/aws-0/cloudnative-pg/s3-bucket.yaml.
#
# Postgres backups outlive any individual cluster (point-in-time recovery may
# need to span a rebuild), so Crossplane must never attempt to remove this.
# `forceDestroy: false` already refuses to delete a non-empty bucket, so what
# the missing `Delete` in managementPolicies actually prevents is the finalizer
# wedge: Crossplane retries the delete on prune, GCP denies it, and the MR
# finalizer hangs the namespace teardown. To remove intentionally, use gcloud.
# (Crossplane v2 namespaced MRs do not expose spec.deletionPolicy;
# managementPolicies is the v2 mechanism.)
#
# Named `${project_id}-` rather than aws-0's `${region}-`: GCS bucket names are
# globally unique across all of GCP, so the region is not enough to avoid a
# collision with someone else's bucket. Same convention as the other three
# buckets on this cluster (harbor, openbao-snapshot, llm weights).
# THE BUCKET OUTLIVES THE CLUSTER. That used to have a consequence on rebuild,
# and since #1963 it no longer does. gcp-0 is destroyed and recreated routinely;
# this bucket is not, by the managementPolicies above. The recreated CNPG
# clusters took the SAME names, so they archived into the SAME prefixes — and
# barman refuses to start archiving into a non-empty one (its
# expected-empty-archive check). A rebuild onto a bucket left as-is wedged the
# new cluster, with the failure surfacing as a Kustomization health check rather
# than as anything naming the archive, so every teardown had to empty the live
# prefixes by hand with a `gcloud storage rm`/`mv`.
#
# Each cluster generation now archives into its OWN prefix, keyed by the XR uid
# (`xplane-<name>-cnpg-cluster-<uid[0:8]>/`), so a new generation's destination
# is empty because it never existed. Nothing is cleared by hand on teardown, and
# the orphaned generation prefixes left behind are reclaimed by the
# `lifecycleRule` below rather than by an operator remembering to.
#
# Freezing a recovery seed is likewise a script now, not a `gcloud storage mv`:
#
#   ./scripts/cnpg-promote-seed.sh --cluster xplane-zitadel --namespace security \
#     --cloud gcp --bucket ${project_id}-ogenki-cnpg-backups --apply
#
# It discovers the uid-suffixed live prefix from the Cluster, forces the
# backup's final WAL segment out before copying, and verifies the seed holds a
# restorable base backup rather than counting objects. Then point the claim's
# objectStoreRecovery.path at the dated prefix it prints. A seed is named
# `zitadel-*` / `harbor-*` and never `xplane-*`, which is what keeps the
# lifecycle rule below structurally incapable of deleting one.
#
apiVersion: storage.gcp.m.upbound.io/v1beta1
kind: Bucket
metadata:
  name: cnpg-backups
  namespace: infrastructure
  annotations:
    crossplane.io/external-name: ${project_id}-ogenki-cnpg-backups
spec:
  managementPolicies: ["Observe", "Create", "Update", "LateInitialize"]
  forProvider:
    location: ${region}
    uniformBucketLevelAccess: true
    forceDestroy: false
    # Since #1963 each cluster generation writes to its own `xplane-*` prefix
    # and nothing reclaims them, so expire those automatically. `condition`
    # and `action` are single objects here, not lists -- confirmed against
    # storage.gcp.m.upbound.io/v1beta1 Bucket via the flux-schema MCP, not
    # assumed from the AWS shape. Scoped to the `xplane-` prefix specifically
    # so this rule is structurally incapable of touching a dated seed -- seeds
    # are named `zitadel-*` / `harbor-*` and never carry that prefix.
    lifecycleRule:
      - action:
          type: Delete
        condition:
          age: 30
          matchesPrefix:
            - "xplane-"
