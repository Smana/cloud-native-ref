apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: infrastructure

# The CloudNativePG operator. Nothing in the base is cloud-specific — the chart
# sets `crds.create: false` and the CRDs come from crds/base, which this cluster
# already applies.
#
# Referenced as a DIRECTORY, like aws-0. The base also carries three
# GrafanaDashboard objects, and both preconditions for them hold here:
# clusters/gcp-0/observability/observability-grafana-operator.yaml runs the
# operator, and the `GrafanaDashboard` CRD comes from
# crds/base/kustomization-grafana-operator.yaml — which this Kustomization
# transitively waits for via infrastructure → crossplane-configuration →
# crossplane-providers → crossplane-controller → crds.
#
# Why the operator is needed at all: Harbor claims a SQLInstance, and the
# Composition renders a CNPG Cluster. Without an operator watching that Kind the
# Cluster is created and never reconciled — Harbor waits on a database nothing
# is building, with no error naming the missing operator.
resources:
  - ../../base/cloudnative-pg
  # The backup bucket. Cloud-specific by definition, which is why
  # infrastructure/base/cloudnative-pg carries neither cloud's.
  - gcs-bucket.yaml
