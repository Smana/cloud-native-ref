apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# gcp-0 has no rate-limit patch (that's aws-0-only); this overlay exists so
# render-bundle.py keeps a render root here once the base stops being one
# (see infrastructure/aws-0/envoy-gateway/kustomization.yaml).
resources:
  - ../../base/envoy-gateway
