---
# Additive allows on two existing workloads, PoC proxies only: Cilium policies
# only add, so the agent-router allows on these pods are untouched.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: agw-poc-mcp-ingress
  namespace: agent-system
spec:
  endpointSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - mcp-victoriametrics
          - mcp-victorialogs
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: agw-poc
            gateway.networking.k8s.io/gateway-name: agent-router-agw
      toPorts:
        - ports:
            - port: "8081"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: agw-poc-traces-ingress
  namespace: observability
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: agent-traces-collector
      app.kubernetes.io/instance: agent-traces
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: agw-poc
            gateway.networking.k8s.io/gateway-name: agent-router-agw
      toPorts:
        - ports:
            - port: "4317"
              protocol: TCP
