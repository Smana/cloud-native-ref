# Default deny in every PoC namespace, then one allow set per workload.
# Clients reach the Gateway's ClusterIP, translated at the socket, so the
# port-scoped rules below hold; a port-scoped rule could never reach an L7-LB
# VIP of our own (GCP hairpin), which is why the proxy Service is ClusterIP.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-deny
  namespace: agw-poc
spec:
  endpointSelector: {}
  ingress:
    - {}
  egress:
    - {}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-deny
  namespace: agw-poc-clients
spec:
  endpointSelector: {}
  ingress:
    - {}
  egress:
    - {}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-deny
  namespace: agentgateway-system
spec:
  endpointSelector: {}
  ingress:
    - {}
  egress:
    - {}
---
# The PoC data plane, selected by Gateway name in the Gateway's own namespace.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: agent-router-agw-data-plane
  namespace: agw-poc
spec:
  endpointSelector:
    matchLabels:
      gateway.networking.k8s.io/gateway-name: agent-router-agw
  ingress:
    # The test clients, and the wrong-namespace caller that P1 expects a 403 for.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: agw-poc-clients
        - matchLabels:
            io.kubernetes.pod.namespace: agw-poc
            app.kubernetes.io/name: agw-rogue
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
            - port: "8081"
              protocol: TCP
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "15021"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    # xDS from the controller (its own CNP admits only this Gateway's pods).
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: agentgateway-system
            app.kubernetes.io/name: agentgateway
      toPorts:
        - ports:
            - port: "9978"
              protocol: TCP
    # Only the provider: the JWKS is fetched by the controller, not here.
    - toFQDNs:
        - matchName: api.z.ai
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: agent-system
            app.kubernetes.io/name: mcp-victoriametrics
        - matchLabels:
            io.kubernetes.pod.namespace: agent-system
            app.kubernetes.io/name: mcp-victorialogs
      toPorts:
        - ports:
            - port: "8081"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: agw-echo
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: agw-ratelimit
      toPorts:
        - ports:
            - port: "8081"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: observability
            app.kubernetes.io/name: agent-traces-collector
      toPorts:
        - ports:
            - port: "4317"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: agw-echo
  namespace: agw-poc
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: agw-echo
  ingress:
    - fromEndpoints:
        - matchLabels:
            gateway.networking.k8s.io/gateway-name: agent-router-agw
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
