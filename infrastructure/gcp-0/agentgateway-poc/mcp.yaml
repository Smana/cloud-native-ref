# Two of agent-mcp's servers plus the PoC probe, federated on /mcp of `public`.
# The listener's jwtAuthentication covers this route too: no second issuer and
# audience list to keep equal by hand (agent-router review M7).
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: agent-mcp
  namespace: agw-poc
spec:
  mcp:
    targets:
      - name: victoriametrics
        static:
          host: mcp-victoriametrics.agent-system.svc.cluster.local
          port: 8081
          path: /mcp
          protocol: StreamableHTTP
      - name: victorialogs
        static:
          host: mcp-victorialogs.agent-system.svc.cluster.local
          port: 8081
          path: /mcp
          protocol: StreamableHTTP
      # The probe stands in for room-broker's injected key (x-room-mcp-key): a
      # header that is not Authorization, from a Secret, on this target only.
      - name: echo
        static:
          host: agw-echo.agw-poc.svc.cluster.local
          port: 8080
          path: /mcp
          protocol: StreamableHTTP
          policies:
            auth:
              credentials:
                - location:
                    header:
                      name: x-echo-mcp-key
                  secretRef:
                    name: agw-echo-mcp-key
                    key: key
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: agent-mcp
  namespace: agw-poc
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: agent-router-agw
      sectionName: public
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /mcp
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: agent-mcp
---
# Per-role allowlist on the token's audience, deny by default: once any allow rule
# exists, an item no rule matches is filtered from lists and refused on get/call.
# Each expression is one alternative (the rules are OR-ed). Unlike Agent Router
# 1.1.0, prompts and resources are authorized too.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: agent-mcp-authz
  namespace: agw-poc
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: agent-mcp
  backend:
    mcp:
      authorization:
        action: Allow
        policy:
          matchExpressions:
            - '"agw-poc.implementer.public" in jwt.aud && mcp.tool.target == "echo" && mcp.tool.name == "echo_headers"'
            - '"agw-poc.implementer.public" in jwt.aud && mcp.tool.target == "victoriametrics" && mcp.tool.name == "documentation"'
            - '"agw-poc.implementer.public" in jwt.aud && mcp.tool.target == "victorialogs" && mcp.tool.name == "documentation"'
            - '"agw-poc.implementer.public" in jwt.aud && mcp.prompt.name == "p_public"'
            - '"agw-poc.implementer.public" in jwt.aud && mcp.resource.name == "res://public"'
            - '"agw-poc.reviewer.public" in jwt.aud && mcp.tool.target == "victoriametrics" && mcp.tool.name == "documentation"'
---
# A throwaway key generated in-cluster: never in git, never on argv.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: agw-echo-mcp-key
  namespace: agw-poc
spec:
  length: 32
  symbols: 0
  noUpper: false
  allowRepeat: true
  secretKeys:
    - key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agw-echo-mcp-key
  namespace: agw-poc
spec:
  refreshPolicy: CreatedOnce
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: agw-echo-mcp-key
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    name: agw-echo-mcp-key
