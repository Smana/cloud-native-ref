# Gap G1: agentgateway speaks the Envoy RLS v3 protocol and bundles no server.
# This is envoyproxy/ratelimit, the image Envoy Gateway runs, with a static
# config carrying `shadow_mode` per descriptor.
#
# Its store is a throwaway Valkey here, not the ai-gateway KVStore: that one's
# password lives in envoy-gateway-system, and the PoC reads no secret but the
# agents' Z.ai key. Only the rate-limit pod can reach it (network-policies.yaml).
apiVersion: v1
kind: ConfigMap
metadata:
  name: agw-ratelimit-config
  namespace: agw-poc
data:
  config.yaml: |
    domain: agw-poc
    descriptors:
      # B1: per run identity, tokens per day. Deliberately tiny, so one
      # completion crosses it and shadow mode is what keeps it from a 429.
      - key: agent
        rate_limit:
          unit: day
          requests_per_unit: 100
        shadow_mode: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agw-ratelimit
  namespace: agw-poc
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agw-ratelimit
  namespace: agw-poc
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agw-ratelimit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agw-ratelimit
    spec:
      serviceAccountName: agw-ratelimit
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ratelimit
          image: docker.io/envoyproxy/ratelimit:0482748e@sha256:5fdd8e3ae335ab6d64316f8d2fd9a886830075cbbb40a1d8065c869275909162
          command: ["/bin/ratelimit"]
          env:
            - name: RUNTIME_ROOT
              value: /data
            - name: RUNTIME_SUBDIRECTORY
              value: ratelimit
            - name: RUNTIME_WATCH_ROOT
              value: "false"
            - name: RUNTIME_IGNOREDOTFILES
              value: "true"
            - name: LOG_LEVEL
              value: debug
            - name: LOG_FORMAT
              value: json
            - name: USE_STATSD
              value: "false"
            - name: USE_PROMETHEUS
              value: "true"
            - name: PROMETHEUS_ADDR
              value: ":19001"
            - name: REDIS_SOCKET_TYPE
              value: tcp
            - name: REDIS_URL
              value: agw-ratelimit-valkey.agw-poc.svc.cluster.local:6379
            - name: GRPC_PORT
              value: "8081"
            - name: PORT
              value: "8080"
          ports:
            - name: grpc
              containerPort: 8081
              protocol: TCP
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: metrics
              containerPort: 19001
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: http
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: config
              mountPath: /data/ratelimit/config
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: agw-ratelimit-config
---
apiVersion: v1
kind: Service
metadata:
  name: agw-ratelimit
  namespace: agw-poc
spec:
  selector:
    app.kubernetes.io/name: agw-ratelimit
  ports:
    - name: grpc
      port: 8081
      targetPort: grpc
      appProtocol: kubernetes.io/h2c
    - name: metrics
      port: 19001
      targetPort: metrics
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agw-ratelimit-valkey
  namespace: agw-poc
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agw-ratelimit-valkey
  namespace: agw-poc
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agw-ratelimit-valkey
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agw-ratelimit-valkey
    spec:
      serviceAccountName: agw-ratelimit-valkey
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: valkey
          image: docker.io/valkey/valkey:8.1-alpine@sha256:081c2f5cb575efc901aa80ff9cdbd1ec6a301682fd35e1ebb4b0990a4a4a8507
          # Ephemeral counters only: no persistence. No password, so protected
          # mode would refuse every non-loopback client; the CNP is the guard.
          command: ["valkey-server", "--save", "", "--appendonly", "no", "--protected-mode", "no", "--dir", "/data"]
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: redis
          livenessProbe:
            tcpSocket:
              port: redis
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: agw-ratelimit-valkey
  namespace: agw-poc
spec:
  selector:
    app.kubernetes.io/name: agw-ratelimit-valkey
  ports:
    - name: redis
      port: 6379
      targetPort: redis
