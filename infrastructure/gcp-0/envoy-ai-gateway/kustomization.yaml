apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# A render root of its own, so CI renders this base with gcp-0's fixture values
# (GCP parity GP-14). The Flux child for gcp-0 points here.
resources:
  - ../../base/envoy-ai-gateway
  - password-generators.yaml
patches:
  - path: api-keys-patch.yaml
    target:
      group: external-secrets.io
      kind: ExternalSecret
      name: ai-gateway-api-keys
