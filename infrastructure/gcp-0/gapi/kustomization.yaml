apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: infrastructure

# The PRIVATE Tailscale gateways. Every manifest in infrastructure/base/gapi is
# cloud-neutral, so this references the directory whole — the AWS-only public
# Gateway lives in infrastructure/aws-0/gapi/ rather than in the base.
#
# This cluster DOES build a public path, from its own manifests in
# infrastructure/gcp-0/gapi-public/ — see ADR-0019. DNS-01 against the public
# zone works there because AWS IAM federation lets GKE workloads assume a
# Route53 role with no static credentials.
#
# platform-private-gateway-certificate.yaml needs no GCP variant: it asks the
# `openbao` ClusterIssuer for *.${private_domain_name}, a key both clusters
# define.
#
# Using loadBalancerClass: tailscale rather than a GCP forwarding rule means the
# private gateways incur no cloud load-balancer charges.
resources:
  - ../../base/gapi
