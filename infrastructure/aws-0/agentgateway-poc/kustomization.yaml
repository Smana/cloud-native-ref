apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The PoC Gateway `agent-router-agw` and what it routes to. Into agent-system and
# nothing else it writes only additive objects: a Z.ai ExternalSecret and two
# backends of its own, a ReferenceGrant, and an ingress CNP on two MCP servers.
resources:
  - gateway.yaml
  - policies-identity.yaml
  - policy-telemetry.yaml
  - llm.yaml
  - mcp.yaml
  - echo.yaml
  - network-policies.yaml
  - clients.yaml

configMapGenerator:
  - name: agw-echo
    namespace: agw-poc
    files:
      - echo-server.py
