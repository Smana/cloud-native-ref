# The PoC twin of agent-router (infrastructure/base/agent-router/gateway.yaml):
# same listeners minus `sts`, class agentgateway.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: agent-router-agw
  namespace: agw-poc
spec:
  gatewayClassName: agentgateway
  listeners:
    - name: public
      protocol: HTTP
      port: 8080
      allowedRoutes:
        namespaces:
          from: Same
    - name: internal
      protocol: HTTP
      port: 8081
      allowedRoutes:
        namespaces:
          from: Same
  infrastructure:
    parametersRef:
      group: agentgateway.dev
      kind: AgentgatewayParameters
      name: agent-router-agw
---
# Gap G3: the generated proxy has no seccomp profile, no liveness probe, no
# limits and a LoadBalancer Service. These fields are strategic-merge overlays.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayParameters
metadata:
  name: agent-router-agw
  namespace: agw-poc
spec:
  image:
    registry: cr.agentgateway.dev
    repository: agentgateway
    tag: v1.6.0
    digest: sha256:9d3e6044ddcdc0878b1787f77bd401252b95e22684203fb5e874c4c42d2ed90c
  logging:
    format: json
  # N1, re-run on kind with 1.6.0: the default (10s/60s) cut a 200s stream 46s
  # after the pods were deleted; min 10 / max 660 held it. The maximum is what counts.
  shutdown:
    min: 10
    max: 660
  # 1.6 buffers up to 32 MiB per LLM request with no aggregate cap (#3184).
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 1Gi
  deployment:
    spec:
      # Two replicas: the live check deletes one mid-stream.
      replicas: 2
      template:
        spec:
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: ScheduleAnyway
              labelSelector:
                matchLabels:
                  gateway.networking.k8s.io/gateway-name: agent-router-agw
          containers:
            - name: agentgateway
              securityContext:
                seccompProfile:
                  type: RuntimeDefault
              livenessProbe:
                httpGet:
                  path: /healthz/ready
                  port: 15021
                periodSeconds: 10
                failureThreshold: 6
  service:
    spec:
      type: ClusterIP
  podDisruptionBudget:
    spec:
      minAvailable: 1
