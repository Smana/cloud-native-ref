# The PoC probe (echo-server.py): /echo on both listeners shows what a backend
# receives after the identity policies; /mcp is a target of agent-mcp.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agw-echo
  namespace: agw-poc
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agw-echo
  namespace: agw-poc
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agw-echo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agw-echo
    spec:
      serviceAccountName: agw-echo
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: echo
          image: docker.io/library/python:3.13-alpine@sha256:79e7a9b9ff1cbceff819f856fb374477792a5967759d94df266de7b7b4120e6f
          command: ["python3", "-u", "/app/echo-server.py", "8080"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: app
              mountPath: /app
              readOnly: true
      volumes:
        - name: app
          configMap:
            name: agw-echo
---
apiVersion: v1
kind: Service
metadata:
  name: agw-echo
  namespace: agw-poc
spec:
  selector:
    app.kubernetes.io/name: agw-echo
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: echo
  namespace: agw-poc
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: agent-router-agw
      sectionName: public
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: agent-router-agw
      sectionName: internal
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /echo
      backendRefs:
        - name: agw-echo
          port: 8080
