# Identities for the throwaway test pods that scripts/ops/k8s/agentgateway-poc-live-check.sh
# creates, with projected tokens for the agw-poc.* audiences.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: implementer
  namespace: agw-poc-clients
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: reviewer
  namespace: agw-poc-clients
automountServiceAccountToken: false
---
# Right audience, wrong namespace: the `sub` prefix check must refuse it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rogue
  namespace: agw-poc
automountServiceAccountToken: false
