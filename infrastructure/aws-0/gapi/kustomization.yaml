apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: infrastructure

# The cloud-neutral Gateway API manifests, plus the one that is AWS-only.
#
# platform-public-gateway.yaml lives HERE, not in ../../base/gapi, because it
# carries service.beta.kubernetes.io/aws-load-balancer-* annotations that mean
# nothing on GKE. Keeping it out of the base is what lets both clusters
# reference that directory whole — so a new cloud-neutral manifest added there
# reaches both, instead of only whichever overlay does not cherry-pick.
#
# gcp-0 builds its public path from its own manifests in
# infrastructure/gcp-0/gapi-public/ (ADR-0019).
resources:
  - ../../base/gapi
  - platform-public-gateway.yaml
