# Read by both ends: the KVStore composition sets it as Valkey's `default`
# password, and the rate-limit Deployment presents it as REDIS_AUTH.
#
# Generated in-cluster rather than stored in OpenBao, so a bootstrap needs no
# seeding step. A per-cluster password loses nothing, because the rate-limit
# counters behind it are ephemeral. CreatedOnce: generated on first reconcile
# and never rotated, which would lock the running Valkey out.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: ai-gateway-ratelimit-valkey
  namespace: envoy-gateway-system
spec:
  length: 48
  symbols: 0 # alphanumeric only: it lands in env vars and Valkey's config
  noUpper: false
  allowRepeat: true
  secretKeys:
    - REDIS_PASSWORD
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ai-gateway-ratelimit-valkey
  namespace: envoy-gateway-system
spec:
  refreshPolicy: CreatedOnce
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: ai-gateway-ratelimit-valkey
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    name: ai-gateway-ratelimit-valkey
