apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# agentgateway PoC controller, aws-0 only. Own controller, GatewayClass and
# namespaces: it shares only the Gateway API CRDs with Envoy Gateway and Cilium.
resources:
