apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: platform-tailscale-general
  namespace: infrastructure
  labels:
    external-dns: enabled
spec:
  gatewayClassName: cilium-tailscale
  infrastructure:
    annotations:
      # Per-cluster, because the tailnet is SHARED between aws-0 and gcp-0 and a
      # Tailscale hostname is tailnet-unique. Two clusters claiming
      # "gateway-general-priv" does not error -- Tailscale suffixes the second
      # device, so its MagicDNS name silently stops being the one anything
      # expects.
      #
      # <role>-<visibility>-<cluster> rather than a suffix that is empty on AWS:
      # a scheme where one cloud is the unlabelled default is exactly what
      # ADR-0017 rejects for DNS names, and cluster names were renamed to aws-0 /
      # gcp-0 in #1832 for the same reason.
      tailscale.com/hostname: "gateway-general-priv-${cluster_name}"
      tailscale.com/tags: "tag:k8s"
      tailscale.com/funnel: "false"
  listeners:
    - name: https
      hostname: "*.${private_domain_name}"
      port: 443
      protocol: HTTPS
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                # Every namespace an App claim can target must be listed here, or
                # its HTTPRoute is rejected `NotAllowedByListeners` and the App XR
                # never goes Ready — the workload runs fine, only the route is
                # refused, so it reads as a broken app rather than a gateway ACL.
                # Keep in lockstep with the stacks in apps/stacks.yaml.
                values:
                  - apps
                  - demo
                  - envoy-ai-gateway-system
                  - envoy-gateway-system
                  - observability
                  - tooling
      tls:
        mode: Terminate
        certificateRefs:
          # Reuse existing wildcard certificate from OpenBao
          - name: private-gateway-tls
