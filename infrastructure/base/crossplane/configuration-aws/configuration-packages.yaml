# The platform's XRDs and Compositions, published from Smana/crossplane-configuration.
#
# Only the -aws package is declared. It pulls -core through its `dependsOn`, and
# Crossplane creates that dependency itself under a registry-derived name
# (smana-crossplane-configuration-core, not the name in packages/core/crossplane.yaml).
# Declaring -core here as well would leave two Configuration objects for one package.
#
# Functions are NOT left to `dependsOn` either: ../functions/functions.yaml keeps
# them cluster-owned and version-pinned, which is why it survives the cutover.
apiVersion: pkg.crossplane.io/v1
kind: Configuration
metadata:
  name: crossplane-configuration-aws
spec:
  # CC-S4's pre-release (crossplane-configuration#35, stacked on CC-S3 #34, CC-S2 #33, CC-S1 #32 and CC-O1 #31): the room-bridge v0.0.1-pr9.74bf067d sidecar, the AgentRun room rules, H-S3's
  # harness v0.2.0 (the PR provenance footer), SQLInstance generated credentials and the room-bridge sidecar,
  # with the XRD CRDs the evidence gate (B2) uses. Phase 7 re-pins to a release tag.
  package: ghcr.io/smana/crossplane-configuration-aws:v0.7.2-pr35.465e19f
