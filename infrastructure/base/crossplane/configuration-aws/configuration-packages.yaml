# The platform's XRDs and Compositions, published from Smana/crossplane-configuration.
#
# Only the -aws package is declared. It pulls -core through its `dependsOn`, and
# Crossplane creates that dependency itself under a registry-derived name
# (smana-crossplane-configuration-core, not the name in packages/core/crossplane.yaml).
# Declaring -core here as well would leave two Configuration objects for one package.
#
# Functions are NOT left to `dependsOn` either: ../functions/functions.yaml keeps
# them cluster-owned and version-pinned, which is why it survives the cutover.
apiVersion: pkg.crossplane.io/v1
kind: Configuration
metadata:
  name: crossplane-configuration-aws
spec:
  # crossplane-configuration#35 at 43e6e38 (chore/room-bridge-v0.4.0): #36's disruption read (the run's pod
  # for Disrupted/PodLost/PodFailed, no preStop) with the room-bridge v0.0.1-pr22.4a4abafc and agent-harness
  # 3aea4800 builds, SQLInstance generated credentials, the room-bridge sidecar with BRANCH, the Running latch and
  # the AgentRun room rules, with the XRD CRDs the evidence gate (B2) uses. It depends on -core at this exact tag:
  # Crossplane does not upgrade an installed dependency, so a live core is patched to it. Phase 7 re-pins to a release tag.
  package: ghcr.io/smana/crossplane-configuration-aws:v0.7.2-pr35.0069ea6
