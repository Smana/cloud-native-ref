apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: crossplane-system

# The XRDs and Compositions are no longer here — they ship in the Configuration
# package declared in configuration-packages.yaml, built from
# github.com/Smana/crossplane-configuration.
#
# What stays is what the *cluster* owns rather than the API contract:
#   - functions.yaml            version-pinned here rather than resolved by the
#                               packages' `dependsOn`, so a package bump cannot
#                               silently move a function version
#   - environmentconfig.yaml    per-cluster values the Compositions read
#   - cluster-providerconfig    provider credentials wiring
resources:
  - cluster-providerconfig-aws.yaml
  - configuration-packages.yaml
  - environmentconfig.yaml
  - functions.yaml
