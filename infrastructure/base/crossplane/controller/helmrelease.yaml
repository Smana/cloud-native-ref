apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: crossplane
spec:
  releaseName: crossplane
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: crossplane
      sourceRef:
        kind: HelmRepository
        name: crossplane
        namespace: crossplane-system
      version: "2.4.2"
  interval: 2m0s
  install:
    remediation:
      retries: 3
  values:
    provider:
      defaultActivations: {}

    replicas: 1

    resourcesCrossplane:
      limits:
        cpu: 500m
        # Holds a cluster-wide pod informer (AgentRun's runPod): the disruption plan's Task 13 measures it.
        memory: 512Mi

    metrics:
      enabled: true
