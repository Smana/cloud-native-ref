apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: crossplane
spec:
  releaseName: crossplane
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: crossplane
      sourceRef:
        kind: HelmRepository
        name: crossplane
        namespace: crossplane-system
      version: "2.4.2"
  interval: 2m0s
  install:
    remediation:
      retries: 3
  values:
    provider:
      defaultActivations: {}

    replicas: 1

    # Measured on aws-0 by the disruption plan's Task 13 (2026-10-07). At 512Mi, with GOMEMLIMIT set
    # to the limit, a 278 MiB live heap forced about one GC a second: the CPU sat at its 500m limit
    # (63% of periods throttled), and Crossplane was still OOM-killed 32 times in 24h. GOGC's 2x heap
    # target (~560 MiB) plus ~3.5k goroutine stacks needs 1Gi. The cluster-wide pod informer behind
    # AgentRun's runPod is a small share of that: about 190 pods.
    resourcesCrossplane:
      requests:
        cpu: 250m
        memory: 640Mi
      limits:
        cpu: "1"
        memory: 1Gi

    metrics:
      enabled: true
