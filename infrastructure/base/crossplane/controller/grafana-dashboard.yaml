# Synced=False is Crossplane's ReconcileError condition, so exists - synced is the reconcile-error
# count. No crossplane_* counter records reconcile errors; controller-runtime's does, unprefixed.
# max by (gvk) keeps a provider running more than one replica from double-counting.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: kubernetes-crossplane
  namespace: infrastructure
spec:
  allowCrossNamespaceImport: true
  folderRef: "kubernetes"
  instanceSelector:
    matchLabels:
      dashboards: "grafana"
  json: |
    {
      "__inputs": [],
      "__requires": [],
      "annotations": {
        "list": []
      },
      "editable": true,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "panels": [
        {
          "datasource": {
            "type": "prometheus",
            "uid": "$${datasource}"
          },
          "description": "Managed resources that exist, across every provider.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "fixed",
                "fixedColor": "blue"
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 0,
            "y": 0
          },
          "id": 1,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "reduceOptions": {
              "calcs": ["lastNotNull"],
              "fields": "",
              "values": false
            }
          },
          "targets": [
            {
              "expr": "sum(max by (gvk) (crossplane_managed_resource_exists))",
              "legendFormat": "exists",
              "refId": "A"
            }
          ],
          "title": "Managed resources",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "$${datasource}"
          },
          "description": "Managed resources with Ready=True.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "fixed",
                "fixedColor": "green"
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 6,
            "y": 0
          },
          "id": 2,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "reduceOptions": {
              "calcs": ["lastNotNull"],
              "fields": "",
              "values": false
            }
          },
          "targets": [
            {
              "expr": "sum(max by (gvk) (crossplane_managed_resource_ready))",
              "legendFormat": "ready",
              "refId": "A"
            }
          ],
          "title": "Ready",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "$${datasource}"
          },
          "description": "Managed resources with Synced=True.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "fixed",
                "fixedColor": "green"
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 12,
            "y": 0
          },
          "id": 3,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "reduceOptions": {
              "calcs": ["lastNotNull"],
              "fields": "",
              "values": false
            }
          },
          "targets": [
            {
              "expr": "sum(max by (gvk) (crossplane_managed_resource_synced))",
              "legendFormat": "synced",
              "refId": "A"
            }
          ],
          "title": "Synced",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "$${datasource}"
          },
          "description": "Managed resources whose last reconcile failed (Synced is not True).",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 18,
            "y": 0
          },
          "id": 4,
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "reduceOptions": {
              "calcs": ["lastNotNull"],
              "fields": "",
              "values": false
            }
          },
          "targets": [
            {
              "expr": "sum(max by (gvk) (crossplane_managed_resource_exists) - max by (gvk) (crossplane_managed_resource_synced))",
              "legendFormat": "reconcile errors",
              "refId": "A"
            }
          ],
          "title": "Reconcile errors",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "$${datasource}"
          },
          "description": "Managed resources that exist, are Ready, and are Synced.",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "fillOpacity": 10,
                "lineWidth": 2,
                "showPoints": "never"
              },
              "min": 0,
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 4
          },
          "id": 5,
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "none"
            }
          },
          "targets": [
            {
              "expr": "sum(max by (gvk) (crossplane_managed_resource_exists))",
              "legendFormat": "exists",
              "refId": "A"
            },
            {
              "expr": "sum(max by (gvk) (crossplane_managed_resource_ready))",
              "legendFormat": "ready",
              "refId": "B"
            },
            {
              "expr": "sum(max by (gvk) (crossplane_managed_resource_synced))",
              "legendFormat": "synced",
              "refId": "C"
            }
          ],
          "title": "Ready and synced over time",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "$${datasource}"
          },
          "description": "Managed resources whose last reconcile failed, by kind.",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "fillOpacity": 10,
                "lineWidth": 2,
                "showPoints": "never"
              },
              "min": 0,
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 4
          },
          "id": 6,
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "expr": "max by (gvk) (crossplane_managed_resource_exists) - max by (gvk) (crossplane_managed_resource_synced)",
              "legendFormat": "{{gvk}}",
              "refId": "A"
            }
          ],
          "title": "Reconcile errors by kind",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "$${datasource}"
          },
          "description": "Count of managed resources per kind, and how many are Ready and Synced.",
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 10,
            "w": 24,
            "x": 0,
            "y": 12
          },
          "id": 7,
          "options": {
            "showHeader": true,
            "sortBy": [
              {
                "displayName": "gvk",
                "desc": false
              }
            ]
          },
          "targets": [
            {
              "expr": "max by (gvk) (crossplane_managed_resource_exists)",
              "format": "table",
              "instant": true,
              "refId": "A"
            },
            {
              "expr": "max by (gvk) (crossplane_managed_resource_ready)",
              "format": "table",
              "instant": true,
              "refId": "B"
            },
            {
              "expr": "max by (gvk) (crossplane_managed_resource_synced)",
              "format": "table",
              "instant": true,
              "refId": "C"
            }
          ],
          "title": "Managed resources by kind",
          "transformations": [
            {
              "id": "merge",
              "options": {}
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true
                },
                "renameByName": {
                  "Value #A": "exists",
                  "Value #B": "ready",
                  "Value #C": "synced"
                }
              }
            }
          ],
          "type": "table"
        }
      ],
      "refresh": "1m",
      "schemaVersion": 39,
      "tags": ["crossplane", "kubernetes"],
      "templating": {
        "list": [
          {
            "current": {
              "selected": true,
              "text": "default",
              "value": "default"
            },
            "hide": 0,
            "includeAll": false,
            "label": "Data source",
            "multi": false,
            "name": "datasource",
            "options": [],
            "query": "prometheus",
            "refresh": 1,
            "regex": "",
            "skipUrlSync": false,
            "type": "datasource"
          }
        ]
      },
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "timepicker": {},
      "timezone": "",
      "title": "Crossplane managed resources",
      "uid": "kubernetes-crossplane",
      "version": 1
    }
