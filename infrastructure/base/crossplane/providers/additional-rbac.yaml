# AWS-only Crossplane RBAC.
#
# The cloud-neutral aggregate ClusterRoles moved to
# infrastructure/base/crossplane/rbac/, which BOTH providers directories now
# reference. What stays here is the part that genuinely names an AWS API group,
# plus the binding for the provider-aws ServiceAccount — neither of which means
# anything on a GKE cluster.
---
# Thats probably a workaround because it doesn't seem to work without it
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  namespace: crossplane-system
  name: crossplane:aws-upbound-provider
  labels:
    rbac.crossplane.io/aggregate-to-crossplane: "true"
rules:
  # Manage AWS provider configs
  - apiGroups:
      - aws.m.upbound.io
    resources:
      - clusterproviderconfigs
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - aws.m.upbound.io
    resources:
      - providerconfigusages
    verbs:
      - "*"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: crossplane:aws-upbound
subjects:
  - kind: ServiceAccount
    name: provider-aws
    namespace: crossplane-system
roleRef:
  kind: ClusterRole
  name: crossplane:aws-upbound-provider
  apiGroup: rbac.authorization.k8s.io
