---
# The `internal` listener: the same four roles, class `.internal` (4 of EG's
# 8-audience maximum). Its routes (Bedrock EU, self-hosted) are SP4's.
#
# agent-mcp's MCPRoutes carry their own `securityPolicy.oauth.{issuer,audiences}`
# (infrastructure/base/agent-mcp/mcproutes.yaml) which REPLACES this policy on
# `/mcp`, not merges with it (Envoy Gateway does not merge route- and
# listener-scoped SecurityPolicies). Keep the two in sync by hand (review M7).
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: agent-router-internal
  namespace: agent-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: agent-router
      sectionName: internal
  jwt:
    providers:
      - name: eks-agents-internal
        issuer: ${oidc_issuer_url}
        audiences:
          - agent-router.implementer.internal
          - agent-router.reviewer.internal
          - agent-router.tester.internal
          - agent-router.triager.internal
        remoteJWKS:
          uri: ${oidc_jwks_uri}
        claimToHeaders:
          - claim: sub
            header: x-ar-agent
