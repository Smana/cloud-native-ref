apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Phase H removed Envoy's agent-router; the router is agentgateway's
# (infrastructure/base/agent-gateway). This child keeps the agents' Z.ai key, which
# agentgateway's zai backends read: moving the ExternalSecret to another child
# would let this one's prune delete the Secret under every run.
resources:
  - externalsecret-zai.yaml
