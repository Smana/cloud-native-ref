apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flux-operator-mcp
  namespace: agent-system
spec:
  releaseName: flux-operator-mcp
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: flux-operator-mcp
    namespace: agent-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  driftDetection:
    mode: enabled
  values:
    fullnameOverride: flux-operator-mcp
    # Pinned by digest, like VM/VL (review M8): the chart otherwise renders
    # `image.repository:image.tag`, floating on whatever v0.60.0 points to.
    # Re-resolve with `skopeo inspect --raw docker://ghcr.io/controlplaneio-fluxcd/flux-operator-mcp:v0.60.0 | sha256sum`.
    # repository is restated (matches the chart default) so Renovate's
    # helm-values manager tracks the image alongside the chart (review I2).
    image:
      repository: ghcr.io/controlplaneio-fluxcd/flux-operator-mcp
      tag: "v0.60.0@sha256:9940c2c46c1bff5af3827cb76f28a1ff347ea8141ed1af42e66ffbd79e8c4bdb"
    # --read-only removes the mutating tools, not the RBAC (research pitfall 11).
    readonly: true
    # The chart binds cluster-admin by default. agent-mcp-flux-read replaces it.
    rbac:
      create: false
    # Replaced by flux-operator-mcp-network-policy.yaml.
    networkPolicy:
      create: false
    serviceAccount:
      create: true
      automount: true
      name: flux-operator-mcp
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi
    podSecurityContext:
      runAsNonRoot: true
      fsGroup: 1337
      seccompProfile:
        type: RuntimeDefault
