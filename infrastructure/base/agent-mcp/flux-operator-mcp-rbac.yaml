---
# What an agent may read through the Flux MCP server (SP1 §6): Flux objects,
# platform claims, workloads, events and pod logs. Never `secrets` (T12), never a
# write verb. ConfigMaps and pod logs only in `flux-system` (the Role below):
# either can carry whatever a process printed.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agent-mcp-flux-read
rules:
  # Flux's own CRDs: a fixed, documented set of Kinds per group, enumerated
  # instead of `resources: ["*"]` (review M1) so a future Flux release adding
  # a Kind to one of these groups needs a diff here before an agent can read it.
  - apiGroups: [source.toolkit.fluxcd.io]
    resources: [gitrepositories, ocirepositories, helmrepositories, helmcharts, buckets, externalartifacts]
    verbs: [get, list, watch]
  - apiGroups: [source.extensions.fluxcd.io]
    resources: [artifactgenerators]
    verbs: [get, list, watch]
  - apiGroups: [kustomize.toolkit.fluxcd.io]
    resources: [kustomizations]
    verbs: [get, list, watch]
  - apiGroups: [helm.toolkit.fluxcd.io]
    resources: [helmreleases]
    verbs: [get, list, watch]
  - apiGroups: [notification.toolkit.fluxcd.io]
    resources: [providers, alerts, receivers]
    verbs: [get, list, watch]
  - apiGroups: [image.toolkit.fluxcd.io]
    resources: [imagerepositories, imagepolicies, imageupdateautomations]
    verbs: [get, list, watch]
  - apiGroups: [fluxcd.controlplane.io]
    resources: [fluxinstances, fluxreports, resourcesets, resourcesetinputproviders]
    verbs: [get, list, watch]
  # This platform's own claims (`get_kubernetes_resources` takes any kind and
  # namespace, like `kubectl get`, so this ClusterRole, not the tool, is the
  # boundary). `agentruns` carries a run's task text and principal annotation
  # -- already reachable before this change, now the only cloud.ogenki.io Kind
  # that is, rather than every future one a Configuration bump adds (review M1).
  - apiGroups: [cloud.ogenki.io]
    resources: [apps, sqlinstances, inferenceservices, kvstores, epis, gcpworkloadidentities, agentruns]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods, services, endpoints, events, namespaces, persistentvolumeclaims]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets, replicasets]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch]
  - apiGroups: [events.k8s.io]
    resources: [events]
    verbs: [get, list, watch]
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [get, list, watch]
  - apiGroups: [metrics.k8s.io]
    resources: [pods, nodes]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agent-mcp-flux-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: agent-mcp-flux-read
subjects:
  - kind: ServiceAccount
    name: flux-operator-mcp
    namespace: agent-system
---
# ConfigMaps and pod logs, in flux-system only (external review M3). Cluster-wide they reached
# `security`, `crossplane-system` and other runs' sandboxes; Flux's controllers are what an
# agent debugs through this server.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agent-mcp-flux-read
  namespace: flux-system
rules:
  - apiGroups: [""]
    resources: [configmaps, pods/log]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agent-mcp-flux-read
  namespace: flux-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agent-mcp-flux-read
subjects:
  - kind: ServiceAccount
    name: flux-operator-mcp
    namespace: agent-system
