# Two MCPRoutes, one per agent-router listener (SP1 §6). Both reuse that
# listener's issuer and audiences for `oauth`, deny by default, and allow each
# role its tools on `aud`, one rule per role and backend (a rule's target holds
# at most 16 tools). toolSelector hides every other tool, including all
# mutating ones. No role gets VictoriaMetrics' operator introspection
# (`tsdb_status`, `active_queries`, `top_queries`), and an implementer gets no
# `get_kubernetes_resources`, which reads any kind in any namespace (external
# review M2, M3). SP2 adds the room-broker backend (:8090) and its room_* rules.
#
# Envoy Gateway 1.9.1 forwards the validated JWT to the MCP proxy, and the
# MCPRoute API has no field to strip it. None is needed: the proxy re-originates
# every backend call with fresh headers, copying only `claimToHeaders`
# (x-ar-agent) and `forwardHeaders`, so no server sees a run's token. Never
# name Authorization in `forwardHeaders`, `securityPolicy.oauth.claimToHeaders`
# or `securityPolicy.apiKeyAuth.forwardClientIDHeader`; gate A6
# (scripts/ci/flux-schema/assert-ai-gateway.py) fails the build if one does.
#
# Agent Router 1.1.0 authorizes tools/call and tools/list only: resources and
# prompts pass through. These three servers expose static docs there, nothing else.
#
# Each MCPRoute's `securityPolicy.oauth.{issuer,audiences}` REPLACES its
# listener's Gateway-level SecurityPolicy on `/mcp` rather than merging with
# it, and must be kept equal by hand to
# infrastructure/base/agent-router/securitypolicy-{public,internal}.yaml
# (review M7): a bump to one without the other is silent everywhere but a
# live `tools/list` call.
---
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: MCPRoute
metadata:
  name: agent-mcp-public
  namespace: agent-system
spec:
  parentRefs:
    - {group: gateway.networking.k8s.io, kind: Gateway, name: agent-router, sectionName: public}
  path: /mcp
  backendRefs:
    - name: flux-operator-mcp
      port: 9090
      path: /mcp
      toolSelector:
        include:
          - search_flux_docs
    - name: mcp-victoriametrics
      port: 8081
      path: /mcp
      toolSelector:
        include:
          - documentation
    - name: mcp-victorialogs
      port: 8081
      path: /mcp
      toolSelector:
        include:
          - documentation
  securityPolicy:
    oauth:
      issuer: ${oidc_issuer_url}
      audiences:
        - agent-router.implementer.public
        - agent-router.reviewer.public
        - agent-router.tester.public
        - agent-router.triager.public
      jwks:
        remoteJWKS:
          uri: ${oidc_jwks_uri}
      claimToHeaders:
        - {claim: sub, header: x-ar-agent}
      protectedResourceMetadata:
        resource: http://agent-router.envoy-gateway-system.svc.cluster.local:8080/mcp
    authorization:
      defaultAction: Deny
      rules:
        - action: Allow
          source:
            jwt:
              claims:
                - name: aud
                  valueType: StringArray
                  values: [agent-router.implementer.public]
          target:
            tools:
              - {backend: flux-operator-mcp, tool: search_flux_docs}
        - action: Allow
          source:
            jwt:
              claims:
                - name: aud
                  valueType: StringArray
                  values: [agent-router.implementer.public]
          target:
            tools:
              - {backend: mcp-victoriametrics, tool: documentation}
        - action: Allow
          source:
            jwt:
              claims:
                - name: aud
                  valueType: StringArray
                  values: [agent-router.implementer.public]
          target:
            tools:
              - {backend: mcp-victorialogs, tool: documentation}
        - action: Allow
          source:
            jwt:
              claims:
                - name: aud
                  valueType: StringArray
                  values: [agent-router.reviewer.public]
          target:
            tools:
              - {backend: flux-operator-mcp, tool: search_flux_docs}
        - action: Allow
          source:
            jwt:
              claims:
                - name: aud
                  valueType: StringArray
                  values: [agent-router.reviewer.public]
          target:
            tools:
              - {backend: mcp-victoriametrics, tool: documentation}
        - action: Allow
          source:
            jwt:
              claims:
                - name: aud
                  valueType: StringArray
                  values: [agent-router.reviewer.public]
          target:
            tools:
              - {backend: mcp-victorialogs, tool: documentation}
        - action: Allow
          source:
            jwt:
              claims:
                - name: aud
                  valueType: StringArray
                  values: [agent-router.tester.public]
          target:
            tools:
              - {backend: flux-operator-mcp, tool: search_flux_docs}
        - action: Allow
          source:
            jwt:
              claims:
                - name: aud
                  valueType: StringArray
                  values: [agent-router.tester.public]
          target:
            tools:
              - {backend: mcp-victoriametrics, tool: documentation}
        - action: Allow
          source:
            jwt:
              claims:
                - name: aud
                  valueType: StringArray
                  values: [agent-router.tester.public]
          target:
            tools:
              - {backend: mcp-victorialogs, tool: documentation}
        - action: Allow
          source:
            jwt:
              claims:
                - name: aud
                  valueType: StringArray
                  values: [agent-router.triager.public]
          target:
            tools:
              - {backend: flux-operator-mcp, tool: search_flux_docs}
        - action: Allow
          source:
            jwt:
              claims:
                - name: aud
                  valueType: StringArray
                  values: [agent-router.triager.public]
          target:
            tools:
              - {backend: mcp-victoriametrics, tool: documentation}
        - action: Allow
          source:
            jwt:
              claims:
                - name: aud
                  valueType: StringArray
                  values: [agent-router.triager.public]
          target:
            tools:
              - {backend: mcp-victorialogs, tool: documentation}
