---
# No Kubernetes identity at all: it reads vmsingle over HTTP (SP1 §6).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp-victoriametrics
  namespace: agent-system
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-victoriametrics
  namespace: agent-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-victoriametrics
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcp-victoriametrics
    spec:
      serviceAccountName: mcp-victoriametrics
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp
          # A bump that adds a resource/prompt/template here ships unauthorized:
          # `resources/*` and `prompts/*` bypass MCPRoute authorization entirely
          # (review M5). Check the release notes before bumping.
          image: ghcr.io/victoriametrics/mcp-victoriametrics:v1.20.2@sha256:bcbf84f945d6efb03fb8b2d2ccc3294420dccdc0b445752dce96f02619416dfe
          env:
            - name: VM_INSTANCE_ENTRYPOINT
              value: http://vmsingle-victoria-metrics-k8s-stack.observability.svc:8428
            - name: VM_INSTANCE_TYPE
              value: single
            - name: MCP_SERVER_MODE
              value: http
            - name: MCP_LISTEN_ADDR
              value: ":8081"
            # 0 turns off mcp-go's server→client ping on the GET stream (F29). agent-router's MCP
            # proxy rejects server-initiated requests (envoyproxy/ai-gateway#2715), and the failed
            # ping kills the harness's MCP session 30 s in, so every later tool call fails. Remove
            # once the proxy relays ping.
            - name: MCP_HEARTBEAT_INTERVAL
              value: "0"
          ports:
            - name: mcp
              containerPort: 8081
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: mcp
          # It listens only after loading its docs index; liveness killed it first on aws-0 (2026-09-27).
          startupProbe:
            tcpSocket:
              port: mcp
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: mcp
            periodSeconds: 20
          resources:
            # The `documentation` tool (the public listener's) keeps a bleve index of the
            # whole embedded VictoriaMetrics docs site in memory: ~700MiB resident, measured
            # on v1.20.2 (2026-09-27). 128Mi and 512Mi were both OOMKilled at startup.
            requests:
              cpu: 10m
              memory: 768Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-victoriametrics
  namespace: agent-system
spec:
  selector:
    app.kubernetes.io/name: mcp-victoriametrics
  ports:
    - name: mcp
      port: 8081
      targetPort: mcp
---
# Same pinning as flux-operator-mcp: the agent-router data plane by name AND
# namespace, never a same-named Gateway elsewhere.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: mcp-victoriametrics
  namespace: agent-system
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: mcp-victoriametrics
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: envoy-gateway-system
            gateway.envoyproxy.io/owning-gateway-name: agent-router
            gateway.envoyproxy.io/owning-gateway-namespace: agent-system
      toPorts:
        - ports:
            - port: "8081"
              protocol: TCP
    # Kubelet probes need this: there's no separate health port or shell for
    # an exec probe. Residual: any hostNetwork pod on the same node (a node
    # daemon, cilium-envoy) can also reach this unauthenticated server
    # (review M2).
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "8081"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: observability
            app.kubernetes.io/name: vmsingle
      toPorts:
        - ports:
            - port: "8428"
              protocol: TCP
