apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Kueue (SP3 FR-4): the controller, scraped and default-denied, with its config shipped
# through the values ConfigMap so Renovate touches only the OCIRepository tag.
resources:
  - helmrelease.yaml
  - helm-values-configmap.yaml
  - network-policy.yaml
  - rbac-metrics.yaml
  - vmservicescrape.yaml
