apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: karpenter
spec:
  releaseName: karpenter
  driftDetection:
    mode: enabled
  chartRef:
    kind: OCIRepository
    name: karpenter
    namespace: kube-system
  interval: 3m0s
  install:
    createNamespace: true
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    # Flux defaults upgrade.crds to Skip, so a chart bump would upgrade the
    # controller while leaving the CRDs at the previously installed version
    # (e.g. no `Balanced` consolidationPolicy enum from 1.14). Karpenter ships
    # its CRDs in the main chart, so replace them on every upgrade.
    crds: CreateReplace
  values:
    settings:
      clusterName: ${cluster_name}
      clusterEndpoint: ${cluster_endpoint_full}
      interruptionQueue: ${karpenter_queue_name}
    tolerations:
      - key: "node.cilium.io/agent-not-ready"
        operator: "Exists"
        effect: "NoExecute"
    controller:
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi
