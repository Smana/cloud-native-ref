# Daily purge of rooms closed longer ago than their retention (SP2 §4, OD-17).
# DELETE-only: it connects as rooms_retention, whose row-level security exposes
# nothing else.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: room-broker-retention
  namespace: agent-system
spec:
  schedule: "17 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 900
      template:
        metadata:
          labels:
            app.kubernetes.io/name: room-broker-retention
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: retention
              # The same pin as app.yaml's.
              image: ghcr.io/smana/room-broker:v0.0.1-pr14.f04ca421@sha256:a1d1e8023f8757eb04fffdbb3feafdc92d4ef467436f3feb8efc062ac9f9d4a1
              args: ["retention"]
              env:
                - name: ROOMS_DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: xplane-rooms-cnpg-role-rooms-retention
                      key: uri
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 200m
                  memory: 64Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
