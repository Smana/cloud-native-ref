# The broker's read-only ZITADEL credential (machine-user PAT + GitHub IdP id), used
# to learn a human's GitHub login from their IdP link. zitadel-idp.sh writes it to
# the managed store and, with --mirror-openbao, to OpenBao's agents mount
# (bao-map.sh: room-broker-zitadel-reader -> agents/zitadel-reader).
# The whole blob lands in one key: the broker parses it as JSON and re-reads the
# file at use, so a PAT rotation reaches it without a restart.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: room-broker-zitadel-reader
  namespace: agent-system
spec:
  refreshInterval: 20m
  secretStoreRef:
    kind: SecretStore
    name: agents-secrets
  data:
    - secretKey: reader.json # pragma: allowlist secret
      remoteRef:
        key: zitadel-reader
  target:
    name: room-broker-zitadel-reader
    creationPolicy: Owner
    deletionPolicy: Retain
