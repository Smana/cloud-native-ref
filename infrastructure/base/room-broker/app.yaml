# The room broker, through the golden path (S11). Named room-broker, not
# xplane-room-broker: SP1's run CNPs and data-plane CNP select
# app.kubernetes.io/name=room-broker (ruling P10). The App's own CNP is off
# because its egress schema has no rules.dns; network-policy.yaml is the policy.
apiVersion: cloud.ogenki.io/v1alpha1
kind: App
metadata:
  name: room-broker
  namespace: agent-system
spec:
  image:
    repository: ghcr.io/smana/room-broker
    # agent-platform v0.6.1, by digest. Move it with the retention CronJob's,
    # crd-rooms.yaml and atlasSchema.ref together.
    tag: "v0.6.1@sha256:66b641009e5e771fdb00bc466309f987bfec25addc484edcfd5c0e6f54662292"
  # One replica in phase 1; phase 2 moves to two with a PDB.
  replicas: 1
  service:
    port: 8443
    extraPorts:
      - name: metrics
        port: 9090
  automountServiceAccountToken: true # the Room and AgentRun watches, the leader lease
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  healthProbes:
    liveness:
      type: http
      path: /healthz
      port: 9090
    readiness:
      type: http
      path: /readyz
      port: 9090
    startup:
      type: http
      path: /startupz
      port: 9090
      periodSeconds: 5
      failureThreshold: 120 # first deploy waits for CNPG and the Atlas migration
  # POD_NAMESPACE, which the broker also requires, is set by the App composition.
  env:
    - name: ROOMS_CONFIG
      value: /etc/room-broker/config/config.yaml
    - name: ROOMS_DATABASE_URL
      valueFrom:
        secretKeyRef:
          name: xplane-rooms-cnpg-role-rooms-broker
          key: uri
  # The config sits beside the TLS pair, not above it: a mount nested in a
  # read-only ConfigMap mount cannot create its mount point.
  extraVolumes:
    - name: config
      configMap:
        name: room-broker-config
    - name: tls
      secret:
        secretName: room-broker-tls  # pragma: allowlist secret
  extraVolumeMounts:
    - name: config
      mountPath: /etc/room-broker/config
      readOnly: true
    - name: tls
      mountPath: /etc/room-broker/tls
      readOnly: true
  networkPolicies:
    enabled: false
