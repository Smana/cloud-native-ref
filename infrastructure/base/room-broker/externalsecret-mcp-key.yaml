---
# The credential agent-router injects towards the room MCP port (ruling P13).
# Generated in-cluster; read by the MCPRoute (key apiKey, Agent Router's contract)
# and by the broker, which reads it once at start: a new value 401s every room_*
# call until the broker restarts. So the value never changes on its own:
# - Orphan + prune disabled: deleting the ExternalSecret (a rename, a move to
#   another child) keeps the Secret instead of garbage-collecting it.
# - immutable: CreatedOnce is tracked on the ExternalSecret's status, so a
#   recreated one re-syncs and a Password generator mints a new value; ESO skips
#   the data of an immutable Secret that already exists.
# Rotating: delete the Secret, then the ExternalSecret (under Orphan a deleted
# Secret is never recreated by a synced ExternalSecret; Flux re-applying it
# generates the new value), then `kubectl rollout restart deploy/room-broker`.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: room-broker-mcp-key
  namespace: agent-system
spec:
  length: 48
  symbols: 0
  noUpper: false
  allowRepeat: true
  secretKeys:
    - apiKey
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: room-broker-mcp-key
  namespace: agent-system
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  refreshPolicy: CreatedOnce
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: room-broker-mcp-key
  target:
    name: room-broker-mcp-key
    creationPolicy: Orphan
    deletionPolicy: Retain
    immutable: true
