---
# rooms-proxy's OIDC client, mirrored to OpenBao's agents mount by the hosting
# cluster's zitadel-oidc-clients.sh (rulings P12, AU, SU), read through
# agent-system's own store (C1).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rooms-proxy
  namespace: agent-system
spec:
  refreshInterval: 20m
  secretStoreRef:
    kind: SecretStore
    name: agents-secrets
  dataFrom:
    - extract:
        key: rooms-proxy
  target:
    name: rooms-proxy
    creationPolicy: Owner
    deletionPolicy: Retain
---
# The broker needs the client id and the project id (a human token's aud must
# hold both), never the secret. Mounted as files and read at use (ruling AS-a):
# gcp-0 mints both anew on every build.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: room-broker-oidc
  namespace: agent-system
spec:
  refreshInterval: 20m
  secretStoreRef:
    kind: SecretStore
    name: agents-secrets
  data:
    - secretKey: client-id # pragma: allowlist secret
      remoteRef:
        key: rooms-proxy
        property: client-id
    - secretKey: project-id # pragma: allowlist secret
      remoteRef:
        key: rooms-proxy
        property: project-id
  target:
    name: room-broker-oidc
    creationPolicy: Owner
    deletionPolicy: Retain
