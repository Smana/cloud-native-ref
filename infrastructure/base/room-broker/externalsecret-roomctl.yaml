---
# roomctl's client id (SP2 phase 6), mirrored to OpenBao's agents mount by the
# hosting cluster's zitadel-oidc-clients.sh like rooms-proxy's. An id, not a
# credential: roomctl is a native app with no secret. The broker reads it from a
# file at use (ruling AS-a), to tell roomctl's tokens from the web UI's (P18).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: room-broker-roomctl
  namespace: agent-system
spec:
  refreshInterval: 20m
  secretStoreRef:
    kind: SecretStore
    name: agents-secrets
  data:
    - secretKey: client-id # pragma: allowlist secret
      remoteRef:
        key: roomctl
        property: client-id
  target:
    name: room-broker-roomctl
    creationPolicy: Owner
    deletionPolicy: Retain
---
# oauth2-proxy lets roomctl's own JWTs through as bearer tokens: issuer=audience.
# A Secret, not a value: gcp-0 mints a new client id every build.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rooms-proxy-extra-issuers
  namespace: agent-system
spec:
  refreshInterval: 20m
  secretStoreRef:
    kind: SecretStore
    name: agents-secrets
  data:
    - secretKey: clientid # pragma: allowlist secret
      remoteRef:
        key: roomctl
        property: client-id
  target:
    name: rooms-proxy-extra-issuers
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        EXTRA_JWT_ISSUERS: "${identity_provider_url}={{ .clientid }}"
