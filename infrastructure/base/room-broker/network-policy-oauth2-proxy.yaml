---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: rooms-oauth2-proxy
  namespace: agent-system
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: oauth2-proxy
      app.kubernetes.io/instance: rooms-oauth2-proxy
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "4180"
              protocol: TCP
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "4180"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    # ZITADEL. On aws-0 it is served by this cluster's public Gateway through an NLB
    # hostname, so a port-scoped FQDN rule matches. gcp-0 reaches it on its own
    # Gateway VIP, where any toPorts fails: its overlay replaces this rule (ruling AU).
    - toFQDNs:
        - matchName: "auth.${public_domain_name}"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: agent-system
            app.kubernetes.io/name: room-broker
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
