apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: infrastructure

# The cnpg-backups bucket is NOT here: it is a cloud-specific managed resource
# and lives in each per-cloud overlay — s3-bucket.yaml under
# infrastructure/aws-0/cloudnative-pg/, gcs-bucket.yaml under
# infrastructure/gcp-0/cloudnative-pg/. Everything else, dashboards included, is
# neutral, so both overlays reference this directory whole.

resources:
  - grafana-dashboard.yaml
  - grafana-dashboard-query-performance.yaml
  - grafana-dashboard-query-plan-correlation.yaml
  - helmrelease.yaml
