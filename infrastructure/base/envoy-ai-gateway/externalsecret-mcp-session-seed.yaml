# Fixes phase-5 review I1: the chart's `controller.mcp.sessionEncryption.seed`
# defaults to the published "default-insecure-seed", which encrypts every
# client-facing MCP session ID. Generated in-cluster instead of seeded by
# hand, same pattern as ai-gateway-ratelimit-valkey.
#
# Residual: the chart only accepts the seed as a controller CLI argument
# (`--mcpSessionEncryptionSeed=`), which the controller then copies literally
# into the extproc sidecar args of every AI-gateway data-plane pod. So this
# value is visible to anything that can read those pods' specs (e.g. the
# agent-mcp `flux-operator-mcp` server's `get pods` grant) — it is not a
# secret from `internal`-class runs. SP2's room broker must authorize every
# call on `x-ar-agent` regardless of session-ID possession (review I1).
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: ai-gateway-mcp-session-seed
  namespace: envoy-ai-gateway-system
spec:
  length: 48
  symbols: 0 # alphanumeric only: it lands in a container arg list
  noUpper: false
  allowRepeat: true
  secretKeys:
    - seed
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ai-gateway-mcp-session-seed
  namespace: envoy-ai-gateway-system
spec:
  # Rotate via the chart's `fallback.seed`, never by regenerating this one:
  # a new seed invalidates every session ID encrypted with the old one.
  refreshPolicy: CreatedOnce
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: ai-gateway-mcp-session-seed
  target:
    name: ai-gateway-mcp-session-seed
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      metadata:
        # helm-controller reacts when the Secret appears, not on the next
        # 10m HelmRelease interval.
        labels:
          reconcile.fluxcd.io/watch: Enabled
