apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-ai-gateway
  namespace: envoy-ai-gateway-system
spec:
  releaseName: envoy-ai-gateway
  driftDetection:
    mode: enabled
  chartRef:
    kind: OCIRepository
    name: envoy-ai-gateway
    namespace: envoy-ai-gateway-system
  interval: 10m0s
  install:
    remediation:
      retries: 3
  # The MCP session-seed Secret is watched: ESO's second write to it right after
  # creation triggers a reconcile that cancels an in-flight upgrade ("context
  # canceled"). With no upgrade retries that failure stalls the release for good.
  upgrade:
    remediation:
      retries: 3
  # CRDs from the sibling HelmRelease must reconcile first.
  dependsOn:
    - name: envoy-ai-gateway-crds
      namespace: envoy-ai-gateway-system
  values:
    # -------------------------------------------------------------------------
    # GenAI request traces (SPEC-006 FR-006, US-3): DISABLED.
    #
    # The extproc emits OpenInference GenAI spans when OTLP export env vars are
    # set on the sidecar via `extProc.extraEnvVars`. For agent-router traffic
    # those spans carry full prompts and completions, and they join the run's
    # trace. They may reach storage only through agent-traces-collector with an
    # allowlist pipeline, or not at all (ADR-0051): never export them straight
    # to VictoriaTraces. Metrics stay Prometheus-scraped (vmscrape.yaml), so any
    # such export also sets `OTEL_METRICS_EXPORTER=none`.
    # -------------------------------------------------------------------------
    controller:
      # Per-principal token counters: the run meter (SP3) and the budget alerts
      # read these labels. Per-run labels cost ~30 series per run (design R11).
      metricsRequestHeaderAttributes: "x-ar-agent:ar_agent,x-ar-human:ar_human,x-ai-gateway-client-id:ar_client"
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 512Mi
      securityContext:
        runAsNonRoot: true
        # Image's USER directive is the alphanumeric `nonroot` (distroless),
        # not a numeric UID, so kubelet can't verify non-root without an
        # explicit runAsUser. 65532 is the conventional distroless nonroot UID.
        runAsUser: 65532
        runAsGroup: 65532
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        seccompProfile:
          type: RuntimeDefault
  # Without this, the chart falls back to the
  # published "default-insecure-seed" for every MCP session ID.
  valuesFrom:
    - kind: Secret
      name: ai-gateway-mcp-session-seed
      valuesKey: seed
      targetPath: controller.mcp.sessionEncryption.seed
