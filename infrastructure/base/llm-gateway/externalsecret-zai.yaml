# The PLATFORM Z.ai key, for human and system traffic. The agents' key is a
# separate one (platform/agents/zai, SP1's agents-secrets store), so revoking
# either never breaks the other, and provider-side spend splits by key
# (design S12).
#
# Read from RunLore's existing secret rather than a copy, so a bootstrap needs no
# seeding step: OpenBao restores that path from the snapshot lineage on every
# rebuild. SP4 PR 6, which puts RunLore behind this gateway, moves the key to
# platform/llm/zai and removes it from RunLore in the same change.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zai-api-key
  namespace: llm-gateway
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-platform
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    name: zai-api-key
    template:
      type: Opaque
      data:
        # Agent Router's APIKey BackendSecurityPolicy reads this key name.
        apiKey: "{{ .api_key }}"
  data:
    - secretKey: api_key  # pragma: allowlist secret
      remoteRef:
        key: runlore/credentials
        property: GLM_API_KEY  # pragma: allowlist secret
