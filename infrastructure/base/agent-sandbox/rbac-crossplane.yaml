---
# The AgentRun composition writes Sandboxes; Crossplane's SA is granted only what
# its providers manage (infrastructure/AGENTS.md, trap 3). ServiceAccounts,
# ConfigMaps and CNPs are already covered by Crossplane's own role and
# infrastructure/base/crossplane/rbac/aggregate-rbac.yaml.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agent-sandbox:aggregate-to-crossplane
  labels:
    rbac.crossplane.io/aggregate-to-crossplane: "true"
rules:
  # The lifecycle the AgentRun composition drives, and nothing else (review N8): no
  # deletecollection, no escalate or bind through a future verb.
  - apiGroups: ["agents.x-k8s.io"]
    resources: ["sandboxes"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["agents.x-k8s.io"]
    resources: ["sandboxes/status"]
    verbs: ["get"]
  # Two readers of a run's pod. The composition reads it as a required resource to tell why a run
  # ended (disruption design §3); Crossplane serves that from a cluster-wide informer, so get alone
  # loops on an informer that never syncs (trap 3). The CNP's Usage reads it with a plain GET until
  # the pod is gone, so agent-run's revoke still reaches api.github.com. Read only, and no wider
  # than the secrets Crossplane's own role already lists and watches cluster-wide.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
