---
# The AgentRun composition writes Sandboxes; Crossplane's SA is granted only what
# its providers manage (infrastructure/AGENTS.md, trap 3). ServiceAccounts,
# ConfigMaps and CNPs are already covered by Crossplane's own role and
# infrastructure/base/crossplane/rbac/aggregate-rbac.yaml.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agent-sandbox:aggregate-to-crossplane
  labels:
    rbac.crossplane.io/aggregate-to-crossplane: "true"
rules:
  - apiGroups: ["agents.x-k8s.io"]
    resources: ["sandboxes", "sandboxes/status"]
    verbs: ["*"]
---
# A run's Usage holds its CNP until the run's pod is gone, so the GitHub token
# revoke in preStop and SIGTERM still reaches api.github.com. Crossplane reads that
# pod with a plain GET (no cache, no watch). Without this grant the Usage can never
# release, and every run deletion hangs.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: crossplane-get-run-pods
  namespace: agents
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: crossplane-get-run-pods
  namespace: agents
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: crossplane-get-run-pods
subjects:
  - kind: ServiceAccount
    name: crossplane
    namespace: crossplane-system
