apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: agent-sandbox
  namespace: agent-system
spec:
  releaseName: agent-sandbox
  interval: 30m
  chart:
    spec:
      chart: helm
      sourceRef:
        kind: GitRepository
        name: agent-sandbox
        namespace: agent-system
      interval: 12h
      # The chart version never moves (0.1.0); only the git tag does. Revision
      # repackages on every new tag.
      reconcileStrategy: Revision
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  driftDetection:
    mode: enabled
  values:
    namespace:
      create: false
      name: agent-system
    image:
      # Lockstep with flux/sources/gitrepo-agent-sandbox.yaml `ref.tag`.
      tag: v1.0.3@sha256:8c8f5814c16bd68631af0496a5fa4eb9bedce4d032de88b956130a041d9f438e
    controller:
      # Bare Sandboxes only (S1): no SandboxTemplate, SandboxClaim or warm pool.
      extensions: false
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi
    podSecurityContext:
      runAsNonRoot: true
      # R-P2-1: fixed non-root UID/GID, proven under PSS restricted in the spike.
      runAsUser: 65532
      runAsGroup: 65532
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext:
      runAsNonRoot: true
      # R-P2-1: fixed non-root UID/GID, proven under PSS restricted in the spike.
      runAsUser: 65532
      runAsGroup: 65532
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: ["ALL"]
      seccompProfile:
        type: RuntimeDefault
    metrics:
      serviceMonitor:
        enabled: true
