apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: default
spec:
  template:
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
      startupTaints:
        - key: node.cilium.io/agent-not-ready
          value: "true"
          effect: NoExecute
      requirements:
        - key: "kubernetes.io/arch"
          operator: In
          values: ["amd64"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot"]
        # Instance types t are really too small
        - key: "karpenter.k8s.aws/instance-category"
          operator: NotIn
          values: ["t"]
        # Do not select big instance types in order to avoid blast radius
        - key: karpenter.k8s.aws/instance-cpu
          operator: Lt
          values: ["26"]
        # ...but not tiny ones either. Measured 2026-09-01 (#1940): with no
        # floor the fleet settles as many 2-vCPU nodes, and every node pays
        # its own copy of the DaemonSet overhead (Cilium, CSI, exporters)
        # plus scheduling fragmentation — ~22 vCPU consumed for a workload
        # GCP packs into 12 on three 4-vCPU machines. A 4-vCPU floor keeps
        # the 4–25 band: fewer, larger nodes, same spot diversity.
        - key: karpenter.k8s.aws/instance-cpu
          operator: Gt
          values: ["3"]
        - key: karpenter.k8s.aws/instance-memory
          operator: Lt
          values: ["50001"]
        # Nitro only — REQUIRED for Cilium ENI prefix delegation, which is a
        # Nitro-only feature. On a Xen instance Cilium falls back to secondary IPs and
        # the node is hard-capped at (usable ENIs x IPs-per-ENI). Since the scheduler
        # does not read Cilium IPAM, it keeps placing pods on a node that cannot
        # network them and they sit in ContainerCreating on "no IPs currently
        # available on the node".
        #
        # Added here as well as on the io pool: nothing in the requirements above
        # excludes a Xen family, so this pool could select one at any time.
        - key: karpenter.k8s.aws/instance-hypervisor
          operator: In
          values: ["nitro"]
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 15m
  limits:
    cpu: "60"
    memory: 192Gi
