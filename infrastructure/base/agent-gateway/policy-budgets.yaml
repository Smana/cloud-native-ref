# B1-B2 (ADR-0050's limits, ADR-0053's mechanism), in SHADOW: counted on
# agent-ratelimit, never enforced (ratelimit.yaml). Gateway-wide, so one bucket
# per principal across every listener and route: entries name the verified sub
# (B1) or a constant (B2), never a route, and read no claim the listener
# policies do not require (#3523: a descriptor whose CEL fails is dropped,
# unlimited; gate AG8). Only LLM calls carry tokens: MCP and sts count nothing.
#
# Cost = the request's price in reference tokens (design D11, OD-6), charged at
# completion after a zero-cost check. Until phase J's price overlay, glm-5.3 is
# unpriced and falls back to total tokens. A stream cut before its last usage
# update is undercounted (#3739; ADR-0053's residual).
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: token-budgets
  namespace: agent-gateway
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: agent-router
  traffic:
    rateLimit:
      global:
        backendRef:
          name: agent-ratelimit
          port: 8081
        domain: agent-router
        # A store or server outage admits the call (1.6 waits up to 10s first).
        failureMode: FailOpen
        descriptors:
          - entries:
              - name: agent
                expression: jwt.sub
            unit: Tokens
            cost: 'has(llm.cost) ? uint(llm.cost.total / 0.0000017) : uint(llm.totalTokens)'
          - entries:
              - name: fleet
                expression: '"agents"'
            unit: Tokens
            cost: 'has(llm.cost) ? uint(llm.cost.total / 0.0000017) : uint(llm.totalTokens)'
      # OD-8's backstop, per proxy replica and verified sub, in raw tokens. Not a
      # budget, and sized so that no run the meter allows can reach it: the
      # frontier tier's $6.80 run cap buys at most 26M tokens, all cache reads
      # at $0.26/M, over its 90 minutes. Only a runaway the meter failed to
      # revoke gets its 429.
      local:
        - tokens: 30000000
          unit: Hours
          key: jwt.sub
