---
# The identity-proxy bootstrap shared by every AgentRun sandbox (design §3, S5).
# Envoy is the ONLY container that mounts the gateway and octo-sts tokens. The
# harness sees three localhost ports:
#   127.0.0.1:4000  /v1, /anthropic, /mcp  -> agent-router `public`   :8080
#   127.0.0.1:4002  /v1, /anthropic, /mcp  -> agent-router `internal` :8081
#   127.0.0.1:4001  /sts/exchange          -> agent-router `sts`      :8082 -> octo-sts
#                   (the listener pins this cluster's issuer; octo-sts matches a pattern)
# A run's audience names its data class, so the other class's port earns a 403,
# and the run's CNP does not open it anyway.
# Admin is a unix socket (not a TCP port) and 0.0.0.0:9902 is a dedicated health
# listener (review CC-1): the harness shares this pod's network namespace and
# could otherwise reach an exposed admin API (e.g. POST /logging?level=debug)
# to leak injected tokens.
#
# Rotation (Q2, failed under gVisor): kubelet rotates a projected token by
# swapping the volume's ..data symlink on the HOST, and gVisor raises no inotify
# for host-side changes, so `watched_directory` never fires inside the sandbox.
# The composition therefore gives each token the run's deadline as its TTL (R2);
# the watch stays for runtimes where inotify does work.
apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-identity-proxy
  namespace: agents
data:
  sds-gateway.yaml: |  # pragma: allowlist secret -- SDS metadata (a token filename path), not a credential value
    resources:
      - "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.Secret
        name: gateway-token
        generic_secret:
          secret:
            filename: /var/run/secrets/agents/gateway/token
  sds-sts.yaml: |  # pragma: allowlist secret -- SDS metadata (a token filename path), not a credential value
    resources:
      - "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.Secret
        name: sts-token
        generic_secret:
          secret:
            filename: /var/run/secrets/agents/sts/token
  envoy.yaml: |
    # Required by file-based SDS (GenericSecretSdsApi): without it Envoy exits
    # at startup. No xDS server reads it, so one static identity serves every run.
    node: {id: agent-identity-proxy, cluster: agent-identity-proxy}
    admin:
      address:
        # Pathname unix socket in the proxy-tmp emptyDir (the harness container
        # does not mount it): never 0.0.0.0 and never an abstract (`@...`)
        # socket, which is netns-scoped and so still reachable from the harness.
        pipe: {path: /tmp/envoy-admin.sock, mode: 0600}
    static_resources:
      listeners:
        - name: public
          address:
            socket_address: {address: 127.0.0.1, port_value: 4000}
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: public
                    # The routes below allowlist by path prefix; without normalization a
                    # traversal (/v1/../x) or an escaped slash (%2F) could reach an
                    # unlisted upstream path instead of matching (and being blocked by)
                    # the catch-all 404 route.
                    normalize_path: true
                    merge_slashes: true
                    path_with_escaped_slashes_action: REJECT_REQUEST
                    # Above agent-models' timeouts.request (600s): a non-streamed completion is silent until done.
                    stream_idle_timeout: 900s
                    route_config:
                      virtual_hosts:
                        - name: agent-router
                          domains: ["*"]
                          routes:
                            - {match: {prefix: /v1/}, route: {cluster: agent_router_public, timeout: 0s}}
                            - {match: {prefix: /anthropic/}, route: {cluster: agent_router_public, timeout: 0s}}
                            - {match: {prefix: /mcp}, route: {cluster: agent_router_public, timeout: 0s}}
                            - {match: {prefix: /}, direct_response: {status: 404}}
                    http_filters:
                      - name: envoy.filters.http.credential_injector
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.credential_injector.v3.CredentialInjector
                          overwrite: true
                          credential:
                            name: envoy.http.injected_credentials.generic
                            typed_config:
                              "@type": type.googleapis.com/envoy.extensions.http.injected_credentials.generic.v3.Generic
                              credential:
                                name: gateway-token
                                sds_config:
                                  path_config_source:
                                    path: /etc/envoy/sds-gateway.yaml
                                    watched_directory: {path: /var/run/secrets/agents/gateway}
                              header: Authorization
                              header_value_prefix: "Bearer "
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
        - name: internal
          address:
            socket_address: {address: 127.0.0.1, port_value: 4002}
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: internal
                    # Same path-confusion guard as the public listener above.
                    normalize_path: true
                    merge_slashes: true
                    path_with_escaped_slashes_action: REJECT_REQUEST
                    # Above agent-models' timeouts.request (600s), as on the public listener.
                    stream_idle_timeout: 900s
                    route_config:
                      virtual_hosts:
                        - name: agent-router
                          domains: ["*"]
                          routes:
                            - {match: {prefix: /v1/}, route: {cluster: agent_router_internal, timeout: 0s}}
                            - {match: {prefix: /anthropic/}, route: {cluster: agent_router_internal, timeout: 0s}}
                            - {match: {prefix: /mcp}, route: {cluster: agent_router_internal, timeout: 0s}}
                            - {match: {prefix: /}, direct_response: {status: 404}}
                    http_filters:
                      - name: envoy.filters.http.credential_injector
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.credential_injector.v3.CredentialInjector
                          overwrite: true
                          credential:
                            name: envoy.http.injected_credentials.generic
                            typed_config:
                              "@type": type.googleapis.com/envoy.extensions.http.injected_credentials.generic.v3.Generic
                              credential:
                                name: gateway-token
                                sds_config:
                                  path_config_source:
                                    path: /etc/envoy/sds-gateway.yaml
                                    watched_directory: {path: /var/run/secrets/agents/gateway}
                              header: Authorization
                              header_value_prefix: "Bearer "
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
        - name: sts
          address:
            socket_address: {address: 127.0.0.1, port_value: 4001}
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: sts
                    # Same path-confusion guard as the public listener above.
                    normalize_path: true
                    merge_slashes: true
                    path_with_escaped_slashes_action: REJECT_REQUEST
                    route_config:
                      virtual_hosts:
                        - name: octo-sts
                          domains: ["*"]
                          routes:
                            - {match: {prefix: /sts/exchange}, route: {cluster: agent_router_sts, timeout: 30s}}
                            - {match: {prefix: /}, direct_response: {status: 404}}
                    http_filters:
                      - name: envoy.filters.http.credential_injector
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.credential_injector.v3.CredentialInjector
                          overwrite: true
                          credential:
                            name: envoy.http.injected_credentials.generic
                            typed_config:
                              "@type": type.googleapis.com/envoy.extensions.http.injected_credentials.generic.v3.Generic
                              credential:
                                name: sts-token
                                sds_config:
                                  path_config_source:
                                    path: /etc/envoy/sds-sts.yaml
                                    watched_directory: {path: /var/run/secrets/agents/sts}
                              header: Authorization
                              header_value_prefix: "Bearer "
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
        - name: health
          address:
            # Host-reachable on purpose: the CC-1 composition probes
            # httpGet /ready :9902 for both readiness and liveness, and opens
            # host ingress on this port only.
            socket_address: {address: 0.0.0.0, port_value: 9902}
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: health
                    route_config:
                      virtual_hosts:
                        - name: health
                          domains: ["*"]
                          routes:
                            - {match: {prefix: /}, direct_response: {status: 404}}
                    http_filters:
                      - name: envoy.filters.http.health_check
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.health_check.v3.HealthCheck
                          # Non-pass-through: answer /ready with 200 directly, never proxy the probe upstream.
                          pass_through_mode: false
                          headers:
                            - name: ":path"
                              string_match: {exact: /ready}
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
      clusters:
        - name: agent_router_public
          type: STRICT_DNS
          connect_timeout: 5s
          dns_lookup_family: V4_ONLY
          load_assignment:
            cluster_name: agent_router_public
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address: {address: agent-router.envoy-gateway-system.svc.cluster.local, port_value: 8080}
        - name: agent_router_internal
          type: STRICT_DNS
          connect_timeout: 5s
          dns_lookup_family: V4_ONLY
          load_assignment:
            cluster_name: agent_router_internal
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address: {address: agent-router.envoy-gateway-system.svc.cluster.local, port_value: 8081}
        - name: agent_router_sts
          type: STRICT_DNS
          connect_timeout: 5s
          dns_lookup_family: V4_ONLY
          load_assignment:
            cluster_name: agent_router_sts
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address: {address: agent-router.envoy-gateway-system.svc.cluster.local, port_value: 8082}
