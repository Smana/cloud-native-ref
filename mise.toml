# mise configuration - polyglot tool version manager
# https://mise.jdx.dev/
#
# Migrated from .tool-versions (asdf)

min_version = "2024.11.1"

[tools]
go = "1.27.0"
"aqua:golangci/golangci-lint" = "2.13.2"
nodejs = "24.20.0"
opentofu = "1.12.6"
pre-commit = "4.6.2"
trivy = "0.74.0"

# Needed by the `terraform_tflint` pre-commit hook. Pinned here rather than
# left to whatever is on PATH so CI and a local `pre-commit run -a` lint with
# the same binary. The *plugin* version is separate — `.tflint.hcl` pins
# ruleset.aws, which tflint downloads from GitHub releases on `--init`.
tflint = "0.64.0"
"ubi:terramate-io/terramate" = "0.17.2"

# Manifest validation (SPEC-007). flux 2.9+ is required for `flux plugin`;
# install the schema plugin with: flux plugin install schema
flux2 = "2.9.5"
helm = "4.2.4"

# Documentation site (website/). "hugo-extended" is deliberate: mise's plain
# `hugo` entry resolves to the non-extended build, and Hextra targets extended.
hugo-extended = "0.165.0"
kustomize = "5.8.1"

# Google Cloud SDK — required by the GCP stacks (opentofu/gcp/**) for cluster
# credentials and for the gcloud-based evidence commands in the GCP runbook.
# The GKE auth plugin is a separate component and kubectl cannot talk to a GKE
# cluster without it: install once with
#   gcloud components install gke-gcloud-auth-plugin
"asdf:mise-plugins/mise-gcloud" = "581.0.0"
