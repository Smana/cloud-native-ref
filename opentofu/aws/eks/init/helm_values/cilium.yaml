# k8sServiceHost/Port: Auto-detected by Cilium in EKS with ENI mode
# Can be set explicitly via helm --set if needed
bandwidthManager:
  enabled: true
bpf:
  preallocateMaps: true
# Explicitly specify devices to prevent Cilium from using tailscale0 MTU
# See: https://tailscale.com/kb/1236/kubernetes-operator#cilium
devices: "eth+ pod-id-link+"
egressMasqueradeInterfaces: eth0
eni:
  enabled: true
  # Use secondary CIDR (100.64.0.0/16) subnets for pod IPs with prefix delegation.
  # This provides higher pod density per node.
  # Requires the cilium-cni-configuration ConfigMap (see cilium-cni-config.tf).
  subnetTagsFilter:
    - "cilium.io/pod-subnet=true"
  # Explicit SG and instance discovery needed because subnetTagsFilter restricts
  # ENI cache to pod subnets (100.64.x.x), hiding primary ENIs (10.0.x.x).
  # Without securityGroupTags, the operator can't determine which SGs to attach.
  # Without instanceTagsFilter, nodes without existing Cilium ENIs are invisible.
  # Tag values are set dynamically via helm set in configure/main.tf.
  securityGroupTags: {}
  instanceTagsFilter: []
  awsEnablePrefixDelegation: true

cni:
  # configMap provides the custom CNI config with ENI settings (first-interface-index,
  # subnet-tags, prefix delegation). Since Cilium v1.14, customConf is NOT needed
  # with configMap — the agent reads the ConfigMap, writes it to the host, enables
  # cni-exclusive mode, and processes ENI settings into CiliumNode CRDs.
  # Using customConf: true is legacy and sets custom-cni-conf flag which can prevent
  # the agent from populating FirstInterfaceIndex in CiliumNode (defaulting to eth0).
  configMap: cilium-cni-configuration
installNoConntrackIptablesRules: true
ipam:
  mode: eni
kubeProxyReplacement: true
loadBalancer:
  enabled: true
  mode: hybrid
socketLB:
  enabled: true
  # IMPORTANT: Must be true for Tailscale pods to work properly
  # When false, Cilium's socket LB intercepts DNS in pod namespaces,
  # breaking pods that modify their own networking (like Tailscale)
  # See: https://github.com/tailscale/tailscale/issues/15478
  hostNamespaceOnly: true
operator:
  resources:
    limits:
      cpu: 100m
      memory: 100Mi
  rollOutPods: true # Reload pods when the configmap is updated
  # Automatically restart pods not managed by Cilium (replaces manual restart script)
  # Default podRestartSelector is "k8s-app=kube-dns" which only restarts CoreDNS
  # Setting to empty restarts ALL unmanaged pods (EBS CSI, etc.)
  # See: https://docs.cilium.io/en/stable/cmdref/cilium-operator/
  extraArgs:
    - --pod-restart-selector=
  unmanagedPodWatcher:
    intervalSeconds: 15
    restart: true
# Can't enable servicemonitor as the CRD is not yet installed
prometheus:
  enabled: true
  serviceMonitor:
    enabled: false
# The agent is OOM-KILLED at 256Mi on a cold start. Measured 2026-09-04 on a
# from-scratch aws-0: both pods exitCode 137, one restart each, and the
# DaemonSet only stabilised ~9 minutes into the rollout -- 40 seconds before
# the recycle job's 10-minute wait expired, which failed the whole bootstrap.
#
# 256Mi is simply too small for what this agent is configured to do. It runs ENI
# IPAM with prefix delegation (a large ipcache, and a per-node CRD it keeps in
# sync), WireGuard encryption, kube-proxy replacement, and the Gateway API L7
# proxy. Startup is the peak: the agent builds its BPF maps and reconciles the
# full endpoint and identity state before it reports ready, so the ceiling has
# to cover the spike, not the steady state.
#
# 512Mi is 2x the value that demonstrably failed, not a number chosen for
# comfort. The measured evidence is only that 256Mi is too small -- how far the
# agent overshot is unknown, because the metrics API was not available on the
# cluster where this was found. So this is the smallest principled step: if the
# agent OOMs again, raise it with a measurement rather than a guess.
#
# This is a LIMIT, not a request, and the agent is a DaemonSet -- so it applies
# on every node but reserves nothing. Requests are deliberately left unset:
# steady-state usage is far below the startup peak, and reserving the peak on
# every node would cost real schedulable capacity to guard a transient.
#
# WHY THIS WENT UNNOTICED FOR SO LONG: the OOM kills were always happening, but
# scripts/eks-recycle-bootstrap-nodes.sh used to read Cilium's ConfigMap BEFORE
# waiting for Cilium, found the key unset, and exited 0. The wait never ran, so
# a slow, crash-looping rollout looked like a healthy one and the damage
# surfaced an hour later as IP exhaustion in an unrelated component. Fixing that
# ordering (#1972) is what made this visible.
resources:
  limits:
    cpu: 300m
    memory: 512Mi
routingMode: native
# Note: tunnelProtocol defaults to vxlan in Helm chart but is ignored in native routing mode.
# ENI mode uses direct routing, no tunnel encapsulation is used regardless of this setting.

# WireGuard encryption fixes cross-node L7 proxy with ENI mode.
# Without this, the BPF ipcache incorrectly sets hastunnel flags for remote
# pods in native routing mode, causing Gateway API envoy to fail on cross-node
# backend connections (cilium/cilium#43493). WireGuard node-to-node tunnels
# bypass the faulty hastunnel routing logic.
encryption:
  enabled: true
  type: wireguard

envoy:
  # Explicitly enable Envoy DaemonSet for Gateway API L7 proxy
  enabled: true
  # xdsMode is deliberately left unset so Cilium >= 1.20 picks its new default,
  # "ads" (Aggregated Discovery Service), instead of the legacy "split" mode.
  # Setting `upgradeCompatibility: "1.19"` anywhere would silently pin us back to
  # "split". ADS delivers Envoy config consistently in one stream — lower CPU and
  # lower policy-update latency on the surface this cluster leans on: the two
  # Tailscale Gateways plus the CiliumEnvoyConfig ext_proc hop to
  # vllm-semantic-router. Verify with:
  #   kubectl -n kube-system get cm cilium-config -o jsonpath='{.data.envoy-xds-mode}'
  resources:
    limits:
      memory: 300Mi
    requests:
      cpu: 200m
      memory: 300Mi

# Enable the CiliumEnvoyConfig (CEC) controller — reconciles `CiliumEnvoyConfig`
# CRs into the Envoy DaemonSet's runtime config (used by the AI-gateway path
# to wire ext_proc filters that call vllm-semantic-router on :50051).
# CEC is restricted to cluster-admin authoring per Cilium docs (no validation,
# no defined conflict resolution between overlapping CECs).
envoyConfig:
  enabled: true

hubble:
  metrics:
    enabled:
      - dns:query;ignoreAAAA
      - drop
      - tcp
      - flow
      - icmp
      - http
    enableOpenMetrics: true
  relay:
    enabled: true
  ui:
    enabled: true

gatewayAPI:
  enabled: true
