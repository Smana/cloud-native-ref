# Trivy configuration for the GKE init OpenTofu stack.
#
# terraform-google-modules/kubernetes-engine ships an examples/ tree full of
# standalone Kubernetes manifests (wordpress-bundle.yaml, CIS benchmark
# fixtures, ...). Once `tofu init` has downloaded the module into .terraform,
# a plain `trivy config .` recurses into those examples and fails on findings
# in vendored, non-owned files -- not the stack's own code. Same problem,
# same fix, as opentofu/aws/eks/init/trivy.yaml.
scan:
  skip-dirs:
    # Downloaded Terraform modules
    - .terraform
