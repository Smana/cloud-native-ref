# Per-stack ignorefile. The Terramate scripts run
#   trivy config --exit-code=1 --ignorefile=./.trivyignore.yaml .
# from the STACK directory, so this file must exist here even when empty --
# without it trivy exits FATAL "ignore file not found" and the deploy fails
# before a single resource is planned.
#
# Findings in this stack are suppressed with inline `#trivy:ignore:` comments
# next to the resource they apply to, which keeps the justification with the
# code. There is exactly ONE such suppression:
#
#   GCP-0066 (no CMEK) on google_storage_bucket.snapshot in main.tf --
#   Google-managed encryption is enough for these objects and there is no
#   key-rotation policy this bucket needs to participate in.
#
# GCP-0078 (no versioning) is NOT suppressed anywhere, and this file used to say
# it was. Versioning is ENABLED on that bucket, with noncurrent versions expiring
# so history cannot accumulate -- see the comment above the resource for why the
# reasoning that would have suppressed it was wrong. Anyone auditing accepted
# risks from this file should read it as: one accepted finding, not two.
#
# Add ids here only for findings that have no single owning resource.
#
# Note trivy.yaml in this directory is a different mechanism and cannot replace
# this file: it configures the scanner (skip-dirs) and can only POINT at an
# ignorefile, not carry ignore rules itself.
misconfigurations: []
