# The server TLS cert, key and CA chain used to be written here. They are now
# fetched from AWS Secrets Manager by startup_script.sh, under an instance-role
# policy scoped to that one secret ARN.
#
# Anything written here lands in the launch template's user_data, which is
# served by IMDS to every process on the instance and readable through
# ec2:DescribeLaunchTemplateVersions. It also lands in the OpenTofu state file
# in plaintext. Do not put secrets in this file.

package_upgrade: true

packages:
  - jq
  - gpg
  - snapd
  - wget
