# Documentation claims that must stay true to configuration.
#
# Four defects found on 2026-08-21/22 were the same shape: a page asserted
# something the manifests contradicted, and every automated gate passed. Links
# resolved, schemas validated, the site built. Nothing checks whether prose is
# *true*, because nothing can — in general. This file makes it checkable for
# the specific claims worth pinning.
#
# Each entry reads a value from the source of truth and requires the pages that
# discuss it to agree. The check is bidirectional on purpose: change `mode` in
# variables.tfvars and this fails until the docs follow; reword the docs away
# from the committed value and it fails too.
#
# Schema
#   id             stable identifier, used in failure output
#   why            why this claim is worth pinning — shown when it fails
#   source.file    the file that decides the answer
#   source.pattern Python regex; group 1 is captured as {value}
#                  omit to assert only that the file exists
#   pages          pages whose prose depends on that value
#   must_contain   pattern each page must match; {value} interpolates the
#                  capture, and is regex-escaped before substitution
#   must_not_contain
#                  patterns no page may match — for phrasings known to be
#                  wrong. Prefer must_contain: asserting the correct claim is
#                  present is stronger than asserting a wrong one is absent,
#                  and does not break when a fix keeps the words and adds a
#                  qualifier.
#
# Adding an entry is cheap. Do it when a page states something a reader would
# act on that lives in exactly one place in the repo.

claims:
  - id: openbao-cluster-mode
    why: >-
      `mode` decides node count AND storage backend — dev is one node on the
      `file` backend, ha is five on Raft. Four pages described the ha shape as
      though it were deployed while variables.tfvars committed dev, so a reader
      assessing availability of the secrets store was actively misled.
    source:
      file: opentofu/aws/openbao/cluster/variables.tfvars
      pattern: '^mode\s*=\s*"([a-z]+)"'
    # Per-page patterns, not a shared one. These pages deliberately document
    # BOTH modes, so `mode = "{value}"` alone matches whichever value is read
    # and passes even when the committed mode changes underneath — verified:
    # flipping variables.tfvars to "ha" did not fail the shared pattern. Each
    # entry anchors the value to that page's own marker of which mode ships.
    pages:
      - path: website/content/docs/platform/foundations/aws.md
        must_contain: '`variables\.tfvars` sets\s+`mode = "{value}"`'
        must_not_contain:
          - '`mode = "(?!{value})[a-z]+"` \(committed\)'
      - path: website/content/docs/platform/security/openbao.md
        must_contain: 'as committed \(`mode = "{value}"`\)'
      - path: website/content/docs/get-started/aws/_index.md
        must_contain: 'As committed,[^`]*`[^`]*variables\.tfvars` sets\s+`mode = "{value}"`'

  - id: karpenter-max-pods
    why: >-
      Pages comparing per-node pod capacity quoted the IP supply prefix
      delegation provides (~240) as though it were the pod ceiling. maxPods is
      what actually binds on a Karpenter node, and the distinction is the point
      of the passage.
    source:
      file: infrastructure/base/karpenter-nodepools/default-ec2nc.yaml
      pattern: 'maxPods:\s*(\d+)'
    pages:
      - website/content/docs/platform/networking/cilium.md
      - website/content/docs/platform/foundations/aws.md
      - website/content/docs/decisions/0009-cilium-over-vpc-cni.md
    must_contain: '{value} pods'

  - id: victorialogs-own-vmalert
    why: >-
      VictoriaLogs runs its own VMAlert, scoped by ruleSelector, because it
      needs its own datasource. The overview page claimed a single shared
      instance evaluated both signals while logs.md said the opposite — the
      site contradicted itself.
    source:
      file: observability/base/victoria-logs/vmalert-vlsingle.yaml
    pages:
      - website/content/docs/platform/observability/_index.md
    must_not_contain:
      - 'a single `?VMAlert'
      - 'one shared `?VMAlert'

  - id: tailscale-gateway-general-hostname
    why: >-
      `gateway-general-priv` carries a `-${cluster_name}` suffix because the
      tailnet is shared between aws-0 and gcp-0 and a Tailscale hostname is
      tailnet-unique — see the comment in
      platform-tailscale-general-gateway.yaml. private-access.md quotes this
      annotation verbatim as the pattern to copy when adding a new Gateway;
      a stale copy without the suffix reintroduces the exact hostname
      collision the suffix exists to prevent.
    source:
      file: infrastructure/base/gapi/platform-tailscale-general-gateway.yaml
      pattern: 'tailscale\.com/hostname:\s*"(gateway-general-priv-\$\{cluster_name\})"'
    pages:
      - website/content/docs/platform/networking/private-access.md
    must_contain: '{value}'

  - id: tailscale-gateway-admin-hostname
    why: >-
      Same claim as tailscale-gateway-general-hostname, for the admin
      Gateway's hostname.
    source:
      file: infrastructure/base/gapi/platform-tailscale-admin-gateway.yaml
      pattern: 'tailscale\.com/hostname:\s*"(gateway-admin-priv-\$\{cluster_name\})"'
    pages:
      - website/content/docs/platform/networking/private-access.md
    must_contain: '{value}'

  - id: kyverno-policies-values
    why: >-
      Only the kyverno-policies release ships `values: {}`; the controller sets
      fullnameOverride and crds.install. Saying "both" made the enforced policy
      set look chosen rather than inherited from chart defaults.
    source:
      file: security/base/kyverno/helmrelease-policies.yaml
      pattern: '^\s*(values: \{\})\s*$'
    pages:
      - website/content/docs/platform/security/policies.md
    must_not_contain:
      - 'Both install with'

  - id: gateway-api-version
    why: >-
      Two files pin the Gateway API release. `globals.gateway_api_version` in
      `opentofu/config.tm.hcl` is what both clouds' `configure` stacks install
      the experimental-channel bundle from (passed by -var, exactly like
      `cilium_version`), and `flux/sources/gitrepo-gateway-api.yaml` re-applies
      that same directory after bootstrap from its own tag. A skew installs one
      CRD set at bootstrap and a different one once Flux reconciles.
      cilium-operator probes for these CRDs once at startup and permanently
      disables its Gateway API controller if one is missing -- no crash, no
      alert -- so the symptom is Gateways stuck `Waiting for controller` with
      nothing naming a version. ADR-0015 recorded the mitigation as "none
      automated"; this claim is that automation. Note the first `page` here is
      a config file, not prose: the check is source-to-source, which the schema
      already supports because a page is just a path and a pattern.
    source:
      file: opentofu/config.tm.hcl
      pattern: '\n\s*gateway_api_version\s*=\s*"(v[0-9]+\.[0-9]+\.[0-9]+)"'
    pages:
      - path: flux/sources/gitrepo-gateway-api.yaml
        must_contain: '\n\s*tag:\s*{value}\s*\n'
      - path: website/content/docs/decisions/0015-gateway-api-over-ingress-nginx.md
        must_contain: 'both currently `{value}`'

  - id: vmsingle-retention
    why: >-
      Retention was `1d` — commented "Minimal retention, for tests only" —
      for the repo's whole life, while the docs discussed metrics look-back
      without quoting a number. It is now a deliberate `14d`, sized to the
      10Gi PVC at this fleet's ingest rate, and that value is a real
      operating constraint a reader needs, not filler.
    source:
      file: observability/base/victoria-metrics-k8s-stack/helmrelease-vmsingle.yaml
      pattern: 'retentionPeriod:\s*"(\d+d)"'
    pages:
      - website/content/docs/platform/observability/_index.md
      - website/content/docs/platform/observability/metrics.md
    must_contain: '{value}'

  - id: vlsingle-retention
    why: >-
      VictoriaLogs retention was unset, so the effective cap was whatever the
      chart's app default happened to be — silent and unreviewed. It is now
      an explicit `7d`, capped by `retentionDiskSpaceUsage`, and logs.md must
      quote the real value rather than describe a policy nobody set.
    source:
      file: observability/base/victoria-logs/helmrelease-vlsingle.yaml
      pattern: 'retentionPeriod:\s*(\d+d)'
    pages:
      - website/content/docs/platform/observability/logs.md
    must_contain: '{value}'

  - id: vtsingle-retention-has-unit
    why: >-
      A unit-less `retentionPeriod` is MONTHS in VictoriaMetrics charts, not
      days — the previous bare `3` (commented "3 days") actually kept three
      months of traces, 30x the intent. The suffix is the guard: this claim
      only passes while the committed value still carries a `d`.
    source:
      file: observability/base/victoria-traces/helmrelease-vtsingle.yaml
      pattern: 'retentionPeriod:\s*(\d+d)'
    pages:
      - website/content/docs/platform/observability/dashboards-and-alerts.md
    must_contain: '{value}'

  - id: grafana-plugin-pins
    why: >-
      Both Grafana datasource plugins were curl initContainers invisible to
      Renovate — one frozen at v0.14.0 for 16 months, one fetching GitHub
      "latest" on every pod start. They are now signed, pinned catalog
      plugins, and the pinned version is a docs claim like any other
      dependency.
    source:
      file: observability/base/victoria-metrics-k8s-stack/vm-common-helm-values-configmap.yaml
      pattern: 'victoriametrics-logs-datasource@(\d+\.\d+\.\d+)'
    pages:
      - website/content/docs/platform/observability/dashboards-and-alerts.md
    must_contain: '{value}'

  - id: loggen-aws-only
    why: >-
      loggen writes ~1.7M synthetic lines/day and used to run on both
      clouds silently — gcp-0 consumed none of its output. The exclusion is
      now a comment in gcp-0's kustomization; logs.md must keep saying it is
      aws-0-only rather than resurrecting it as a shared component.
    source:
      file: observability/gcp-0/kustomization.yaml
      pattern: '\.\./base/(loggen) is deliberately NOT listed'
    pages:
      - website/content/docs/platform/observability/logs.md
    must_contain: 'aws-0`\s*only'

  - id: oncall-removed
    why: >-
      Grafana OnCall was built but never wired into a Kustomization, and
      that "exists but undeployed" story lived in the docs for months. The
      estate was removed on 2026-08-29 (ADR-0029, RunLore replacing it);
      these pages must not resurrect the undeployed-OnCall narrative now
      that there is no OnCall left to be undeployed.
    source:
      file: website/content/docs/decisions/0029-runlore-over-grafana-oncall.md
    pages:
      - website/content/docs/platform/observability/_index.md
      - website/content/docs/platform/observability/dashboards-and-alerts.md
      - website/content/docs/guides/fork-and-adapt.md
    must_not_contain:
      - 'built but not deployed'
      - 'never actually deploys'
      - 'wired into no Kustomization'

  - id: runlore-alerts-both-clouds
    why: >-
      The 12 RunLore health alerts sat in the aws-0 overlay for months
      after RunLore itself reached gcp-0, so a dead agent there raised
      nothing. The rule now ships from base to both clusters; sre-agent.md
      must not describe the alerts as AWS-scoped again.
    source:
      file: observability/base/victoria-metrics-k8s-stack/vmrules/runlore.yaml
    pages:
      - website/content/docs/platform/observability/sre-agent.md
    must_not_contain:
      - 'AWS-only'
      - 'aws-0 only'
      - 'stays AWS'
