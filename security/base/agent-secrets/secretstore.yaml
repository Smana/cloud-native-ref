---
# agent-system's store for its own secrets (C1, S9). Its OpenBao role reads the
# `agents` mount and nothing else (SP2 P38), and only this namespace can use it.
# That it is agent-system's ONLY store is a convention, not a control: no
# ClusterSecretStore sets namespace conditions (openbao-platform: T14), and
# openbao-ca itself reads through one.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: agents-secrets
  namespace: agent-system
spec:
  provider:
    vault:
      server: "https://openbao.security.svc.cluster.local:8200"
      path: "agents"
      version: "v2"
      caProvider:
        type: Secret
        name: openbao-ca
        key: ca.crt
      auth:
        jwt:
          path: "jwt/${cluster_name}"
          role: "agents-secrets"
          kubernetesServiceAccountToken: # pragma: allowlist secret
            serviceAccountRef:
              name: agents-secrets
            audiences:
              - openbao
