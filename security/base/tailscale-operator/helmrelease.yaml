apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tailscale-operator
spec:
  releaseName: tailscale-operator
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: tailscale-operator
      sourceRef:
        kind: HelmRepository
        name: tailscale
      version: "1.90.6"
  interval: 2m0s
  install:
    remediation:
      retries: 3
  values:
    # CRDs are managed separately via kustomize
    installCRDs: false

    operatorConfig:
      # Per-cluster, same reason as the Gateway hostnames
      # (infrastructure/base/gapi/platform-tailscale-general-gateway.yaml): the
      # tailnet is SHARED between aws-0 and gcp-0, and the chart default
      # ("tailscale-operator", verified via `helm template tailscale/tailscale-
      # operator --version 1.90.6`) is not tailnet-unique across two clusters
      # running this same shared HelmRelease. Without this, gcp-0's operator
      # device collides with aws-0's and Tailscale silently suffixes one of
      # them. `cluster_name` substitutes on both clouds.
      hostname: "tailscale-operator-${cluster_name}"

      resources:
        limits:
          memory: 256Mi
        requests:
          cpu: 300m
          memory: 256Mi

      # CONTAINER security context for the `operator` container
      # (`operatorConfig.podSecurityContext` is the pod one — see the chart's
      # templates/deployment.yaml). The chart ships both empty, so the operator
      # ran with privilege escalation allowed. The operator only talks to the
      # Kubernetes and Tailscale APIs; the tailscale *proxies* it creates are
      # separate pods governed by their own ProxyClass.
      securityContext:
        allowPrivilegeEscalation: false
