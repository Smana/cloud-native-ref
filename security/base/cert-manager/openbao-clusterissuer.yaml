apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: openbao
  namespace: security
spec:
  vault:
    server: https://bao.${private_domain_name}:8200
    namespace: admin/pki
    path: pki_private_issuer/sign/ogenki
    # Was an inline base64 chain pasted into this file. Now synced from the
    # same AWS Secrets Manager entry the OpenTofu management stack builds the
    # PKI from, so rotating the intermediate does not require editing a
    # manifest. Resolved in cert-manager's cluster resource namespace
    # (`security`) — see openbao-ca-externalsecret.yaml.
    caBundleSecretRef:
      name: openbao-ca
      key: ca.crt
    auth:
      appRole:
        path: approle
        roleId: ${cert_manager_approle_id}
        secretRef:
          # This secret should have been created before
          name: cert-manager-openbao-approle
          key: cert_manager_approle_secret
