apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: security-cert-manager
  # folderRef resolves in the dashboard's own namespace, and the `kubernetes`
  # GrafanaFolder lives in `infrastructure`.
  namespace: infrastructure
spec:
  allowCrossNamespaceImport: true
  folderRef: "kubernetes"
  instanceSelector:
    matchLabels:
      dashboards: "grafana"
  # The chart's ServiceMonitor does not honor labels, so the Certificate's
  # namespace arrives as `exported_namespace`; `namespace` is cert-manager's own.
  json: |
    {
      "__inputs": [],
      "__requires": [],
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "datasource": {
            "type": "prometheus",
            "uid": "$${datasource}"
          },
          "description": "Certificates cert-manager tracks.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "fixedColor": "blue",
                "mode": "fixed"
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 0,
            "y": 0
          },
          "id": 1,
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$${datasource}"
              },
              "expr": "count(certmanager_certificate_ready_status{condition=\"True\", exported_namespace=~\"$${namespace}\"})",
              "instant": true,
              "refId": "A"
            }
          ],
          "title": "Certificates",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "$${datasource}"
          },
          "description": "Certificates whose Ready condition is not True: failed, or stuck issuing (the CertificateNotReady alert).",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 6,
            "y": 0
          },
          "id": 2,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$${datasource}"
              },
              "expr": "count(certmanager_certificate_ready_status{condition=\"True\", exported_namespace=~\"$${namespace}\"} == 0) or vector(0)",
              "instant": true,
              "refId": "A"
            }
          ],
          "title": "Not ready",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "$${datasource}"
          },
          "description": "Time left on the certificate closest to expiry. Renewal happens at two thirds of the lifetime, so under 14 days means renewal is failing (the CertificateExpiringSoon alert).",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 604800
                  },
                  {
                    "color": "green",
                    "value": 1209600
                  }
                ]
              },
              "unit": "s"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 5,
            "w": 12,
            "x": 12,
            "y": 0
          },
          "id": 3,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$${datasource}"
              },
              "expr": "min(certmanager_certificate_expiration_timestamp_seconds{exported_namespace=~\"$${namespace}\"} - time())",
              "instant": true,
              "refId": "A"
            }
          ],
          "title": "Soonest expiry",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "$${datasource}"
          },
          "description": "One row per Certificate, soonest expiry first.",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "auto",
                "cellOptions": {
                  "type": "auto"
                }
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Ready"
                },
                "properties": [
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "options": {
                          "0": {
                            "color": "red",
                            "index": 1,
                            "text": "Not ready"
                          },
                          "1": {
                            "color": "green",
                            "index": 0,
                            "text": "Ready"
                          }
                        },
                        "type": "value"
                      }
                    ]
                  },
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-background"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Time to expiry"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "s"
                  },
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "red",
                          "value": null
                        },
                        {
                          "color": "orange",
                          "value": 604800
                        },
                        {
                          "color": "green",
                          "value": 1209600
                        }
                      ]
                    }
                  },
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-text"
                    }
                  }
                ]
              }
            ]
          },
          "gridPos": {
            "h": 10,
            "w": 24,
            "x": 0,
            "y": 5
          },
          "id": 4,
          "options": {
            "cellHeight": "sm",
            "showHeader": true,
            "sortBy": [
              {
                "desc": false,
                "displayName": "Time to expiry"
              }
            ]
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$${datasource}"
              },
              "expr": "max by (exported_namespace, name, issuer_kind, issuer_name) (certmanager_certificate_ready_status{condition=\"True\", exported_namespace=~\"$${namespace}\"})",
              "format": "table",
              "instant": true,
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$${datasource}"
              },
              "expr": "max by (exported_namespace, name, issuer_kind, issuer_name) (certmanager_certificate_expiration_timestamp_seconds{exported_namespace=~\"$${namespace}\"} - time())",
              "format": "table",
              "instant": true,
              "refId": "B"
            }
          ],
          "title": "Certificates",
          "transformations": [
            {
              "id": "merge",
              "options": {}
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true
                },
                "indexByName": {
                  "exported_namespace": 0,
                  "name": 1,
                  "issuer_kind": 2,
                  "issuer_name": 3,
                  "Value #A": 4,
                  "Value #B": 5
                },
                "renameByName": {
                  "Value #A": "Ready",
                  "Value #B": "Time to expiry",
                  "exported_namespace": "Namespace",
                  "issuer_kind": "Issuer kind",
                  "issuer_name": "Issuer",
                  "name": "Certificate"
                }
              }
            }
          ],
          "type": "table"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "$${datasource}"
          },
          "description": "1 while the Certificate's Ready condition is True. A dip to 0 that recovers is a renewal; one that stays is a stuck issuance.",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 0,
                "lineInterpolation": "stepAfter",
                "lineWidth": 1,
                "showPoints": "never"
              },
              "max": 1,
              "min": 0,
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 15
          },
          "id": 5,
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "none"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$${datasource}"
              },
              "expr": "certmanager_certificate_ready_status{condition=\"True\", exported_namespace=~\"$${namespace}\"}",
              "legendFormat": "{{exported_namespace}}/{{name}}",
              "refId": "A"
            }
          ],
          "title": "Ready status",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "$${datasource}"
          },
          "description": "A sawtooth is healthy: each drop back up is a renewal. A line that keeps falling past 14 days is a renewal that is failing.",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 0,
                "lineWidth": 1,
                "showPoints": "never",
                "thresholdsStyle": {
                  "mode": "line"
                }
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "transparent",
                    "value": 1209600
                  }
                ]
              },
              "unit": "s"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 15
          },
          "id": 6,
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "asc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$${datasource}"
              },
              "expr": "certmanager_certificate_expiration_timestamp_seconds{exported_namespace=~\"$${namespace}\"} - time()",
              "legendFormat": "{{exported_namespace}}/{{name}}",
              "refId": "A"
            }
          ],
          "title": "Time to expiry",
          "type": "timeseries"
        }
      ],
      "refresh": "5m",
      "schemaVersion": 39,
      "tags": [
        "cert-manager",
        "security"
      ],
      "templating": {
        "list": [
          {
            "current": {
              "selected": true,
              "text": "VictoriaMetrics",
              "value": "VictoriaMetrics"
            },
            "hide": 0,
            "includeAll": false,
            "label": "Data source",
            "multi": false,
            "name": "datasource",
            "options": [],
            "query": "prometheus",
            "refresh": 1,
            "regex": "",
            "skipUrlSync": false,
            "type": "datasource"
          },
          {
            "allValue": ".*",
            "current": {
              "selected": true,
              "text": "All",
              "value": "$$__all"
            },
            "datasource": {
              "type": "prometheus",
              "uid": "$${datasource}"
            },
            "definition": "label_values(certmanager_certificate_ready_status, exported_namespace)",
            "hide": 0,
            "includeAll": true,
            "label": "Namespace",
            "multi": true,
            "name": "namespace",
            "options": [],
            "query": {
              "query": "label_values(certmanager_certificate_ready_status, exported_namespace)",
              "refId": "PrometheusVariableQueryEditor-VariableQuery"
            },
            "refresh": 2,
            "regex": "",
            "skipUrlSync": false,
            "sort": 1,
            "type": "query"
          }
        ]
      },
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "timepicker": {},
      "timezone": "",
      "title": "cert-manager",
      "uid": "security-cert-manager",
      "version": 1,
      "weekStart": ""
    }
