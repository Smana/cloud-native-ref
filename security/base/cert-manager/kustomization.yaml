apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The chart, and nothing its webhook admits.
#
# cert-manager ships a validating webhook with `failurePolicy: Fail`, so a
# ClusterIssuer applied in the same Kustomization as the chart races the webhook
# Service having endpoints. Keeping this directory free of anything the webhook
# admits means referencing it whole is always safe -- the GrafanaDashboard below
# is admitted by no webhook and waits harmlessly for the grafana-operator
# instance, unlike an issuer that would be rejected outright.
#
# The issuers each cloud needs live in that cloud's overlay, not here, because
# they are not shared: the OpenBao issuer differs per cluster (its own CA, its
# own AppRole) and the ACME issuer differs per solver (Route53 on aws-0, the
# same zone via a federated role on gcp-0). See security/{aws-0,gcp-0}/openbao/
# and security/{aws-0,gcp-0}/cert-manager-public/. The dashboard, by contrast,
# is identical on every cluster that runs cert-manager.
resources:
  - helmrelease.yaml
  - grafana-dashboard.yaml
