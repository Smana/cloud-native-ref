---
# The admission control agent-sandbox's threat model asks for on bare Sandboxes:
# the gVisor boundary, no API token, and nothing but a Sandbox creating pods here.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: agents-pod-shape
spec:
  validationActions: [Deny]
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: agents
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE]
        resources: [pods]
  validations:
    - expression: "has(object.spec.runtimeClassName) && object.spec.runtimeClassName == 'gvisor'"
      message: "every pod in agents runs under RuntimeClass gvisor"
    - expression: "has(object.spec.automountServiceAccountToken) && object.spec.automountServiceAccountToken == false"
      message: "a pod in agents never mounts a Kubernetes API token"
    - expression: "has(object.metadata.ownerReferences) && object.metadata.ownerReferences.exists(o, o.kind == 'Sandbox' && o.apiVersion.startsWith('agents.x-k8s.io/'))"
      message: "pods in agents are created by a Sandbox"
---
# ownerReferences are client-supplied, so the Sandbox check above can be forged by
# anything allowed to create pods here; the requester cannot. Its own policy
# because `request` is absent in background scans.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: agents-pod-creator
spec:
  validationActions: [Deny]
  failurePolicy: Fail
  evaluation:
    background:
      enabled: false
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: agents
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE]
        resources: [pods]
  validations:
    - expression: "request.userInfo.username == 'system:serviceaccount:agent-system:agent-sandbox-controller'"
      message: "pods in agents are created by the agent-sandbox controller"
---
# Every composed name, audience and octo-sts subject pattern depends on the name
# shape (C2). The XRD enforces it too; this also pins the namespace, which the
# XRD cannot see. SP3's one-creator rule lives beside this one, not in it.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: agentrun-admission
spec:
  validationActions: [Deny]
  failurePolicy: Fail
  evaluation:
    background:
      enabled: false
  matchConstraints:
    resourceRules:
      - apiGroups: [cloud.ogenki.io]
        apiVersions: [v1alpha1]
        operations: [CREATE]
        resources: [agentruns]
  validations:
    - expression: "object.metadata.name.matches('^xplane-run-[a-z2-7]{8}$')"
      message: "an AgentRun is named xplane-run-<runId>, runId being 8 characters of [a-z2-7]"
    - expression: "object.metadata.namespace == 'agents'"
      message: "AgentRuns live in namespace agents"
---
# agents holds no secret (S9). Blocks the ESO objects that could pull one in. The one
# exception is room-broker-ca, the platform CA the run bridges trust (GCP parity GP-18): a
# certificate, no credential, admitted only in exactly that shape (either cloud's key).
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: agents-no-secret-import
spec:
  validationActions: [Deny]
  failurePolicy: Fail
  evaluation:
    background:
      enabled: false
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: agents
    resourceRules:
      - apiGroups: [external-secrets.io]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE]
        resources: [externalsecrets, pushsecrets, secretstores]
  validations:
    # Allowlists, not denylists: an unlisted field (a per-item sourceRef.storeRef, which
    # overrides secretStoreRef; target.manifest or template; dataFrom; refreshPolicy)
    # refuses, so a new ESO field cannot reopen the exception. The domain is not pinned:
    # this Kustomization is not Flux-substituted, and any certificates/*/ca-chain entry
    # holds only a public chain.
    - expression: >-
        object.kind == 'ExternalSecret' && object.metadata.name == 'room-broker-ca' &&
        object.spec.all(k, k in ['secretStoreRef', 'target', 'data', 'refreshInterval']) &&
        object.spec.secretStoreRef.kind == 'ClusterSecretStore' &&
        object.spec.secretStoreRef.name == 'clustersecretstore' &&
        object.spec.target.all(k, k in ['name', 'creationPolicy', 'deletionPolicy']) &&
        object.spec.target.name == 'room-broker-ca' &&
        size(object.spec.data) == 1 &&
        object.spec.data[0].all(k, k in ['secretKey', 'remoteRef']) &&
        'ca.crt' == object.spec.data[0].secretKey &&
        object.spec.data[0].remoteRef.all(k, k in ['key', 'property', 'conversionStrategy', 'decodingStrategy', 'metadataPolicy', 'nullBytePolicy']) &&
        (!has(object.spec.data[0].remoteRef.metadataPolicy) || object.spec.data[0].remoteRef.metadataPolicy == 'None') &&
        ((object.spec.data[0].remoteRef.key.matches('^certificates/[^/]+/ca-chain$') &&
            has(object.spec.data[0].remoteRef.property) && object.spec.data[0].remoteRef.property == 'ca') ||
          (object.spec.data[0].remoteRef.key == 'openbao-priv-gcp-ca-chain' &&
            !has(object.spec.data[0].remoteRef.property)))
      message: "namespace agents holds no secret: External Secrets objects are refused, but for the room-broker-ca certificate (SP1 S9)"  # pragma: allowlist secret
---
# Envoy Gateway can neither prefix-match `sub` nor read the kubernetes.io claim,
# so the audiences agents use are reserved. Cluster-wide, hence Ignore: an
# outage of this policy must not block every pod in the cluster.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: agent-audience-reservation
spec:
  validationActions: [Deny]
  failurePolicy: Ignore
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: [agents, kube-system]
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE]
        resources: [pods]
  validations:
    - expression: >-
        !has(object.spec.volumes) || object.spec.volumes.all(v,
          !has(v.projected) || !has(v.projected.sources) || v.projected.sources.all(s,
            !has(s.serviceAccountToken) || !has(s.serviceAccountToken.audience) ||
            !(s.serviceAccountToken.audience.startsWith('agent-router.') ||
              s.serviceAccountToken.audience.startsWith('octo-sts/') ||
              s.serviceAccountToken.audience.startsWith('room-broker'))))
      message: "audiences agent-router.*, octo-sts/* and room-broker* are reserved for namespace agents"
---
# The TokenRequest API mints the same audiences with no pod: `kubectl create token
# --audience`, or ESO's cluster-wide serviceaccounts/token grant driven by any
# SecretStore. A TokenRequest lands in its ServiceAccount's namespace, and kubelet
# mints the runs' projected tokens through it in agents. Cluster-wide, hence
# Ignore, as above. Kyverno's own webhook config already drops kube-system and its
# own namespace (security) for both rules. No background scan: a TokenRequest is
# never stored.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: agent-audience-token-request
spec:
  validationActions: [Deny]
  failurePolicy: Ignore
  evaluation:
    background:
      enabled: false
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: [agents]
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE]
        resources: [serviceaccounts/token]
  validations:
    - expression: >-
        !has(object.spec) || !has(object.spec.audiences) ||
        !object.spec.audiences.exists(a,
          a.startsWith('agent-router.') || a.startsWith('octo-sts/') || a.startsWith('room-broker'))
      message: "audiences agent-router.*, octo-sts/* and room-broker* are minted only for ServiceAccounts in namespace agents"
