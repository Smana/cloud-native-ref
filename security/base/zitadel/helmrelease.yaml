apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: zitadel
spec:
  interval: 30m
  timeout: 45m
  install:
    remediation:
      # Unbounded, and the distinction from `upgrade` below is the point.
      #
      # This chart's pre-install hook, Job/zitadel-init, waits for the database
      # to accept connections. On a FIRST bootstrap that database does not exist
      # yet: the SQLInstance claim has to reach Crossplane, render a CNPG
      # Cluster, pull images and (on a cold cluster) wait for a node to be
      # scaled up for it. Observed on gcp-0 on 2026-08-28 -- the init Job failed
      # `timed out waiting for the condition`, five retries burned in minutes,
      # and the release parked on RetriesExceeded permanently.
      #
      # Nothing recovers from that on its own. The database came up healthy
      # twenty minutes later and the release stayed Failed, so the Kustomization
      # health check failed every interval and paged Slack every interval, until
      # a human ran `flux reconcile --reset`. A finite count here is a bet on how
      # long a cold bootstrap takes, and it is a bet this repo keeps losing.
      #
      # An install racing its dependencies is a timing problem and retrying is
      # the correct answer. An UPGRADE failing repeatedly is a regression and
      # should stop and be looked at -- so that one stays finite.
      retries: -1
  upgrade:
    remediation:
      retries: 3
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: zitadel
      version: "10.0.4"
      sourceRef:
        kind: HelmRepository
        name: zitadel
        namespace: security
      interval: 12h
  values:
    replicaCount: 1

    # Chart-wide CONTAINER security context. The chart threads `.Values.securityContext`
    # into the zitadel Deployment AND every Job container (init, setup + its
    # machinekey/machine-pat sidecars, cleanup), so this one block covers all six.
    # The chart default sets runAsNonRoot/runAsUser/readOnlyRootFilesystem/privileged
    # but omits allowPrivilegeEscalation; this merges with those defaults rather
    # than replacing them.
    # (`zitadel.securityContext` / `login.securityContext` are per-component
    # overrides that fall back to this block while left empty — they are.)
    securityContext:
      allowPrivilegeEscalation: false

    initJob:
      backoffLimit: 30 # Wait for the CNPG database instance to be ready

    # The chart's kubectl helper image (setup/cleanup/init jobs) defaults its
    # tag to the CLUSTER's Kubernetes version, and docker.io/alpine/k8s does
    # not publish every patch release — tags jump 1.35.6 → 1.36.0, so GKE's
    # v1.35.7 resolved to a tag that does not exist and the setup job died in
    # ImagePullBackOff (found live on gcp-0, 2026-09-01; same class as the
    # earlier missing-1.34.2 fix, but chart 10.x moved the knob from
    # setupJob.machinekeyWriter to tools.kubectl). Pin an EXISTING tag within
    # kubectl's ±1-minor skew of both clusters; re-check the tag exists when
    # bumping cluster versions.
    tools:
      kubectl:
        image:
          tag: "1.36.2"
    setupJob:
      machinekeyWriter:
        image:
          tag: "1.36.2"

    # Login v2 disabled due to Helm chart bug with pod-level TLS
    # Bug: Init container uses HTTPS for internal connections when TLS.Enabled=true
    # Using embedded login UI instead (same features, simpler architecture)
    login:
      enabled: false
    zitadel:
      serverSslCrtSecret: "zitadel-certificate"
      masterkeySecretName: "zitadel-masterkey" # Populated from the zitadel-envvars secret
      configmapConfig:
        # Keep the EMBEDDED login UI, which is what `login.enabled: false`
        # above already assumes.
        #
        # ZITADEL v4 defaults DefaultInstance.Features.LoginV2.Required to TRUE
        # (cmd/defaults.yaml). A fresh instance therefore redirects every OIDC
        # authorize to /ui/v2/login/... -- a path only the separate login v2
        # deployment serves, and this chart does not deploy it. The result is
        # that authentication looks configured, the redirect fires correctly,
        # and the login page itself returns:
        #
        #   {"code":5, "message":"Not Found"}
        #
        # It only bites a NEWLY BOOTSTRAPPED instance, and the split is
        # restored-vs-fresh rather than AWS-vs-GCP:
        #
        #   aws-0 never creates an instance. Its SQLInstance restores from
        #   objectStoreRecovery (path zitadel-20260719), so every rebuild brings
        #   back a July database whose instance row carries the flags of that
        #   time. DefaultInstance.Features is read at instance CREATION only, so
        #   aws-0 never consults it.
        #
        #   gcp-0 drops objectStoreRecovery -- there is no GCS backup to restore
        #   -- so it bootstraps empty and the defaults genuinely apply.
        #
        # aws-0 would hit this the first time it bootstraps without that backup.
        # Setting it here protects both.
        #
        # Because DefaultInstance applies only at creation, an instance already
        # carrying the flag must be corrected through the API:
        #   PUT /v2/features/instance  {"loginV2":{"required":false}}
        DefaultInstance:
          Features:
            LoginV2:
              Required: false
        Log:
          Formatter:
            Format: json
        ExternalPort: 443
        ExternalSecure: true
        ExternalDomain: "auth.${public_domain_name}"
        TLS:
          Enabled: true
          KeyPath: /tls/tls.key
          CertPath: /tls/tls.crt
        Database:
          Postgres:
            Host: xplane-zitadel-cnpg-cluster-rw
            Port: 5432
            Database: zitadel
            MaxOpenConns: 20
            MaxIdleConns: 10
            MaxConnLifetime: 30m
            MaxConnIdleTime: 5m

        # FirstInstance configuration for v9 (initializes service accounts)
        FirstInstance:
          Org:
            Machine:
              Machine:
                Username: 'iam-admin'
                Name: 'IAM Admin Service Account'
              MachineKey:
                ExpirationDate: '2029-01-01T00:00:00Z'
                Type: 1
              Pat:
                ExpirationDate: '2029-01-01T00:00:00Z'

    # reference: https://zitadel.com/docs/self-hosting/manage/configure
    # All configuration items are loaded from a secret
    # These are the keys that are expected in the secret
    # ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD
    # ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE
    # ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME
    # ZITADEL_DATABASE_POSTGRES_USER_PASSWORD
    # ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE
    # ZITADEL_DATABASE_POSTGRES_USER_USERNAME
    # ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD
    # ZITADEL_FIRSTINSTANCE_ORG_HUMAN_USERNAME
    # ZITADEL_MASTERKEY
    envVarsSecret: "zitadel-envvars"

    # Mount certificate generated by cert-manager
    extraVolumes:
      - name: zitadel-certificate
        secret:
          defaultMode: 420
          secretName: zitadel-certificate
    extraVolumeMounts:
      - name: zitadel-certificate
        mountPath: /tls
        readOnly: true
