apiVersion: cloud.ogenki.io/v1alpha1
kind: SQLInstance
metadata:
  name: xplane-zitadel
spec:
  instances: 2
  size: "small"
  storageSize: "20Gi"
  postgresVersion: "18"
  createSuperuser: true
  # Recovery source for the next bootstrap (only consulted during
  # initial provisioning — `bootstrap` is immutable post-create).
  #
  # `zitadel-pre-destroy` is an ALIAS owned by the destroy hook
  # (scripts/ops/k8s/cnpg-pre-destroy-seed.sh, called by both clouds' destroy
  # lanes; CNPG_SKIP_PRE_DESTROY_SEED gate):
  # at teardown it promotes this database to a dated seed and refreshes this
  # prefix from it via scripts/ops/k8s/cnpg-promote-seed.sh --rotate-alias,
  # which touches the alias only after the fresh dated seed verifies
  # restorable. Never copy into this prefix by hand; the dated seeds beside
  # it (zitadel-20260904 and older) are immutable history and the fallback
  # chain — delete one only once a rebuild has restored from a newer seed.
  #
  # The verify-before-rotate invariant exists because zitadel-20260829-2 was
  # born unrestorable — its newest base backup's consistency WAL segment was
  # archived seconds after the copy — and passed an object-count check
  # anyway; the script's begin_wal/end_wal verification is what keeps that
  # failure mode out of this alias. Design: the 2026-10-05 database-backup
  # brief (.superpowers/sdd/2026-10-05-database-backup-plan/task-backup-brief.md).
  objectStoreRecovery:
    bucketName: "${region}-ogenki-cnpg-backups"
    path: "zitadel-pre-destroy"
  backup:
    # SIX fields, and the first one is SECONDS. CNPG does not use Kubernetes
    # CronJob syntax here: it uses the robfig/cron format, so a five-field
    # expression is not rejected -- it is silently reinterpreted one position to
    # the left. `0 0 * * *` parsed as (sec=0, min=0, hour=*, dom=*, month=*)
    # means EVERY HOUR at :00:00, not daily at midnight.
    #
    # Measured 2026-09-02: this cluster had six "daily" base backups before
    # 13:00, and harbor (`0 1 * * *`) fired at 08:01, 09:01, 10:01, 11:01, 12:01
    # and 13:01. Nothing errors, nothing warns, and the resource is still named
    # `...-daily-backup` -- the only symptom is 24x the intended object count and
    # S3 cost, which looks like normal growth.
    schedule: "0 0 0 * * *"
    bucketName: "${region}-ogenki-cnpg-backups"
  crossplane:
    compositionRef:
      name: xsqlinstances.cloud.ogenki.io
