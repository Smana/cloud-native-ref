apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: zitadel
spec:
  gatewayClassName: cilium
  infrastructure:
    annotations:
      # Cloud-neutral. The four service.beta.kubernetes.io/aws-load-balancer-*
      # annotations that used to sit here are AWS-only and now live in
      # security/aws-0/zitadel/gateway-patch.yaml -- they named an NLB by name
      # and set its scheme and target type, which means nothing on GKE, where
      # Cilium's GatewayClass provisions the LoadBalancer itself.
      #
      # Leaving them in a shared base is the pattern that has bitten this repo
      # repeatedly: valid YAML on both clouds, meaningful on one.
      external-dns.alpha.kubernetes.io/hostname: "auth.${public_domain_name}"
  listeners:
    - name: auth
      hostname: "auth.${public_domain_name}"
      port: 443
      protocol: TLS
      allowedRoutes:
        namespaces:
          from: Same
      tls:
        mode: Passthrough
