apiVersion: batch/v1
kind: CronJob
metadata:
  labels:
    app.kubernetes.io/instance: openbao
  name: openbao-snapshot
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  schedule: "0 4 * * *"
  successfulJobsHistoryLimit: 1
  suspend: false
  # Without this a controller outage silently swallows missed runs instead of
  # catching up when it recovers.
  startingDeadlineSeconds: 3600
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/instance: openbao
    spec:
      backoffLimit: 2
      # A snapshot that has not finished in 30 minutes is wedged, not slow.
      activeDeadlineSeconds: 1800
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/instance: openbao
        spec:
          volumes:
            # Was a 5Gi ReadWriteOnce gp3 PVC, which pinned the job to a single
            # AZ and outlived every run for no reason - the snapshot is copied
            # to S3 and the local file is disposable. concurrencyPolicy: Forbid
            # already serialises runs.
            - name: snapshot
              emptyDir:
                sizeLimit: 5Gi
            # readOnlyRootFilesystem is on, and the AWS CLI wants a scratch dir.
            - name: tmp
              emptyDir:
                sizeLimit: 256Mi
          securityContext:
            fsGroup: 1001
            runAsUser: 1000
            runAsGroup: 1001
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - command:
                - sh
                - -c
                - "openbao-snapshot.sh save -b $(BUCKET_NAME) -s /snapshot/backup.snap -a $(VAULT_ADDR) -d 8"
              env:
                # Not yet removable. Two things block it, both tracked
                # elsewhere: the script resolves the raft leader and connects
                # to it by private IP, and the server certificate carries only
                # a DNS SAN (bao.priv.cloud.ogenki.io), so verification cannot
                # succeed against an IP. Mounting the CA alone would not help.
                # Fixing it means either adding IP SANs to the server
                # certificate or routing the snapshot call through the NLB.
                - name: "VAULT_SKIP_VERIFY"
                  value: "true"
                - name: HOME
                  value: /snapshot
              envFrom:
                - secretRef:
                    name: openbao-snapshot
              image: smana/openbao-snapshot:v0.1.0
              imagePullPolicy: IfNotPresent
              name: openbao-snapshot
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 50m
                  memory: 150Mi
                limits:
                  # Headroom over the request rather than a tight cap: the job is
                  # a once-a-night snapshot, so throttling it only makes the
                  # backup window longer. The constitution requires a limit, so
                  # there is one.
                  cpu: 300m
                  memory: 150Mi
              volumeMounts:
                - mountPath: "/snapshot"
                  name: snapshot
                - mountPath: "/tmp"
                  name: tmp
          serviceAccountName: openbao-snapshot
          restartPolicy: Never
