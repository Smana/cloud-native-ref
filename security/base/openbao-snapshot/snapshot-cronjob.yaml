apiVersion: batch/v1
kind: CronJob
metadata:
  labels:
    app.kubernetes.io/instance: openbao
  name: openbao-snapshot
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  schedule: "0 4 * * *"
  successfulJobsHistoryLimit: 1
  suspend: false
  # Bounds how late a missed run may start. The semantics are the opposite of
  # what they look like: with this UNSET the controller catches up a missed
  # schedule whenever it recovers, and setting it makes anything missed by more
  # than the deadline get skipped. It is set anyway, because unbounded catch-up
  # means a controller outage spanning several days fires a burst of snapshots
  # at once. An hour is long enough to ride out a node or control-plane blip.
  # A run dropped past that surfaces as OpenBaoSnapshotStale.
  startingDeadlineSeconds: 3600
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/instance: openbao
    spec:
      backoffLimit: 2
      # A snapshot that has not finished in 30 minutes is wedged, not slow.
      activeDeadlineSeconds: 1800
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/instance: openbao
        spec:
          volumes:
            # Was a 5Gi ReadWriteOnce gp3 PVC, which pinned the job to a single
            # AZ and outlived every run for no reason - the snapshot is copied
            # to S3 and the local file is disposable. concurrencyPolicy: Forbid
            # already serialises runs.
            - name: snapshot
              emptyDir:
                sizeLimit: 5Gi
            # readOnlyRootFilesystem is on, and the AWS CLI wants a scratch dir.
            - name: tmp
              emptyDir:
                sizeLimit: 256Mi
            # Same ExternalSecret the cert-manager ClusterIssuer uses; both live
            # in this namespace.
            - name: openbao-ca
              secret:
                secretName: openbao-ca  # pragma: allowlist secret
            # The credential. A projected ServiceAccount token with the audience
            # the JWT role binds and a 10-minute lifetime; the kubelet rotates
            # it. Nothing here comes from a secret store any more.
            - name: openbao-token
              projected:
                sources:
                  - serviceAccountToken:
                      path: token
                      audience: openbao
                      expirationSeconds: 600
          securityContext:
            fsGroup: 1001
            runAsUser: 1000
            runAsGroup: 1001
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - command:
                - sh
                - -c
                - "openbao-snapshot.sh save -b $(BUCKET_NAME) -s /snapshot/backup.snap -a $(VAULT_ADDR) -d 8"
              env:
                # No VAULT_SKIP_VERIFY. The job goes through the neutral
                # in-cluster name, which is a SAN on the server certificate, so
                # the CA is enough and this workload verifies TLS like everything
                # else.
                - name: VAULT_CACERT
                  value: /etc/openbao/tls/ca.crt
                - name: VAULT_ADDR
                  value: https://openbao.security.svc.cluster.local:8200
                - name: HOME
                  value: /snapshot
                # Selects the cloud branch inside openbao-snapshot.sh (aws | gcp).
                # gcp-0 patches this to "gcp".
                - name: CLOUD
                  value: "aws"
                # The lineage's snapshot bucket, per cluster (region-prefixed on
                # AWS, project-prefixed on GCP).
                - name: BUCKET_NAME
                  value: ${openbao_snapshot_bucket}
                # JWT login: mount, role and where the projected token is.
                - name: OPENBAO_JWT_MOUNT
                  value: jwt/${cluster_name}
                - name: OPENBAO_JWT_ROLE
                  value: openbao-snapshot
                - name: OPENBAO_JWT_PATH
                  value: /var/run/secrets/openbao/token
              image: ghcr.io/smana/openbao-snapshot:v0.3.0
              imagePullPolicy: IfNotPresent
              name: openbao-snapshot
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 50m
                  # ~= the resident set of the cloud CLI at rest, which is the
                  # typical case today: the objects this job writes are ~1 KB
                  # (opentofu/gcp/openbao/lineage/main.tf makes that call for the
                  # bucket's encryption), far below the 8Mi threshold that
                  # switches gcloud to a chunked upload -- so the steady state is
                  # "an interpreter with a cloud SDK imported" and nothing more.
                  # Peaks are what the limit below is for, so this stays where it
                  # was and the scheduling footprint on both clouds is unchanged.
                  memory: 150Mi
                  # The snapshot lands in an emptyDir backed by the node's root
                  # disk, so the scheduler has to account for it. Without this
                  # a large snapshot triggers node DiskPressure and evicts
                  # unrelated pods before the volume's own sizeLimit fires.
                  ephemeral-storage: 5Gi
                limits:
                  ephemeral-storage: 5Gi
                  # Headroom over the request rather than a tight cap: the job is
                  # a once-a-night snapshot, so throttling it only makes the
                  # backup window longer. The constitution requires a limit, so
                  # there is one.
                  cpu: 300m
                  # Memory gets the same treatment, which it did not before: it
                  # was pinned to the request at 150Mi, i.e. no headroom at all,
                  # on a container whose copy step is a Python cloud CLI.
                  # Measured, not guessed -- importing the module graph that
                  # `gcloud storage cp` needs (googlecloudsdk.gcloud_main plus
                  # surface.storage.cp, 1178 modules, SDK 581 which is the series
                  # the image pins at 582.0.0-0) peaks at 92.6 MiB RSS before a
                  # single argument is parsed, a credential fetched or a byte
                  # read. Two SDK defaults then sit on top of it:
                  #
                  #   storage/resumable_threshold   8Mi   -> above this, the
                  #                                          upload is chunked
                  #   storage/upload_chunk_size   100Mi   -> and apitools holds a
                  #                                          buffer that size per
                  #                                          in-flight chunk
                  #
                  # so a snapshot that grows past 8 MiB needs ~193 MiB for one
                  # worker -- 43 MiB over the old limit. An OOMKill there lands
                  # AFTER `bao operator raft snapshot save` has succeeded, so the
                  # Job dies with exit 137 and no snapshot while
                  # OpenBaoSnapshotJobFailed sends the responder to the JWT login
                  # and bucket access. 512Mi clears that with room for the retry
                  # path and for gcloud's own process pool, which sizes itself
                  # from multiprocessing.cpu_count() -- the NODE's cores, not this
                  # cgroup's quota.
                  #
                  # ONE number for both clouds, not a per-cloud patch. `aws s3
                  # cp` is the same kind of program -- AWS CLI v2 is a frozen
                  # CPython bundling botocore -- so 150Mi was never measured on
                  # the AWS side either; it has simply not been pushed past it
                  # yet. And a limit is not a reservation: raising it changes
                  # nothing about what aws-0 schedules or bills, which removes the
                  # only reason to make the two clouds differ here.
                  memory: 512Mi
              volumeMounts:
                - mountPath: "/snapshot"
                  name: snapshot
                - mountPath: "/tmp"
                  name: tmp
                - mountPath: "/etc/openbao/tls"
                  name: openbao-ca
                  readOnly: true
                - mountPath: /var/run/secrets/openbao
                  name: openbao-token
                  readOnly: true
          serviceAccountName: openbao-snapshot
          restartPolicy: Never
