apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openbao-snapshot
spec:
  dataFrom:
    - extract:
        conversionStrategy: Default
        # Per-cluster: AWS Secrets Manager allows path-style names, GCP Secret
        # Manager forbids "/" in an ID entirely. See ${openbao_snapshot_secret}
        # in each cluster's eks/gke configure vars ConfigMap.
        key: ${openbao_snapshot_secret}
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: clustersecretstore
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    name: openbao-snapshot
