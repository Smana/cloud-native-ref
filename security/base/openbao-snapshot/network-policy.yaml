apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: openbao-snapshot
spec:
  description: "Limit egress from the OpenBao snapshot job, and deny all ingress - nothing calls it."
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/instance: openbao
  # Default-deny is per-direction in Cilium: an endpoint only enters default-deny
  # for a direction if a rule selecting it has a section for that direction. An
  # egress-only policy therefore leaves ingress fully open, which is what this
  # policy did before — the description claimed otherwise. Asking for it
  # explicitly is clearer than relying on an empty `ingress: []` array.
  enableDefaultDeny:
    ingress: true
    egress: true
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # EKS Pod Identity agent on AWS; on GCP this is what lets `gcloud` reach
    # GKE's metadata server at 169.254.169.254. Both run on the node's host
    # network, so Cilium classifies the destination as the `host` entity and a
    # toCIDR rule for the link-local address silently fails - see
    # .claude/rules/cilium-network-policies.md.
    - toEntities:
        - host
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
    # The OpenBao API, reached through the internal load balancer. The job no
    # longer connects to the raft leader by private IP — it goes through the
    # LB and lets standby nodes forward the request to the active node.
    # ${openbao_cidr} differs per cloud: on AWS it's the whole VPC (the
    # internal NLB's private addresses); on GCP it's the node subnet, where
    # the internal load balancer lives. See the ConfigMap comment in each
    # cluster's eks/gke configure stack.
    - toCIDR:
        - ${openbao_cidr}
      toPorts:
        - ports:
            - port: "8200"
              protocol: TCP
    # Reaching OpenBao when the `openbao` Service is in its REMOTE form
    # (security/base/openbao-endpoint/remote): the ExternalName then resolves to
    # the Tailscale operator's egress ProxyGroup, so the packet's first hop is a
    # proxy pod in the tailscale namespace, not the load balancer. Harmless in
    # the local form -- no traffic matches it.
    #
    # NO toPorts, deliberately. The operator does not have the proxy pod listen
    # on 8200: for each port of the user Service it allocates a free CONTAINER
    # port and maps 8200 onto it through the generated ClusterIP Service's
    # targetPort. tailscale v1.90.6, cmd/k8s-operator/egress-services.go:
    # `unusedPort()` returns `rand.Int32N(maxPorts) + 10000`, i.e. a random port
    # in [10000, 11000) ("The high range should make it easier to distinguish
    # container ports from the tailnet target ports"), and the PortMap is built
    # as `Port: <user port>, TargetPort: <allocated port>`. Cilium enforces
    # egress AFTER socket-level service translation, so a rule written for 8200
    # would be matched against the backend pod's port and silently deny every
    # connection -- and pinning [10000, 11000) instead would be a 1000-port
    # range picked at random on every reconcile, which is not a constraint worth
    # writing down. The destination is already one named workload in one
    # namespace; the port is left unconstrained because the operator owns it.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: tailscale
            k8s:tailscale.com/parent-resource: ts-proxies
    # S3 and STS on AWS; on GCP this is what carries `gcloud storage` traffic
    # to Google APIs. toFQDNs would be the tighter rule, but both clouds' object
    # storage endpoint topology fans out past what a single-segment
    # matchPattern can follow. The blanket 443 rule is the sanctioned trade for
    # a bounded one-shot job: this is a CronJob with a TTL, running under
    # restricted PSS with a scoped IAM role, and every other port stays denied.
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
