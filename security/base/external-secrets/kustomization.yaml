apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The chart, and nothing its webhook admits -- same rule as
# security/base/cert-manager. Each cloud's ClusterSecretStore names a different
# provider (`aws` on aws-0, `gcpsm` on gcp-0), so it was never shared anyway;
# it lives in security/{aws-0,gcp-0}/openbao/clustersecretstore.yaml.
resources:
  - helmrelease.yaml
