# The single source of every team's permissions on this platform.
#
# Rows are teams, columns are consumers. scripts/render_access_matrix.py turns
# this into the ZITADEL project role list and three RBAC manifests; CI fails if
# a rendered file was edited by hand. scripts/access-matrix-sync.sh reconciles
# ZITADEL role grants from each team's Google Workspace group.
#
# To change what a team may do, change it HERE and re-render. Editing a
# generated file is the one thing this design exists to stop.
#
# See docs/superpowers/specs/2026-09-11-workspace-access-matrix-design.md.
teams:
  # Runs the platform. `mountAccess: all` is what used to be the hand-written
  # openbao-admin identity group.
  - team: platform
    googleGroup: platform@ogenki.io
    kubernetes: cluster-admin
    mountAccess: all
    grafana: Admin
    fluxUI: cluster-admin

  # Service teams: read-only on the cluster, every change goes through GitOps
  # (owner decision, 2026-09-11). That covers the Flux UI too -- `fluxUI` may
  # never exceed `kubernetes`, because both render a ClusterRoleBinding on the
  # same group and RBAC is a union: the old `fluxUI: edit` was cluster-wide
  # kubectl `edit` on aws-0. access_matrix.load() refuses such a row.
  # That comparison (none < view < edit < cluster-admin) holds ONLY because
  # both columns render to nested BUILT-IN ClusterRoles. Map either one to a
  # custom ClusterRole and "not above" stops meaning "no broader than", so the
  # guard must be revisited. Flux UI `view` is the built-in `view`, never the
  # chart's `flux-web-user`, which reads */* and so every Secret.
  - team: backend
    googleGroup: backend@ogenki.io
    kubernetes: view
    mountAccess: own
    grafana: Editor
    fluxUI: view

  - team: data
    googleGroup: data-eng@ogenki.io
    kubernetes: view
    mountAccess: own
    grafana: Editor
    fluxUI: view

  # Dashboards only -- no Kubernetes, no OpenBao mount access.
  - team: frontend
    googleGroup: frontend@ogenki.io
    kubernetes: none
    mountAccess: none
    grafana: Editor
    fluxUI: none
