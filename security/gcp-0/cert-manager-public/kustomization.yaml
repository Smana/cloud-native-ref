apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: security

# Separate from security/gcp-0/openbao/, which holds the PRIVATE issuer. Two
# issuers, two trust chains, two failure modes: the openbao ClusterIssuer signs
# *.priv.gcp.ogenki.io from an offline root, this one gets publicly-trusted
# certificates from Let's Encrypt. Keeping them apart means a Route53 outage
# cannot make the private path look broken.
#
# The ACME solver here federates a projected `cert-manager` ServiceAccount token
# to AWS STS, so it needs the `cert-manager-token-creator` Role. That Role used
# to be applied from THIS directory, which had the private issuer inheriting its
# own precondition from the public one -- deleting this overlay would have
# broken the private PKI silently. It now lives in
# security/base/cert-manager-token-creator/ and is applied by ../openbao/, and
# is deliberately NOT listed here as well: two Flux Kustomizations owning the
# same Role would fight over it through server-side apply.
resources:
  - letsencrypt-clusterissuer.yaml
