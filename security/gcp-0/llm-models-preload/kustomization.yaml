apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The bucket-write identity for the LLM model-weights preload Job, split out
# of apps/gcp-0/llm into its own directory (and own Flux Kustomization,
# llm-platform-security-wi) so it can be gated -- and depended on --
# independently of the InferenceService claims in llm-platform-apps. GCP
# analogue of aws-0's security/base/epis-llm.
resources:
  - workloadidentity.yaml
