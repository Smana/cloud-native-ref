# This CronJob only ever runs `openbao-snapshot.sh save` -- see the
# container `command:` in the base -- so a bucket-scoped grant is all it
# needs. Deliberately no `roles:` here: GCPWorkloadIdentity's `roles` field
# renders a project-scoped ProjectIAMMember, which would hand this job read
# access to every secret in the project, including the intermediate CA's
# private key (same call the repo already made for external-dns's absence of
# a per-secret grant here -- see infrastructure/gcp-0/external-dns/
# workloadidentity.yaml). `RECOVERY_KEYS_SECRET_ID` is read only by the
# `restore` path, which is an operator action run by hand, not by this
# CronJob -- so no secret access is granted at all. This leaves gcp-0's
# restore path needing a human with Secret Manager access, which no manifest
# in this repo grants today; a real gap, tracked as follow-up rather than
# fixed here.
#
# No KMS grant either, unlike the AWS EPI's AllowKMSUsage statement: the
# bucket above declares no CMEK, so it's encrypted with Google-managed keys
# by default and there is nothing to grant.
apiVersion: cloud.ogenki.io/v1alpha1
kind: GCPWorkloadIdentity
metadata:
  name: xplane-openbao-snapshot
  namespace: security
spec:
  serviceAccount:
    name: openbao-snapshot
  bucketRoles:
    - bucket: ${project_id}-ogenki-openbao-snapshot
      # objectCreator, NOT objectAdmin, and the distinction matters more here
      # than it would on an ordinary bucket: this one is both gcp-0's snapshot
      # target AND the DR mirror of the entire AWS lineage. objectAdmin includes
      # storage.objects.delete, so a bug or a compromise in the daily job could
      # erase the fallback copy of every AWS snapshot -- the one thing the
      # cross-cloud design exists to preserve. The AWS twin grants no delete
      # either; they now agree.
      #
      # Create is all the job needs. `save()` does one `gcloud storage cp` and
      # nothing else; the bucket listing lives in `restore()`, which is an
      # operator action run with operator credentials, not the pod's identity.
      # Retention is the bucket's lifecycle rules, not something the job does.
      # Object names are timestamped, so nothing is ever overwritten.
      role: roles/storage.objectCreator
