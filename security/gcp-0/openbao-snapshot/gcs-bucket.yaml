# Mirrors security/base/openbao-snapshot's aws-0 bucket: OpenBao raft
# snapshots are the disaster-recovery payload and must never be deleted by
# Crossplane on prune. `forceDestroy: false` already refuses to delete a
# non-empty bucket, so the realistic failure this `managementPolicies`
# omission of Delete prevents is the same finalizer wedge as on aws-0, not
# data loss. To remove intentionally, use the gcloud CLI.
# (Crossplane v2 namespaced MRs do not expose spec.deletionPolicy;
# managementPolicies is the v2 mechanism.)
apiVersion: storage.gcp.m.upbound.io/v1beta1
kind: Bucket
metadata:
  name: openbao-snapshot
  namespace: security
  annotations:
    crossplane.io/external-name: ${region}-ogenki-openbao-snapshot
spec:
  managementPolicies: ["Observe", "Create", "Update", "LateInitialize"]
  forProvider:
    location: ${region}
    uniformBucketLevelAccess: true
    forceDestroy: false
