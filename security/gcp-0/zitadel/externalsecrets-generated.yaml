# A regenerated value would not match what ZITADEL already wrote, so each
# generated Secret must outlive its ExternalSecret and never be rewritten:
#   - Orphan: no ownerReference, so deleting the ExternalSecret leaves the Secret;
#   - prune disabled: Flux never deletes the ExternalSecret, even on a rename;
#   - immutable: a RECREATED ExternalSecret (empty status, so CreatedOnce
#     generates again) finds the Secret immutable, skips the template and keeps
#     the existing data (ESO v2.11.0).
# The same three are patched onto base's zitadel-masterkey in kustomization.yaml.
# To rotate one, delete both the Secret and its ExternalSecret; for the
# masterkey that means rebuilding the directory.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zitadel-db-user
  namespace: security
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  refreshPolicy: CreatedOnce
  target:
    name: zitadel-db-user
    creationPolicy: Orphan
    deletionPolicy: Retain
    immutable: true
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: zitadel-db-user
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zitadel-first-human
  namespace: security
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  refreshPolicy: CreatedOnce
  target:
    name: zitadel-first-human
    creationPolicy: Orphan
    deletionPolicy: Retain
    immutable: true
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: zitadel-first-human
