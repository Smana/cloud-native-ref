apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# ZITADEL on gcp-0 -- the platform's only directory while GCP is primary
# (ADR-0052, GCP parity GP-3).
#
# It is FRESH on every build and never restored:
#   - every key is generated in-cluster by an ESO Password generator
#     (password-generators.yaml), CreatedOnce, so no store holds a masterkey;
#   - the database admin is read from CNPG's own superuser Secret, so ZITADEL
#     and CNPG cannot disagree on it (helmrelease-env-patch.yaml);
#   - the SQLInstance runs initdb: no objectStoreRecovery, backups kept.
# The deploy then re-registers the Google IdP, the groups Action and every OIDC
# client (gcp/gke/init stage 3). What is lost each build is users and IdP links;
# the owner logs in once and re-grants.
#
# The Gateway, Certificate, TLSRoute, CiliumNetworkPolicy and HelmRelease come
# from base; only the database claim, the secrets and the HelmRelease's env
# differ.
resources:
  - ../../base/zitadel
  - password-generators.yaml
  - externalsecrets-generated.yaml

patches:
  # The database claim. Three differences from base:
  #
  #   1. compositionRef names the GCP Composition. aws-0 gets
  #      `xsqlinstances.cloud.ogenki.io` from crossplane-configuration-aws;
  #      gcp-0 gets `xsqlinstances-gcp...` from -gcp. A claim naming the AWS one
  #      here would find no Composition at all.
  #
  #   2. objectStoreRecovery is removed, so CNPG runs initdb. A restored
  #      directory would need its old masterkey, which is exactly what this
  #      overlay no longer reads from a store.
  #
  #   3. backup.bucketName points at a `${project_id}-` bucket rather than
  #      base's `${region}-` one: GCS bucket names are globally unique. The
  #      bucket is infrastructure/gcp-0/cloudnative-pg/gcs-bucket.yaml.
  #
  # instances stays 2: this is THE directory, and every login depends on it.
  # (The XRD's CEL rule -- `backup.schedule is required for multi-instance
  # clusters` -- is satisfied by the kept backup block.)
  - target:
      group: cloud.ogenki.io
      kind: SQLInstance
      name: xplane-zitadel
    patch: |-
      - op: replace
        path: /spec/crossplane/compositionRef/name
        value: xsqlinstances-gcp.cloud.ogenki.io
      - op: replace
        path: /spec/instances
        value: 2
      - op: remove
        path: /spec/objectStoreRecovery
      - op: replace
        path: /spec/backup/bucketName
        value: ${project_id}-ogenki-cnpg-backups
  - target: {group: external-secrets.io, kind: ExternalSecret, name: zitadel-envvars}
    patch: |-
      $patch: delete
      apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      metadata:
        name: zitadel-envvars
  - target: {group: external-secrets.io, kind: ExternalSecret, name: zitadel-masterkey}
    patch: |-
      - op: remove
        path: /spec/data
      - op: remove
        path: /spec/secretStoreRef
      - op: add
        path: /spec/refreshPolicy
        value: CreatedOnce
      - op: add
        path: /spec/dataFrom
        value:
          - sourceRef:
              generatorRef:
                apiVersion: generators.external-secrets.io/v1alpha1
                kind: Password
                name: zitadel-masterkey
      - op: replace
        path: /spec/target/template/data/masterkey
        value: "{{ .password }}"
  - path: helmrelease-env-patch.yaml
    target: {group: helm.toolkit.fluxcd.io, kind: HelmRelease, name: zitadel}
