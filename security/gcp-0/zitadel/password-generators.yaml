# ZITADEL's keys, generated in-cluster (ADR-0052, GCP parity GP-3). Generated on
# the first reconcile and never rewritten, because a rotated masterkey makes the
# database unreadable. CreatedOnce alone does not guarantee that; the three
# settings in externalsecrets-generated.yaml's header do.
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: zitadel-masterkey
  namespace: security
spec:
  # ZITADEL requires exactly 32 characters; no symbols, the key is read raw.
  length: 32
  digits: 8
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: zitadel-db-user
  namespace: security
spec:
  length: 32
  digits: 8
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: zitadel-first-human
  namespace: security
spec:
  # ZITADEL's default password policy wants upper, lower, digit and symbol.
  length: 32
  digits: 6
  symbols: 4
  symbolCharacters: "-_!#%+="
  noUpper: false
  allowRepeat: true
