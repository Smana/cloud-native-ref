# Reads GCP Secret Manager as the External Secrets controller's own identity.
#
# `auth` is deliberately absent. Under GKE Workload Identity the controller's
# ServiceAccount IS a Google principal, so the client picks the credentials up
# from the metadata server -- nothing is mounted, nothing rotates, and there is
# no key to leak. The AWS counterpart (security/aws-0/openbao/clustersecretstore.yaml)
# is the same idea through EKS Pod Identity.
#
# Which secrets this can actually read is decided in
# opentofu/gcp/openbao/management/iam.tf: ONE per-secret binding -- the CA chain
# -- rather than a project-wide role. It used to be two; the second granted
# cert-manager's AppRole secret_id, and JWT auth generates no such credential,
# so both the secret and its binding are gone.
#
# A ClusterSecretStore is cluster-scoped, so every namespace can reference it;
# the IAM side is what keeps that from meaning "every secret in the project".
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: clustersecretstore
spec:
  provider:
    gcpsm:
      projectID: ${project_id}
  refreshInterval: 0
