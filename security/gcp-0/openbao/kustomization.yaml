apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Everything that the controllers in ../controllers/ have to ADMIT before it can
# exist: two ExternalSecrets and a ClusterSecretStore behind the external-secrets
# webhook, a ClusterIssuer behind cert-manager's.
#
# Kept out of ../controllers/ deliberately -- see the note there. Applying these
# in the same Kustomization as the charts means admitting them against webhooks
# whose Services have no endpoints yet.
#
# Ordering runs the other way too, which is why this is a good boundary rather
# than a workaround: the ClusterIssuer needs the two Secrets that the
# ExternalSecrets produce, and those need External Secrets to be running. One
# group installs controllers; the other configures them.
# `openbao-endpoint/local` because this cluster consumes the OpenBao in its own
# cloud. A cluster consuming the OTHER cloud's active OpenBao lists
# `../../base/openbao-endpoint/remote` instead and sets openbao_target_ip in
# its configure stack -- see the cross-cloud failover guide.
#
# `cert-manager-token-creator` is the RBAC precondition of the ClusterIssuer
# below: without it cert-manager cannot mint the projected ServiceAccount token
# it authenticates to OpenBao with, and the issuer never goes Ready. It used to
# live in ../cert-manager-public/, where the PRIVATE issuer inherited it from
# the PUBLIC one -- see ../../base/cert-manager-token-creator/rbac.yaml for why
# that was wrong. The ACME issuer next door needs the same Role and now gets it
# from here; one Role in one namespace serves both, and only one Kustomization
# owns it.
resources:
  - ../../base/openbao-endpoint/local
  - ../../base/cert-manager-token-creator
  - clustersecretstore.yaml
  - openbao-ca-externalsecret.yaml
  - openbao-clusterissuer.yaml
