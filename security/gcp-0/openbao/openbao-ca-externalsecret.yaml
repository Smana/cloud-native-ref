# Backs caBundleSecretRef on the openbao ClusterIssuer.
#
# Synced rather than committed for the same reason as AWS: OpenBao's server
# certificate chains to a root no system trust store knows, and rotating the
# intermediate should not mean hand-editing a manifest with nothing tracking the
# expiry.
#
# `security` is cert-manager's cluster resource namespace (the chart defaults it
# to the release namespace and the shared HelmRelease does not override it), so
# a ClusterIssuer resolves secret references here.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openbao-ca
  namespace: security
spec:
  data:
    - secretKey: ca.crt  # pragma: allowlist secret
      remoteRef:
        # No `property`: this entry is a raw PEM bundle, where the AWS
        # equivalent is JSON with a `ca` field. The shapes differ because the
        # GCP chain is produced by the offline ceremony's openssl output and
        # consumed as-is -- see scripts/openbao-config.sh, which branches on
        # --cloud for exactly this.
        key: openbao-priv-gcp-ca-chain
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: clustersecretstore
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    name: openbao-ca
