# cert-manager's AppRole secret_id.
#
# Only the secret_id crosses into the cluster. AWS extracts the whole entry with
# `dataFrom`, because its role_id is generated and has to reach the ClusterIssuer
# through postBuild substitution; here the role_id is PINNED in
# opentofu/gcp/openbao/management/auth.tf and written into the ClusterIssuer
# directly, so pulling it would put an identifier in a Secret for no reason.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cert-manager-bao-approle
  namespace: security
spec:
  data:
    - secretKey: cert_manager_approle_secret  # pragma: allowlist secret
      remoteRef:
        # Written by opentofu/gcp/openbao/management/secrets.tf as
        # {role_id, secret_id}.
        key: openbao-priv-gcp-approle-cert-manager
        property: secret_id
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: clustersecretstore
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    name: cert-manager-openbao-approle
