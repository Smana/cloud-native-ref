apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # Chart release only. The base DIRECTORY additionally carries the Let's
  # Encrypt ClusterIssuers, which solve DNS-01 through Route53 and have no
  # meaning on this cluster.
  - ../../base/cert-manager/helmrelease.yaml
  - openbao-approle-externalsecret.yaml
  - openbao-ca-externalsecret.yaml
  - openbao-clusterissuer.yaml
