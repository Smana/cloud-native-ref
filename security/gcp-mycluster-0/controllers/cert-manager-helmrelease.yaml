# Turn off cert-manager's ServiceMonitor on this cluster.
#
# Two independent reasons, either of which is sufficient:
#
# 1. It would not work. `ServiceMonitor` is a prometheus-operator CRD, installed
#    here by the `crds-prometheus-operator` HelmRelease in `crds/base`. The
#    `crds` Kustomization has no health checks, so it reports Ready as soon as
#    it has APPLIED that HelmRelease -- not when the chart has installed. On a
#    fresh cluster `security` fires one reconcile later and races it. If it
#    loses, the cert-manager install fails with `no matches for kind
#    "ServiceMonitor"`, and with `install.remediation.retries: 3` the
#    HelmRelease exhausts its retries and stops on its own -- it then needs a
#    manual `flux reconcile hr cert-manager --force`, because helm-controller
#    will not try again until the spec or chart version changes.
#
#    AWS never sees this: its `security` sits behind eks-pod-identities ->
#    crossplane-* -> crds, a chain long enough that the CRDs are always in by
#    the time it runs. This cluster deliberately drops that chain.
#
# 2. Nothing would read it. gcp-mycluster-0 runs no observability stack at all
#    -- there is no `observability` Kustomization in clusters/gcp-mycluster-0.
#
# Re-enable this when the observability tree lands on GCP, and add the
# dependency edge at the same time rather than relying on the race resolving
# favourably.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: security
spec:
  values:
    prometheus:
      enabled: false
