apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # The chart release itself is cloud-neutral, so it is referenced by file
  # rather than copied. The base DIRECTORY is not usable here: its
  # kustomization.yaml also pulls in the AWS SecretsManager ClusterSecretStore,
  # which would fail to authenticate on GCP and mask the real store below.
  - ../../base/external-secrets/helmrelease.yaml
  - clustersecretstore.yaml
