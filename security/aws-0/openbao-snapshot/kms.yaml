---
# `managementPolicies` without `Delete`, for the same reason as s3-bucket.yaml
# next to it: this key encrypts the OpenBao raft snapshots, which are the
# disaster-recovery payload.
#
# Here the omission is not just policy, it is the only arrangement that can
# work. opentofu/aws/eks/init/iam.tf grants the Crossplane principal
# kms:Get*/ListAliases/DescribeKey/ListResourceTags, kms:CreateKey/TagResource
# and kms:CreateAlias -- and no delete action of any kind. With the default
# `["*"]` policy, any prune of these two MRs makes provider-aws call
# kms:ScheduleKeyDeletion / kms:DeleteAlias, AWS denies it, and the MR sits in
# Terminating behind its finalizer until someone strips it by hand. Excluding
# Delete means the k8s object goes away and the AWS key is orphaned instead.
#
# To retire a key intentionally, schedule its deletion with the aws CLI.
# (Crossplane v2 namespaced MRs do not expose `spec.deletionPolicy`;
# `managementPolicies` is the v2 mechanism.)
apiVersion: kms.aws.m.upbound.io/v1beta1
kind: Key
metadata:
  labels:
    cloud.ogenki.io/name: openbao-snapshot
  name: xplane-openbao-snapshot
spec:
  managementPolicies: ["Observe", "Create", "Update", "LateInitialize"]
  forProvider:
    deletionWindowInDays: 7
    description: Used for the Vault s3 bucket
    region: ${region}
---
apiVersion: kms.aws.m.upbound.io/v1beta1
kind: Alias
metadata:
  name: xplane-openbao-snapshot
spec:
  managementPolicies: ["Observe", "Create", "Update", "LateInitialize"]
  forProvider:
    region: ${region}
    targetKeyIdRef:
      name: xplane-openbao-snapshot
