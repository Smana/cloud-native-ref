apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# This overlay exists only to patch the chart; ../../base/external-secrets is
# chart-only, so referencing it whole is safe. The ClusterSecretStore the chart's
# webhook admits is applied from ../openbao.
resources:
  - ../../base/external-secrets

patches:
  - path: helmrelease.yaml
    target:
      group: helm.toolkit.fluxcd.io
      kind: HelmRelease
      name: external-secrets
      namespace: kube-system
      version: v2beta2
