apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The chart alone. ../../base/external-secrets also carries
# clustersecretstore.yaml, which this cluster applies from ../openbao instead --
# the ClusterSecretStore is admitted by the webhook this very chart installs.
resources:
  - ../../base/external-secrets/helmrelease.yaml

patches:
  - path: helmrelease.yaml
    target:
      group: helm.toolkit.fluxcd.io
      kind: HelmRelease
      name: external-secrets
      namespace: kube-system
      version: v2beta2
