apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The PUBLIC certificate issuers: ACME against Let's Encrypt with a Route53
# dns01 solver. Nothing here touches OpenBao or the private PKI -- the two
# issuer families exist to fail independently, which is why they are separate
# Kustomizations rather than one.
#
# Mirrors security/gcp-0/cert-manager-public. Neither overlay carries the
# `cert-manager-token-creator` Role any more: it lives in
# security/base/cert-manager-token-creator/ and is applied by both clusters'
# ../openbao/ overlays, because the private-PKI ClusterIssuer needs it too since
# it switched to projected-token auth. Nothing in THIS directory needs it on
# aws-0 -- the dns01 solver here reaches Route53 with ambient EKS Pod Identity
# credentials rather than a federated token, which is the one place aws-0 and
# gcp-0 genuinely differ.
#
# Staging is kept alongside prod deliberately: it is the issuer to switch a
# Certificate to while debugging an issuance problem, and Let's Encrypt's
# duplicate-certificate limit makes retrying against prod expensive.
resources:
  - le-clusterissuer-prod.yaml
  - le-clusterissuer-staging.yaml
