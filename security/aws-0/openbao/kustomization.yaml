apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Everything the controllers in ../ have to ADMIT before it can exist: a
# ClusterSecretStore and one ExternalSecret behind the external-secrets webhook,
# one ClusterIssuer behind cert-manager's. It was two ExternalSecrets until the
# JWT switch: the second fetched cert-manager's AppRole secret_id, and a
# projected ServiceAccount token needs no stored credential.
#
# Kept out of the `security` Kustomization deliberately, and this now mirrors
# security/gcp-0/openbao file for file. See that directory's kustomization.yaml
# for the measured failure -- it is where the race was reproduced (gcp-0's first
# deploy, 2026-08-25). aws-0 kept the racy arrangement longer because a
# long-running cluster already has its webhooks up, so it only bites a cold
# rebuild.
#
# Ordering runs the other way too, which is why this is a good boundary rather
# than a workaround: the openbao ClusterIssuer needs the two Secrets that the
# ExternalSecrets produce, and those need External Secrets running. One group
# installs controllers; the other configures them.
#
# The Let's Encrypt issuers used to be in this directory. They are ACME/Route53
# and have nothing to do with OpenBao, so they moved to
# ../cert-manager-public/, applied by `security-public-certs` -- the same split
# gcp-0 already had.
# `openbao-endpoint/local` because this cluster consumes the OpenBao in its own
# cloud. A cluster consuming the OTHER cloud's active OpenBao lists
# `../../base/openbao-endpoint/remote` instead and sets openbao_target_ip in
# its configure stack -- see the cross-cloud failover guide.
#
# `cert-manager-token-creator` is the RBAC precondition of the ClusterIssuer
# below: without it cert-manager cannot mint the projected ServiceAccount token
# it authenticates to OpenBao with, and the issuer never goes Ready. It travels
# with the issuer that needs it -- see that directory's rbac.yaml.
resources:
  - ../../base/openbao-endpoint/local
  - ../../base/cert-manager-token-creator
  - clustersecretstore.yaml
  - openbao-ca-externalsecret.yaml
  - openbao-clusterissuer.yaml
