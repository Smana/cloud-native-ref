apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openbao-ca
  namespace: security
spec:
  # Backs caBundleSecretRef on the openbao ClusterIssuer. The chain used to be
  # a base64 blob pasted into the ClusterIssuer, which meant rotating the
  # intermediate required hand-editing a manifest or every issuance broke, with
  # nothing tracking the expiry.
  #
  # `security` is cert-manager's cluster resource namespace (the chart defaults
  # it to the release namespace and the HelmRelease does not override it), so a
  # ClusterIssuer resolves secret references here.
  data:
    - secretKey: ca.crt  # pragma: allowlist secret
      remoteRef:
        # Certificates only -- intermediate then root -- under the `ca` key.
        # The former `root-ca` entry, which also held the ROOT private key, is
        # gone: the root is offline and the intermediate lives in
        # certificates/<domain>/intermediate-ca, which nothing in-cluster reads.
        key: certificates/${private_domain_name}/ca-chain
        property: ca
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: clustersecretstore
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    name: openbao-ca
