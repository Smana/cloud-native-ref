apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The controllers, and NOTHING they admit.
#
# ../base/cert-manager and ../base/external-secrets are chart-only directories:
# the ClusterIssuers, ClusterSecretStore and ExternalSecrets their webhooks
# admit live in ./openbao and ./cert-manager-public, applied by the
# `security-openbao` and `security-public-certs` Kustomizations. Applying those
# in the same Kustomization as the charts races the webhook Services having
# endpoints -- see security/gcp-0/controllers/kustomization.yaml for the
# measured failure.
#
# ./openbao-snapshot and ../base/tailscale-operator moved out for the same
# reason -- each renders an ExternalSecret that needs the ClusterSecretStore
# from ./openbao -- and are now applied by `security-openbao-snapshot` and
# `security-tailscale`.
#
# kyverno and rbac stay: neither renders anything either webhook admits.
#
# ../base/cert-manager-token-creator stays for the same reason -- it is a plain
# Role and RoleBinding, admitted by no webhook, without which cert-manager cannot
# mint the ServiceAccount token it authenticates with. It is applied HERE, with
# cert-manager itself, rather than from ./openbao: `security-openbao` and
# `security-public-certs` both dependsOn this Kustomization and neither depends
# on the other, so this is the only place the Role can go without one issuer
# family's ordering depending on the other's.
# ../base/cert-manager-token-creator/rbac.yaml has the whole argument.
resources:
  - ../base/kyverno
  - ../base/rbac
  - ../base/cert-manager
  - ../base/cert-manager-token-creator
  - external-secrets
