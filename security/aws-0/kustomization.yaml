apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The controllers, and NOTHING they admit.
#
# cert-manager and external-secrets are referenced BY FILE: their base
# directories also carry the ClusterIssuers, ExternalSecrets and
# ClusterSecretStore their own webhooks admit, and applying those in the same
# Kustomization as the charts races the webhook Services having endpoints. Those
# live in ./openbao, applied by the `security-openbao` Kustomization which
# dependsOn this one. See that directory for the measured failure.
#
# ./openbao-snapshot and ../base/tailscale-operator moved out for the same
# reason -- each renders an ExternalSecret that needs the ClusterSecretStore
# from ./openbao -- and are now applied by `security-openbao-snapshot` and
# `security-tailscale`.
#
# kyverno and rbac stay: neither renders anything either webhook admits.
resources:
  - ../base/kyverno
  - ../base/rbac
  - ../base/cert-manager/helmrelease.yaml
  - external-secrets
