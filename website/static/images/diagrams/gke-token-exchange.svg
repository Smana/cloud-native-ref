<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1040" height="520" viewBox="0 0 1040 520"
     style="background: transparent; background-color: transparent; color-scheme: light dark;">
  <title>Per-user RBAC on GKE through an RFC 8693 token exchange</title>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrowAccent" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6366f1"/>
    </marker>
    <marker id="arrowOk" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/>
    </marker>
  </defs>

  <g font-family="Helvetica" font-size="13" fill="#1E293B">

    <!-- ─── the cluster boundary ─────────────────────────────────────── -->
    <rect x="150" y="86" width="600" height="180" rx="10"
          fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="162" y="106" font-size="12" fill="#64748b">gcp-0 cluster</text>

    <!-- ─── browser ──────────────────────────────────────────────────── -->
    <rect x="20" y="140" width="104" height="56" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
    <text x="72" y="165" text-anchor="middle" font-weight="bold">browser</text>
    <text x="72" y="182" text-anchor="middle" font-size="11" fill="#475569">a human</text>

    <!-- ─── oauth2-proxy ─────────────────────────────────────────────── -->
    <rect x="170" y="140" width="132" height="56" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
    <text x="236" y="164" text-anchor="middle" font-weight="bold">oauth2-proxy</text>
    <text x="236" y="181" text-anchor="middle" font-size="11" fill="#475569">authenticates</text>

    <!-- ─── the exchange proxy ───────────────────────────────────────── -->
    <rect x="344" y="132" width="164" height="72" rx="8" fill="#ede9fe" stroke="#6366f1" stroke-width="2"/>
    <text x="426" y="156" text-anchor="middle" font-weight="bold">token-exchange</text>
    <text x="426" y="172" text-anchor="middle" font-weight="bold">proxy</text>
    <text x="426" y="190" text-anchor="middle" font-size="11" fill="#475569">RFC 8693</text>

    <!-- ─── headlamp ─────────────────────────────────────────────────── -->
    <rect x="550" y="140" width="120" height="56" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
    <text x="610" y="164" text-anchor="middle" font-weight="bold">Headlamp</text>
    <text x="610" y="181" text-anchor="middle" font-size="11" fill="#475569">forwards only</text>

    <!-- ─── the API server ───────────────────────────────────────────── -->
    <rect x="800" y="132" width="200" height="72" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
    <text x="900" y="158" text-anchor="middle" font-weight="bold">GKE API server</text>
    <text x="900" y="176" text-anchor="middle" font-size="11" fill="#475569">trusts Google,</text>
    <text x="900" y="191" text-anchor="middle" font-size="11" fill="#475569">never ZITADEL</text>

    <!-- ─── ZITADEL (external) ───────────────────────────────────────── -->
    <rect x="170" y="26" width="132" height="48" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="236" y="47" text-anchor="middle" font-weight="bold">ZITADEL</text>
    <text x="236" y="63" text-anchor="middle" font-size="11" fill="#475569">the IdP</text>

    <!-- ─── Google STS (external) ────────────────────────────────────── -->
    <rect x="352" y="300" width="148" height="52" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="426" y="322" text-anchor="middle" font-weight="bold">Google STS</text>
    <text x="426" y="338" text-anchor="middle" font-size="11" fill="#475569">workforce pool</text>

    <!-- ─── flow arrows ──────────────────────────────────────────────── -->
    <line x1="124" y1="168" x2="166" y2="168" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

    <line x1="236" y1="140" x2="236" y2="78" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
    <text x="246" y="112" font-size="11" fill="#92400e">OIDC login</text>

    <line x1="302" y1="168" x2="340" y2="168" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arrowAccent)"/>
    <text x="321" y="158" text-anchor="middle" font-size="10" fill="#4338ca">id_token</text>

    <line x1="426" y1="204" x2="426" y2="296" stroke="#d97706" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="452" y1="296" x2="452" y2="208" stroke="#059669" stroke-width="1.5" marker-end="url(#arrowOk)"/>
    <text x="336" y="252" font-size="10" fill="#92400e">subject</text>
    <text x="336" y="265" font-size="10" fill="#92400e">token</text>
    <text x="462" y="252" font-size="10" fill="#047857">federated</text>
    <text x="462" y="265" font-size="10" fill="#047857">token, 1h</text>

    <line x1="508" y1="168" x2="546" y2="168" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arrowAccent)"/>
    <text x="527" y="158" text-anchor="middle" font-size="10" fill="#4338ca">X-Gke-Token</text>

    <line x1="670" y1="168" x2="796" y2="168" stroke="#059669" stroke-width="2" marker-end="url(#arrowOk)"/>
    <text x="733" y="158" text-anchor="middle" font-size="10" fill="#047857">Authorization: Bearer</text>

    <!-- ─── what the API server resolves ─────────────────────────────── -->
    <rect x="640" y="286" width="380" height="118" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <text x="656" y="308" font-weight="bold" fill="#065f46">the API server resolves</text>
    <text x="656" y="330" font-size="11" font-family="monospace" fill="#1E293B">user:   principal://…/subject/&lt;zitadel sub&gt;</text>
    <text x="656" y="350" font-size="11" font-family="monospace" fill="#1E293B">groups: principalSet://…/group/admin</text>
    <line x1="656" y1="362" x2="1004" y2="362" stroke="#a7f3d0" stroke-width="1"/>
    <text x="656" y="382" font-size="11" fill="#065f46">authorised by an ordinary ClusterRoleBinding,</text>
    <text x="656" y="396" font-size="11" fill="#065f46">exactly as on aws-0</text>
    <line x1="900" y1="204" x2="900" y2="282" stroke="#059669" stroke-width="1.5" marker-end="url(#arrowOk)"/>

    <!-- ─── the point ────────────────────────────────────────────────── -->
    <rect x="20" y="286" width="300" height="118" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="36" y="308" font-weight="bold" fill="#991b1b">why a proxy at all</text>
    <text x="36" y="330" font-size="11">GKE accepts no custom OIDC issuer, and</text>
    <text x="36" y="345" font-size="11">Headlamp cannot perform the exchange</text>
    <text x="36" y="360" font-size="11">itself — but it CAN forward a token a</text>
    <text x="36" y="375" font-size="11">proxy hands it. That gap is the whole</text>
    <text x="36" y="390" font-size="11">reason this component exists.</text>

    <!-- ─── the security note ────────────────────────────────────────── -->
    <rect x="20" y="428" width="1000" height="70" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
    <text x="36" y="450" font-weight="bold">Scope is not authority.</text>
    <text x="188" y="450" font-size="12">The exchange asks for cloud-platform scope, but a workforce principal has no default IAM permissions —</text>
    <text x="36" y="468" font-size="12">so the same token that lists 46 pods is refused (403) by Cloud Resource Manager and Cloud Storage. The credential is powerful</text>
    <text x="36" y="486" font-size="12">inside the cluster and inert outside it, which is the opposite of authenticating users as Google Workspace humans.</text>

  </g>
</svg>
