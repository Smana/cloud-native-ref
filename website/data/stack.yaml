# Every component this platform runs, its version, and where that version is
# pinned. Rendered by layouts/_shortcodes/stack-table.html on Reference →
# Technology Stack, and by stack-strip.html on the landing page.
#
# Versions were re-read from their pins on 2026-08-20 — mise.toml,
# opentofu/config.tm.hcl, an OpenTofu variable default, or a HelmRelease /
# OCIRepository — not copied from prose. Where a component has no version
# pinned in this repository, `version` says so rather than guessing a number.
#
# Fields
#   name        display name
#   short       shorter label for the landing-page strip, where the full name
#               would not fit a chip; falls back to `name`
#   version     as pinned, verbatim
#   logo        basename under static/images/logos/; omit for a typographic tile
#   logo_dark   light-ink variant, for marks that vanish on the dark theme
#   pin         where the version lives (Markdown); omit when the group sets pin_note
#   url         the project's home
#   note        optional caveat, rendered under the row
#   strip       true = also appears in the landing-page strip
#
# Group `pin_note` hoists a pin shared by every row out of the per-row column,
# which is what stops the CLI table repeating `mise.toml` eleven times.
groups:
  - id: cli
    title: CLI tools
    pin_note: "All pinned in `mise.toml`. Run `mise install` to get exactly these."
    items:
      - name: OpenTofu
        version: "1.12.6"
        logo: opentofu
        url: https://opentofu.org
        strip: true
      - name: Terramate
        version: "0.17.2"
        url: https://terramate.io
        strip: true
      - name: Flux CLI (+ schema plugin)
        version: "2.9.4"
        logo: flux
        url: https://fluxcd.io
      - name: Helm
        version: "4.2.4"
        logo: helm
        logo_dark: helm-dark
        url: https://helm.sh
      - name: Kustomize
        version: "5.8.1"
        url: https://kustomize.io
      - name: Trivy
        version: "0.74.0"
        logo: trivy
        logo_dark: trivy-dark
        url: https://trivy.dev
      - name: Go
        version: "1.27.0"
        logo: go
        url: https://go.dev
      - name: Node.js
        version: "22.23.1"
        logo: nodejs
        url: https://nodejs.org
      - name: golangci-lint
        version: "2.12.2"
        url: https://golangci-lint.run
      - name: pre-commit
        version: "4.6.2"
        url: https://pre-commit.com
      - name: Hugo (extended)
        version: "0.156.0"
        logo: hugo
        url: https://gohugo.io
        note: Required for this site — Hextra targets the extended build.

  - id: bootstrap
    title: EKS bootstrap
    items:
      - name: Kubernetes (EKS control plane)
        short: Kubernetes
        version: "1.36"
        logo: kubernetes
        url: https://kubernetes.io
        pin: "`opentofu/eks/init/variables.tf` — `kubernetes_version` default, not overridden in `variables.tfvars`"
        strip: true
      - name: Cilium
        version: "1.20.0"
        logo: cilium
        url: https://cilium.io
        pin: "`opentofu/config.tm.hcl` — `cilium_version`"
        strip: true
      - name: Flux Operator
        short: Flux
        version: "0.55.0"
        logo: flux
        url: https://fluxcd.control-plane.io
        pin: "`opentofu/config.tm.hcl` — `flux_operator_version`"
        strip: true
      - name: Flux Instance
        version: "0.55.0"
        logo: flux
        url: https://fluxcd.io
        pin: "`opentofu/config.tm.hcl` — `flux_instance_version`"
      - name: Gateway API CRDs
        short: Gateway API
        version: "v1.6.1"
        url: https://gateway-api.sigs.k8s.io
        pin: "`opentofu/eks/configure/variables.tf` — `gateway_api_version` default"
        strip: true

  - id: infrastructure
    title: Infrastructure
    items:
      - name: Crossplane (controller)
        short: Crossplane
        version: "2.3.4"
        logo: crossplane
        url: https://crossplane.io
        pin: "`infrastructure/base/crossplane/controller/helmrelease.yaml`"
        strip: true
      - name: Crossplane Configuration package
        version: "v0.1.0"
        logo: crossplane
        url: https://github.com/Smana/crossplane-configuration
        pin: "`infrastructure/base/crossplane/configuration/configuration-packages.yaml`"
        note: The compositions themselves are built and released from `Smana/crossplane-configuration`, not from this repository.
      - name: Karpenter
        version: "1.13.0"
        logo: karpenter
        url: https://karpenter.sh
        pin: "`flux/sources/ocirepo-karpenter.yaml`"
        strip: true
      - name: KEDA
        version: "2.20.2"
        logo: keda
        url: https://keda.sh
        pin: "`infrastructure/base/keda/helmrelease.yaml`"
      - name: CloudNativePG (operator)
        short: CloudNativePG
        version: "0.29.0"
        logo: cloudnativepg
        url: https://cloudnative-pg.io
        pin: "`infrastructure/base/cloudnative-pg/helmrelease.yaml`"
        strip: true
      - name: Atlas Operator
        version: "0.7.11"
        url: https://atlasgo.io
        pin: "`flux/sources/ocirepo-atlas-operator.yaml`"
        note: v0.7.11 does not support `dir.remote` for Git repositories; migrations use the GitOps/ConfigMap pattern instead.
      - name: AWS Load Balancer Controller
        version: "3.5.0"
        url: https://kubernetes-sigs.github.io/aws-load-balancer-controller/
        pin: "`infrastructure/base/aws-load-balancer-controller/helmrelease.yaml`"
      - name: AWS EFS CSI driver
        version: "4.4.1"
        url: https://github.com/kubernetes-sigs/aws-efs-csi-driver
        pin: "`infrastructure/base/aws-efs-csi-driver/helmrelease.yaml`"
        note: Chart 4.x ships driver v3.x, needed for S3 Files access points.
      - name: External DNS
        version: "1.21.1"
        url: https://kubernetes-sigs.github.io/external-dns/
        pin: "`infrastructure/base/external-dns/helmrelease.yaml`"
      - name: Envoy Gateway
        version: "1.9.0"
        logo: envoy
        url: https://gateway.envoyproxy.io
        pin: "`flux/sources/ocirepo-envoy-gateway.yaml`"
        note: LLM platform, opt-in.
      - name: Envoy AI Gateway
        version: "1.0.0"
        logo: envoy
        url: https://aigateway.envoyproxy.io
        pin: "`flux/sources/ocirepo-envoy-ai-gateway.yaml`"
        note: LLM platform, opt-in.
      - name: vLLM Semantic Router
        version: "0.2.0"
        logo: vllm
        url: https://github.com/vllm-project/semantic-router
        pin: "`flux/sources/ocirepo-vllm-semantic-router.yaml`"
        note: LLM platform, opt-in.

