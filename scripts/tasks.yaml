version: "3"

tasks:
  validate:
    desc: Render the repo as Flux would, then gate it (schema + polaris)
    cmds: ["{{.TASKFILE_DIR}}/ci/validate-manifests.sh"]

  test:
    desc: Run every shell and Python test suite the environment can satisfy
    cmds: ["{{.TASKFILE_DIR}}/ci/tests/run.sh"]

  links:
    desc: Resolve every relative Markdown link
    cmds: ["{{.TASKFILE_DIR}}/ci/validate-links.sh"]

  vmrules:
    desc: Parse the PromQL in every repo-authored VMRule
    cmds: ["{{.TASKFILE_DIR}}/ci/validate-vmrules.sh"]

  alertmanager:
    desc: Render the Slack templates against the fixture payloads
    cmds: ["{{.TASKFILE_DIR}}/ci/validate-alertmanager-templates.sh"]

  doc-claims:
    desc: Check documentation claims against configuration
    cmds: ["{{.TASKFILE_DIR}}/ci/validate-doc-claims.sh"]

  doc-paths:
    desc: Check every backticked repository path in the docs site exists
    cmds: ["{{.TASKFILE_DIR}}/ci/verify-doc-paths.sh"]

  idp-topology:
    desc: Assert exactly one cloud hosts ZITADEL (ADR-0027)
    cmds: ["{{.TASKFILE_DIR}}/ci/validate-idp-topology.sh"]

  vector-vrl:
    desc: Test the CNPG auto_explain VRL in the timberio/vector image (needs docker)
    cmds: ["{{.TASKFILE_DIR}}/ci/validate-vector-vrl.sh"]
