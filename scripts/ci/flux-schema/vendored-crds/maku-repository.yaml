                x-kubernetes-list-type: map
              liveCount:
                minimum: 0
                type: integer
              merge:
                description: Merge is the repository's merge settings as resolved,
                  the Factory's defaults applied (Q8).
                properties:
                  approveToMerge:
                    description: |-
                      ApproveToMerge: a maintainer's APPROVED review of the current head arms the merger on an
