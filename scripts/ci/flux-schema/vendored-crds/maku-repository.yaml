                    type: boolean
                  leakScanCheck:
                    maxLength: 1024
                    type: string
                  mergerLogin:
                    maxLength: 253
                    type: string
                  policyBot:
                    description: |-
                      PolicyBot false drops policy-bot from the gate and needs gateStatus: maku/merge-gate is then
                      the status branch protection requires (D11); nil means true.
                    type: boolean
                  policyBotLogin:
                    maxLength: 253
                    type: string
                  requiredChecks:
                    description: The 8 contexts classic protection requires, by name
