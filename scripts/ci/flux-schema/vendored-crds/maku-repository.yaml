                      minimum: 0
                      type: integer
                    maxPerDay:
                      minimum: 0
                      type: integer
                    mode:
                      enum:
                      - live
                      - shadow
                      - "off"
                      type: string
                    name:
                      description: Name is the MergePolicy's, so the class's (B1).
                      maxLength: 40
                      pattern: ^[a-z0-9]([-a-z0-9]{0,38}[a-z0-9])?$
                      type: string
                    oracleWorkflow:
                      description: OracleWorkflow is the workflow on main whose runs
