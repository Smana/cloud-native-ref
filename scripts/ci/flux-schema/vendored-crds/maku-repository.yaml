                      maxLength: 253
                      type: string
                    text:
                      maxLength: 14336
                      type: string
                  type: object
                maxItems: 16
                type: array
              triggerLabel:
                maxLength: 50
                type: string
            required:
            - factoryRef
            - repository
            type: object
            x-kubernetes-validations:
            - message: review is bound with mode off and no parameter
              rule: '!has(self.mergePolicies) || !self.mergePolicies.exists(b, b.name
                == ''review'' && (b.mode != ''off'' || has(b.allowedFiles) || has(b.companionFiles)
                || has(b.requiredLabel) || has(b.oracleWorkflow) || has(b.holdoutChecks)
                || has(b.protectedFiles) || has(b.requiresApproval) || has(b.maxPatchFiles)
                || has(b.maxModifiedLines) || has(b.maxPerDay)))'
            - message: bind docs-links and revert when any policy is bound (OD-8)
              rule: '!has(self.mergePolicies) || size(self.mergePolicies) == 0 ||
                (self.mergePolicies.exists(b, b.name == ''docs-links'') && self.mergePolicies.exists(b,
                b.name == ''revert''))'
            - message: 'classAuthority repository: the repository''s file holds the
                bindings (MP15)'
              rule: '!has(self.classAuthority) || self.classAuthority != ''repository''
                || !has(self.mergePolicies)'
            - message: spec.factoryRef is fixed once set
              rule: '!has(oldSelf.factoryRef) || self.factoryRef == oldSelf.factoryRef'
            - message: spec.repository is fixed once set
              rule: '!has(oldSelf.repository) || self.repository == oldSelf.repository'
          status:
            description: RepositoryStatus is what the factory made of its Repository
              (D11, narrowed for v1).
            properties:
              authority:
                description: 'Authority is who declares the classes: central, or the
                  repository''s file (MP15).'
                enum:
                - central
                - repository
                type: string
              classCount:
                description: 'ClassCount and LiveCount are always serialized, zero
