                    items:
                      maxLength: 1024
                      type: string
                    maxItems: 64
                    type: array
                  revertWindow:
                    maxLength: 32
                    pattern: ^([0-9]+(\.[0-9]+)?(ns|us|µs|ms|s|m|h))+$
