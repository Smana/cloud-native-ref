                      maxLength: 1024
                      type: string
                    protectedFiles:
                      items:
                        maxLength: 512
                        type: string
                      maxItems: 64
                      type: array
                    requiredLabel:
                      maxLength: 253
                      type: string
                    requiresApproval:
                      items:
                        description: ApprovalLeaf asks a human about a pull request
