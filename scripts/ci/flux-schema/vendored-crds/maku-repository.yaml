                      type: string
                    dataClass:
                      maxLength: 253
                      type: string
                    name:
                      maxLength: 253
                      type: string
                    probe:
                      maxLength: 1024
                      type: string
                    probeAuthor:
                      description: 'ProbeAuthor is the login whose open PRs the probe
