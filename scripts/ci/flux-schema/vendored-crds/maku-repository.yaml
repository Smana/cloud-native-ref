# VENDORED, NOT APPLIED. Maku v0.47.0 config/crd/maku.ogenki.io_repositories.yaml, copied verbatim below.
# It exists so `flux schema validate` knows the repository kind (maku.ogenki.io/v1alpha1) that
# ai-native-ref commits; the CRD itself is installed with Maku, not from here.
# Refresh it when Maku bumps and a field you need is missing.
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: repositories.maku.ogenki.io
spec:
  group: maku.ogenki.io
  names:
    kind: Repository
    listKind: RepositoryList
    plural: repositories
    singular: repository
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.repository
      name: Repo
      type: string
    - jsonPath: .spec.factoryRef
      name: Factory
      type: string
    - jsonPath: .status.classCount
      name: Classes
      type: integer
    - jsonPath: .status.liveCount
      name: Live
      type: integer
    - jsonPath: .status.conditions[?(@.type=="Accepted")].status
      name: Accepted
      type: string
    - jsonPath: .status.conditions[?(@.type=="Connected")].status
      name: Connected
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Repository is one repository a Factory serves (D3).
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              RepositorySpec is one repository served (D3): today's repositories[] entry. Its merge settings
              and the MergePolicies it binds are here (reusable merge policies B2, B3), or, in the
              per-repository shape, in the MergePolicy that names it.
            properties:
              checks:
                description: |-
                  Checks is what a check-enabled run of the repository requests beyond github (v3 feature 3,
                  RC7): the platform names the egress, never the repository's own file.
                properties:
                  egress:
                    items:
                      maxLength: 1024
                      type: string
                    maxItems: 64
                    type: array
                type: object
              classAuthority:
                enum:
                - central
                - repository
                type: string
              factoryRef:
                maxLength: 63
                minLength: 1
                type: string
              maintainers:
                items:
                  maxLength: 39
                  type: string
                maxItems: 32
                type: array
              merge:
                description: 'Merge is the repository''s merge settings (B2): config.Merge,
                  plus fluxSource.'
                properties:
                  approveToMerge:
                    description: |-
                      ApproveToMerge: a maintainer's APPROVED review of the current head arms the merger on an
                      agents pull request (human path AM1). Off, the approval hands off to a human merge.
                    type: boolean
                  autoMergesPerDay:
                    type: integer
                  awaitingCIFor:
                    description: |-
                      AwaitingCIFor bounds a pull request's stay in AwaitingCI on a wait verdict (#182): past it,
                      a human is told which checks never reported. Omitted, Parse sets 24h (D2); 0s is no bound.
                      Read it through AwaitingCIBound.
                    maxLength: 32
                    pattern: ^([0-9]+(\.[0-9]+)?(ns|us|µs|ms|s|m|h))+$
                    type: string
                  breaker:
                    description: |-
                      Breaker is the circuit breaker's outcome window (R41, review G5): a class whose last Window
                      merges hold MaxReverts reverts is demoted to human review, whatever the config.
                    properties:
                      maxFollowUps:
                        description: |-
                          MaxFollowUps: follow-up fixes and monitor regressions in the last Window merges that demote
                          a class (MC8); 0 counts none.
                        type: integer
                      maxReverts:
                        type: integer
                      recoverAfter:
                        description: |-
                          RecoverAfter: a tripped class resumes once this many of its newest merges, all newer than the
                          newest bad one, are clean and mature (human path AM7); 0 keeps the window rule alone.
                        type: integer
                      window:
                        type: integer
                    type: object
                  checkReruns:
                    description: |-
                      CheckReruns caps the re-runs of a cancelled required check per task; 0 hands it to a human
                      instead. Above 0 the merger App must hold actions: write.
