                    maxLength: 1024
                    type: string
                  fixRuns:
                    format: int32
                    type: integer
                  fluxSource:
                    description: |-
                      FluxSource is the GitRepository that delivers the repository to the factory's cluster,
                      namespace/name: the source every monitor.flux of a bound MergePolicy watches (B2, Q14).
                    maxLength: 1024
                    type: string
                  gateStatus:
                    description: GateStatus makes the factory post the gate's verdict
