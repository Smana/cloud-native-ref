                        properties:
                          changedFiles:
                            items:
                              maxLength: 512
                              type: string
                            maxItems: 64
                            type: array
                        type: object
                      maxItems: 16
                      type: array
                  required:
                  - mode
                  - name
                  type: object
                maxItems: 32
                type: array
                x-kubernetes-list-map-keys:
