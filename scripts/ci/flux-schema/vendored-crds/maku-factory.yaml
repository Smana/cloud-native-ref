# VENDORED, NOT APPLIED. Maku v0.41.0 config/crd/maku.ogenki.io_factories.yaml, copied verbatim below.
# It exists so `flux schema validate` knows the factory kind (maku.ogenki.io/v1alpha1) that
# ai-native-ref commits; the CRD itself is installed with Maku, not from here.
# Refresh it when Maku bumps and a field you need is missing.
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: factories.maku.ogenki.io
spec:
  group: maku.ogenki.io
  names:
    kind: Factory
    listKind: FactoryList
    plural: factories
    singular: factory
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Accepted")].status
      name: Accepted
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.repositories
      name: Repos
      type: integer
    - jsonPath: .status.stopped
      name: Stopped
      type: boolean
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Factory is one factory's catalogue (D3). Its name is config.factory,
          the fence's (D15).
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              FactorySpec is the factory's catalogue (D3, D12), in today's config keys. prices is today's
              meter.prices: the meter's URL and queries stay in the values.
            properties:
              brief:
                description: |-
                  Brief is what a revision brief quotes from GitHub beyond the room's own log (CD12). A switch here
                  lands with the code that reads it: both decoders refuse a key they do not know, so a file written
                  for a later release fails this one's rollout instead of silently changing nothing.
                properties:
                  ciEvidence:
                    description: |-
                      CIEvidence is CD12: a revision brief carries, fenced as untrusted data, what the open change
                      requests asked for and what the failing checks annotated — the reviewer's comments and the
                      failing job are the cheapest context a revision can have. Each is bounded by its read and
                      cleaned where it is rendered, and a source the merger App cannot read leaves one sentence.
                      Off by default: a room that reads it needs the release that writes it.
                    type: boolean
                type: object
              budgets:
                description: |-
                  Budgets are the admission-time caps SP3 owns (C5). The task cap is enforced unless the config
                  writes enforceTask: false (owner, 2026-10-07: a shadow cap let a task run to 3.35 M of its 3 M);
                  the principal's starts false, a week of shadow numbers first (OD-10, R3). The run cap is always
                  enforced by the meter. The days are in USD (truthful costs TC5): the day ledger counts each
                  run's priced cost, a cache read at its own rate.
                properties:
                  enforcePrincipal:
                    type: boolean
                  enforceTask:
                    type: boolean
                  factoryDaily:
                    description: |-
                      The token days the USD days replaced (#155), accepted for one release so that a file
                      written for the previous one still loads: Parse names each in Config.Ignored and clears it.
                    format: int64
                    type: integer
                  factoryDailyUSD:
                    type: number
                  humanDaily:
                    format: int64
                    type: integer
                  humanDailyUSD:
                    type: number
                  perPerson:
                    description: 'PerPerson is v2''s per-person caps: off, every run
                      is admitted as before.'
                    properties:
                      dailyTokens:
                        description: IgnoredDailyTokens is the token day DailyUSD
                          replaced, accepted for one release (Budgets).
                        format: int64
                        type: integer
                      dailyUSD:
                        description: 'DailyUSD is every person''s day (D7: one value,
                          no per-person override). Omitted: humanDailyUSD.'
                        type: number
                      enabled:
                        type: boolean
                    type: object
                type: object
              caps:
                description: Caps bound the factory's throughput (§6.2).
                properties:
                  activeTasks:
                    type: integer
                  awaitingHumanWIP:
                    description: |-
                      AwaitingHumanWIP bounds the tasks waiting on a human review before the factory queues
                      more of the review-class work that produces them (§6.2's back-pressure on reviewers).
                      Required, never defaulted: a config that omits it fails its rollout (§4).
                    type: integer
                  concurrentRuns:
                    type: integer
                  escalatedHours:
                    description: |-
                      EscalatedHours is how long a task may wait Escalated for a maintainer before it is
                      Stopped (#61); otherwise it polls GitHub until its issue or pull request closes.
                      Omitted: 168. An explicit 0: no limit. A pointer tells the two apart.
                    type: integer
                  maxPendingMinutes:
                    description: |-
                      How long a run that never started may sit Pending before the task escalates as
                      run_unschedulable (P): no other layer bounds it — activeDeadlineSeconds counts from the
                      pod's start, and Kueue queues unadmitted work forever. Defaulted when omitted, never left
                      open.
                    type: integer
                  maxTextBytes:
                    type: integer
                  preferRevisions:
                    description: |-
                      PreferRevisions is CD22: while any task in the factory waits for a slot to run a revision
                      (a run that continues a task which already has one), a task whose next run is its first
                      waits with the reason waiting_revision_first. Caps still bind: this priority never overrides
                      a limit, and nothing is reserved — a first run gives up one slot-time. Off by default.
                    type: boolean
                  tasksPerDay:
                    type: integer
                type: object
              control:
                description: |-
                  Control is the pinned issue whose factory/stop label is the global stop (§6.1). Issue 0: none,
                  and only the stop object stops the factory.
                properties:
                  issue:
                    type: integer
                  repository:
                    maxLength: 253
                    type: string
                type: object
              defaults:
                description: Defaults apply when triage leaves a value open.
                properties:
                  dataClass:
                    maxLength: 253
                    type: string
                  predictedClass:
                    maxLength: 253
                    type: string
                  template:
                    maxLength: 253
                    type: string
                  tier:
                    maxLength: 253
                    type: string
                type: object
              evaluation:
                description: Evaluation is the team evaluation's cohort share and
                  mode, read per decision.
                properties:
                  controlPercent:
                    maximum: 100
                    minimum: 0
                    type: integer
                  mode:
                    enum:
                    - observe
                    - apply
                    type: string
                type: object
              facts:
                description: |-
                  Facts are what a terminal task tells its room about its dollars (CD23). A switch here lands with
                  the code that reads it: both decoders refuse a key they do not know, so a file written for a
                  later release fails this one's rollout instead of silently changing nothing.
                properties:
                  finalSpend:
                    description: |-
                      FinalSpend is CD23: a terminal task requeues once at its last run's end plus the settle
                      window plus a margin, prices its runs again, and posts one fact whose dollars it will not
                      change — the facts key stops bucketing dollars for it. Off by default: it is a new claim
                      about money, and a room that read it needs the release that writes it.
                    type: boolean
                type: object
              harnessProfiles:
                additionalProperties:
                  description: |-
                    HarnessProfile is a named, centrally approved way of running a class (merge policy MP2). Stage 1
                    reads Checks and TestFirst; Template, Tier and Loop are validated here and read from repository
                    cutover on. Empty keeps what the factory selects today.
                  properties:
                    checks:
                      type: boolean
                    description:
                      description: 'Description is the line the scoper''s brief shows:
                        when to choose the profile.'
                      maxLength: 120
                      type: string
                    loop:
                      description: LoopRef names a row of loops, or off.
                      maxLength: 253
                      type: string
                    template:
                      maxLength: 253
                      type: string
                    testFirst:
                      type: boolean
                    tier:
                      maxLength: 253
                      type: string
                  type: object
                maxProperties: 16
                type: object
              loops:
                additionalProperties:
                  description: |-
                    Loop is one row of loops. A row switches its class's loop on when it sets any of the three
                    keys (D4: no row, or a row without them, is today's run); an unset key then takes the
                    design's default. Rows are keyed by class so the scoper's switch (scoper design SC2,
                    loops.<class>.scope) joins them as one more key.
                  properties:
                    continuations:
                      description: 'Continuations is how many not_yet verdicts continue
                        the conversation (L2): 0 to 5, default 2.'
                      format: int32
                      type: integer
                    judge:
                      description: 'Judge is the completion judge''s alias, or none
                        for no judge (L2): default tier-light.'
                      maxLength: 253
                      type: string
                    models:
                      additionalProperties:
                        additionalProperties:
                          description: ModelAlias is a provider alias, a named type
                            for the same reason.
                          maxLength: 253
                          type: string
                        description: |-
                          ModelAliases is tier → provider alias, one role's row of Loop.Models. It is a named type so the
                          CRD can bound the inner map.
                        maxProperties: 32
                        type: object
                      description: |-
                        Models is role → tier → the provider alias that role runs on for a public task of that tier
                        (v3 F15, F3); a role or tier without an entry, and every internal task, keep today's model.
                        It never switches the loop on.
                      maxProperties: 32
                      type: object
                    scope:
                      description: |-
                        Scope is the class's scope mode (scoper design SC2): off, steering or scoper; unset is off.
                        It never switches the loop on: On reads the loop's three keys only.
                      maxLength: 253
                      type: string
                    search:
                      description: |-
                        Search offers the class's implementer runs the search tool (v3 feature 5, ST9); absent is off.
                        It never switches the loop on: On reads the loop's three keys only.
                      type: boolean
                    split:
                      description: |-
                        Split offers the scoper a split of the class's hard tasks (splitter design SL3): absent, off.
                        It needs scope: scoper on the same row, and never switches the loop on.
                      properties:
                        anyTier:
                          description: |-
                            AnyTier offers the split to every task of the class, whatever tier C7 rated it (SP1's
                            option (b), an explicit opt-in); omitted, only a task C7 rated frontier is offered one.
                          type: boolean
                        childTier:
                          description: 'ChildTier is every child''s tier (SP5): omitted,
                            standard.'
                          maxLength: 253
                          type: string
                        familyUSD:
                          description: |-
                            FamilyUSD caps the parent's and every child's runs together; omitted, four of the child
                            tier's tasks (SP3: $20.40 on standard's $5.10).
                          type: number
                        maxChildren:
                          description: 'MaxChildren is the most parts a split may
                            hold: 2 to 5, required.'
                          format: int32
                          type: integer
                      type: object
                    stallSteps:
                      description: 'StallSteps ends a run with no commit by this many
                        steps (L3): 1 to 500, default 80.'
                      format: int32
                      type: integer
                  type: object
                maxProperties: 32
                type: object
              mergeGuardrails:
                description: |-
                  MergeGuardrails bound every repository's class policy (MP3, MP6): a class may add protected
                  paths and mandatory checks and choose lower caps, never the reverse. A cap of 0 is no guardrail.
                properties:
                  mandatoryChecks:
                    items:
                      maxLength: 1024
                      type: string
                    maxItems: 64
                    type: array
                  maxGrantLifetime:
                    description: |-
                      MaxGrantLifetime caps a saved approval grant's life from its creation or last renewal (merge
                      policy stage 5): the factory's lookup expires an older grant. 0 is DefaultGrantLifetime.
                    maxLength: 32
                    pattern: ^([0-9]+(\.[0-9]+)?(ns|us|µs|ms|s|m|h))+$
                    type: string
                  maxModifiedLines:
                    type: integer
                  maxPatchFiles:
                    type: integer
                  maxPerDay:
                    type: integer
                  minPromotionEvidence:
                    description: |-
                      MinPromotionEvidence is the clean shadow decisions a class needs before it may be promoted to
                      live (MP7): 0 is DefaultMinPromotionEvidence, and less is refused here. A promotion on less
                      needs an operator's exception, recorded per request, never a lower number here.
                    type: integer
                  protectedFiles:
                    items:
                      maxLength: 512
                      type: string
                    maxItems: 64
                    type: array
                type: object
              prices:
                additionalProperties:
                  description: |-
                    Price is a model's list price in USD per million tokens of each type the gateway reports.
                    The gateway's input count includes the cache reads and writes, so each is priced once.
                  properties:
                    cacheRead:
                      type: number
                    cacheWrite:
                      description: CacheWrite prices cache_creation_input; omitted,
                        the input rate (Z.ai bills no write).
                      type: number
                    checkedAt:
                      maxLength: 1024
                      type: string
                    input:
                      type: number
                    output:
                      type: number
                    source:
                      description: |-
                        Source is the provider page the row was read from, an https URL, and CheckedAt the day it
                        was read, YYYY-MM-DD: provenance for the human who confirms a drift finding (truthful costs
                        TC1). Validated when present; the meter never reads them.
                      maxLength: 1024
                      type: string
                  type: object
                maxProperties: 32
                type: object
              resume:
                description: Resume bounds the automatic resume of a run lost to its
                  infrastructure (disruption design §4).
                properties:
                  maxPerTask:
                    description: |-
                      MaxPerTask is how many runs of one task the factory resumes on its own; past it the task
                      escalates as before. Defaulted when omitted.
                    type: integer
                type: object
              scoper:
                description: |-
                  Scoper bounds a scoping run's exploration (harness roles HR2): the harness nudges the scoper to
                  hand off at NudgeAt tool calls and ends the run at MaxToolCalls, as budget_calls. The factory
                  writes both into the scoper brief's first line, which the harness reads. Each is defaulted alone
                  when omitted.
                properties:
                  maxToolCalls:
                    type: integer
                  nudgeAt:
                    type: integer
                type: object
              templates:
                additionalProperties:
                  description: 'Template is a team: the roles run in order on one
                    branch.'
                  properties:
                    maxReviewRounds:
                      format: int32
                      type: integer
                    reviewerModel:
                      description: |-
                        ReviewerModel is the reviewer's gateway name whatever the implementer's tier; empty keeps
                        the other tier's model. The run keeps the other tier's caps.
                      maxLength: 253
                      type: string
                    roles:
                      items:
                        maxLength: 253
                        type: string
                      maxItems: 64
                      type: array
                  type: object
                maxProperties: 16
                type: object
              tiers:
                additionalProperties:
                  description: |-
                    Tier is a model and its budgets. RunUSD and TaskUSD cap a run and a task in USD, priced by
                    meter.prices, in place of RunTokens and TaskTokens; 0 keeps the token cap. With meter.prices
                    set each defaults to RefUSD of its token cap.
                  properties:
                    model:
                      maxLength: 253
                      type: string
                    runMinutes:
                      format: int64
                      type: integer
                    runTokens:
                      format: int64
                      type: integer
                    runUSD:
                      type: number
                    taskTokens:
                      format: int64
                      type: integer
                    taskUSD:
                      type: number
                  type: object
                maxProperties: 16
                type: object
              triage:
                description: 'FactoryTriage is the live part of triage (D12): the
                  classifier''s URL stays in the values.'
                properties:
                  controlPercent:
                    maximum: 100
                    minimum: 0
                    type: integer
                type: object
            type: object
          status:
            description: FactoryStatus is what the factory made of its Factory (D11,
              narrowed for v1).
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                maxItems: 8
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                format: int64
                type: integer
              repositories:
                minimum: 0
                type: integer
              stopped:
                type: boolean
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
