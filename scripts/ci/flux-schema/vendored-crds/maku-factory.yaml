# VENDORED, NOT APPLIED. Maku v0.57.0 config/crd/maku.ogenki.io_factories.yaml, copied verbatim below.
# It exists so `flux schema validate` knows the factory kind (maku.ogenki.io/v1alpha1) that
# ai-native-ref commits; the CRD itself is installed with Maku, not from here.
# Refresh it when Maku bumps and a field you need is missing.
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: factories.maku.ogenki.io
spec:
  group: maku.ogenki.io
  names:
    kind: Factory
    listKind: FactoryList
    plural: factories
    singular: factory
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Accepted")].status
      name: Accepted
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.repositories
      name: Repos
      type: integer
    - jsonPath: .status.stopped
      name: Stopped
      type: boolean
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Factory is one factory's catalogue (D3). Its name is config.factory,
          the fence's (D15).
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              FactorySpec is the factory's catalogue (D3, D12), in today's config keys. prices is today's
              meter.prices: the meter's URL and queries stay in the values.
            properties:
              brief:
                description: |-
                  Brief is what a revision brief quotes from GitHub beyond the room's own log (CD12). A switch here
                  lands with the code that reads it: both decoders refuse a key they do not know, so a file written
                  for a later release fails this one's rollout instead of silently changing nothing.
                properties:
                  ciEvidence:
                    description: |-
                      CIEvidence is CD12: a revision brief carries, fenced as untrusted data, what the open change
                      requests asked for and what the failing checks annotated — the reviewer's comments and the
                      failing job are the cheapest context a revision can have. Each is bounded by its read and
                      cleaned where it is rendered, and a source the merger App cannot read leaves one sentence.
                      Off by default: a room that reads it needs the release that writes it.
                    type: boolean
                type: object
              budgets:
                description: |-
                  Budgets are the admission-time caps SP3 owns (C5). The task cap is enforced unless the config
                  writes enforceTask: false (owner, 2026-10-07: a shadow cap let a task run to 3.35 M of its 3 M);
                  the principal's starts false, a week of shadow numbers first (OD-10, R3). The run cap is always
                  enforced by the meter. The days are in USD (truthful costs TC5): the day ledger counts each
                  run's priced cost, a cache read at its own rate.
                properties:
                  enforcePrincipal:
                    type: boolean
                  enforceTask:
                    type: boolean
                  factoryDaily:
                    description: |-
                      The token days the USD days replaced (#155), accepted for one release so that a file
                      written for the previous one still loads: Parse names each in Config.Ignored and clears it.
                    format: int64
                    type: integer
                  factoryDailyUSD:
                    type: number
                  humanDaily:
                    format: int64
                    type: integer
                  humanDailyUSD:
                    type: number
                  perPerson:
                    description: 'PerPerson is v2''s per-person caps: off, every run
                      is admitted as before.'
                    properties:
                      dailyTokens:
                        description: IgnoredDailyTokens is the token day DailyUSD
                          replaced, accepted for one release (Budgets).
                        format: int64
                        type: integer
                      dailyUSD:
                        description: 'DailyUSD is every person''s day (D7: one value,
                          no per-person override). Omitted: humanDailyUSD.'
                        type: number
                      enabled:
                        type: boolean
                    type: object
                type: object
              caps:
                description: Caps bound the factory's throughput (§6.2).
                properties:
                  activeTasks:
                    type: integer
                  awaitingHumanWIP:
                    description: |-
                      AwaitingHumanWIP bounds the tasks waiting on a human review before the factory queues
                      more of the review-class work that produces them (§6.2's back-pressure on reviewers).
                      Required, never defaulted: a config that omits it fails its rollout (§4).
                    type: integer
                  concurrentRuns:
                    type: integer
                  escalatedHours:
                    description: |-
                      EscalatedHours is how long a task may wait Escalated for a maintainer before it is
                      Stopped (#61); otherwise it polls GitHub until its issue or pull request closes.
                      Omitted: 168. An explicit 0: no limit. A pointer tells the two apart.
                    type: integer
                  maxPendingMinutes:
                    description: |-
                      How long a run that never started may sit Pending before the task escalates as
                      run_unschedulable (P): no other layer bounds it — activeDeadlineSeconds counts from the
                      pod's start, and the runs quota holds a run back forever. Defaulted when omitted, never left
                      open.
                    type: integer
                  maxTextBytes:
                    type: integer
                  preferRevisions:
                    description: |-
                      PreferRevisions is CD22: while any task in the factory waits for a slot to run a revision
                      (a run that continues a task which already has one), a task whose next run is its first
                      waits with the reason waiting_revision_first. Caps still bind: this priority never overrides
                      a limit, and nothing is reserved — a first run gives up one slot-time. Off by default.
                    type: boolean
                  tasksPerDay:
                    type: integer
                type: object
              control:
                description: |-
                  Control is the pinned issue whose factory/stop label is the global stop (§6.1). Issue 0: none,
                  and only the stop object stops the factory.
                properties:
                  issue:
                    type: integer
                  repository:
                    maxLength: 253
                    type: string
                type: object
              defaults:
                description: |-
                  Defaults apply when triage leaves a value open. A workflow names the template and the tier: the
                  two keys that did were removed (WF9, WF13).
                properties:
                  dataClass:
                    maxLength: 253
                    type: string
                  harness:
                    description: |-
                      Harness is the default harness for new tasks when no maintainer label or treatment arm overrides it.
                      Empty defaults to openhands.
                    enum:
                    - openhands
                    - opencode
                    type: string
                  predictedClass:
                    maxLength: 253
                    type: string
                type: object
              evaluation:
                description: Evaluation is the team evaluation's cohort share and
                  mode, read per decision.
                properties:
                  controlPercent:
                    maximum: 100
                    minimum: 0
                    type: integer
                  mode:
                    enum:
                    - observe
                    - apply
                    type: string
                  treatment:
                    maxLength: 253
                    type: string
                  treatmentHarness:
                    description: |-
                      TreatmentHarness selects the harness for the treatment cohort without changing workflow,
                      template, loop, checks, model, effort, or tier. Empty uses defaults.harness (openhands).
                    enum:
                    - openhands
                    - opencode
                    type: string
                  treatmentModel:
                    description: |-
                      TreatmentModel puts the treatment cohort's TreatmentRoles on a gateway alias (Gemini plan A8),
                      changing nothing else: workflow, template, harness, effort and caps stay the control's. A
                      provider alias applies to public tasks only. The measurement's one variable: it is refused
                      beside treatmentHarness or a treatment workflow.
                    maxLength: 64
                    type: string
                  treatmentRoles:
                    description: TreatmentRoles are the roles TreatmentModel moves;
                      unset, the implementer.
                    items:
                      maxLength: 32
                      type: string
                    maxItems: 4
                    type: array
                type: object
              facts:
                description: |-
                  Facts are what a terminal task tells its room about its dollars (CD23). A switch here lands with
                  the code that reads it: both decoders refuse a key they do not know, so a file written for a
                  later release fails this one's rollout instead of silently changing nothing.
                properties:
                  finalSpend:
                    description: |-
                      FinalSpend is CD23: a terminal task requeues once at its last run's end plus the settle
                      window plus a margin, prices its runs again, and posts one fact whose dollars it will not
                      change — the facts key stops bucketing dollars for it. Off by default: it is a new claim
                      about money, and a room that read it needs the release that writes it.
                    type: boolean
                type: object
              gitops:
                description: |-
                  GitOps is the repository and manifest path where the factory opens policy-change pull requests.
                  The factory never merges those pull requests.
                properties:
                  branch:
                    description: Branch is the base branch for policy changes, main
                      when omitted.
                    maxLength: 128
                    pattern: ^[A-Za-z0-9._/-]+$
                    type: string
                  path:
                    description: Path is the manifest's slash-separated path in that
                      repository.
                    maxLength: 512
                    pattern: ^[^/].*[^/]$|^[^/]$
                    type: string
                  repository:
                    description: Repository is owner/name on GitHub.
                    maxLength: 140
                    pattern: ^[A-Za-z0-9-]+/[A-Za-z0-9._-]+$
                    type: string
                required:
                - path
                - repository
                type: object
              loops:
                additionalProperties:
                  description: |-
                    Loop is one row of loops. A row switches its class's loop on when it sets any of the three
                    keys (D4: no row, or a row without them, is today's run); an unset key then takes the
                    design's default. Rows are keyed by class so the scoper's switch (scoper design SC2,
                    loops.<class>.scope) joins them as one more key. A row inherits each key it leaves unset from
                    default's row (WF10, rowOf).
                  properties:
                    ask:
                      description: |-
                        Ask checks whether an issue states acceptance before any run starts (WR6); absent inherits
                        default's, or falls back to the scoper's forced question on legacy rows. Never switches the loop on.
                      type: boolean
                    continuations:
                      description: 'Continuations is how many not_yet verdicts continue
                        the conversation (L2): 0 to 5, default 2.'
                      format: int32
                      type: integer
                    judge:
                      description: 'Judge is the completion judge''s alias, or none
                        for no judge (L2): default tier-light.'
                      maxLength: 253
                      type: string
                    models:
                      additionalProperties:
                        additionalProperties:
                          description: ModelAlias is a provider alias, a named type
                            for the same reason.
                          maxLength: 253
                          type: string
                        description: |-
                          ModelAliases is tier → provider alias, one role's row of Loop.Models. It is a named type so the
                          CRD can bound the inner map.
                        maxProperties: 32
                        type: object
                      description: |-
                        Models is the loops row's public fallback: role → tier → provider alias (F3). A role or tier
                        without an entry keeps today's model; a workflow's models override takes precedence, including
                        a tier alias on an internal task (CP10). It never switches the loop on.
                      maxProperties: 32
                      type: object
                    plan:
                      description: |-
                        Plan runs the scoper before the implementer (WR6): plan: true is scope: scoper, plan: false
                        is scope: off. Contradicting scope on the same row is refused. Never switches the loop on.
                      type: boolean
                    review:
                      description: |-
                        Review resolves the template for a workflow that names none (pair when true, solo when
                        false), and must agree with a workflow's explicit template (WR6). Never switches the loop on.
                      type: boolean
                    scope:
                      description: |-
                        Scope is the class's scope mode (scoper design SC2): off, steering or scoper; unset is off.
                        It never switches the loop on: On reads the loop's three keys only.
                      maxLength: 253
                      type: string
                    search:
                      description: |-
                        Search offers the class's implementer runs the search tool (v3 feature 5, ST9); absent is off.
                        It never switches the loop on: On reads the loop's three keys only.
                      type: boolean
                    split:
                      description: |-
                        Split offers the scoper a split of the class's hard tasks (splitter design SL3): absent, off.
                        It needs scope: scoper on the same row, and never switches the loop on.
                      properties:
                        anyTier:
                          description: |-
                            AnyTier offers the split to every task of the class, whatever tier C7 rated it (SP1's
                            option (b), an explicit opt-in); omitted, only a task C7 rated frontier is offered one.
                          type: boolean
                        childTier:
                          description: 'ChildTier is every child''s tier (SP5): omitted,
                            standard.'
                          maxLength: 253
                          type: string
                        familyUSD:
                          description: |-
                            FamilyUSD caps the parent's and every child's runs together; omitted, four of the child
                            tier's tasks (SP3: $20.40 on standard's $5.10).
                          type: number
                        maxChildren:
                          description: 'MaxChildren is the most parts a split may
                            hold: 2 to 5, required.'
                          format: int32
                          type: integer
                        parallel:
                          description: |-
                            Parallel is how many independent parts of a split may be open at once: 1 (default) or 2
                            (MaxParallelParts, phase H3). Two parts run together only when their declared files do not
                            overlap, each names at least one check, and neither depends on the other.
                          maximum: 2
                          minimum: 1
                          type: integer
                      type: object
                    stallSteps:
                      description: 'StallSteps ends a run with no commit by this many
                        steps (L3): 1 to 500, default 80.'
                      format: int32
                      type: integer
                    tests:
                      description: |-
                        Tests starts a public task of the row with the tester when its repository opts in
                        (Repository.spec.workflow.testFirst); absent is off. It never switches the loop on.
                      type: boolean
                  type: object
                maxProperties: 32
                type: object
              mergeDefaults:
                description: |-
                  MergeDefaults are the merge settings most repositories share (Q8): a Repository's merge
                  overrides them key by key, each key whole.
                properties:
                  approveToMerge:
                    description: |-
                      ApproveToMerge: a maintainer's APPROVED review of the current head arms the merger on an
                      agents pull request (human path AM1). Off, the approval hands off to a human merge.
                    type: boolean
                  autoRevert:
                    description: |-
                      AutoRevert merges the factory's own revert pull request at the original head GitHub created.
                      It replaces the deprecated live `revert` policy binding; unset is false.
                    type: boolean
                  awaitingCIFor:
                    description: |-
                      AwaitingCIFor bounds a pull request's stay in AwaitingCI on a wait verdict (#182): past it,
                      a human is told which checks never reported. Omitted, Parse sets 24h (D2); 0s is no bound.
                      Read it through AwaitingCIBound.
                    maxLength: 32
                    pattern: ^([0-9]+(\.[0-9]+)?(ns|us|µs|ms|s|m|h))+$
                    type: string
                  breaker:
                    description: |-
                      Breaker is the circuit breaker's outcome window (R41, review G5): a class whose last Window
                      merges hold MaxReverts reverts is demoted to human review, whatever the config.
                    properties:
                      maxFollowUps:
                        description: |-
                          MaxFollowUps: follow-up fixes and monitor regressions in the last Window merges that demote
                          a class (MC8); 0 counts none.
                        type: integer
                      maxReverts:
                        type: integer
                      recoverAfter:
                        description: |-
                          RecoverAfter: a tripped class resumes once this many of its newest merges, all newer than the
                          newest bad one, are clean and mature (human path AM7); 0 keeps the window rule alone.
                        type: integer
                      window:
                        type: integer
                    type: object
                  checkReruns:
                    description: |-
                      CheckReruns caps the re-runs of a cancelled required check per task; 0 hands it to a human
                      instead. Above 0 the merger App must hold actions: write.
                    format: int32
                    type: integer
                  contractCheck:
                    description: |-
                      ContractCheck is the check run that proves a task's test contract (R21, TF7): required on
                      a task with a contract (row 2b), only reported on one without.
                    maxLength: 1024
                    type: string
                  fixRuns:
                    format: int32
                    type: integer
                  fluxSource:
                    description: |-
                      FluxSource is the GitRepository that delivers the repository to the factory's cluster,
                      namespace/name: the source every monitor.flux of a bound MergePolicy watches (B2, Q14).
                    maxLength: 1024
                    type: string
                  gateStatus:
                    description: |-
                      GateStatus makes the factory post the gate's verdict as a commit status on the pull request,
                      maku/merge-gate; nil means true (v4 step 8). Read it through PostsGateStatus.
                    type: boolean
                  leakScanCheck:
                    maxLength: 1024
                    type: string
                  maxPerDay:
                    description: |-
                      MaxPerDay caps the repository's auto-merges a day, every live policy together (MR9): the
                      name a policy's own cap has. Read it through PerDay.
                    minimum: 0
                    type: integer
                  mergerLogin:
                    maxLength: 253
                    type: string
                  paused:
                    description: |-
                      Paused stops every automatic policy decision with a human-readable reason. A maintainer's
                      approve-to-merge review still arms; resume by removing this block.
                    properties:
                      reason:
                        description: Reason is the operator's short explanation of
                          the pause.
                        maxLength: 200
                        minLength: 1
                        type: string
                    type: object
                  policyBot:
                    description: |-
                      PolicyBot true routes the gate through policy-bot, an opt-in (D11); nil means false (v4 step
                      8). Without it maku/merge-gate is the status branch protection requires, which needs
                      gateStatus. Read it through UsesPolicyBot.
                    type: boolean
                  policyBotLogin:
                    maxLength: 253
                    type: string
                  requiredChecks:
                    description: The 8 contexts classic protection requires, by name
                      (GitHub Actions, app 15368).
                    items:
                      maxLength: 1024
                      type: string
                    maxItems: 64
                    type: array
                  revertWindow:
                    maxLength: 32
                    pattern: ^([0-9]+(\.[0-9]+)?(ns|us|µs|ms|s|m|h))+$
                    type: string
                  verifyChecks:
                    description: |-
                      The checks main's CI runs on push, watched on the merge commit. Not RequiredChecks: a
                      path-filtered push workflow never reports there, and absent must not mean pending (§6.4).
                    items:
                      maxLength: 1024
                      type: string
                    maxItems: 64
                    type: array
                  verifyFor:
                    maxLength: 32
                    pattern: ^([0-9]+(\.[0-9]+)?(ns|us|µs|ms|s|m|h))+$
                    type: string
                type: object
              mergeGuardrails:
                description: |-
                  MergeGuardrails bound every repository's class policy (MP3, MP6): a class may add protected
                  paths and mandatory checks and choose lower caps, never the reverse. A cap of 0 takes its default
                  (MR7, WithDefaults).
                properties:
                  mandatoryChecks:
                    items:
                      maxLength: 1024
                      type: string
                    maxItems: 64
                    type: array
                  maxGrantLifetime:
                    description: |-
                      MaxGrantLifetime caps a saved approval grant's life from its creation or last renewal (merge
                      policy stage 5): the factory's lookup expires an older grant. 0 is DefaultGrantLifetime.
                    maxLength: 32
                    pattern: ^([0-9]+(\.[0-9]+)?(ns|us|µs|ms|s|m|h))+$
                    type: string
                  maxModifiedLines:
                    type: integer
                  maxPatchFiles:
                    type: integer
                  maxPerDay:
                    type: integer
                  protectedFiles:
                    items:
                      maxLength: 512
                      type: string
                    maxItems: 64
                    type: array
                type: object
              outcomes:
                description: |-
                  Outcomes are the task outcomes this factory offers (phase F): change by default.
                  An outcome not listed here falls back to change.
                items:
                  enum:
                  - change
                  - plan-first
                  - review
                  - report
                  maxLength: 16
                  type: string
                maxItems: 4
                type: array
              prices:
                additionalProperties:
                  description: |-
                    Price is a model's list price in USD per million tokens of each type the gateway reports.
                    The gateway's input count includes the cache reads and writes, so each is priced once.
                  properties:
                    cacheRead:
                      type: number
                    cacheWrite:
                      description: CacheWrite prices cache_creation_input; omitted,
                        the input rate (Z.ai bills no write).
                      type: number
                    checkedAt:
                      maxLength: 1024
                      type: string
                    input:
                      type: number
                    output:
                      type: number
                    source:
                      description: |-
                        Source is the provider page the row was read from, an https URL, and CheckedAt the day it
                        was read, YYYY-MM-DD: provenance for the human who confirms a drift finding (truthful costs
                        TC1). Validated when present; the meter never reads them.
                      maxLength: 1024
                      type: string
                  type: object
                maxProperties: 32
                type: object
              resume:
                description: Resume bounds the automatic resume of a run lost to its
                  infrastructure (disruption design §4).
                properties:
                  maxPerTask:
                    description: |-
                      MaxPerTask is how many runs of one task the factory resumes on its own; past it the task
                      escalates as before. Defaulted when omitted.
                    type: integer
                type: object
              roles:
                additionalProperties:
                  description: RoleDef declares one custom role in Factory.spec.roles
                    (WR11).
                  properties:
                    brief:
                      description: Brief is a relative path under the factory's configuration
                        directory, read at load (≤ 16 KiB).
                      maxLength: 512
                      type: string
                    capability:
                      description: Capability is the closed capability profile the
                        role binds (read in this release).
                      enum:
                      - read
                      - tests
                      - write
                      maxLength: 16
                      type: string
                    effort:
                      description: Effort is low, medium or high; unset keeps the
                        harness's default.
                      enum:
                      - low
                      - medium
                      - high
                      maxLength: 6
                      type: string
                    model:
                      description: Model is an optional model alias for the role.
                      maxLength: 253
                      type: string
                  type: object
                description: |-
                  Roles are custom roles declared by the platform (WR11), each bound to a closed capability
                  profile and a brief file under the factory's configuration directory.
                maxProperties: 16
                type: object
              scoper:
                description: |-
                  Scoper bounds a scoping run's exploration (harness roles HR2): the harness nudges the scoper to
                  hand off at NudgeAt tool calls and ends the run at MaxToolCalls, as budget_calls. The factory
                  writes both into the scoper brief's first line, which the harness reads. Each is defaulted alone
                  when omitted. PlanTier picks the tier (model and run caps) the scoper runs at; unset is light.
                properties:
                  maxToolCalls:
                    type: integer
                  nudgeAt:
                    type: integer
                  planTier:
                    description: |-
                      PlanTier is the tier whose model and run caps the scoper runs at (WR6): light, standard or
                      frontier; unset is light.
                    enum:
                    - light
                    - standard
                    - frontier
                    type: string
                type: object
              templates:
                additionalProperties:
                  description: 'Template is a team: the roles run in order on one
                    branch.'
                  properties:
                    maxReviewRounds:
                      format: int32
                      type: integer
                    reviewerModel:
                      description: |-
                        ReviewerModel is the reviewer's gateway name whatever the implementer's tier; empty keeps
                        the other tier's model. The run keeps the other tier's caps.
                      maxLength: 253
                      type: string
                    roles:
                      items:
                        maxLength: 253
                        type: string
                      maxItems: 64
                      type: array
                  type: object
                maxProperties: 16
                type: object
              tiers:
                additionalProperties:
                  description: |-
                    Tier is a model and its budgets. RunUSD and TaskUSD cap a run and a task in USD, priced by
                    meter.prices, in place of RunTokens and TaskTokens; 0 keeps the token cap. With meter.prices
                    set each defaults to RefUSD of its token cap.
                  properties:
                    model:
                      maxLength: 253
                      type: string
                    runMinutes:
                      format: int64
                      type: integer
                    runTokens:
                      format: int64
                      type: integer
                    runUSD:
                      type: number
                    taskTokens:
                      format: int64
                      type: integer
                    taskUSD:
                      type: number
                  type: object
                maxProperties: 16
                type: object
              triage:
                description: 'FactoryTriage is the live part of triage (D12): the
                  classifier''s URL stays in the values.'
                properties:
                  controlPercent:
                    maximum: 100
                    minimum: 0
                    type: integer
                type: object
              workflows:
                additionalProperties:
                  description: |-
                    HarnessProfile is one workflow (WF1, WF7, WR11): either the readable list form (budget and
                    stages) or the legacy bundle (template, tier, checks and loop), plus description, step-up and
                    per-role tuning. A Factory spells the map workflows.
                  properties:
                    budget:
                      description: 'Budget is the tier under the name a person reads
                        (WR11): light, standard or frontier.'
                      enum:
                      - light
                      - standard
                      - frontier
                      maxLength: 8
                      type: string
                    checks:
                      type: boolean
                    description:
                      description: 'Description is the line the scoper''s brief shows:
                        when to choose the workflow.'
                      maxLength: 120
                      type: string
                    effort:
                      additionalProperties:
                        description: Effort is a role's reasoning effort (CP9).
                        enum:
                        - low
                        - medium
                        - high
                        maxLength: 6
                        type: string
                      description: |-
                        Effort maps a non-implementer role to low, medium or high (CP9). An absent role keeps the
                        harness's default, high.
                      maxProperties: 4
                      type: object
                    escalation:
                      description: |-
                        Escalation is the workflow a failed run's signal group steps to (WF7, TE7); absent, or an
                        absent group, goes to a maintainer.
                      properties:
                        notConverged:
                          maxLength: 253
                          type: string
                        outOfBudget:
                          maxLength: 253
                          type: string
                      type: object
                    loop:
                      description: LoopRef names a row of loops, or off.
                      maxLength: 253
                      type: string
                    models:
                      additionalProperties:
                        description: ModelAlias is a provider alias, a named type
                          for the same reason.
                        maxLength: 253
                        type: string
                      description: |-
                        Models maps a non-implementer role to a model alias (CP10). Internal runs accept only the
                        tier-light, tier-standard and tier-frontier aliases; provider aliases are public only.
                      maxProperties: 4
                      type: object
