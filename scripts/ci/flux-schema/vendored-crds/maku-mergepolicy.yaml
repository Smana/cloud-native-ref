# VENDORED, NOT APPLIED. Maku v0.54.0 config/crd/maku.ogenki.io_mergepolicies.yaml, copied verbatim below.
# It exists so `flux schema validate` knows the mergepolicy kind (maku.ogenki.io/v1alpha1) that
# ai-native-ref commits; the CRD itself is installed with Maku, not from here.
# Refresh it when Maku bumps and a field you need is missing.
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: mergepolicies.maku.ogenki.io
spec:
  group: maku.ogenki.io
  names:
    kind: MergePolicy
    listKind: MergePolicyList
    plural: mergepolicies
    singular: mergepolicy
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.consumerCount
      name: Consumers
      type: integer
    - jsonPath: .status.currentCount
      name: Current
      type: integer
    - jsonPath: .status.liveCount
      name: Live
      type: integer
    - jsonPath: .spec.description
      name: Description
      type: string
    - jsonPath: .status.conditions[?(@.type=="Accepted")].status
      name: Accepted
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          MergePolicy is one reusable class definition, its name the class name (reusable merge policies
          B1).
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: MergePolicySpec is one reusable policy definition, named
              by the object, that Repositories bind.
            properties:
              allowedFiles:
                description: 'AllowedFiles: every changed path matches one of these
                  regular expressions.'
                items:
                  maxLength: 512
                  pattern: ^\^.*\$$
                  type: string
                maxItems: 64
                type: array
              author:
                description: 'Author is how the class''s pull requests are authored:
                  absent, the agents App through a task''s runs; Adopt, another author''s
                  pull requests the factory adopts.'
                properties:
                  adopt:
                    description: |-
                      Adopt names the logins whose pull requests are adopted and the head branches they come from
                      (gh-aw's allowed-branches); every commit and every push of the branch must be theirs.
                    properties:
                      branches:
                        items:
                          maxLength: 253
                          type: string
                        maxItems: 64
                        type: array
                      logins:
                        items:
                          maxLength: 253
                          type: string
                        maxItems: 64
                        type: array
                    type: object
                type: object
              companionFiles:
                description: |-
                  CompanionFiles are the paths an added-entry pull request may append to beside its one added
                  entry (a knowledge base's index and log), anchored like AllowedFiles.
                items:
                  maxLength: 512
                  type: string
                maxItems: 64
                type: array
              description:
                description: |-
                  Description says what the class is for, in plain words, for the settings pages and
                  `kubectl get`; the gate never reads it.
                maxLength: 280
                type: string
              diffShape:
                description: DiffShape is the mechanical shape every changed line
                  must have.
                enum:
                - links-only
                - semver-patch
                - semver-minor
                - added-entry
                maxLength: 512
                type: string
              evidence:
                default: standard
                description: |-
                  Evidence is the clean shadow decisions a promotion needs: low is 5 when a shape or oracle
                  checks the diff mechanically; standard, the default, is 20.
                enum:
                - low
                - standard
                type: string
              holdoutChecks:
                description: HoldoutChecks are checks GitHub Actions must report SUCCESS
                  on the head; their workflow is a gate path, so the pull request
                  cannot change them.
                items:
                  maxLength: 1024
                  type: string
                maxItems: 64
                type: array
              maxModifiedLines:
                minimum: 0
                type: integer
              maxPatchFiles:
                description: |-
                  MaxPatchFiles caps the changed files and MaxModifiedLines their additions plus deletions,
                  as GitHub counts them; 0 is no cap.
                minimum: 0
                type: integer
              maxPerDay:
                description: MaxPerDay caps this class's merges a day, under merge.maxPerDay;
                  0 is no cap of its own.
                minimum: 0
                type: integer
              modifyOnly:
                description: 'ModifyOnly: no file is added, deleted, renamed or copied.'
                type: boolean
              monitor:
                description: |-
                  Monitor watches each merge of the class after it lands: main's CI
                  for every merge, the detector's next runs for an oracle class, Flux on the factory's cluster,
                  and follow-up fixes for FollowUpWindow. Absent: no monitor, as before.
                properties:
                  flux:
                    description: Flux watches the factory's cluster once its source
                      holds the merge commit.
                    properties:
                      source:
                        description: |-
                          Source is namespace/name. Optional in the type, since a MergePolicy leaves it to the
                          repository's merge.fluxSource; required on a class.
                        maxLength: 1024
                        type: string
                      within:
                        maxLength: 32
                        pattern: ^([0-9]+(\.[0-9]+)?(ns|us|µs|ms|s|m|h))+$
                        type: string
                    type: object
                  followUpWindow:
                    description: |-
                      FollowUpWindow is how long later merges are read for a fix of this one (MC8), and when the
                      monitor's verdict is final.
                    maxLength: 32
                    pattern: ^([0-9]+(\.[0-9]+)?(ns|us|µs|ms|s|m|h))+$
                    type: string
                  oracleRuns:
                    description: |-
                      OracleRuns is how many scheduled detector runs after the merge must report none of the
                      targets the pull request wrote; 0 reads none. Needs an oracle.
                    type: integer
                  verification:
                    description: |-
                      Verification reads an internal principal's verdict on the fix (RA11, R12): the merge is
                      watched for it, for at most Within after the merge. Unset by default.
                    properties:
                      within:
                        maxLength: 32
                        pattern: ^([0-9]+(\.[0-9]+)?(ns|us|µs|ms|s|m|h))+$
                        type: string
                    type: object
                type: object
              narrowedFiles:
                description: |-
                  NarrowedFiles is a binding's allowedFiles over a policy that has its own: every changed
                  path matches one of these too. Set only by resolving a binding; refused on a MergePolicy.
                items:
                  maxLength: 512
                  type: string
                maxItems: 64
                type: array
              oracle:
                description: 'Oracle makes the class oracle-backed: its tasks are
                  a detector''s findings, and its gate holds only when the head no
                  longer holds them and changes nothing else.'
                properties:
                  maxFindings:
                    type: integer
                  probe:
                    maxLength: 1024
                    type: string
                  workflow:
                    description: |-
                      Workflow is optional in the type, since a MergePolicy leaves it to the binding's
                      oracleWorkflow; required on a class.
                    maxLength: 1024
                    type: string
                type: object
              protectedFiles:
                description: 'ProtectedFiles: no changed path matches one of these.'
                items:
                  maxLength: 512
                  type: string
                maxItems: 64
                type: array
              releaseAgeCheck:
                description: 'ReleaseAgeCheck names the commit status that holds the
                  release age, posted by an adopted login: Renovate''s renovate/stability-days.'
                maxLength: 1024
                type: string
              requiredLabel:
                description: 'RequiredLabel is the label an adopted pull request must
                  carry, set by an adopted login, for the factory to adopt it: RunLore''s
                  ready-to-merge.'
                maxLength: 253
                type: string
              requires:
                description: |-
                  Requires names workflow stages that every task touching this class's paths must run (WR6):
                  plan, tests, judge, review. Adds stages to any workflow and never removes one.
                items:
                  enum:
                  - plan
                  - tests
                  - judge
                  - review
                  maxLength: 16
                  type: string
                maxItems: 4
                type: array
              requiresApproval:
                description: RequiresApproval asks a human about a pull request touching
                  one of its paths, even in a live class.
                items:
                  description: ApprovalLeaf asks a human about a pull request touching
                    one of its paths, even in a live class.
                  properties:
                    changedFiles:
                      items:
                        maxLength: 512
                        type: string
                      maxItems: 64
                      type: array
                  type: object
                maxItems: 16
                type: array
            type: object
            x-kubernetes-validations:
            - message: 'oracle.workflow is the repository''s: set oracleWorkflow on
                the binding'
              rule: '!has(self.oracle) || !has(self.oracle.workflow)'
            - message: 'the Flux source is the repository''s: Repository.spec.merge.fluxSource'
              rule: '!has(self.monitor) || !has(self.monitor.flux) || !has(self.monitor.flux.source)'
            - message: 'narrowedFiles is set by a binding''s allowedFiles: set allowedFiles
                on the policy'
              rule: '!has(self.narrowedFiles)'
            - message: 'evidence: low needs diffShape or oracle: set one, or use evidence:
                standard'
              rule: self.evidence != 'low' || has(self.diffShape) || has(self.oracle)
          status:
            description: 'MergePolicyStatus is what the factory made of its MergePolicy
              (B10): Accepted, and its consumers.'
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                maxItems: 8
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              consumerCount:
                description: |-
                  ConsumerCount, CurrentCount and LiveCount are always serialized, zero included: the printer
                  columns read them. CurrentCount counts the accepted consumers serving the current generation,
                  LiveCount the served consumers that bind the policy live.
                minimum: 0
                type: integer
              consumers:
                description: Consumers are the Repositories that bind the MergePolicy
                  (B10).
                items:
                  description: ConsumerStatus is one Repository's binding of a MergePolicy
                    (B10).
                  properties:
                    accepted:
                      description: Accepted is always serialized, false included.
                      type: boolean
                    mode:
                      enum:
                      - live
                      - shadow
                      - disabled
                      type: string
                    reason:
                      maxLength: 64
                      type: string
                    repository:
                      description: Repository is the Repository object's name.
                      maxLength: 253
                      type: string
                    servedGeneration:
                      format: int64
                      type: integer
                  required:
                  - repository
                  type: object
                maxItems: 64
                type: array
                x-kubernetes-list-map-keys:
                - repository
                x-kubernetes-list-type: map
              currentCount:
                minimum: 0
                type: integer
              liveCount:
                minimum: 0
                type: integer
              observedGeneration:
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: a MergePolicy's name is its class name (B1)
          rule: self.metadata.name.matches('^[a-z0-9]([-a-z0-9]{0,38}[a-z0-9])?$')
        - message: review is not a policy
          rule: self.metadata.name != 'review'
    served: true
    storage: true
    subresources:
      status: {}
