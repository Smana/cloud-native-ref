version: "3"

includes:
  # Not scripts/taskfile.yaml: go-task stops its upward search at the first
  # taskfile it finds, so run from under scripts/ that name would shadow this
  # file and no ci:* task would exist.
  ci:
    taskfile: scripts/tasks.yaml
  ops:
    taskfile: scripts/ops/tasks.yaml
  docs:
    taskfile: scripts/docs/tasks.yaml
  provision:
    taskfile: scripts/provision/tasks.yaml

tasks:
  default:
    silent: true
    cmds: ["task --list"]

  # A hand-kept mirror: keep it in step with every scripts/ci gate in
  # .github/workflows/. CI spreads the same gates over several jobs, since a
  # required check is a job: two in kubernetes-validation, three in links, and
  # doc-paths in docs-check.yml.
  check:
    desc: Every scripts/ci gate CI runs, in one command
    cmds:
      # First: the gates below read the AI paths, which only the overlay puts in the tree.
      - {task: "ai:overlay"}
      - {task: "ci:validate"}
      - {task: "ci:test"}
      - {task: "ci:shellcheck"}
      - {task: "ci:links"}
      - {task: "ci:doc-claims"}
      - {task: "ci:idp-topology"}
      - {task: "ci:policy-gates"}
      - {task: "ci:workflow-secrets"}
      - {task: "ci:openbao-policies"}
      - {task: "ci:doc-paths"}

  ai:overlay:
    desc: Verify and lay the pinned ai-native-ref artifact over the (gitignored) AI paths
    cmds: ["{{.ROOT_DIR}}/scripts/ci/ai-overlay.sh"]

  # agent-run.sh moved to Smana/ai-native-ref. This wrapper keeps the runbooks' `task agent:run`
  # working from a host checkout, where the factory's CA is.
  agent:run:
    desc: "Ask the agent factory for one AgentRun (roomctl login first; AI_NATIVE_REF_DIR=<ai-native-ref checkout>)"
    cmds:
      - |
        s="${AI_NATIVE_REF_DIR:?agent-run.sh moved to Smana/ai-native-ref: set AI_NATIVE_REF_DIR to a checkout of it}/scripts/ops/k8s/agent-run.sh"
        AGENT_FACTORY_CA="${AGENT_FACTORY_CA:-{{.ROOT_DIR}}/opentofu/aws/openbao/management/.tls/ca.pem}" "$s" {{.CLI_ARGS}}
