version: "3"

includes:
  # Not scripts/taskfile.yaml: go-task stops its upward search at the first
  # taskfile it finds, so run from under scripts/ that name would shadow this
  # file and no ci:* task would exist.
  ci:
    taskfile: scripts/tasks.yaml
  ops:
    taskfile: scripts/ops/tasks.yaml
  docs:
    taskfile: scripts/docs/tasks.yaml
  provision:
    taskfile: scripts/provision/tasks.yaml

tasks:
  default:
    silent: true
    cmds: ["task --list"]

  # A hand-kept mirror: keep it in step with every scripts/ci gate in
  # .github/workflows/. CI spreads the same gates over several jobs, since a
  # required check is a job: two in kubernetes-validation, three in links, and
  # doc-paths in docs-check.yml.
  check:
    desc: Every scripts/ci gate CI runs, in one command
    cmds:
      - {task: "ci:validate"}
      - {task: "ci:test"}
      - {task: "ci:links"}
      - {task: "ci:doc-claims"}
      - {task: "ci:idp-topology"}
      - {task: "ci:policy-gates"}
      - {task: "ci:workflow-secrets"}
      - {task: "ci:openbao-policies"}
      - {task: "ci:doc-paths"}

  # The design names this `task agent:run` (SP1 §Implementation outline): the
  # owner's way to start a run until SP3's factory is the only creator (C3).
  agent:run:
    desc: Create one AgentRun on the current cluster (owner only until SP3)
    cmds: ["{{.ROOT_DIR}}/scripts/ops/k8s/agent-run.sh {{.CLI_ARGS}}"]
